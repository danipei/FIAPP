// Unidad 0: finanzas desde cero absoluto. Va antes de Fundamentos y no da nada por sabido.
UNITS.unshift({
  id: 'z0', title: 'Finanzas desde cero', sub: 'Sin conocimientos previos: qué es una empresa, cómo gana dinero y las palabras que los banqueros usan cada día', ch: 'Empieza aquí', col: 'var(--u12)',
  lessons: [
    {
      id: 'z0l1', title: 'Qué es una empresa y cómo gana dinero',
      th: [
        { h: 'Una empresa es una máquina que convierte dinero en más dinero', b: `<p>Imagina que montas un <b>puesto de limonada</b>. Gastas dinero en limones, azúcar y vasos, vendes vasos de limonada y al final del día cuentas lo que te queda.</p><p>Todas las empresas del mundo, de la cafetería de la esquina a Apple, funcionan igual:</p><ul><li><b>Venden</b> algo (un producto o un servicio). El dinero que cobran a los clientes se llama <b>ingresos</b> (en inglés <i>revenue</i> o <i>sales</i>, la <b>primera línea</b>).</li><li><b>Gastan</b> dinero para fabricarlo y venderlo. Son los <b>costes</b> o <b>gastos</b>.</li><li>Lo que queda después de todos los costes es el <b>beneficio</b>. Si los costes superan a los ingresos, hay <b>pérdidas</b>.</li></ul><p class="formula">Beneficio = Ingresos − Costes</p>` },
        { h: 'Un ejemplo sencillo', b: `<p>Tu puesto vende 100 vasos a 2 $ cada uno.</p><ul><li>Ingresos = 100 × 2 $ = <b>200 $</b></li><li>Limones, azúcar y vasos cuestan 80 $</li><li>Pagas 40 $ a un amigo para que te ayude</li></ul><p>Beneficio = 200 $ − 80 $ − 40 $ = <b>80 $</b>.</p><p>Esa es toda la idea. Todo lo demás en finanzas es una versión más detallada de esto: qué costes, cuándo se pagan, quién puso el dinero para empezar y cuánto vale el puesto entero.</p>` },
        { h: '¿De quién es una empresa?', b: `<p>Alguien tuvo que poner el dinero para empezar: comprar la mesa, la jarra, los primeros limones. Quienes ponen dinero y son <b>dueños</b> del negocio son los <b>propietarios</b> o <b>accionistas</b>.</p><p>Las empresas grandes dividen la propiedad en trocitos llamados <b>acciones</b>. Si una empresa tiene 100 acciones y tú tienes 10, eres dueño del 10%: del 10% de sus beneficios y del 10% de su valor.</p><p>Las empresas cuyas acciones puede comprar cualquiera en una bolsa (como la NYSE, el Nasdaq o la Bolsa de Madrid) son <b>empresas cotizadas</b>. Las que pertenecen a unas pocas personas o a un fondo son <b>empresas privadas</b> (no cotizadas).</p>` },
        { h: 'Por qué importa esto en banca', b: `<p>Los banqueros de inversión y los inversores de private equity se pasan el día respondiendo tres preguntas sobre las empresas:</p><ol><li><b>¿Cuánto dinero gana?</b> (ingresos, costes, beneficio)</li><li><b>¿Qué tiene y qué debe?</b> (activos y deudas)</li><li><b>¿Cuánto vale?</b> (valoración)</li></ol><p>Esta unidad te enseña las palabras y la lógica de cada pregunta, paso a paso y con números pequeños. Al acabarla estarás listo para la unidad de Fundamentos y los capítulos del libro.</p>` }
      ],
      ex: [
        { t: 'mc', q: 'El dinero que cobra una empresa por vender sus productos o servicios se llama…', o: ['Ingresos', 'Beneficio', 'Patrimonio neto', 'Deuda'], a: 0, e: 'Los ingresos (revenue o sales, la “primera línea”) son todo lo que pagan los clientes. El beneficio es lo que queda tras los costes.' },
        { t: 'num', q: 'Una panadería vende 500 barras a 4 $ cada una. Los ingredientes cuestan 900 $ y los sueldos 600 $. ¿Cuál es su beneficio, en $?', a: 500, u: '$', e: 'Ingresos = 500 × 4 $ = 2.000 $. Costes = 900 $ + 600 $ = 1.500 $. Beneficio = 2.000 $ − 1.500 $ = 500 $.' },
        { t: 'tf', q: 'Si los costes de una empresa superan a sus ingresos, tiene pérdidas.', a: true, e: 'Beneficio = Ingresos − Costes. Si el resultado es negativo, son pérdidas.' },
        { t: 'fill', q: 'Beneficio = Ingresos − ___', o: ['Costes', 'Acciones', 'Activos', 'Caja'], a: 0, e: 'El beneficio es lo que queda de los ingresos tras pagar todos los costes.' },
        { t: 'num', q: 'Una empresa tiene 1.000 acciones y tú tienes 50. ¿Qué porcentaje de la empresa es tuyo, en %?', a: 5, u: '%', e: '50 / 1.000 = 0,05 = 5%. Te corresponde el 5% de sus beneficios y de su valor.' },
        { t: 'match', q: 'Empareja cada palabra con su significado', p: [['Ingresos', 'Dinero cobrado a los clientes'], ['Costes', 'Dinero gastado para funcionar'], ['Accionistas', 'Los dueños de la empresa'], ['Empresa cotizada', 'Sus acciones se negocian en bolsa']] },
        { t: 'mc', q: '¿Qué es más probable que sea una empresa privada?', o: ['Un negocio propiedad de su fundador y de un fondo de private equity', 'Un negocio cuyas acciones cotizan en el Nasdaq', 'Un negocio que cotiza en la NYSE', 'Cualquier empresa con más de 1.000 empleados'], a: 0, e: 'Las acciones de una empresa privada no se negocian en una bolsa. El tamaño no tiene nada que ver: hay empresas privadas enormes.' },
        { t: 'int', q: 'Entrevista: En una o dos frases, ¿qué hace una empresa desde el punto de vista financiero?', m: 'Una empresa obtiene dinero de sus dueños (y a veces de prestamistas), lo usa para fabricar y vender productos o servicios y busca cobrar en ingresos más de lo que gasta en costes. La diferencia es el beneficio, que pertenece a los dueños y puede reinvertirse o repartirse.' }
      ]
    },
    {
      id: 'z0l2', title: 'La cuenta de resultados, línea a línea',
      th: [
        { h: 'No todos los costes son iguales', b: `<p>Los banqueros no miran un único número de “costes”. Los van quitando por capas, porque cada capa cuenta algo distinto. El informe que lo hace es la <b>cuenta de resultados</b> (en inglés <i>income statement</i> o <b>P&amp;L</b>, profit and loss). Cubre un <b>periodo de tiempo</b>: un trimestre o un año.</p><p>Vamos a construir una para una pequeña cadena de cafeterías, “BeanCo”, línea a línea.</p>` },
        { h: 'Paso 1: Ingresos → Margen bruto', b: `<p><b>Ingresos:</b> 1.000 $ de café vendido este año.</p><p><b>COGS (coste de los bienes vendidos):</b> los costes ligados directamente a cada producto: café en grano, leche, vasos. 400 $.</p><p class="formula">Margen bruto (gross profit) = Ingresos − COGS = 1.000 $ − 400 $ = 600 $</p><p>El <b>margen bruto en %</b> = Margen bruto ÷ Ingresos = 60%. Te dice cuánto queda de cada dólar vendido después de pagar el propio producto.</p>` },
        { h: 'Paso 2: Gastos operativos → EBITDA', b: `<p><b>Gastos operativos</b> (a menudo llamados <b>SG&amp;A</b>: gastos de venta, generales y de administración): alquiler, sueldos, marketing, oficina central. 300 $.</p><p class="formula">EBITDA = Margen bruto − Gastos operativos = 600 $ − 300 $ = 300 $</p><p><b>EBITDA</b> son las siglas en inglés de <i>beneficio antes de intereses, impuestos, depreciaciones y amortizaciones</i>. Que no te asuste el nombre: es simplemente el <b>beneficio de hacer funcionar el negocio, antes de cuatro partidas concretas</b> que veremos ahora. A los banqueros les encanta porque aproxima la caja que genera la operación y permite comparar empresas con deudas, impuestos y maquinaria de edades distintas.</p>` },
        { h: 'Paso 3: D&A → EBIT', b: `<p>BeanCo compró cafeteras por 500 $ que duran 5 años. En vez de contar los 500 $ enteros como coste el primer año, los contables los reparten: 100 $ al año. Ese cargo anual es la <b>depreciación</b> (para cosas físicas como máquinas y edificios). La misma idea para cosas intangibles, como patentes o licencias de software, es la <b>amortización</b>. Juntas: <b>D&amp;A</b>.</p><p class="formula">EBIT = EBITDA − D&amp;A = 300 $ − 100 $ = 200 $</p><p>El <b>EBIT</b> (beneficio antes de intereses e impuestos) también se llama <b>resultado operativo</b> (operating income).</p><p>Idea clave: la D&amp;A <b>no es un pago en efectivo</b> este año. El dinero salió cuando se compraron las máquinas. La D&amp;A es solo la forma contable de repartir ese coste.</p>` },
        { h: 'Paso 4: Intereses e impuestos → Beneficio neto', b: `<p>BeanCo pidió un préstamo a un banco y paga <b>intereses</b> de 40 $ al año.</p><p class="formula">EBT (beneficio antes de impuestos) = EBIT − Intereses = 200 $ − 40 $ = 160 $</p><p>Hacienda se lleva los <b>impuestos</b>, por ejemplo el 25% del EBT = 40 $.</p><p class="formula">Beneficio neto = EBT − Impuestos = 160 $ − 40 $ = 120 $</p><p>El <b>beneficio neto</b> (net income) es la <b>última línea</b>: el beneficio que pertenece a los accionistas. Si lo divides entre el número de acciones obtienes el <b>BPA</b> (beneficio por acción, en inglés <b>EPS</b>). Con 60 acciones, BPA = 120 $ ÷ 60 = 2 $.</p>` },
        { h: 'La escalera completa', b: `<table class="tbl"><tr><td>Ingresos</td><td>1.000</td></tr><tr><td>− COGS</td><td>(400)</td></tr><tr><td><b>Margen bruto</b></td><td><b>600</b></td></tr><tr><td>− Gastos operativos (SG&amp;A)</td><td>(300)</td></tr><tr><td><b>EBITDA</b></td><td><b>300</b></td></tr><tr><td>− D&amp;A</td><td>(100)</td></tr><tr><td><b>EBIT</b></td><td><b>200</b></td></tr><tr><td>− Intereses</td><td>(40)</td></tr><tr><td><b>EBT</b></td><td><b>160</b></td></tr><tr><td>− Impuestos (25%)</td><td>(40)</td></tr><tr><td><b>Beneficio neto</b></td><td><b>120</b></td></tr></table><p>Memoriza el orden. Casi todas las preguntas de entrevista sobre la cuenta de resultados consisten en bajar por esta escalera.</p>` }
      ],
      ex: [
        { t: 'ord', q: 'Ordena las líneas de la cuenta de resultados, de arriba abajo', o: ['Ingresos', 'Margen bruto', 'EBITDA', 'EBIT', 'EBT', 'Beneficio neto'], e: 'Ingresos − COGS = Margen bruto; − gastos operativos = EBITDA; − D&A = EBIT; − intereses = EBT; − impuestos = Beneficio neto.' },
        { t: 'num', q: 'Los ingresos son 800 $ y el COGS 300 $. ¿Cuál es el margen bruto, en $?', a: 500, u: '$', e: 'Margen bruto = Ingresos − COGS = 800 $ − 300 $ = 500 $.' },
        { t: 'num', q: 'Con los números anteriores (ingresos 800 $, margen bruto 500 $), ¿cuál es el margen bruto en %?', a: 62.5, tol: 0.1, u: '%', e: 'Margen bruto % = 500 $ ÷ 800 $ = 62,5%.' },
        { t: 'mc', q: '¿Qué significan las letras “DA” de EBITDA?', o: ['Depreciación y amortización', 'Deuda y activos', 'Dividendos y ajustes', 'Diferidos y aplazados'], a: 0, e: 'EBITDA = Earnings Before Interest, Taxes, Depreciation and Amortization: beneficio antes de intereses, impuestos, depreciación y amortización.' },
        { t: 'num', q: 'El EBITDA es 250 $ y la D&A 50 $. ¿Cuál es el EBIT, en $?', a: 200, u: '$', e: 'EBIT = EBITDA − D&A = 250 $ − 50 $ = 200 $.' },
        { t: 'num', q: 'El EBIT es 200 $, los intereses 20 $ y el tipo impositivo el 25%. ¿Cuál es el beneficio neto, en $?', a: 135, u: '$', e: 'EBT = 200 $ − 20 $ = 180 $. Impuestos = 25% × 180 $ = 45 $. Beneficio neto = 180 $ − 45 $ = 135 $.' },
        { t: 'tf', q: 'La depreciación es dinero en efectivo que la empresa paga durante el año.', a: false, e: 'La depreciación reparte el coste de un activo comprado antes. El dinero salió al comprarlo; el cargo anual de D&A no supone salida de caja.' },
        { t: 'mc', q: 'Una empresa de software paga 1 M$ por una licencia que dura 4 años. ¿Cómo se llama el cargo anual?', o: ['Amortización de 250.000 $', 'Depreciación de 1 M$', 'COGS de 1 M$', 'Intereses de 250.000 $'], a: 0, e: 'Repartir el coste de un activo intangible durante su vida es amortización: 1 M$ ÷ 4 = 250.000 $ al año.' },
        { t: 'match', q: 'Empareja cada línea de beneficio con lo que se ha restado para llegar a ella (desde los ingresos)', p: [['Margen bruto', 'Solo el COGS'], ['EBITDA', 'COGS y gastos operativos'], ['EBIT', 'También la D&A'], ['Beneficio neto', 'Todo, incluidos intereses e impuestos']] },
        { t: 'num', q: 'El beneficio neto es 300 $ y la empresa tiene 100 acciones. ¿Cuál es el BPA, en $?', a: 3, u: '$', e: 'BPA = Beneficio neto ÷ Acciones = 300 $ ÷ 100 = 3 $.' },
        { t: 'int', q: 'Entrevista: ¿Qué es el EBITDA y por qué lo usan los banqueros?', m: 'El EBITDA es el beneficio antes de intereses, impuestos, depreciación y amortización: el beneficio de operar el negocio antes de las decisiones de financiación (intereses), de la situación fiscal y de los cargos no monetarios por inversiones pasadas (D&A). Los banqueros lo usan porque aproxima la caja que genera la operación y hace comparables empresas con estructuras de capital, impuestos y antigüedad de activos distintas. Su punto débil: ignora el capex y el circulante que el negocio necesita, así que sobrestima la caja real.' }
      ]
    },
    {
      id: 'z0l3', title: 'El balance: lo que tienes y quién lo pagó',
      th: [
        { h: 'Una foto, no una película', b: `<p>La cuenta de resultados es una <b>película</b>: lo que pasó durante un año. El <b>balance</b> (balance sheet) es una <b>foto</b> tomada un día concreto (por ejemplo, el 31 de diciembre). Recoge:</p><ul><li><b>Activos:</b> todo lo que la empresa tiene y vale algo: caja, dinero que le deben los clientes, existencias, máquinas, edificios, patentes.</li><li><b>Pasivos:</b> todo lo que debe a otros: préstamos bancarios, facturas de proveedores sin pagar, impuestos pendientes.</li><li><b>Patrimonio neto</b> (fondos propios): lo que queda para los dueños.</li></ul>` },
        { h: 'Piensa en una casa', b: `<p>Compras una casa que vale <b>500.000 $</b>. Pagas 100.000 $ de tus ahorros y pides 400.000 $ al banco (una hipoteca).</p><ul><li>Activo: la casa, 500.000 $</li><li>Pasivo: la hipoteca, 400.000 $</li><li>Tu patrimonio: 100.000 $</li></ul><p class="formula">Activos = Pasivos + Patrimonio neto → 500.000 $ = 400.000 $ + 100.000 $</p><p>Esta ecuación se cumple <b>siempre</b>, porque cada activo lo pagó alguien: o los prestamistas (pasivos) o los dueños (patrimonio). Por eso se llama <b>balance</b>: siempre cuadra.</p>` },
        { h: 'Las partidas principales', b: `<p><b>Activo corriente</b> (se convierte en caja en menos de un año):</p><ul><li><b>Caja</b> (efectivo)</li><li><b>Cuentas por cobrar</b> (clientes, A/R): ventas ya hechas que el cliente aún no ha pagado</li><li><b>Existencias</b> (inventario): productos esperando a venderse</li></ul><p><b>Activo no corriente:</b> <b>PP&amp;E</b> (inmovilizado material: máquinas, edificios), activos intangibles, <b>fondo de comercio</b> (goodwill, lo veremos en M&amp;A).</p><p><b>Pasivo corriente:</b> <b>cuentas por pagar</b> (proveedores, A/P), facturas aún no pagadas; gastos devengados.</p><p><b>Pasivo no corriente:</b> <b>deuda</b> (préstamos y bonos).</p><p><b>Patrimonio neto:</b> el dinero que aportaron los accionistas más las <b>reservas</b> o beneficios retenidos (retained earnings: todos los beneficios pasados que se quedaron en la empresa en vez de repartirse).</p>` },
        { h: 'Cómo llega el beneficio al balance', b: `<p>Si BeanCo gana 120 $ de beneficio neto y no reparte dividendo, esos 120 $ se quedan en la empresa. El patrimonio crece en 120 $ (vía beneficios retenidos) y, al otro lado, los activos también crecen (normalmente la caja).</p><p>Si BeanCo paga un <b>dividendo</b> de 20 $ a los accionistas, los beneficios retenidos solo crecen 100 $ y la caja baja 20 $.</p><p class="formula">Beneficios retenidos finales = Iniciales + Beneficio neto − Dividendos</p>` }
      ],
      ex: [
        { t: 'fill', q: 'Activos = Pasivos + ___', o: ['Patrimonio neto', 'Ingresos', 'Beneficio neto', 'EBITDA'], a: 0, e: 'Cada activo lo financian los prestamistas (pasivos) o los dueños (patrimonio neto).' },
        { t: 'num', q: 'Una empresa tiene 900 $ de activos y 600 $ de pasivos. ¿Cuál es su patrimonio neto, en $?', a: 300, u: '$', e: 'Patrimonio neto = Activos − Pasivos = 900 $ − 600 $ = 300 $.' },
        { t: 'mc', q: 'Un cliente compró 50 $ de mercancía pero pagará el mes que viene. ¿Dónde aparece?', o: ['Cuentas por cobrar (un activo)', 'Cuentas por pagar (un pasivo)', 'Deuda', 'Solo en beneficios retenidos'], a: 0, e: 'El dinero que los clientes DEBEN a la empresa son cuentas por cobrar, un activo corriente.' },
        { t: 'mc', q: 'La empresa ha recibido una factura de un proveedor de 30 $ y la pagará en 60 días. ¿Dónde aparece?', o: ['Cuentas por pagar (un pasivo)', 'Cuentas por cobrar (un activo)', 'Existencias', 'Ingresos'], a: 0, e: 'El dinero que la empresa DEBE a proveedores son cuentas por pagar, un pasivo corriente.' },
        { t: 'tf', q: 'El balance muestra los resultados de todo un año.', a: false, e: 'El balance es una foto en una fecha concreta. La cuenta de resultados y el estado de flujos de efectivo cubren un periodo.' },
        { t: 'match', q: 'Clasifica cada partida', p: [['Existencias', 'Activo corriente'], ['Fábrica', 'Activo no corriente (PP&E)'], ['Préstamo a 5 años', 'Pasivo no corriente'], ['Beneficios retenidos', 'Parte del patrimonio neto']] },
        { t: 'num', q: 'Los beneficios retenidos empiezan el año en 500 $. El beneficio neto es 80 $ y los dividendos 30 $. ¿Cuánto son al final del año, en $?', a: 550, u: '$', e: '500 $ + 80 $ − 30 $ = 550 $.' },
        { t: 'num', q: 'Compras un piso de 300.000 $ con una hipoteca de 240.000 $. ¿Cuál es tu patrimonio en el piso, en miles de $?', a: 60, u: 'k$', e: 'Patrimonio = 300.000 $ − 240.000 $ = 60.000 $.' },
        { t: 'int', q: 'Entrevista: ¿Por qué el balance siempre cuadra?', m: 'Porque cada activo que tiene una empresa lo tuvo que pagar alguien: o lo financiaron los acreedores (pasivos, como préstamos o facturas de proveedores pendientes) o los dueños (patrimonio neto: el capital que aportaron más los beneficios que se quedaron en la empresa). Así que el total de activos tiene que ser igual a pasivos más patrimonio. Cada operación cambia los dos lados en la misma cantidad, o mueve valor dentro de un mismo lado.' }
      ]
    },
    {
      id: 'z0l4', title: 'Beneficio no es caja: el estado de flujos de efectivo',
      th: [
        { h: 'Por qué una empresa con beneficios puede quedarse sin caja', b: `<p>Un fabricante de muebles vende una mesa de 1.000 $ en diciembre y registra 1.000 $ de ingresos. Pero el cliente paga en febrero. En diciembre la empresa tiene <b>beneficio pero no caja</b>. Si el 31 de diciembre tiene que pagar las nóminas, tiene un problema.</p><p>El beneficio sigue <b>reglas contables</b> (los ingresos se cuentan cuando se ganan y los costes cuando se incurren). La caja es <b>lo que realmente hay en el banco</b>. Se diferencian por tres motivos principales:</p><ol><li><b>Costes no monetarios:</b> la D&amp;A reduce el beneficio pero no sale dinero.</li><li><b>Plazos:</b> clientes que pagan tarde (cuentas por cobrar), pagar tarde a proveedores (cuentas por pagar), comprar existencias antes de venderlas.</li><li><b>Inversiones:</b> comprar una máquina de 500 $ gasta 500 $ de caja hoy, pero este año solo aparecen 100 $ como coste.</li></ol>` },
        { h: 'Las tres secciones', b: `<p>El <b>estado de flujos de efectivo</b> (cash flow statement) explica cómo ha pasado la caja de su nivel inicial al final:</p><ul><li><b>Flujo de operaciones (CFO):</b> parte del beneficio neto, suma las partidas no monetarias (D&amp;A) y ajusta por los cambios en el circulante.</li><li><b>Flujo de inversión (CFI):</b> compra de equipos (<b>capex</b>, inversión en inmovilizado), compra o venta de negocios.</li><li><b>Flujo de financiación (CFF):</b> pedir o devolver deuda, emitir acciones, pagar dividendos.</li></ul><p class="formula">Variación de caja = CFO + CFI + CFF</p>` },
        { h: 'El circulante, en sencillo', b: `<p>El <b>capital circulante</b> (working capital) es el dinero atrapado en el día a día del negocio. Los banqueros suelen referirse al <b>capital circulante neto (NWC)</b>: (cuentas por cobrar + existencias) − (cuentas por pagar + gastos devengados), sin contar caja ni deuda.</p><ul><li>Si <b>suben las cuentas por cobrar o las existencias</b>, hay caja atrapada ahí → la caja <b>baja</b>.</li><li>Si <b>suben las cuentas por pagar</b> (pagas más tarde a los proveedores), te quedas el dinero más tiempo → la caja <b>sube</b>.</li></ul><p>Regla práctica: si <b>sube un activo</b>, consume caja; si <b>sube un pasivo</b>, aporta caja.</p>` },
        { h: 'Flujo de caja libre: el número que más importa', b: `<p>El <b>flujo de caja libre (FCF)</b> es la caja que genera un negocio después de pagar todo lo que necesita para seguir funcionando y creciendo: operaciones, circulante y equipos.</p><p class="formula">FCF simple = Flujo de operaciones − Capex</p><p>Ejemplo: beneficio neto 120 $, D&amp;A 100 $, cuentas por cobrar +30 $, capex 90 $.</p><p>CFO = 120 + 100 − 30 = 190 $. FCF = 190 − 90 = <b>100 $</b>.</p><p>La valoración por DCF y los LBO se construyen sobre el flujo de caja libre, porque lo que paga a prestamistas y dueños es la caja, no el beneficio contable.</p>` }
      ],
      ex: [
        { t: 'tf', q: 'Una empresa puede tener beneficios y aun así quedarse sin caja.', a: true, e: 'Si los clientes pagan tarde, se acumulan existencias o invierte mucho, la caja puede vaciarse aunque haya beneficio.' },
        { t: 'num', q: 'Beneficio neto 50 $, D&A 20 $, sin cambios en el circulante. ¿Cuál es el flujo de operaciones, en $?', a: 70, u: '$', e: 'CFO = Beneficio neto + D&A = 50 $ + 20 $ = 70 $. La D&A se suma porque redujo el beneficio sin gastar caja.' },
        { t: 'mc', q: 'Las cuentas por cobrar aumentan 40 $ durante el año. ¿Qué efecto tiene en el flujo de operaciones?', o: ['−40 $', '+40 $', 'Ninguno', '−40 $ en inversión'], a: 0, e: 'Más dinero pendiente de los clientes significa menos caja cobrada: si sube un activo, consume caja.' },
        { t: 'mc', q: 'Las cuentas por pagar aumentan 15 $. ¿Qué efecto tiene en la caja?', o: ['+15 $', '−15 $', 'Ninguno', 'Solo afecta a la cuenta de resultados'], a: 0, e: 'Pagar más tarde a los proveedores mantiene la caja más tiempo en la empresa: si sube un pasivo, aporta caja.' },
        { t: 'match', q: 'Coloca cada partida en su sección del estado de flujos', p: [['Sumar la depreciación', 'Operaciones'], ['Comprar una fábrica nueva', 'Inversión'], ['Devolver un préstamo', 'Financiación'], ['Pagar un dividendo', 'Financiación (dueños)']] },
        { t: 'num', q: 'El flujo de operaciones es 200 $ y el capex 70 $. ¿Cuál es el flujo de caja libre, en $?', a: 130, u: '$', e: 'FCF = CFO − Capex = 200 $ − 70 $ = 130 $.' },
        { t: 'fill', q: 'Variación de caja = Flujo de operaciones + Flujo de inversión + Flujo de ___', o: ['financiación', 'ingresos', 'valor de las acciones', 'EBITDA'], a: 0, e: 'Las tres secciones juntas explican toda la variación del saldo de caja.' },
        { t: 'num', q: 'Beneficio neto 100 $, D&A 30 $, existencias +20 $, cuentas por pagar +10 $, capex 50 $. ¿Cuál es el flujo de caja libre, en $?', a: 70, u: '$', e: 'CFO = 100 + 30 − 20 + 10 = 120 $. FCF = 120 − 50 = 70 $.' },
        { t: 'int', q: 'Entrevista: ¿Por qué el flujo de caja es distinto del beneficio neto?', m: 'El beneficio neto sigue el criterio de devengo: los ingresos se registran cuando se ganan y los costes cuando se incurren. El flujo de caja cuenta la caja real. Se diferencian por partidas no monetarias como la depreciación (un coste sin salida de caja), por los plazos del circulante (clientes que pagan más tarde, existencias compradas antes de venderse, proveedores pagados más tarde) y por inversiones como el capex, que gastan caja hoy pero se llevan a gasto poco a poco mediante la depreciación.' }
      ]
    },
    {
      id: 'z0l5', title: 'Deuda frente a capital: dos formas de financiar una empresa',
      th: [
        { h: 'De dónde sale el dinero', b: `<p>Para empezar o crecer, una empresa necesita dinero (<b>capital</b>). Puede conseguirlo de dos formas básicas:</p><ul><li><b>Deuda:</b> pedirlo prestado. Los prestamistas (bancos, inversores en bonos) reciben un <b>interés</b> fijo y les devuelven su dinero en una fecha fijada (el <b>vencimiento</b>). No son dueños de la empresa.</li><li><b>Capital</b> (equity, fondos propios): vender propiedad. Los accionistas no reciben un pago fijo, pero son dueños de todo lo que queda después de pagar a los demás: todo el potencial de subida.</li></ul><p>La combinación de deuda y capital que usa una empresa es su <b>estructura de capital</b>.</p>` },
        { h: 'Quién cobra primero', b: `<p>Si a la empresa le va mal y se vende o se liquida, el dinero se reparte en un orden estricto:</p><ol><li><b>Prestamistas con garantía</b> (respaldados por activos concretos)</li><li><b>Prestamistas sin garantía</b> (bonistas sin colateral)</li><li><b>Accionistas</b>, que se quedan lo que sobre, a menudo nada</li></ol><p>Este orden se llama <b>prelación</b> (seniority) o <b>estructura de capital por capas</b> (capital stack). Cuanto más arriba estás, más seguro, así que exiges menos rentabilidad.</p>` },
        { h: 'Riesgo y rentabilidad van juntos', b: `<p>Como la deuda cobra primero y tiene un rendimiento fijo, es <b>menos arriesgada</b>, así que los prestamistas aceptan menos rentabilidad (por ejemplo, un 6–9% de interés). El capital cobra el último y puede perderse entero, así que los accionistas exigen una <b>rentabilidad esperada mayor</b> (por ejemplo, un 10–25%).</p><p>Por eso <b>la deuda es más barata que el capital</b>. Además, los intereses <b>son deducibles</b>: reducen el beneficio sobre el que se pagan impuestos, lo que abarata aún más la deuda. Pero demasiada deuda es peligrosa: los intereses hay que pagarlos cada año, vayan bien o mal las cosas, y dejar de pagar puede llevar a la empresa a la <b>quiebra</b>.</p>` },
        { h: 'El apalancamiento en un ejemplo', b: `<p>Compras un negocio por 100 $ y lo vendes un año después por 120 $.</p><ul><li><b>Todo con capital propio:</b> pones 100 $ y recuperas 120 $. Rentabilidad = <b>20%</b>.</li><li><b>Mitad deuda:</b> pones 50 $ y pides prestados 50 $ al 10%. Vendes por 120 $, devuelves 50 $ + 5 $ de intereses = 55 $ y te quedas 65 $. Rentabilidad = 65 $ ÷ 50 $ − 1 = <b>30%</b>.</li></ul><p>Pedir prestado (<b>apalancarte</b>) ha multiplicado tu rentabilidad. Si el negocio hubiera bajado a 80 $, te quedarían 25 $: una pérdida del −50% en vez del −20%. El apalancamiento amplifica las ganancias y las pérdidas. Es la idea central de un <b>LBO</b> (compra apalancada).</p>` }
      ],
      ex: [
        { t: 'mc', q: '¿Qué inversor es dueño de una parte de la empresa?', o: ['Un accionista', 'Un banco que ha dado un préstamo', 'Un bonista', 'Un proveedor'], a: 0, e: 'Los accionistas son dueños de la empresa. Los prestamistas y bonistas son acreedores: se les debe dinero, pero no son dueños.' },
        { t: 'ord', q: 'Ordena de quien cobra primero a quien cobra el último si la empresa se liquida', o: ['Prestamistas con garantía', 'Bonistas sin garantía', 'Accionistas'], e: 'La deuda con garantía está respaldada por colateral y cobra primero; el capital es el derecho residual y cobra el último.' },
        { t: 'tf', q: 'Para una empresa, el capital suele ser más barato que la deuda.', a: false, e: 'El capital es más arriesgado (cobra el último, sin rentabilidad garantizada), así que los inversores exigen más. Además, los intereses de la deuda son deducibles.' },
        { t: 'mc', q: '¿Por qué se dice que los intereses de la deuda crean un “escudo fiscal”?', o: ['Se restan antes de impuestos, así que se pagan menos impuestos', 'Los prestamistas pagan los impuestos de la empresa', 'La deuda no tributa en ningún país', 'Aumentan los ingresos'], a: 0, e: 'Los intereses se restan antes de calcular el beneficio sujeto a impuestos (EBT), así que la empresa paga menos.' },
        { t: 'num', q: 'Compras un negocio por 200 $ con 100 $ tuyos y 100 $ de deuda (ignora los intereses). Lo vendes por 260 $ y devuelves la deuda. ¿Cuál es tu rentabilidad, en %?', a: 60, u: '%', e: 'Recibes 260 $ − 100 $ = 160 $ por tus 100 $. Rentabilidad = 160 / 100 − 1 = 60%. Sin deuda habría sido un 30%.' },
        { t: 'num', q: 'La misma operación, pero el negocio se vende por 150 $. ¿Cuál es tu rentabilidad, en %?', a: -50, u: '%', e: 'Recibes 150 $ − 100 $ = 50 $ por tus 100 $: pierdes un 50%. Sin deuda habría sido un −25%. El apalancamiento también amplifica las pérdidas.' },
        { t: 'fill', q: 'La combinación de deuda y capital que usa una empresa se llama su ___ de capital', o: ['estructura', 'inversión', 'ganancia', 'mercado'], a: 0, e: 'La estructura de capital describe cómo se financia la empresa.' },
        { t: 'match', q: 'Empareja cada término', p: [['Vencimiento', 'Fecha en que hay que devolver el préstamo'], ['Colateral', 'Activos dados en garantía a un prestamista'], ['Apalancamiento', 'Usar deuda para financiar una inversión'], ['Quiebra', 'Proceso legal cuando no se pueden pagar las deudas']] },
        { t: 'int', q: 'Entrevista: ¿Por qué usaría una empresa deuda en lugar de capital, y cuál es el riesgo?', m: 'La deuda es más barata que el capital: los prestamistas asumen menos riesgo porque cobran primero y reciben un rendimiento fijo, y los intereses son deducibles. Además, no diluye a los dueños actuales. El riesgo es que los intereses y las devoluciones son obligatorios pase lo que pase; demasiada deuda puede llevar al impago y a la quiebra, y reduce la flexibilidad en una crisis.' }
      ]
    },
    {
      id: 'z0l6', title: 'Acciones, precio de la acción y valor de mercado',
      th: [
        { h: 'Del precio de una acción al valor de toda la empresa', b: `<p>Si una acción de una empresa cotizada vale <b>50 $</b> y hay <b>10 millones</b> de acciones, el mercado valora toda la participación de los dueños en:</p><p class="formula">Valor del capital (capitalización bursátil) = Precio por acción × Número de acciones = 50 $ × 10 M = 500 M$</p><p>Es el valor de la empresa <b>para sus accionistas</b>. También se llama <b>capitalización bursátil</b> (market cap) o <b>equity value</b>.</p><p>Un precio por acción más alto no hace a una empresa “más grande” por sí solo: una acción de 10 $ con 1.000 millones de acciones (10.000 M$) vale más que una acción de 500 $ con 1 millón de acciones (500 M$).</p>` },
        { h: 'Dilución y opciones, con calma', b: `<p>Las empresas suelen dar a sus empleados <b>opciones sobre acciones</b> (stock options): el derecho a comprar una acción a un precio fijo (el <b>precio de ejercicio</b> o strike). Si la acción cotiza a 50 $ y el strike de una opción es 30 $, la opción está <b>dentro del dinero</b> (in the money): ejercerla crea una acción nueva.</p><p>Más acciones significa que cada dueño actual tiene un trozo un poco más pequeño. Eso es la <b>dilución</b>. Por eso los banqueros cuentan las <b>acciones totalmente diluidas</b>: las acciones existentes más las que crearían las opciones dentro del dinero y los valores convertibles. Aprenderás exactamente cómo (el <i>método de autocartera</i> o treasury stock method) en el capítulo de Comparables.</p>` },
        { h: 'Precio frente a valor', b: `<p>El precio de la acción es lo que el mercado está dispuesto a pagar <b>hoy</b>. Se mueve con las noticias, los tipos de interés y el sentimiento. El <b>valor intrínseco</b> es lo que la empresa vale de verdad según la caja que generará en el futuro.</p><p>Gran parte de la banca de inversión consiste en estimar el valor y compararlo con el precio: “¿Está barata o cara esta empresa? ¿Cuánto debería pagar un comprador?”</p>` }
      ],
      ex: [
        { t: 'num', q: 'Una acción cotiza a 20 $ y la empresa tiene 50 millones de acciones. ¿Cuál es el valor de su capital, en M$?', a: 1000, u: 'M$', e: '20 $ × 50 M = 1.000 M$ (1.000 millones).' },
        { t: 'mc', q: 'Empresa A: acción a 200 $, 1 M de acciones. Empresa B: acción a 5 $, 100 M de acciones. ¿Cuál tiene más capitalización?', o: ['La B (500 M$ frente a 200 M$)', 'La A, porque su acción vale más', 'Son iguales', 'No se puede saber sin el EBITDA'], a: 0, e: 'Capitalización = precio × acciones. A = 200 M$, B = 500 M$. El precio de la acción por sí solo no dice nada del tamaño.' },
        { t: 'tf', q: 'Una opción con strike de 40 $ está “dentro del dinero” cuando la acción cotiza a 35 $.', a: false, e: 'Una opción para comprar a 40 $ solo merece la pena ejercerla si la acción vale más de 40 $. A 35 $ está fuera del dinero.' },
        { t: 'fill', q: 'Cuando se crean acciones nuevas y baja el porcentaje de cada dueño actual, se llama ___', o: ['dilución', 'apalancamiento', 'amortización', 'acreción'], a: 0, e: 'La dilución reduce el porcentaje de propiedad de cada accionista existente.' },
        { t: 'num', q: 'Tienes 1.000 de las 10.000 acciones de una empresa. Emite 2.500 acciones nuevas para otras personas. ¿Qué porcentaje tienes ahora, en %?', a: 8, u: '%', e: '1.000 ÷ 12.500 = 8%. Te han diluido del 10% al 8%.' },
        { t: 'match', q: 'Empareja cada término', p: [['Capitalización bursátil', 'Precio por acción × acciones'], ['Precio de ejercicio', 'Precio al que una opción compra una acción'], ['Acciones totalmente diluidas', 'Acciones incluidas las opciones dentro del dinero'], ['Valor intrínseco', 'Valor según los flujos de caja futuros']] },
        { t: 'int', q: 'Entrevista: ¿Qué diferencia hay entre el precio de la acción de una empresa y su valor?', m: 'El precio de la acción es lo que el mercado paga hoy por una acción, movido por la oferta y la demanda, las noticias y el sentimiento. El valor del capital es ese precio por las acciones totalmente diluidas. El valor intrínseco es lo que el negocio vale de verdad según los flujos de caja que generará, descontados por riesgo y tiempo. Los banqueros estiman el valor con DCF, comparables y transacciones precedentes y lo comparan con el precio de mercado.' }
      ]
    },
    {
      id: 'z0l7', title: 'Valor de empresa: el precio de todo el negocio',
      th: [
        { h: 'Volvemos a la casa', b: `<p>Quieres comprar una casa. El dueño te dice: “Mi patrimonio en ella son 100.000 $”. Pero la casa tiene una <b>hipoteca de 400.000 $</b>. Si la compras, te quedas también con la hipoteca. El precio real de la casa es <b>500.000 $</b>, no 100.000 $.</p><p>Ahora imagina que hay <b>20.000 $ en efectivo</b> en un cajón que vienen con la casa. En la práctica pagas 20.000 $ menos: la casa te cuesta 480.000 $.</p><p>Así es exactamente como piensan los banqueros al comprar una empresa.</p>` },
        { h: 'La fórmula', b: `<p class="formula">Valor de empresa (EV) = Valor del capital + Deuda − Caja</p><p>(La fórmula completa suma también las acciones preferentes y los minoritarios; los verás en Comparables).</p><p>El <b>valor del capital</b> (equity value) es lo que vale la participación de los accionistas. El <b>valor de empresa</b> (enterprise value, EV) es lo que vale <b>todo el negocio operativo</b> para <b>todos los que lo financian</b>: accionistas y prestamistas.</p><p>Ejemplo: valor del capital 800 $, deuda 300 $, caja 100 $ → EV = 800 + 300 − 100 = <b>1.000 $</b>.</p>` },
        { h: '¿Por qué dos valores?', b: `<p>Dos empresas pueden tener negocios idénticos pero financiarse de forma distinta: una sin deuda y otra con mucha. Sus <b>valores del capital son distintos</b> (la deuda se lleva un trozo mayor), pero sus <b>valores de empresa son parecidos</b>, porque el negocio en sí es el mismo.</p><p>Por eso el EV se compara con cifras que pertenecen a <b>todos</b> los que aportan capital, como los ingresos, el EBITDA y el EBIT (antes de intereses). El valor del capital se compara con cifras que solo pertenecen a los accionistas, como el beneficio neto y el BPA (después de intereses).</p>` }
      ],
      ex: [
        { t: 'num', q: 'Valor del capital 500 $, deuda 200 $, caja 50 $. ¿Cuál es el valor de empresa, en $?', a: 650, u: '$', e: 'EV = 500 + 200 − 50 = 650 $.' },
        { t: 'num', q: 'El valor de empresa es 1.200 $, la deuda 400 $ y la caja 100 $. ¿Cuál es el valor del capital, en $?', a: 900, u: '$', e: 'Valor del capital = EV − Deuda + Caja = 1.200 − 400 + 100 = 900 $.' },
        { t: 'mc', q: '¿Por qué se resta la caja al calcular el valor de empresa?', o: ['El comprador se la queda, así que en la práctica reduce el precio del negocio', 'La caja es un pasivo', 'La caja ya está en el EBITDA', 'Lo exige el regulador'], a: 0, e: 'Como el dinero del cajón de la casa que compras: viene con la empresa, así que el coste neto del negocio es menor.' },
        { t: 'tf', q: 'Dos negocios idénticos, uno con mucha deuda y otro sin deuda, tendrán valores de empresa parecidos pero valores del capital distintos.', a: true, e: 'El EV refleja el negocio operativo sea cual sea su financiación. La deuda se lleva un trozo mayor y deja menos valor para el capital.' },
        { t: 'match', q: 'Empareja cada valor con la medida de beneficio que le corresponde', p: [['Valor de empresa', 'EBITDA (antes de intereses)'], ['Valor del capital', 'Beneficio neto (después de intereses)'], ['EV / Ingresos', 'Ventas de todo el negocio'], ['Precio por acción', 'BPA']] },
        { t: 'num', q: 'Una empresa tiene 10 M de acciones a 30 $, 100 M$ de deuda y 40 M$ de caja. ¿Cuál es el EV, en M$?', a: 360, u: 'M$', e: 'Valor del capital = 10 M × 30 $ = 300 M$. EV = 300 + 100 − 40 = 360 M$.' },
        { t: 'int', q: 'Entrevista: ¿Cuál es la diferencia entre valor de empresa y valor del capital?', m: 'El valor del capital es el valor de la empresa solo para sus accionistas: precio por acción por acciones totalmente diluidas. El valor de empresa es el valor del negocio operativo para todos los que aportan capital: valor del capital más deuda, acciones preferentes y minoritarios, menos caja. Piensa en comprar una casa: el patrimonio es lo que se queda el dueño, pero el precio completo incluye la hipoteca que asumes, menos el efectivo que venga con la casa.' }
      ]
    },
    {
      id: 'z0l8', title: 'Valor temporal del dinero: por qué 100 $ hoy valen más que 100 $ dentro de un año',
      th: [
        { h: 'La idea central', b: `<p>¿Prefieres <b>100 $ hoy</b> o <b>100 $ dentro de un año</b>? Hoy, porque podrías meterlos en una cuenta al 10% y tener <b>110 $</b> el año que viene. El dinero de hoy puede generar rentabilidad, así que vale más que la misma cantidad más adelante.</p><p>Esto es el <b>valor temporal del dinero</b>, la idea más importante de la valoración.</p>` },
        { h: 'Capitalizar: hacia delante', b: `<p>100 $ al 10% anual:</p><ul><li>Tras 1 año: 100 × 1,10 = 110 $</li><li>Tras 2 años: 110 × 1,10 = 121 $ (ganas intereses sobre los intereses)</li><li>Tras 3 años: 121 × 1,10 = 133,1 $</li></ul><p class="formula">Valor futuro = Valor actual × (1 + r)<sup>n</sup></p><p>donde <b>r</b> es el tipo anual y <b>n</b> el número de años.</p>` },
        { h: 'Descontar: hacia atrás', b: `<p>Ahora al revés. Alguien te promete <b>121 $ dentro de 2 años</b>. Si pudieras ganar un 10% en otra parte, ¿cuánto vale hoy esa promesa?</p><p class="formula">Valor actual = Valor futuro ÷ (1 + r)<sup>n</sup> = 121 ÷ 1,10² = 100 $</p><p>El tipo que usas, <b>r</b>, es la <b>tasa de descuento</b>: la rentabilidad que podrías obtener en otra inversión de riesgo parecido. Cuanto más arriesgada la promesa, mayor la tasa de descuento y menor el valor actual.</p>` },
        { h: 'De aquí al DCF', b: `<p>Una empresa es una serie de flujos de caja futuros: 100 $ el año que viene, 110 $ el siguiente, etc. Para valorarla, <b>descuentas cada flujo futuro a hoy</b> y los sumas. Eso es una valoración por <b>descuento de flujos de caja (DCF)</b>.</p><p>Ejemplo al 10%: 110 $ en el año 1 y 121 $ en el año 2 valen hoy 110/1,1 + 121/1,21 = 100 + 100 = <b>200 $</b>.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Inviertes 1.000 $ al 5% anual durante 2 años. ¿Cuánto tienes al final, en $?', a: 1102.5, tol: 0.5, u: '$', e: '1.000 × 1,05² = 1.000 × 1,1025 = 1.102,50 $.' },
        { t: 'num', q: '¿Cuánto valen hoy 220 $ que recibirás dentro de un año, con una tasa de descuento del 10%, en $?', a: 200, u: '$', e: 'VA = 220 ÷ 1,10 = 200 $.' },
        { t: 'tf', q: 'Una tasa de descuento más alta hace que un flujo futuro valga más hoy.', a: false, e: 'VA = VF ÷ (1 + r)ⁿ. Una r mayor hace mayor el denominador y, por tanto, menor el valor actual.' },
        { t: 'mc', q: '¿Por qué se descuenta una inversión más arriesgada a un tipo más alto?', o: ['Los inversores exigen más rentabilidad por asumir más riesgo', 'Las inversiones arriesgadas pagan más impuestos', 'Los bancos lo exigen por ley', 'Facilita las cuentas'], a: 0, e: 'La tasa de descuento es la rentabilidad que exigen los inversores. Más riesgo → más rentabilidad exigida → menor valor actual.' },
        { t: 'fill', q: 'Valor actual = Valor futuro ÷ (1 + r)^___', o: ['n (número de años)', 'r (el tipo)', 'siempre 2', 'el precio de la acción'], a: 0, e: 'Divides entre (1 + r) una vez por cada año que esperas.' },
        { t: 'num', q: 'Al 10%, ¿cuál es el valor actual total de 110 $ en el año 1 más 121 $ en el año 2, en $?', a: 200, u: '$', e: '110/1,1 = 100; 121/1,21 = 100; total = 200 $. Es un mini DCF.' },
        { t: 'ord', q: 'Ordena de mayor a menor valor actual (todo al 8%)', o: ['100 $ recibidos hoy', '100 $ recibidos dentro de 1 año', '100 $ recibidos dentro de 5 años', '100 $ recibidos dentro de 10 años'], e: 'Cuanto más tarde llega el dinero, más se descuenta.' },
        { t: 'int', q: 'Entrevista: Explica el valor temporal del dinero a alguien sin formación financiera.', m: 'Un dólar hoy vale más que un dólar en el futuro porque el de hoy se puede invertir y crecer. Si puedo ganar un 10% al año, 100 $ hoy se convierten en 110 $ el año que viene, así que una promesa de 110 $ dentro de un año solo me vale 100 $ hoy. Para comparar dinero en momentos distintos, descontamos las cantidades futuras a hoy con un tipo que refleje la rentabilidad disponible en otras inversiones y el riesgo de la promesa.' }
      ]
    },
    {
      id: 'z0l9', title: 'Rentabilidad: cómo miden el éxito los inversores',
      th: [
        { h: 'Dos formas de medir una rentabilidad', b: `<p>Inviertes 100 $ y recuperas 200 $ al cabo de 5 años. ¿Es mucho o poco?</p><ul><li><b>Múltiplo sobre lo invertido (MoM o MOIC):</b> cuántas veces recuperas tu dinero. 200 $ ÷ 100 $ = <b>2,0x</b>.</li><li><b>TIR (tasa interna de rentabilidad, en inglés IRR):</b> el tipo anual compuesto que convierte 100 $ en 200 $ en 5 años. Aquí, alrededor del <b>14,9%</b> anual.</li></ul><p>El MoM te dice <b>cuánto</b>; la TIR te dice <b>a qué velocidad</b>. Duplicar tu dinero en 2 años (≈41% de TIR) es mucho mejor que duplicarlo en 10 (≈7% de TIR).</p>` },
        { h: 'Intuición de la TIR y atajos', b: `<p>La TIR es la tasa de descuento que hace que el valor actual de lo que recuperas sea igual a lo que pusiste. Con una sola entrada y una sola salida:</p><p class="formula">TIR = (Valor de salida ÷ Valor de entrada)<sup>1/años</sup> − 1</p><p>Atajos que los banqueros memorizan para 5 años: <b>2x ≈ 15%</b>, <b>2,5x ≈ 20%</b>, <b>3x ≈ 25%</b>. Para 3 años: 2x ≈ 26%.</p><p><b>Regla del 72:</b> el dinero se duplica en unos 72 ÷ tipo años. Al 8%, unos 9 años.</p>` },
        { h: 'Rentabilidad exigida y tasa mínima', b: `<p>Todo inversor tiene una rentabilidad mínima que necesita para que una inversión merezca la pena: la <b>rentabilidad exigida</b> o <b>tasa mínima</b> (hurdle rate). Los fondos de private equity suelen buscar una <b>TIR del 20–25%</b> y un <b>2,0–3,0x</b> en 3–7 años.</p><p>Desde el punto de vista de la empresa, la rentabilidad que exigen los inversores es su <b>coste de capital</b>. Si combinas el coste de la deuda y el coste del capital según cuánto usa de cada uno, obtienes el <b>WACC</b> (coste medio ponderado del capital), la tasa de descuento de un DCF.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Inviertes 50 $ y recibes 150 $ a la salida. ¿Cuál es tu múltiplo sobre lo invertido (x)?', a: 3, u: 'x', e: 'MoM = 150 ÷ 50 = 3,0x.' },
        { t: 'mc', q: '¿Qué es mejor: 2,0x en 3 años o 2,0x en 7 años?', o: ['2,0x en 3 años (más TIR)', '2,0x en 7 años', 'Son lo mismo', 'No se pueden comparar'], a: 0, e: 'El mismo múltiplo, pero más rápido significa más TIR: alrededor del 26% frente a alrededor del 10%.' },
        { t: 'num', q: '¿Qué TIR aproximada corresponde a 2,0x en 5 años, en %? (usa el atajo de banquero)', a: 15, tol: 0.5, u: '%', e: '2^(1/5) − 1 ≈ 14,9%. Los banqueros redondean al 15%.' },
        { t: 'num', q: 'Con la regla del 72, ¿en cuántos años se duplica el dinero al 12%?', a: 6, tol: 0.2, u: 'años', e: '72 ÷ 12 = 6 años.' },
        { t: 'tf', q: 'La TIR mide cuántas veces recuperas tu dinero.', a: false, e: 'Eso es el múltiplo sobre lo invertido (MoM). La TIR es la rentabilidad anual compuesta, así que también tiene en cuenta el tiempo.' },
        { t: 'match', q: 'Empareja cada término', p: [['MoM', 'Veces que recuperas tu dinero'], ['TIR', 'Rentabilidad anual compuesta'], ['Tasa mínima (hurdle)', 'Rentabilidad mínima aceptable'], ['WACC', 'Coste combinado de deuda y capital']] },
        { t: 'int', q: 'Entrevista: ¿Qué diferencia hay entre la TIR y el múltiplo sobre lo invertido, y por qué los inversores de PE miran los dos?', m: 'El múltiplo mide el valor total devuelto respecto a lo invertido (por ejemplo, 2,5x), sin tener en cuenta el tiempo. La TIR es la rentabilidad anualizada compuesta, así que recoge lo rápido que se ganó el dinero. El PE mira los dos: una TIR alta en una operación rápida puede devolver poco dinero en términos absolutos, y un múltiplo alto en muchos años puede tener una TIR mediocre. Los LP se fijan en la TIR para comparar resultados y en los múltiplos para saber cuánta caja reciben realmente.' }

    {
      id: 'z0l10', title: 'Qué significa valorar: múltiplos y valor intrínseco',
      th: [
        { h: 'Dos formas de responder “¿cuánto vale?”', b: `<p><b>1. Valoración relativa:</b> mirar a cuánto se venden cosas parecidas. Un piso vale más o menos lo que se pagó por pisos similares en la misma calle. Para empresas:</p><ul><li><b>Compañías comparables (“comps”):</b> cómo valora hoy la bolsa a empresas cotizadas similares.</li><li><b>Transacciones precedentes:</b> lo que pagaron compradores por empresas similares en adquisiciones pasadas.</li></ul><p><b>2. Valoración intrínseca:</b> estimar los flujos de caja futuros y descontarlos a hoy: el <b>DCF</b>.</p><p>El <b>análisis LBO</b> añade una cuarta visión: cuánto podría pagar un comprador de private equity y aun así alcanzar su rentabilidad objetivo.</p>` },
        { h: 'Múltiplos: la valoración como cociente', b: `<p>Un <b>múltiplo</b> compara un valor con una cifra financiera. Los más usados:</p><ul><li><b>EV / EBITDA:</b> cuántos años de EBITDA cuesta el negocio. Una empresa con 100 M$ de EBITDA a 8x vale un EV de 800 M$.</li><li><b>PER (precio / beneficio, en inglés P/E):</b> precio de la acción ÷ BPA, o valor del capital ÷ beneficio neto.</li><li><b>EV / Ingresos:</b> se usa cuando los beneficios son pequeños o negativos (empresas tecnológicas jóvenes).</li></ul><p>Múltiplos más altos suelen indicar que los inversores esperan <b>más crecimiento</b>, <b>más margen</b> o <b>menos riesgo</b>.</p>` },
        { h: 'Usar un múltiplo, paso a paso', b: `<p>Quieres valorar TargetCo: EBITDA de 50 M$, deuda de 100 M$ y caja de 20 M$. Empresas similares cotizan a <b>8x–10x EBITDA</b>.</p><ol><li>EV = 50 M$ × 8x a 10x = <b>400–500 M$</b></li><li>Valor del capital = EV − deuda + caja = 400 − 100 + 20 = <b>320 M$</b> hasta 500 − 100 + 20 = <b>420 M$</b></li></ol><p>Los banqueros muestran estos rangos de todos los métodos uno al lado del otro en un gráfico llamado <b>football field</b>.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Una empresa tiene un EBITDA de 40 M$. Sus comparables cotizan a 9x EV/EBITDA. ¿Cuál es su valor de empresa implícito, en M$?', a: 360, u: 'M$', e: '40 M$ × 9 = 360 M$.' },
        { t: 'num', q: 'La acción de una empresa vale 30 $ y su BPA es 2 $. ¿Cuál es su PER (x)?', a: 15, u: 'x', e: 'PER = 30 ÷ 2 = 15x.' },
        { t: 'num', q: 'El EV implícito es 500 M$, la deuda 150 M$ y la caja 30 M$. ¿Cuál es el valor del capital implícito, en M$?', a: 380, u: 'M$', e: '500 − 150 + 30 = 380 M$.' },
        { t: 'mc', q: '¿Qué método es una valoración intrínseca?', o: ['Descuento de flujos de caja (DCF)', 'Compañías comparables', 'Transacciones precedentes', 'Football field'], a: 0, e: 'Un DCF valora la empresa a partir de sus propios flujos de caja proyectados. Comparables y precedentes son métodos relativos; el football field es solo un gráfico que los resume.' },
        { t: 'tf', q: 'Una empresa con más crecimiento esperado suele cotizar a un múltiplo más alto.', a: true, e: 'Los inversores pagan más hoy por cada dólar de beneficio actual cuando esperan que ese beneficio crezca rápido.' },
        { t: 'mc', q: 'Una empresa de software joven tiene EBITDA negativo. ¿Qué múltiplo es más útil?', o: ['EV / Ingresos', 'EV / EBITDA', 'PER', 'No se puede usar ninguno'], a: 0, e: 'Con EBITDA y beneficio negativos, EV/EBITDA y PER no tienen sentido; los múltiplos sobre ingresos siguen funcionando.' },
        { t: 'match', q: 'Empareja cada método con su pregunta', p: [['Compañías comparables', '¿Qué paga hoy el mercado por empresas similares?'], ['Transacciones precedentes', '¿Qué pagaron compradores por empresas similares?'], ['DCF', '¿Cuánto valen hoy sus flujos de caja futuros?'], ['Análisis LBO', '¿Cuánto puede pagar un fondo de PE y lograr su rentabilidad?']] },
        { t: 'int', q: 'Entrevista: Explícame las principales formas de valorar una empresa.', m: 'Hay métodos relativos e intrínsecos. Relativos: compañías comparables, que aplican a la empresa los múltiplos de cotización de empresas cotizadas similares (por ejemplo, EV/EBITDA), y transacciones precedentes, que aplican los múltiplos pagados en adquisiciones pasadas de empresas similares e incluyen una prima de control. Intrínseco: el DCF, que proyecta los flujos de caja libres, los descuenta al WACC y suma un valor terminal. El análisis LBO da el precio que podría pagar un fondo para lograr su TIR objetivo. Los resultados se muestran juntos como rangos en un football field.' }
      ]
    },
    {
      id: 'z0l11', title: 'Crecimiento, márgenes y TACC',
      th: [
        { h: 'Márgenes: el beneficio como porcentaje de las ventas', b: `<p>Un <b>margen</b> es cualquier línea de beneficio dividida entre los ingresos. Responde: “De cada 1 $ de ventas, ¿cuánto queda?”</p><ul><li>Margen bruto = Margen bruto en $ ÷ Ingresos</li><li>Margen EBITDA = EBITDA ÷ Ingresos</li><li>Margen neto = Beneficio neto ÷ Ingresos</li></ul><p>Ejemplo: ingresos 500 $, EBITDA 100 $ → margen EBITDA = <b>20%</b>. Los márgenes permiten comparar una empresa pequeña con una enorme en igualdad de condiciones.</p>` },
        { h: 'Tasas de crecimiento', b: `<p>Crecimiento de un año al siguiente:</p><p class="formula">Crecimiento = (Este año ÷ Año pasado) − 1</p><p>Las ventas pasan de 200 $ a 230 $ → crecimiento = 230 ÷ 200 − 1 = <b>15%</b>.</p><p>En varios años el crecimiento es irregular. Los banqueros lo resumen con la <b>TACC</b> (tasa anual de crecimiento compuesto, en inglés <b>CAGR</b>): el tipo anual constante que te llevaría del principio al final.</p><p class="formula">TACC = (Final ÷ Inicial)<sup>1/años</sup> − 1</p><p>Ventas de 100 $ a 121 $ en 2 años → TACC = 1,21<sup>1/2</sup> − 1 = <b>10%</b>.</p>` },
        { h: 'Leer una empresa en 30 segundos', b: `<p>Cuando abres las cifras de una empresa, pregúntate:</p><ol><li><b>¿Cómo de grande es?</b> Ingresos y EBITDA.</li><li><b>¿A qué ritmo crece?</b> Crecimiento / TACC de ingresos y EBITDA.</li><li><b>¿Cómo de rentable es?</b> Márgenes.</li><li><b>¿Cuánta caja genera con eso?</b> FCF tras capex y circulante.</li><li><b>¿Cuánta deuda tiene?</b> Deuda ÷ EBITDA (<b>ratio de apalancamiento</b>). 2x es cómodo; 6x es agresivo.</li></ol><p>Estas cinco preguntas son la columna vertebral de los comparables, del análisis de crédito y de la selección de candidatos a LBO.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Los ingresos son 400 $ y el EBITDA 60 $. ¿Cuál es el margen EBITDA, en %?', a: 15, u: '%', e: '60 ÷ 400 = 15%.' },
        { t: 'num', q: 'Las ventas pasan de 250 $ a 300 $. ¿Cuál es el crecimiento, en %?', a: 20, u: '%', e: '300 ÷ 250 − 1 = 20%.' },
        { t: 'num', q: 'Los ingresos crecen de 100 $ a 144 $ en 2 años. ¿Cuál es la TACC, en %?', a: 20, u: '%', e: '(144/100)^(1/2) − 1 = 1,2 − 1 = 20%.' },
        { t: 'num', q: 'Una empresa tiene una deuda de 300 M$ y un EBITDA de 75 M$. ¿Cuál es su ratio de apalancamiento (x)?', a: 4, u: 'x', e: 'Deuda ÷ EBITDA = 300 ÷ 75 = 4,0x.' },
        { t: 'tf', q: 'Una empresa con 10.000 M$ de ingresos siempre tiene más margen EBITDA que una con 100 M$.', a: false, e: 'Los márgenes son porcentajes y no dependen solo del tamaño. Una empresa pequeña puede ser mucho más rentable por cada dólar vendido.' },
        { t: 'fill', q: 'TACC = (Final ÷ Inicial)^(1/___) − 1', o: ['años', 'margen', 'acciones', 'tipo'], a: 0, e: 'Se toma la raíz del número de años para obtener el tipo anual constante.' },
        { t: 'int', q: 'Entrevista: Tienes 30 segundos con las cuentas de una empresa. ¿Qué miras?', m: 'El tamaño (ingresos y EBITDA), el crecimiento (crecimiento o TACC de ingresos y EBITDA), la rentabilidad (margen bruto y margen EBITDA), la conversión en caja (flujo de caja libre tras capex y circulante como porcentaje del EBITDA) y el riesgo del balance (deuda sobre EBITDA y cobertura de intereses). Así sé cómo de grande, cómo de rápida, cómo de rentable, cuánta caja genera y cuánto apalancamiento tiene.' }
      ]
    },
    {
      id: 'z0l12', title: 'Quién hace qué: bancos, fondos de PE y las principales operaciones',
      th: [
        { h: 'Los protagonistas', b: `<ul><li><b>Empresas (corporates):</b> gestionan negocios; a veces compran otras empresas, venden divisiones o captan dinero.</li><li><b>Bancos de inversión:</b> asesores y estructuradores. No suelen invertir su propio dinero en la operación; cobran <b>comisiones</b> por asesorar y por captar financiación.</li><li><b>Fondos de private equity (PE, capital riesgo):</b> captan dinero de grandes inversores (fondos de pensiones, aseguradoras, familias ricas) y lo usan, junto con mucha deuda, para <b>comprar empresas</b>, mejorarlas y venderlas unos años después.</li><li><b>Prestamistas:</b> bancos y fondos de deuda privada que aportan la deuda.</li><li><b>Inversores de mercado:</b> fondos de inversión, hedge funds y particulares que compran acciones y bonos.</li></ul>` },
        { h: 'Las operaciones principales (y los capítulos del libro)', b: `<ul><li><b>M&amp;A (fusiones y adquisiciones):</b> una empresa compra otra. Los banqueros de <b>sell-side</b> (lado vendedor) ayudan a un dueño a vender (organizan una <b>subasta</b> entre compradores); los de <b>buy-side</b> (lado comprador) ayudan a un comprador a adquirir. Capítulos 6–7.</li><li><b>LBO (compra apalancada):</b> un fondo de PE compra una empresa usando sobre todo <b>deuda</b> (a menudo un 50–70%) y poco capital, y luego usa la caja de la empresa para devolver la deuda. Capítulos 4–5.</li><li><b>OPV o IPO (oferta pública inicial):</b> una empresa privada vende acciones al público por primera vez y empieza a cotizar en bolsa. Capítulos 8–9.</li><li>La <b>valoración</b> está debajo de todas: no puedes comprar, vender o sacar a bolsa una empresa sin acordar cuánto vale. Capítulos 1–3.</li></ul>` },
        { h: 'Qué hace de verdad un banquero junior', b: `<p>Los analistas y asociados construyen <b>modelos financieros</b> en Excel (comparables, DCF, LBO, modelos de fusión), preparan <b>pitch books</b> (presentaciones para clientes), redactan documentos de venta (<b>teaser</b>, <b>CIM</b>), gestionan la <b>due diligence</b> (los compradores revisando la empresa) y se coordinan con abogados y auditores.</p><p>En las entrevistas te harán <b>preguntas técnicas</b> justo sobre los conceptos de esta app: los tres estados financieros, EV frente a valor del capital, métodos de valoración, DCF, LBO y acreción/dilución.</p>` }
      ],
      ex: [
        { t: 'mc', q: '¿Cómo gana dinero principalmente un banco de inversión en una operación de M&A?', o: ['Comisiones de asesoramiento', 'Siendo dueño de la empresa que vende', 'Intereses de los depósitos', 'Dividendos de la empresa objetivo'], a: 0, e: 'En M&A los bancos actúan como asesores y cobran comisiones, sobre todo cuando se cierra la operación.' },
        { t: 'mc', q: '¿Qué hace que una compra apalancada sea “apalancada”?', o: ['Se financia sobre todo con deuda', 'El comprador es una gran empresa cotizada', 'Se paga entera en acciones', 'Cotiza en bolsa'], a: 0, e: 'Un LBO usa mucho dinero prestado, que se devuelve con los propios flujos de caja de la empresa comprada.' },
        { t: 'tf', q: 'En una OPV, una empresa privada vende acciones al público por primera vez.', a: true, e: 'OPV (IPO) = oferta pública inicial; después las acciones de la empresa cotizan en bolsa.' },
        { t: 'match', q: 'Empareja cada protagonista con su papel', p: [['Banco de inversión', 'Asesora y capta financiación a cambio de comisiones'], ['Fondo de private equity', 'Compra empresas con capital y deuda'], ['Fondo de pensiones', 'Invierte en fondos de PE como LP'], ['Fondo de deuda privada', 'Presta directamente a empresas']] },
        { t: 'match', q: 'Empareja cada operación con lo que ocurre', p: [['M&A sell-side', 'Ayudar a un dueño a vender una empresa'], ['M&A buy-side', 'Ayudar a un comprador a adquirir una empresa'], ['LBO', 'Un PE compra una empresa sobre todo con deuda'], ['OPV', 'La empresa sale a cotizar en bolsa']] },
        { t: 'int', q: 'Entrevista: ¿Por qué banca de inversión, y qué crees que hace un analista en su día a día?', m: 'Una buena respuesta une un interés genuino por cómo se valoran las empresas y cómo se cierran las operaciones con la curva de aprendizaje del puesto. En el día a día, un analista construye modelos financieros (comparables, DCF, LBO, modelos de fusión), prepara pitch books y material de venta como teasers y CIMs, gestiona data rooms y la logística de la due diligence y se coordina con clientes, abogados y auditores, bajo la dirección de los banqueros sénior y con plazos muy ajustados.' }
      ]
    }

UNITS.push({

<ol><li>Seleccionar el universo de adquisiciones comparables</li><li>Localizar la información de la operación y la financiera necesaria</li><li>Calcular las principales magnitudes, ratios y múltiplos de la operación</li><li>Comparar las adquisiciones comparables</li><li>Determinar la valoración</li></ol>
<p>Los múltiplos suelen ser <b>más altos</b> que en los comparables cotizados porque incluyen una <b>prima de control</b> y a menudo parte de las <b>sinergias</b> esperadas.</p>` },
        { h: 'Buscar adquisiciones comparables', b: `<p>Parte del universo de comparables: operaciones en las que participaron esas empresas u objetivos parecidos. Busca en bases de datos de M&amp;A (Dealogic, Capital IQ, Mergermarket, Bloomberg), en las merger proxies de operaciones anteriores (que recogen los precedentes que usaron sus asesores) y en el historial interno de operaciones del banco. La <b>antigüedad</b> importa: las operaciones de los últimos 3-5 años suelen ser las más relevantes.</p>` },
        { h: 'Analizar otros factores', b: `<p><b>Condiciones de mercado</b>: disponibilidad de crédito, mercados de renta variable y ciclo económico en el momento de la firma. Las operaciones de 2007 o 2021, con financiación barata y abundante, marcaron múltiplos altos.</p>
<p><b>Dinámica de la operación</b>:</p><ul><li>Tipo de comprador: <b>estratégico</b> (sinergias, a menudo paga más) frente a <b>financiero</b> (busca rentabilidad y depende de la deuda)</li><li>Forma de pago: efectivo frente a acciones</li><li>Proceso: subasta frente a negociación, tensión competitiva, hostil frente a amistosa</li><li>Motivaciones: vendedor en apuros, activo imprescindible, restricciones regulatorias</li></ul>` }
      ],
      ex: [

        { t: 'tf', q: 'Los múltiplos de transacciones precedentes suelen ser más altos que los de compañías comparables.', a: true, e: 'Incluyen una prima de control y a menudo sinergias.' },

        { t: 'mc', q: 'Las operaciones firmadas en épocas de crédito barato y abundante suelen mostrar:', o: ['Múltiplos más altos', 'Múltiplos más bajos', 'Ninguna diferencia', 'Solo primas más bajas'], a: 0, e: 'Los fondos pueden apalancarse más y aun así lograr su rentabilidad, y los estratégicos se animan.' },
        { t: 'match', q: 'Empareja cada factor de la operación con su efecto típico', p: [['Subasta competitiva', 'Empuja el precio al alza'], ['Vendedor en apuros', 'Empuja el precio a la baja'], ['Grandes sinergias', 'Justifica una prima mayor'], ['Mercados de crédito cerrados', 'Limitan las ofertas de los fondos']] },
        { t: 'int', q: 'Entrevista: "¿Por qué un precedente de 2021 podría ser engañoso hoy?"', m: 'Porque las <b>condiciones de mercado</b> eran muy distintas: tipos casi a cero, crédito abundante y valoraciones bursátiles altas empujaron los múltiplos al alza. El coste de la financiación, las perspectivas económicas y la dinámica del sector pueden haber cambiado. Daría más peso a las operaciones recientes y explicaría cualquier valor atípico antiguo.' }

    {

      th: [
        { h: 'Objetivos cotizados', b: `<ul><li><b>Merger proxy</b> (DEFM14A): se envía a los accionistas del objetivo para votar una fusión. Incluye los "<b>antecedentes de la fusión</b>" (background of the merger), los motivos del consejo, un resumen de los análisis de la <b>fairness opinion</b> y el contrato de fusión.</li><li><b>Documento de registro / folleto</b> (S-4): cuando el comprador emite acciones como forma de pago.</li><li><b>Schedule TO</b>: lo presenta el comprador en una <b>OPA</b> (tender offer).</li><li><b>Schedule 14D-9</b>: la recomendación del consejo del objetivo sobre una OPA.</li><li><b>Schedule 13E-3</b>: exclusiones de bolsa con partes vinculadas (por ejemplo, management buyouts).</li><li><b>8-K</b>: anuncio de la operación y del contrato definitivo.</li><li><b>10-K / 10-Q</b> para las cifras del objetivo en el momento del anuncio.</li></ul>` },
        { h: 'Objetivos privados', b: `<p>No tienen obligación de presentar documentos, así que la información es limitada: notas de prensa, noticias, bases de datos de M&amp;A, los documentos del comprador si la operación es relevante para él. A menudo el precio <b>no se publica</b>, o el múltiplo es un rumor.</p>` }
      ],

        { t: 'mc', q: '¿Qué sección de una merger proxy cuenta la historia de la negociación?', o: ['Antecedentes de la fusión', 'Factores de riesgo', 'Retribución de directivos', 'Procedimientos judiciales'], a: 0, e: 'Describe cómo surgió la operación, qué otros postores hubo y cómo se llegó al precio.' },
        { t: 'mc', q: 'Un management buyout de una empresa cotizada requiere, además, ¿qué documento?', o: ['Schedule 13E-3', 'Formulario 10-Q', 'Solo el Schedule 14A', 'Formulario S-1'], a: 0, e: 'Las exclusiones de bolsa con partes vinculadas exigen información adicional por los conflictos de interés.' },
        { t: 'tf', q: 'En los objetivos privados, el precio de compra a menudo no se hace público.', a: true, e: 'Es una limitación clave de los precedentes con empresas privadas.' },
        { t: 'mc', q: 'Un comprador paga a los accionistas del objetivo con sus propias acciones. ¿Qué documento registra esas acciones?', o: ['S-4', 'Schedule TO', '13E-3', 'Solo el 8-K'], a: 0, e: 'Emitir valores en una fusión requiere un documento de registro, a menudo combinado con la proxy.' },
        { t: 'int', q: 'Entrevista: "¿Dónde mirarías para entender cómo se negoció una operación con una empresa cotizada?"', m: 'En la <b>merger proxy</b> (o el 14D-9 en una OPA), en concreto en la sección de "<b>antecedentes de la fusión</b>": quién se acercó a quién, otros postores, revisiones del precio y el calendario. El resumen de la fairness opinion muestra los análisis de valoración que hicieron los asesores. El 8-K y el contrato de fusión dan las condiciones clave.' }

<p><b>Ecuación de canje variable</b>: el valor por acción es fijo y se ajusta el número de acciones. Los <b>collars</b> limitan el rango en el que varía la ecuación.</p>` },

        { t: 'num', q: '3,5x en 5 años. ¿TIR (%, 1 decimal)?', a: 28.5, tol: 0.4, u: '%', e: '3,5^0,2 − 1 = 28,5%.' },
        { t: 'mc', q: '¿Por qué aquí más deuda deja más deuda pendiente a la salida?', o: ['Más intereses consumen caja que habría amortizado principal', 'La deuda crece sola', 'Los prestamistas no aceptan que se devuelva', 'Suben los impuestos'], a: 0, e: 'Más apalancamiento, más intereses, menos caja libre para amortizar.' },
        { t: 'tf', q: 'Para el accionista, el apalancamiento amplifica tanto las pérdidas como las ganancias.', a: true, e: 'Si el EV de salida cayera a 800 $, la estructura con un 70% de deuda podría borrar el capital.' },
        { t: 'int', q: 'Entrevista: "¿Por qué no financiar un LBO con un 100% de deuda?"', m: 'Los prestamistas no lo aceptarían: necesitan un <b>colchón de capital</b> que absorba las pérdidas antes que ellos. Los intereses se comerían la caja de la empresa y el <b>riesgo de impago</b> sería extremo. Los mercados de crédito limitan el apalancamiento (por ejemplo 4-6x EBITDA según el sector y las condiciones), y los fondos equilibran la mejora de rentabilidad con el riesgo de dificultades financieras.' }

    {
      id: 'c4l5', title: 'Estrategias de salida y monetización',

        { h: 'Formas de salir', b: `<ul><li><b>Venta del negocio</b>: a un <b>comprador estratégico</b> (a menudo el precio más alto gracias a las sinergias) o a otro fondo (<b>secondary buyout</b>). Da una salida completa e inmediata.</li>
<li><b>Salida a bolsa (OPV)</b>: se vende parte de la participación en la OPV y el resto con el tiempo en colocaciones posteriores. Potencial de subida si la bolsa valora mucho la empresa, pero el lock-up y el riesgo de mercado retrasan la salida completa.</li>
<li><b>Dividendos / recapitalización con dividendo</b>: se pide deuda nueva para pagar un dividendo. Devuelve capital antes (mejora la TIR) sin perder la propiedad, a costa de más apalancamiento.</li>
<li><b>Recompra de deuda por debajo de par</b>: cuando la deuda de la empresa cotiza con descuento, recomprarla por debajo de par reduce la deuda con una ganancia y aumenta el valor del capital.</li></ul>
<p>Los periodos de inversión suelen ser de <b>3-7 años</b>; los modelos suelen suponer una salida en el año 5.</p>` }

        { t: 'fill', q: 'Pedir deuda nueva para pagar un dividendo al fondo es una ___', o: ['recapitalización con dividendo', 'barrido de caja', 'reinversión', 'OPA'], a: 0, e: 'Devuelve capital antes y mejora la TIR.' },
        { t: 'num', q: 'Una empresa recompra 100 $ nominales de sus bonos a 80. ¿Reducción de deuda ($)?', a: 100, e: 'La deuda baja en los 100 $ nominales a cambio de 80 $ de caja: una ganancia de 20 $.' },
        { t: 'tf', q: 'Una OPV suele permitir al fondo vender toda su participación de inmediato.', a: false, e: 'Normalmente el fondo vende una parte y va vendiendo el resto con el tiempo tras el lock-up.' },
        { t: 'mc', q: '¿Por qué una recapitalización con dividendo sube la TIR?', o: ['Devuelve caja antes', 'Reduce el apalancamiento', 'Reduce los intereses', 'Aumenta el múltiplo de salida'], a: 0, e: 'Los flujos más tempranos pesan más en la TIR.' },
        { t: 'int', q: 'Entrevista: "¿Qué salida elegirías para una participada y por qué?"', m: 'Compararía <b>valor, certeza y rapidez</b>. Una <b>venta a un estratégico</b> suele pagar más (sinergias) y es una salida limpia. Un <b>secondary buyout</b> funciona si los mercados de crédito están abiertos y aún queda recorrido de creación de valor. Una <b>OPV</b> puede maximizar el valor en empresas grandes y en crecimiento, pero la salida es gradual y con riesgo de mercado. Una <b>recapitalización con dividendo</b> devuelve capital manteniendo el potencial. A menudo los fondos hacen un proceso dual-track.' }

    {
      id: 'c4l6', title: 'Estructura de financiación y deuda con garantía',
      th: [
        { h: 'Estructura de financiación', b: `<p>La estructura de capital se apila de lo más sénior (más barato) a lo más subordinado (más caro): <b>deuda con garantía</b> (deuda bancaria) → <b>bonos high yield</b> → <b>mezzanine</b> → <b>capital</b>. Históricamente la deuda ha financiado en torno al 60-70% de los grandes LBO, menos en mercados más cerrados, y el capital del fondo aporta el resto.</p>` },
        { h: 'Deuda con garantía', b: `<ul><li><b>Línea de crédito revolving</b> (revolver): se dispone y se devuelve según haga falta para liquidez y circulante; comisión de disponibilidad sobre lo no dispuesto. Un <b>revolving por flujo de caja</b> se dimensiona sobre el EBITDA; una <b>línea ABL</b> se dimensiona sobre una <b>base de préstamo</b> (borrowing base, por ejemplo ~85% de las cuentas por cobrar elegibles y ~50% de las existencias).</li>

<li><b>Préstamos a plazo institucionales (TLB)</b>: ~1% de amortización anual y un pago único al vencimiento (~7 años), en manos de inversores institucionales.</li>
<li><b>Préstamos de segundo rango</b> (second lien): garantizados con el mismo colateral, pero por detrás del primer rango; diferencial más alto.</li></ul>
<p>La deuda bancaria suele ser a <b>tipo variable</b> (SOFR + diferencial) y <b>amortizable anticipadamente</b>.</p>` }
      ],

        { t: 'mc', q: '¿Para qué sirve principalmente el revolving?', o: ['Para necesidades de liquidez y circulante', 'Para pagar todo el precio de compra', 'Para pagar al fondo', 'Para sustituir el capital'], a: 0, e: 'Funciona como la tarjeta de crédito de la empresa.' },
        { t: 'mc', q: 'TLA frente a TLB:', o: ['El TLA amortiza mucho; el TLB amortiza ~1% al año y se paga al vencimiento', 'El TLB siempre es más barato', 'El TLA es un bono', 'El TLB no paga intereses'], a: 0, e: 'El TLB se adapta a los inversores institucionales y deja más caja a la empresa.' },
        { t: 'tf', q: 'Un préstamo de segundo rango comparte el colateral del primer rango pero va por detrás.', a: true, e: 'Por eso tiene un diferencial más alto.' },

        { t: 'int', q: 'Entrevista: "¿Qué diferencia hay entre un revolving por flujo de caja y una ABL?"', m: 'Un <b>revolving por flujo de caja</b> se dimensiona y tiene covenants según el EBITDA y la generación de caja de la empresa; es lo típico en la mayoría de los LBO. Una <b>ABL</b> se dimensiona sobre una <b>base de préstamo</b> de colateral líquido (porcentajes de las cuentas por cobrar y existencias elegibles), así que lo disponible varía con el circulante. Las ABL encajan en negocios intensivos en activos como minoristas y distribuidores y suelen ser más baratas y con covenants más ligeros.' }
      ]
    },
    {

        { h: 'Deuda mezzanine', b: `<p>Deuda subordinada colocada de forma privada entre la deuda sénior y el capital, a menudo con un cupón en efectivo más intereses <b>PIK</b> y un <b>equity kicker</b> (warrants). Busca rentabilidades de alrededor del 15%. Se usa en operaciones más pequeñas o cuando los bonos no son una opción.</p>

      ],
      ex: [

        { t: 'num', q: '100 $ de bonos PIK al 10% con intereses capitalizados anualmente. ¿Saldo tras 2 años?', a: 121, e: '100 × 1,1² = 121.' },

        { t: 'mc', q: '¿Por qué aceptaría un fondo poner más capital?', o: ['Por los límites de apalancamiento del mercado o por querer menos riesgo', 'Para subir la TIR', 'Para aumentar los intereses', 'Porque los prestamistas exigen un 100% de capital'], a: 0, e: 'Más capital reduce el riesgo pero diluye la rentabilidad.' },
        { t: 'int', q: 'Entrevista: "¿Por qué emitiría una empresa bonos high yield en vez de más préstamos a plazo?"', m: 'Los bonos ofrecen <b>más plazo</b>, <b>sin amortización</b>, <b>tipo fijo</b> (cubre el riesgo de tipos) y <b>solo covenants de incurrencia</b>, así que más flexibilidad. Además llegan a otra base de inversores, lo que permite más deuda total. Los inconvenientes son un coste mayor, la <b>call protection</b> (sale caro refinanciar antes) y la información pública.' }

    {

<p><b>Prelación</b> (seniority): el orden de los derechos de cobro. <b>Subordinación contractual</b>: un acuerdo por el que una deuda se paga después de otra. <b>Subordinación estructural</b>: la deuda de una sociedad holding va por detrás de todos los pasivos de las filiales operativas, porque los acreedores de la holding solo cobran lo que queda después de pagar a los acreedores de las operativas.</p>` },
        { h: 'Vencimiento y cupón', b: `<p><b>Vencimiento</b>: revolving ~5 años, TLA ~5-6, TLB ~7, high yield 8-10. La deuda subordinada vence después que la sénior.</p>
<p><b>Cupón</b>: la deuda bancaria paga <b>SOFR + diferencial</b> (por ejemplo +350 pb), a veces con un <b>suelo de SOFR</b> y emitida con descuento (<b>OID</b>). Los bonos pagan un cupón fijo.</p>` },

      ],
      ex: [
        { t: 'num', q: 'Préstamo a SOFR + 350 pb con el SOFR al 5%. ¿Tipo total (%)?', a: 8.5, u: '%', e: '5% + 3,5% = 8,5%.' },

        { t: 'num', q: 'Un préstamo a plazo de 500 $ emitido con un OID de 98. ¿Caja recibida?', a: 490, e: '500 × 98% = 490.' },

        { t: 'tf', q: 'Los préstamos bancarios a plazo suelen poder amortizarse a la par, mientras que los bonos high yield tienen call protection.', a: true, e: 'Salvo la soft call de los préstamos.' },

        { t: 'int', q: 'Entrevista: "¿Por qué los inversores en bonos exigen call protection?"', m: 'Porque aceptan un <b>cupón fijo</b> durante años. Si bajan los tipos o mejora el crédito, el emisor refinanciaría de inmediato y el inversor perdería un cupón por encima del mercado. La call protection garantiza que el inversor cobre el cupón durante un periodo mínimo o que se le compense con una <b>prima de amortización</b>.' }

    {
      id: 'c4l9', title: 'Covenants, term sheets y dimensionar la estructura',
      th: [
        { h: 'Covenants', b: `<ul><li><b>Positivos</b> (affirmative): lo que el prestatario debe hacer (entregar estados financieros, mantener seguros, pagar impuestos).</li><li><b>Negativos</b>: límites a la deuda, las garantías, los dividendos, la venta de activos, las inversiones y las operaciones con partes vinculadas.</li><li><b>Financieros de mantenimiento</b> (préstamos bancarios): se comprueban cada trimestre, por ejemplo Deuda/EBITDA máxima, EBITDA/intereses mínima, capex máximo.</li><li><b>De incurrencia</b> (bonos): solo se comprueban cuando la empresa hace algo, por ejemplo endeudarse solo si la cobertura pro forma sigue por encima de 2,0x.</li></ul>

        { h: 'Term sheets y diseño de la estructura', b: `<p>Un <b>term sheet</b> resume las condiciones clave de cada tramo: importe, plazo, precio, amortización, garantías, covenants, call protection, comisiones.</p>

      ],
      ex: [

        { t: 'num', q: 'Deuda 500 $, EBITDA 100 $, intereses 25 $. ¿Ratio de cobertura (x)?', a: 4, u: 'x', e: '100 / 25 = 4,0x.' },
        { t: 'num', q: 'Covenant de apalancamiento máximo de 5,0x y EBITDA de 90 $. ¿Deuda máxima permitida?', a: 450, e: '5,0 × 90 = 450.' },
        { t: 'tf', q: 'Un préstamo covenant-lite no tiene covenants financieros de mantenimiento.', a: true, e: 'Se comporta como un bono, con pruebas de tipo incurrencia.' },
        { t: 'mc', q: '¿Qué ocurre si un prestatario incumple un covenant de mantenimiento?', o: ['Impago técnico; normalmente negocia una dispensa o una modificación', 'Nada', 'Quiebra automática', 'Los bonos se convierten en acciones'], a: 0, e: 'Los prestamistas ganan poder para subir el precio o endurecer las condiciones; el fondo puede inyectar capital para subsanarlo (equity cure).' },
        { t: 'int', q: 'Entrevista: "¿Cómo decides cuánta deuda poner en un LBO?"', m: 'Empiezo por lo que <b>acepta el mercado</b>: múltiplos de apalancamiento de créditos comparables y las condiciones actuales. Compruebo la <b>cobertura</b> (EBITDA/intereses, (EBITDA − capex)/intereses) y que la empresa pueda <b>devolver</b> una parte significativa de la deuda en los casos base y pesimista sin incumplir covenants. Después equilibro el beneficio en <b>TIR</b> de más deuda con la flexibilidad y el riesgo de dificultades, y comparo estructuras (bancos + bonos frente a unitranche).' }
      ]

UNITS.push({

        { t: 'mc', q: 'En una subasta, la fuente principal para el modelo LBO es:', o: ['El CIM y las proyecciones de la dirección', 'La proxy statement', 'Solo los informes de research', 'La declaración de impuestos del comprador'], a: 0, e: 'Se complementa con la data room y las reuniones con la dirección.' },

        { t: 'tf', q: 'Los mercados suelen dar menos crédito a las sinergias de ingresos que a las de costes.', a: true, e: 'Son más difíciles de lograr y de medir.' },

        { t: 'mc', q: 'La "maldición del ganador" (winner’s curse) en una subasta significa:', o: ['El ganador suele ser quien más sobrestimó el valor', 'El ganador no puede revender', 'El perdedor paga una comisión', 'El ganador asume la deuda del banco'], a: 0, e: 'La disciplina de precio es clave para el comprador.' },

        { h: 'Efectos en el balance', b: `<ul><li>Los activos y pasivos de la objetivo se registran a <b>valor razonable</b> (asignación del precio de compra, PPA): <b>revalorizaciones</b> (write-ups) del inmovilizado y nuevos <b>intangibles identificables</b> (relaciones con clientes, marcas, tecnología).</li><li><b>Fondo de comercio</b> (goodwill) = precio pagado por el equity − valor razonable de los activos netos identificables (tras revalorizaciones y DTL).</li><li><b>Pasivo por impuesto diferido (DTL)</b>: en una compra de acciones, las revalorizaciones contables no tienen base fiscal, así que DTL = revalorización × tipo impositivo, lo que <b>aumenta</b> el fondo de comercio.</li><li>Nueva deuda, caja usada, acciones nuevas; ratios de crédito pro forma.</li></ul>

        { h: 'SPACs', b: `<p>Una <b>special purpose acquisition company</b> es una sociedad "cheque en blanco" que sale a bolsa (normalmente unidades a <b>10 $</b>, cada una una acción más una fracción de warrant), deposita el dinero en un <b>trust</b> (cuenta fiduciaria) y tiene unos <b>18-24 meses</b> para fusionarse con una compañía privada (el <b>de-SPAC</b>).</p>

    {
      id: 'c8l7', title: 'Ofertas posteriores y consideraciones de la OPV',

        { h: 'Ofertas de acciones tras la OPV', b: `<ul><li><b>Follow-ons</b> (ampliaciones/colocaciones posteriores): primarias (capital nuevo) o secundarias (ventas del fondo).</li><li><b>Oferta comercializada</b> (marketed): un roadshow corto de pocos días.</li><li><b>Overnight / accelerated bookbuild (ABB)</b>: se lanza tras el cierre del mercado y se fija el precio antes de la apertura siguiente.</li><li><b>Block trade / bought deal</b>: un banco compra el paquete con descuento y lo revende, asumiendo el riesgo.</li><li><b>Programa at-the-market (ATM)</b>: la compañía vende acciones poco a poco en el mercado.</li><li><b>Confidentially marketed public offering (CMPO)</b>, registered directs y <b>convertibles</b>.</li></ul>` },

        { t: 'mc', q: '¿Qué factor favorece más que se abra una ventana de OPV?', o: ['Baja volatilidad y buen comportamiento de las OPV recientes', 'Una fuerte caída del mercado', 'Resultados por debajo de lo esperado', 'Litigios pendientes'], a: 0, e: 'El apetito inversor sigue al mercado y a las operaciones recientes.' },
        { t: 'int', q: 'Entrevista: "Explica un Up-C de forma sencilla."', m: 'El negocio operativo sigue siendo una <b>sociedad transparente</b> (partnership) en parte de los dueños originales. Una nueva <b>sociedad cotizada</b> vende acciones en la OPV y usa el dinero para comprar units de la partnership, así que los inversores públicos poseen el negocio a través de PubCo. Los dueños originales conservan sus units (tributan una sola vez, por transparencia) y pueden <b>canjearlas</b> por acciones cotizadas más adelante. Cada canje crea un <b>step-up fiscal</b> para PubCo, y un <b>TRA</b> devuelve la mayor parte (normalmente el 85%) de ese ahorro a los dueños originales.' }
