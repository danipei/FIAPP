function vReview(m) {
  const d = dueCount(), seen = Object.keys(S.srs).filter(id => EXI[id]);
  const weak = seen.filter(id => S.srs[id].w > 0).sort((a, b) => S.srs[b].w - S.srs[a].w || S.srs[a].b - S.srs[b].b).slice(0, 6);
  let html = `<div class="sec"><h2>Review</h2><p class="lead">Questions come back right before you would forget them: after 1 day, 3 days, a week, two weeks and a month. Miss one and it starts over.</p>
  <div class="tiles"><div class="tile"><b>${d}</b><span>due today</span></div><div class="tile"><b>${seen.length}</b><span>questions seen of ${Object.keys(EXI).length}</span></div></div>
  <button class="btn blue" id="rv" ${seen.length ? '' : 'disabled'}>${d ? `Review ${Math.min(d, 12)} questions` : 'Free review'}</button>
  <p class="hint">Reviews never cost hearts, and finishing one restores 2.</p></div>`;
  if (weak.length) html += `<div class="sec"><h2>Your weak spots</h2><div class="list">${weak.map(id => { const x = EXI[id]; return `<div class="li"><div>${strip(x.q).slice(0, 110)}${strip(x.q).length > 110 ? '…' : ''}</div><span class="pill r">${S.srs[id].w} miss${S.srs[id].w > 1 ? 'es' : ''}</span><small>${x.lesson.title}</small></div>`; }).join('')}</div><button class="btn red" id="rw">Practice weak spots</button></div>`;
  html += `<div class="sec"><h2>By unit</h2><div class="list">${UNITS.map(u => { const ids = u.lessons.flatMap(l => l.ex.map(x => x.id)); const s = ids.filter(id => S.srs[id]); const mast = s.filter(id => S.srs[id].b >= 3).length; return `<div class="li"><div><b>${u.title}</b></div>${s.length ? `<button class="btn sm ghost" data-ur="${u.id}">Review</button>` : '<span class="pill">not started</span>'}<small>${s.length}/${ids.length} seen · ${mast} mastered</small></div>`; }).join('')}</div></div>`;
  m.innerHTML = html;
  const rv = $('#rv', m); if (rv) rv.onclick = () => startReview();
  const rw = $('#rw', m); if (rw) rw.onclick = () => startReview(null, weak);
  m.querySelectorAll('[data-ur]').forEach(b => b.onclick = () => startReview(b.dataset.ur));
}

function vNotes(m) {
  let html = `<div class="sec"><h2>Notes</h2><p class="lead">Every concept card from the lessons plus a glossary, to revise before an interview.</p><input type="search" id="gq" placeholder="Search a term or concept" autocomplete="off"></div>
  <div class="sec" id="glw"><h2>Glossary</h2><dl class="gl card" id="gl"></dl></div><div class="sec" id="thw"><h2>Concepts by lesson</h2>`;
  UNITS.forEach((u, ui) => {
    html += `<details class="note"><summary>${ui + 1}. ${u.title}</summary><div class="nb">${u.lessons.map(l => `<div class="th" data-s="${(l.title + ' ' + strip(l.th.map(t => t.h + ' ' + t.b).join(' '))).toLowerCase().replace(/"/g, '')}"><h3>${l.title}</h3>${l.th.map(t => `<div class="card"><b>${t.h}</b>${t.b}</div>`).join('')}</div>`).join('')}</div></details>`;
  });
  html += '</div>';
  m.innerHTML = html;
  const draw = q => {
    const items = GLOSS.slice().sort((a, b) => a[0].localeCompare(b[0], 'en')).filter(([t, d]) => !q || (t + ' ' + d).toLowerCase().includes(q));
    $('#gl').innerHTML = items.length ? items.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join('') : '<dd>No matching terms.</dd>';
    m.querySelectorAll('#thw .th').forEach(el => el.hidden = !!q && !el.dataset.s.includes(q));
    m.querySelectorAll('#thw details').forEach(d => { const vis = d.querySelectorAll('.th:not([hidden])').length; d.hidden = !vis; if (q) d.open = true; });
  };
  draw('');
  $('#gq').oninput = e => draw(e.target.value.trim().toLowerCase());
}

function vMe(m) {
  const lessonsDone = LESSONS.filter(l => S.done[l.id]).length;
  const acc = S.ok + S.ko ? Math.round(S.ok / (S.ok + S.ko) * 100) : 0;
  const days = [...Array(7)].map((_, i) => dstr(Date.now() - (6 - i) * DAY));
  const mx = Math.max(S.goal, ...days.map(d => S.log[d] || 0));
  const dn = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  const mastered = Object.values(S.srs).filter(r => r.b >= 3).length;
  m.innerHTML = `<div class="sec"><h2>Your progress</h2>
  <div class="tiles"><div class="tile"><b>${S.xp}</b><span>total XP</span></div><div class="tile"><b>${streakNow()}</b><span>day streak · best ${S.best}</span></div>
  <div class="tile"><b>${lessonsDone}/${LESSONS.length}</b><span>lessons completed</span></div><div class="tile"><b>${acc}%</b><span>right first time</span></div>
  <div class="tile"><b>${mastered}</b><span>questions mastered</span></div><div class="tile"><b>${Math.round(lessonsDone / LESSONS.length * 100)}%</b><span>of the syllabus</span></div></div></div>
  <div class="sec"><h2>Last 7 days</h2><div class="card"><div class="week">${days.map(d => { const v = S.log[d] || 0; return `<div><em>${v || ''}</em><i class="${d === today() ? 'today' : ''}" style="height:${v / mx * 90}%"></i>${dn[new Date(d + 'T12:00').getDay()]}</div>`; }).join('')}</div></div></div>
  <div class="sec"><h2>Settings</h2>
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div><b>Daily goal</b><div class="seg" id="goal" style="margin-top:8px">${[30, 50, 100, 150].map(g => `<button data-g="${g}" class="${S.goal === g ? 'on' : ''}">${g} XP</button>`).join('')}</div></div>
    <label class="tog" for="inf"><span><b>Unlimited hearts</b><br><small class="hint">Mistakes don\u2019t cost hearts.</small></span><input type="checkbox" id="inf" ${S.inf ? 'checked' : ''}></label>
    <label class="tog" for="all"><span><b>Unlock all lessons</b><br><small class="hint">Jump to any topic.</small></span><input type="checkbox" id="all" ${S.all ? 'checked' : ''}></label>
  </div></div>
  <div class="sec"><h2>Backup</h2><p class="lead">${Cloud.state === 'synced' ? 'Progress is saved to your Claude account, so it follows you on any device where you open this link signed in.' : Cloud.state === 'error' ? 'Couldn\u2019t reach your account just now, so progress is saved in this browser and will sync when the connection is back.' : 'Progress is saved on this device only.'} To move it to another device, copy the backup code and paste it there.</p>
  <div class="row"><button class="btn ghost" id="exp">Copy code</button><button class="btn ghost" id="imp">Paste code</button></div>
  <textarea id="code" hidden placeholder="Paste your progress code here"></textarea><button class="btn" id="impgo" hidden>Load progress</button></div>
  <div class="sec"><button class="btn ghost" id="rst" style="color:var(--red)">Reset all progress</button></div>`;
  m.querySelectorAll('#goal button').forEach(b => b.onclick = () => { S.goal = +b.dataset.g; save(); render(); });
  $('#inf').onchange = e => { S.inf = e.target.checked; save(); topbar(); };
  $('#all').onchange = e => { S.all = e.target.checked; save(); };
  const code = $('#code');
  $('#exp').onclick = () => {
    const c = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    code.hidden = false; code.value = c;
    navigator.clipboard && navigator.clipboard.writeText(c).then(() => toast('Code copied'), () => { code.select(); toast('Select and copy the code'); });
  };
  $('#imp').onclick = () => { code.hidden = false; code.value = ''; $('#impgo').hidden = false; code.focus(); };
  $('#impgo').onclick = () => {
    try { S = Object.assign(def(), JSON.parse(decodeURIComponent(escape(atob(code.value.trim()))))); save(); render(); toast('Progress loaded'); }
    catch (e) { toast('That code isn\u2019t valid. Copy all of it and try again.'); }
  };
  $('#rst').onclick = () => sheet(`<h3>Reset all progress?</h3><p class="meta">You will lose XP, streak, completed lessons and review history. This can’t be undone.</p><button class="btn red" id="y">Reset progress</button><button class="btn ghost" id="n">Cancel</button>`, s => {
    $('#y', s).onclick = () => { S = def(); save(); s.remove(); setTab('path'); toast('Progress reset'); };
    $('#n', s).onclick = () => s.remove();
  });
}

// ---------- Lesson / review session ----------
let SES = null;
function noHearts() {
  const mins = Math.ceil((HEART_MS - (Date.now() - S.hts)) / 60e3);
  sheet(`<h3>You\u2019re out of hearts</h3><p class="meta">You get one back every 30 minutes (next in ${mins} min). Do a review to get 2 now, or turn on unlimited hearts in Profile.</p><button class="btn blue" id="r">Start a review</button><button class="btn ghost" id="c">Close</button>`, s => {
    $('#r', s).onclick = () => { s.remove(); startReview(); };
    $('#c', s).onclick = () => s.remove();
  });
}
function startLesson(l) {
  regen();
  if (!S.inf && S.hearts <= 0) return noHearts();
  const q = [...l.th.map(t => ({ k: 'th', t })), ...l.ex.map(x => ({ k: 'ex', x }))];
  SES = { type: 'lesson', l, q, i: 0, total: q.length, done: 0, ok: 0, ko: 0, xp: 0, first: {}, t0: Date.now() };
  openSession();
}
function startReview(unitId, ids) {
  let pool = ids || Object.keys(S.srs).filter(id => EXI[id] && (!unitId || EXI[id].lesson.unit.id === unitId));
  if (!pool.length) return toast('Finish a lesson first so there is something to review.');
  if (!ids) {
    const now = Date.now();
    let due = pool.filter(id => S.srs[id].due <= now).sort((a, b) => S.srs[a].due - S.srs[b].due);
    if (due.length < 8) due = due.concat(pool.filter(id => !due.includes(id)).sort((a, b) => S.srs[a].b - S.srs[b].b || S.srs[a].due - S.srs[b].due).slice(0, 8 - due.length));
    pool = due.slice(0, 12);
  }
  const q = shuffle(pool).map(id => ({ k: 'ex', x: EXI[id] }));
  SES = { type: 'review', q, i: 0, total: q.length, done: 0, ok: 0, ko: 0, xp: 0, first: {}, t0: Date.now() };
  openSession();
}
function openSession() {
  const L = document.createElement('div'); L.className = 'lesson'; L.id = 'lesson';
  L.innerHTML = `<div class="wrap lhead"><button class="x" id="lx" aria-label="Quit">${I.x}</button><div class="lprog"><div id="lp"></div></div><button class="thbtn" id="lth" hidden>CONCEPTS</button><span class="stat heart" id="lh"></span></div>
  <div class="lbody"><div class="wrap" id="lb"></div></div><div class="lfoot" id="lf"><div class="wrap" id="lfw"></div></div>`;
  document.body.appendChild(L); document.body.style.overflow = 'hidden';
  $('#lx').onclick = () => sheet(`<h3>Quit this lesson?</h3><p class="meta">You will lose this session\u2019s progress, but answers so far still count toward review.</p><button class="btn" id="k">Keep learning</button><button class="btn ghost" id="q" style="color:var(--red)">Quit</button>`, s => {
    $('#k', s).onclick = () => s.remove(); $('#q', s).onclick = () => { s.remove(); closeSession(); };
  });
  $('#lth').onclick = () => { const it = SES.q[SES.i]; const l = SES.l || (it && it.x && it.x.lesson); if (l) theorySheet(l); };
  step();
}
function closeSession() { const L = $('#lesson'); L && L.remove(); document.body.style.overflow = ''; SES = null; save(); render(); }
function hud() {
  $('#lp').style.width = (SES.done / SES.total * 100) + '%';
  $('#lh').innerHTML = I.heart + `<span>${S.inf ? '∞' : S.hearts}</span>`;
}
function foot(html, cls) { const f = $('#lf'); f.className = 'lfoot ' + (cls || ''); $('#lfw').innerHTML = html; }

function step() {
  SES.locked = false;
  hud();
  const it = SES.q[SES.i];
  if (!it) return finish();
  const b = $('#lb'); b.innerHTML = '';
  $('.lbody').scrollTop = 0;
  $('#lth').hidden = it.k === 'th';
  SES.cur = null;
  if (it.k === 'th') {
    b.innerHTML = `<div class="kind th">${I.book.replace('<svg', '<svg width="16" height="16"')} Concept</div><div class="th">${'<h3>' + it.t.h + '</h3>' + it.t.b}</div>`;
    foot(`<button class="btn" id="cont">Got it</button>`);
    $('#cont').onclick = () => { SES.done++; SES.i++; step(); };
    return;
  }
  const x = it.x;
  R[x.t](x, b);
}

// Cada renderizador fija SES.cur = { ready, eval: () => ({ ok, sol }) } y llama a setReady()
function checkFoot() {
  foot(`<button class="btn" id="chk" disabled>Check</button>`);
  $('#chk').onclick = doCheck;
}
function setReady(v) { const c = $('#chk'); if (c) c.disabled = !v; }
const kindLbl = { mc: 'Choose the answer', tf: 'True or false', fill: 'Fill the gap', num: 'Calculate', ord: 'Put in order', match: 'Match the pairs', int: 'Interview question' };
const kindHead = (t) => `<div class="kind ${t === 'int' ? 'int' : ''}">${t === 'int' ? I.mic.replace('<svg', '<svg width="16" height="16"') : ''}${kindLbl[t]}</div>`;

const R = {
  mc(x, b) {
    const order = shuffle(x.o.map((_, i) => i));
    b.innerHTML = kindHead('mc') + `<p class="q">${x.q}</p><div class="opts">${order.map((oi, k) => `<button class="opt" data-k="${k}"><kbd>${k + 1}</kbd><span>${x.o[oi]}</span></button>`).join('')}</div>`;
    let sel = -1;
    b.querySelectorAll('.opt').forEach(o => o.onclick = () => { if (SES.locked) return; sel = +o.dataset.k; b.querySelectorAll('.opt').forEach(z => z.classList.toggle('sel', z === o)); setReady(true); });
    SES.cur = { eval: () => { const ok = order[sel] === x.a; b.querySelectorAll('.opt').forEach((z, k) => { if (order[k] === x.a) z.classList.add('good'); else if (k === sel) z.classList.add('bad'); }); return { ok, sol: x.o[x.a] }; } };
    checkFoot();
  },
  tf(x, b) {
    b.innerHTML = kindHead('tf') + `<p class="q">${x.q}</p><div class="tf"><button class="opt" data-v="1"><kbd>1</kbd>True</button><button class="opt" data-v="0"><kbd>2</kbd>False</button></div>`;
    let sel = null;
    b.querySelectorAll('.opt').forEach(o => o.onclick = () => { if (SES.locked) return; sel = o.dataset.v === '1'; b.querySelectorAll('.opt').forEach(z => z.classList.toggle('sel', z === o)); setReady(true); });
    SES.cur = { eval: () => { const ok = sel === x.a; b.querySelectorAll('.opt').forEach(z => { const v = z.dataset.v === '1'; if (v === x.a) z.classList.add('good'); else if (v === sel) z.classList.add('bad'); }); return { ok, sol: x.a ? 'True' : 'False' }; } };
    checkFoot();
  },
  fill(x, b) {
    const order = shuffle(x.o.map((_, i) => i));
    const [pre, post] = x.q.split('___');
    b.innerHTML = kindHead('fill') + `<p class="sentence">${pre}<span class="blank" id="bl">&nbsp;</span>${post || ''}</p><div class="chips">${order.map((oi, k) => `<button class="chip opt" data-k="${k}"><kbd>${k + 1}</kbd>${x.o[oi]}</button>`).join('')}</div>`;
    let sel = -1; const bl = $('#bl', b);
    b.querySelectorAll('.chip').forEach(o => o.onclick = () => {
      if (SES.locked) return; const k = +o.dataset.k;
      sel = sel === k ? -1 : k;
      b.querySelectorAll('.chip').forEach(z => z.classList.toggle('sel', +z.dataset.k === sel));
      bl.textContent = sel < 0 ? ' ' : x.o[order[sel]]; bl.classList.toggle('filled', sel >= 0); setReady(sel >= 0);
    });
    SES.cur = { eval: () => ({ ok: order[sel] === x.a, sol: x.o[x.a] }) };
    checkFoot();
  },
  num(x, b) {
    b.innerHTML = kindHead('num') + `<p class="q">${x.q}</p><div class="numin"><input id="ni" inputmode="decimal" autocomplete="off" placeholder="Your answer">${x.u ? `<span>${x.u}</span>` : ''}</div><p class="hint">Use a dot or comma for decimals. Leave out units and symbols.</p>`;
    const inp = $('#ni', b);
    inp.oninput = () => setReady(parseNums(inp.value).length > 0);
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); const c = $('#chk'); if (c && !c.disabled) c.click(); else { const n = $('#nx'); n && n.click(); } } };
    setTimeout(() => inp.focus({ preventScroll: true }), 60);
    const tol = x.tol != null ? x.tol : Math.max(Math.abs(x.a) * 0.005, 0.01);
    SES.cur = { eval: () => { inp.disabled = true; return { ok: parseNums(inp.value).some(v => Math.abs(v - x.a) <= tol), sol: fmt(x.a) + (x.u ? ' ' + x.u : '') }; } };
    checkFoot();
  },
  ord(x, b) {
    let order = shuffle(x.o.map((_, i) => i));
    if (order.every((v, i) => v === i)) order = order.reverse();
    const chosen = [];
    b.innerHTML = kindHead('ord') + `<p class="q">${x.q}</p><div class="answer" id="ans"></div><div class="bank" id="bank">${order.map(oi => `<button class="chip" data-i="${oi}">${x.o[oi]}</button>`).join('')}</div>`;
    const ans = $('#ans', b), bank = $('#bank', b);
    const draw = () => {
      ans.innerHTML = chosen.map((oi, k) => `<button class="chip" data-i="${oi}"><b>${k + 1}</b>${x.o[oi]}</button>`).join('');
      bank.querySelectorAll('.chip').forEach(c => c.classList.toggle('used', chosen.includes(+c.dataset.i)));
      ans.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (SES.locked) return; chosen.splice(chosen.indexOf(+c.dataset.i), 1); draw(); });
      setReady(chosen.length === x.o.length);
    };
    bank.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (SES.locked || chosen.includes(+c.dataset.i)) return; chosen.push(+c.dataset.i); draw(); });
    SES.cur = { eval: () => ({ ok: chosen.every((v, i) => v === i), sol: x.o.join(' → ') }) };
    checkFoot(); draw();
  },
  match(x, b) {
    const L = shuffle(x.p.map((_, i) => i)), Rr = shuffle(x.p.map((_, i) => i));
    b.innerHTML = kindHead('match') + `<p class="q">${x.q}</p><div class="match"><div class="col">${L.map(i => `<button class="opt" data-s="l" data-i="${i}">${x.p[i][0]}</button>`).join('')}</div><div class="col">${Rr.map(i => `<button class="opt" data-s="r" data-i="${i}">${x.p[i][1]}</button>`).join('')}</div></div><p class="hint">Tap one item in each column to pair them.</p>`;
    let pick = null, matched = 0, miss = 0;
    b.querySelectorAll('.opt').forEach(o => o.onclick = () => {
      if (SES.locked || o.classList.contains('ok')) return;
      if (!pick || pick.dataset.s === o.dataset.s) { if (pick) pick.classList.remove('sel'); pick = o; o.classList.add('sel'); return; }
      const a = pick, c = o; pick = null; a.classList.remove('sel');
      if (a.dataset.i === c.dataset.i) {
        [a, c].forEach(z => { z.classList.add('ok'); z.disabled = true; }); matched++;
        if (matched === x.p.length) { setReady(true); setTimeout(doCheck, 250); }
      } else {
        miss++; [a, c].forEach(z => z.classList.add('wrong')); setTimeout(() => [a, c].forEach(z => z.classList.remove('wrong')), 450);
      }
    });
    SES.cur = { eval: () => ({ ok: miss === 0, sol: x.p.map(p => p[0] + ' = ' + p[1]).join(' · '), note: miss ? `You missed ${miss} pair${miss > 1 ? 's' : ''}.` : '' }) };
    checkFoot();
  },
  int(x, b) {
    b.innerHTML = kindHead('int') + `<p class="q">${x.q.replace(/^Interview:\s*/, '')}</p><p class="hint">Answer out loud or in writing as if you were in the interview, then compare with the model answer.</p><textarea id="ia" placeholder="Your answer (optional)"></textarea><div id="mdl"></div>`;
    foot(`<button class="btn blue" id="rev">Show model answer</button>`);
    $('#rev').onclick = () => {
      $('#mdl', b).innerHTML = `<div class="model"><h4>Model answer</h4><p>${x.m}</p></div>`;
      $('#mdl', b).scrollIntoView({ behavior: 'smooth', block: 'start' });
      foot(`<p class="hint" style="text-align:center">Did your answer cover the key ideas?</p><div class="row"><button class="btn red" id="no">Need to review</button><button class="btn" id="si">Nailed it</button></div>`);
      $('#si').onclick = () => selfGrade(true); $('#no').onclick = () => selfGrade(false);
    };
  }
};

function selfGrade(ok) {
  const x = SES.q[SES.i].x;
  if (!SES.first[x.id]) { SES.first[x.id] = 1; srsMark(x.id, ok); }
  if (ok) { const g = SES.type === 'lesson' ? 10 : 5; SES.xp += g; addXP(g); SES.ok++; S.ok++; SES.done++; }
  else { SES.ko++; S.ko++; SES.done++; }
  save(); SES.i++; step();
}

function doCheck() {
  if (!SES.cur || SES.locked) return;
  SES.locked = true;
  const it = SES.q[SES.i], x = it.x, r = SES.cur.eval();
  const first = !SES.first[x.id];
  if (first) { SES.first[x.id] = 1; srsMark(x.id, r.ok); r.ok ? S.ok++ : S.ko++; }
  if (r.ok) {
    const g = (SES.type === 'lesson' ? 10 : 5) / (first ? 1 : 2);
    SES.xp += g; addXP(g); SES.done++; if (first) SES.ok++;
  } else {
    if (first) SES.ko++;
    SES.q.push({ k: 'ex', x });
    if (SES.type === 'lesson' && !S.inf) S.hearts = Math.max(0, S.hearts - 1);
  }
  save(); hud();
  const praise = ['Correct!', 'Nice work!', 'Exactly!', 'Spot on!'][Math.floor(Math.random() * 4)];
  foot(`<div class="fb">${r.ok ? `<h4>${I.check.replace('<svg', '<svg width="24" height="24"')} ${praise}</h4>` : `<h4>${I.x.replace('<svg', '<svg width="24" height="24"')} Not quite</h4><p class="sol">Correct answer: ${r.sol}</p>`}${r.note ? `<p>${r.note}</p>` : ''}${x.e ? `<p>${x.e}</p>` : ''}${!r.ok ? '<p class="hint">This question will come back at the end of the session.</p>' : ''}</div><button class="btn" id="nx">Continue</button>`, r.ok ? 'good' : 'bad');
  $('#nx').onclick = () => {
    SES.locked = false;
    if (SES.type === 'lesson' && !S.inf && S.hearts <= 0) return outOfHearts();
    SES.i++; step();
  };
}

function outOfHearts() {
  $('#lb').innerHTML = `<div class="sec end"><div class="medal sad">${I.heart}</div><h2>Out of hearts</h2><p class="lead">Your answers so far count toward review. Review to get 2 hearts back, or wait: one returns every 30 minutes.</p></div>`;
  foot(`<div class="row"><button class="btn ghost" id="q">Quit</button><button class="btn blue" id="r">Review</button></div>`);
  $('#q').onclick = closeSession;
  $('#r').onclick = () => { $('#lesson').remove(); startReview(); };
}

function finish() {
  const mins = Math.max(1, Math.round((Date.now() - SES.t0) / 60e3));
  const answered = SES.ok + SES.ko, acc = answered ? Math.round(SES.ok / answered * 100) : 100;
  let bonus = 0, title, sub;
  if (SES.type === 'lesson') {
    S.done[SES.l.id] = (S.done[SES.l.id] || 0) + 1;
    bonus = 15 + (SES.ko === 0 ? 10 : 0);
    title = SES.ko === 0 ? 'Perfect lesson!' : 'Lesson complete!';
    const nxt = LESSONS[SES.l.idx + 1];
    sub = nxt ? `Next up: ${nxt.title}` : 'You have finished the whole syllabus. Keep reviewing until you master it.';
  } else {
    bonus = 5; S.hearts = Math.min(MAXH, S.hearts + 2);
    title = 'Review complete!'; sub = 'You got 2 hearts back. Questions you know will come back less often.';
  }
  addXP(bonus); SES.xp += bonus; touchStreak(); save();
  $('#lth').hidden = true; $('#lp').style.width = '100%';
  $('#lb').innerHTML = `<div class="sec end"><div class="medal">${I.star}</div><h2>${title}</h2><p class="lead">${sub}</p>
  <div class="tiles"><div class="tile gold"><b>+${SES.xp}</b><span>XP</span></div><div class="tile grn"><b>${acc}%</b><span>accuracy</span></div><div class="tile blu"><b>${mins}′</b><span>time</span></div></div>
  <p class="lead">Streak: <b>${streakNow()} ${streakNow() === 1 ? 'day' : 'days'}</b></p></div>`;
  foot(`<button class="btn" id="end">Continue</button>`);
  $('#end').onclick = () => { vPath.scrolled = 0; closeSession(); };
}

// ---------- Teclado ----------
document.addEventListener('keydown', e => {
  if (!SES || document.querySelector('.scrim')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.key === 'Enter' && tag !== 'textarea') {
    const btn = $('#nx') || $('#chk') || $('#cont') || $('#end') || $('#rev');
    if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
    return;
  }
  if (tag === 'input' || tag === 'textarea') return;
  if (/^[1-9]$/.test(e.key) && !SES.locked) {
    const o = document.querySelectorAll('#lb .opts .opt, #lb .tf .opt, #lb .chips .chip')[+e.key - 1];
    o && o.click();
  }
});

// ---------- Arranque ----------
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('#nav-path').insertAdjacentHTML('afterbegin', I.path);
$('#nav-review').insertAdjacentHTML('afterbegin', I.loop);
$('#nav-notes').insertAdjacentHTML('afterbegin', I.book);
$('#nav-me').insertAdjacentHTML('afterbegin', I.user);
if (!['path', 'review', 'notes', 'me'].includes(S.tab)) S.tab = 'path';
render();
setInterval(() => { if (!SES) topbar(); }, 60e3);
Cloud.init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script></body></html>
