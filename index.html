<p>Pre-money y post-money: <b>valor del equity post-money = valor del equity pre-money + fondos primarios</b>. Ejemplo: pre-money de 900 M$ + 100 M$ primarios = post-money de 1.000 M$; los nuevos inversores poseen un 10% de la compañía por las acciones primarias.</p>` },
        { h: 'Reunión organizativa', b: `<p>El <b>kick-off</b> ("org meeting") reúne a la compañía, los bookrunners, abogados y auditores para acordar el <b>calendario</b>, las responsabilidades, la equity story, el plan de due diligence y las sesiones de redacción.</p>
<p>Calendario orientativo: reunión organizativa → redacción y diligence (~2-3 meses) → presentación confidencial → comentarios de la SEC → registro público → testing-the-waters → lanzamiento y roadshow → precio → cierre.</p>` }

        { t: 'ord', q: 'Ordena un calendario típico de OPV', o: ['Reunión organizativa', 'Redacción y due diligence', 'Presentación confidencial a la SEC', 'Registro público', 'Lanzamiento y roadshow', 'Fijación del precio', 'Cierre'], e: 'Normalmente varios meses del arranque al precio.' },
        { t: 'int', q: 'Entrevista: "¿Cómo decides el tamaño de una OPV?"', m: 'Empiezo por las <b>necesidades de capital</b> de la compañía (primaria) y el deseo de <b>vender</b> de los dueños (secundaria), y luego compruebo la demanda inversora y el <b>float</b> necesario para la liquidez y la entrada en índices (a menudo 15-25% o más). Demasiado grande arriesga presión en el precio; demasiado pequeña perjudica la liquidez y el interés. El greenshoe añade flexibilidad encima.' }

    {
      id: 'c9l4', title: 'Due diligence, redacción y registro',

        { h: 'Due diligence de los colocadores', b: `<p>Diligence de negocio, financiera, legal y contable: sesiones con la dirección, llamadas a clientes, revisión de documentos, <b>comfort letters</b> de los auditores y <b>opiniones</b> legales/<b>cartas 10b-5</b>. Sustenta la <b>defensa de due diligence</b> de los colocadores frente a la responsabilidad de la <b>Sección 11</b> de la Securities Act de 1933 por errores en el registration statement.</p>` },
        { h: 'El registration statement (folleto)', b: `<p>El <b>S-1</b> incluye el folleto: resumen, <b>factores de riesgo</b>, uso de los fondos, política de dividendos, capitalización, dilución, <b>MD&amp;A</b> (análisis de la dirección), negocio, dirección y retribuciones, accionistas principales, descripción del capital, aseguramiento y estados financieros.</p>

        { t: 'match', q: 'Relaciona cada sección del S-1 con su contenido', p: [['Factores de riesgo', 'Riesgos materiales del negocio y la oferta'], ['Uso de los fondos', 'En qué se gastará el dinero primario'], ['MD&A', 'Análisis de los resultados por la dirección'], ['Dilución', 'Efecto en el valor contable por acción de los nuevos']] },
        { t: 'num', q: '¿Cuántos días antes del roadshow, como mínimo, debe registrarse públicamente un S-1 presentado de forma confidencial?', a: 15, e: 'Después puede lanzarse el roadshow.' },
        { t: 'tf', q: 'Los analistas de los colocadores pueden participar en vender la OPV a los inversores.', a: false, e: 'El análisis debe ser independiente de la banca de inversión y la venta.' },
        { t: 'mc', q: '¿Qué hace la compañía tras recibir cartas de comentarios de la SEC?', o: ['Responde y presenta versiones modificadas del registro', 'Fija el precio de inmediato', 'Cancela la OPV', 'Nada'], a: 0, e: 'Normalmente hay varias rondas.' },
        { t: 'int', q: 'Entrevista: "¿Por qué hacen tanta due diligence los colocadores en una OPV?"', m: 'Porque tienen <b>responsabilidad legal</b> (Secciones 11 y 12 de la Securities Act) por errores u omisiones materiales en el folleto, y una buena <b>defensa de due diligence</b> los protege. La diligence también protege su <b>reputación</b> ante los inversores y asegura que la equity story sea precisa y defendible en el roadshow.' }

    {
      id: 'c9l5', title: 'Marketing y roadshow',
      th: [
        { h: 'Materiales de marketing y teach-in', b: `<p>La <b>presentación del roadshow</b> (y a menudo un vídeo grabado para minoristas) cuenta la equity story. En el lanzamiento, el <b>folleto preliminar</b> ("red herring") incluye el <b>rango de precio</b>.</p>
<p>El <b>teach-in a la fuerza de ventas</b>: dirección y banqueros forman a los equipos de venta de acciones de los colocadores para que puedan presentar la operación a los inversores. Antes del lanzamiento, las compañías pueden <b>tantear el mercado</b> (testing-the-waters) con inversores institucionales para medir la demanda.</p>` },

        { t: 'mc', q: '¿Qué es el teach-in a la fuerza de ventas?', o: ['Formar a los equipos de venta de los colocadores en la equity story', 'Formar a los comerciales de la compañía', 'Una sesión de la SEC', 'Una reunión del consejo'], a: 0, e: 'Para que los vendedores presenten bien la operación a los inversores.' },
        { t: 'tf', q: 'Las reuniones de testing-the-waters permiten medir el interés institucional antes del lanzamiento.', a: true, e: 'Hoy disponibles para todos los emisores en EE. UU.' },
        { t: 'mc', q: '¿Por qué les importa a los bookrunners la calidad del libro?', o: ['Los inversores a largo plazo sostienen el secundario; los flippers venden rápido', 'Solo importa el tamaño total', 'Para bajar comisiones', 'Lo exige la regulación'], a: 0, e: 'La asignación favorece la demanda de calidad.' },
        { t: 'int', q: 'Entrevista: "¿Qué ocurre durante el roadshow de una OPV?"', m: 'Tras el lanzamiento con el <b>red herring</b> y el rango de precio, dirección y banqueros se reúnen con inversores institucionales en <b>reuniones de grupo e individuales</b> durante aproximadamente una semana para presentar la <b>equity story</b> y responder preguntas. Mientras, los bookrunners <b>construyen el libro de órdenes</b>, siguiendo importes, precios límite y calidad de los inversores, y trasladan la demanda para calibrar el precio y la asignación.' }
      ]

    {
      id: 'c9l6', title: 'Precio, asignación y cierre',
      th: [
        { h: 'Fijar el precio de la oferta', b: `<p>Cuando se cierra el libro (normalmente la tarde antes de empezar a cotizar), los bookrunners recomiendan un <b>precio</b> según la demanda y la sensibilidad al precio. Con demanda fuerte, el precio puede quedar <b>por encima del rango</b> o ampliarse la oferta (<b>upsize</b>); con demanda débil, se fija por debajo o se aplaza. El objetivo es equilibrar maximizar los fondos con un buen primer día de cotización (un "pop" moderado).</p>` },
        { h: 'Asignar las acciones y cerrar', b: `<p>La <b>asignación</b> prioriza a inversores de calidad y a largo plazo, asegurando una base accionarial amplia y cierta participación minorista.</p>

        { t: 'num', q: 'OPV a 20 $ que cierra su primer día a 25 $. ¿Subida del primer día (%)?', a: 25, u: '%', e: '25 / 20 − 1 = 25%.' },
        { t: 'mc', q: '¿Cuándo se suele fijar el precio de una OPV?', o: ['La tarde antes de empezar a cotizar', 'Un mes antes del roadshow', 'En la reunión organizativa', 'Después del lock-up'], a: 0, e: 'Justo después de cerrar el libro.' },
        { t: 'tf', q: 'Una subida muy fuerte el primer día puede significar que el emisor "dejó dinero sobre la mesa".', a: true, e: 'La compañía podría haber vendido las acciones más caras.' },
        { t: 'ord', q: 'Ordena los pasos finales', o: ['Se cierra el libro', 'Se fija el precio', 'Se asignan las acciones', 'Empieza la cotización', 'Cierre y pago de los fondos netos'], e: 'Después, estabilización y greenshoe.' },

        { t: 'int', q: 'Entrevista: "Explícame el proceso de una OPV."', m: '<b>Organización</b>: elegir bancos, abogados, auditores y bolsa; puesta a punto corporativa; estructura (C corp o Up-C), calendario, tamaño y valoración preliminar; reunión organizativa. <b>Due diligence, redacción y registro</b>: diligence, redactar el S-1, presentación confidencial, comentarios de la SEC, registro público, coordinación del análisis. <b>Marketing</b>: testing-the-waters, teach-in a la fuerza de ventas, lanzamiento con el red herring, roadshow y libro de órdenes. <b>Precio y asignación</b>: fijar el precio, asignar a inversores de calidad, empezar a cotizar, cerrar y después estabilización y greenshoe.' }

UNITS.push({
  id: 'x1', title: 'Fondos de private equity', sub: 'Cómo se estructuran los fondos, cómo cobra el GP y cómo crea valor', ch: 'Más allá del libro', col: 'var(--u8)',
  lessons: [
    {
      id: 'x1l1', title: 'Estructura del fondo: GPs y LPs',
      th: [
        { h: 'GP y LPs', b: `<ul><li><b>General partner (GP)</b>: la gestora de PE. Busca, ejecuta y gestiona las inversiones, y aporta ella misma un 1-5% del fondo.</li><li><b>Limited partners (LPs)</b>: fondos de pensiones, aseguradoras, fondos soberanos, fundaciones universitarias (endowments), family offices, fondos de fondos.</li></ul>
<p>Los LPs <b>comprometen</b> capital; el GP lo va pidiendo mediante <b>capital calls</b> (llamadas de capital) a medida que cierra operaciones. El capital comprometido pero aún no invertido es la <b>dry powder</b>.</p>` },
        { h: 'Vida del fondo', b: `<p>Normalmente <b>10 años</b> (+1-2 de prórroga): ~5 años de <b>periodo de inversión</b> y después la fase de desinversión. La <b>curva J</b>: al principio la rentabilidad es negativa (comisiones, costes, inversiones sin realizar) hasta que las salidas la vuelven positiva.</p>
<p><b>Buyout o venture capital</b>: los buyouts toman el <b>control</b> de compañías maduras con deuda; el VC toma participaciones <b>minoritarias</b> en startups sin apalancamiento. El growth equity está en medio.</p>` }
      ],
      ex: [
        { t: 'match', q: 'Relaciona cada término con su definición', p: [['GP', 'Gestiona el fondo y toma las decisiones'], ['LP', 'Inversor que compromete capital'], ['Capital call', 'Petición a los LPs para que desembolsen'], ['Dry powder', 'Capital comprometido sin invertir']] },
        { t: 'tf', q: 'Los LPs transfieren todo su compromiso el primer día.', a: false, e: 'Desembolsan a medida que el GP hace capital calls.' },
        { t: 'mc', q: '¿Qué explica la curva J?', o: ['Rentabilidad negativa al principio por comisiones y operaciones sin realizar, luego ganancias con las salidas', 'La bajada de tipos de interés', 'La forma de la estructura de capital', 'El calendario fiscal'], a: 0, e: 'Primero sale caja; las ganancias llegan con las salidas.' },
        { t: 'mc', q: 'Diferencia clave entre buyouts y venture capital:', o: ['Buyout: control y apalancamiento en empresas maduras; VC: minoritarias en startups', 'Son lo mismo', 'El VC usa más apalancamiento', 'Los buyouts solo financian startups'], a: 0, e: 'El growth equity está en medio.' },
        { t: 'int', q: 'Entrevista: "¿Por qué private equity y no banca?"', m: 'En banca <b>asesoras</b> y el trabajo termina en el cierre; en PE eres el <b>inversor</b>: decides qué comprar con tu propio criterio y te quedas años para <b>crear valor</b> junto a la dirección. Me atrae pensar como propietario, el análisis profundo del negocio y ver el resultado de las decisiones. La banca da la base técnica en modelos y procesos.' }
      ]
    },
    {
      id: 'x1l2', title: 'Economía del fondo: el 2 y 20',
      th: [
        { h: 'Cómo cobra el GP', b: `<ul><li><b>Comisión de gestión</b> (management fee): ~<b>2%</b> anual sobre el capital comprometido durante el periodo de inversión (después, a menudo sobre el invertido).</li><li><b>Carried interest</b> (carry): ~<b>20%</b> de los beneficios del fondo.</li><li><b>Hurdle rate</b> (rentabilidad preferente): normalmente un <b>8%</b> anual para los LPs antes del carry.</li><li><b>Catch-up</b>: superado el hurdle, el GP se lleva una parte mayor hasta alcanzar el 20% del beneficio total.</li></ul>` },
        { h: 'Waterfalls (cascadas) y métricas', b: `<p><b>Waterfall europeo</b> (de fondo completo): carry solo cuando los LPs han recuperado todo el capital aportado más el hurdle. <b>Americano</b> (operación a operación): carry en cada operación exitosa, con un <b>clawback</b> (devolución) si el fondo rinde peor después.</p>
<ul><li><b>DPI</b> = Distribuciones / Capital desembolsado</li><li><b>RVPI</b> = Valor residual (NAV) / Capital desembolsado</li><li><b>TVPI</b> = DPI + RVPI</li></ul>` }
      ],
      ex: [

        { t: 'num', q: 'Beneficios del fondo de 500 M$, carry del 20% con catch-up completo. ¿Carry del GP (M$)?', a: 100, e: '20% × 500 = 100.' },
        { t: 'fill', q: 'La rentabilidad anual mínima que reciben los LPs antes de que el GP cobre carry es el ___', o: ['hurdle rate', 'WACC', 'cupón', 'diferencial'], a: 0, e: 'También llamado rentabilidad preferente, normalmente del 8%.' },
        { t: 'mc', q: 'Con un waterfall europeo, el GP cobra carry:', o: ['Solo cuando los LPs recuperan todo su capital más el hurdle', 'En cada operación con beneficio', 'Al lanzar el fondo', 'Nunca'], a: 0, e: 'Más favorable para los LPs.' },
        { t: 'num', q: 'Los LPs han desembolsado 100 $ y recibido 150 $ en distribuciones. ¿DPI (x)?', a: 1.5, u: 'x', e: '150 / 100 = 1,5x.' },
        { t: 'num', q: 'DPI de 0,8x y RVPI de 1,0x. ¿TVPI (x)?', a: 1.8, u: 'x', e: '0,8 + 1,0 = 1,8x.' },
        { t: 'int', q: 'Entrevista: "¿Qué alinea al GP con sus LPs?"', m: 'El <b>carried interest</b>: el GP solo gana mucho dinero si los LPs también. El <b>hurdle</b> garantiza antes una rentabilidad mínima. El <b>compromiso propio</b> del GP (1-5%) lo convierte también en inversor. Los <b>clawbacks</b> y el waterfall europeo evitan cobrar carry por éxitos parciales. Las comisiones de gestión pueden desalinear incentivos al premiar el tamaño del fondo.' }

      ],
      ex: [

        { t: 'num', q: 'Un add-on con 10 $ de EBITDA se compra a 6x y dentro de la plataforma se valora a 10x. ¿Valor creado por arbitraje de múltiplos?', a: 40, e: '10 × (10 − 6) = 40.' },
        { t: 'tf', q: 'La expansión del múltiplo es la palanca de valor más controlable para un fondo.', a: false, e: 'Depende sobre todo del mercado.' },
        { t: 'mc', q: '¿Qué es un secondary buyout?', o: ['Un fondo vende una compañía a otro fondo', 'Una segunda OPV', 'Comprar préstamos en el mercado secundario', 'Vender una división a los empleados'], a: 0, e: 'Una de las salidas más habituales.' },

      ]
    }
  ]

UNITS.push({
  id: 'x2', title: 'Reestructuraciones', sub: 'Compañías en dificultades: opciones, Chapter 11 y cascadas de recuperación', ch: 'Más allá del libro', col: 'var(--u11)',
  lessons: [
    {
      id: 'x2l1', title: 'Señales de dificultad y opciones',
      th: [
        { h: 'Liquidez o solvencia', b: `<p>Un problema de <b>liquidez</b>: no hay caja suficiente para atender las obligaciones, aunque el negocio sea viable. Un problema de <b>solvencia</b>: la deuda supera el valor del negocio, así que el equity no vale nada económicamente.</p>
<p>Señales: apalancamiento de 8x o más, cobertura de intereses por debajo de ~1,5x, bonos cotizando muy por debajo de la par (por debajo de ~70-80 se considera "distressed"), incumplimientos de covenants inminentes, un <b>muro de vencimientos</b> (maturity wall).</p>` },

        { t: 'tf', q: 'Si sube el EV de reorganización, el fulcrum puede pasar a una clase más subordinada.', a: true, e: 'Más valor llega a más clases.' },

  ['Red herring', 'Folleto preliminar con el rango de precio.'],
  ['Revolver', 'Línea de crédito revolving para liquidez.'],
  ['ROIC', 'EBIT / (deuda neta media + patrimonio neto medio).'],
  ['Sección 338(h)(10)', 'Elección para tratar una compra de acciones como compra de activos a efectos fiscales.'],
  ['Orígenes y aplicaciones (Sources and uses)', 'Tabla que cuadra las fuentes de financiación con los usos de los fondos.'],
  ['SPAC', 'Sociedad cheque en blanco que sale a bolsa y después se fusiona con una compañía privada.'],
  ['Stapled financing', 'Financiación preacordada que el banco del vendedor ofrece a los compradores.'],
  ['Subordinación estructural', 'La deuda de la holding queda por detrás de todos los pasivos de la sociedad operativa.'],
  ['Sinergias', 'Valor de combinar compañías: de costes (más fiables) y de ingresos.'],
  ['Teaser', 'Resumen breve, a menudo anónimo, enviado a compradores potenciales.'],
  ['OPA (Tender offer)', 'Oferta hecha directamente a los accionistas para comprar sus acciones.'],
  ['Term Loan B', 'Préstamo institucional con ~1% de amortización anual y vencimiento único a ~7 años.'],
  ['Método de las acciones propias (Treasury stock method)', 'Dilución de las opciones in the money neta de las acciones recompradas con el dinero del ejercicio.'],
  ['UFCF', 'Flujo de caja libre desapalancado: EBIAT + D&A − capex − ΔNWC.'],
  ['Unitranche', 'Préstamo único que combina deuda senior y junior.'],
  ['Up-C', 'Estructura de OPV en la que PubCo posee units de una OpCo fiscalmente transparente; usa un TRA.'],
  ['WACC', 'Coste medio ponderado del capital: rd(1 − t)·D/V + re·E/V.']
];
// Tarjetas "En lenguaje llano": una por lección, se muestra primero y explica la idea sin jerga antes de la teoría técnica.
const PLAIN = {
  // Fundamentos
  f0l1: ['Tres informes, una historia', `<p>Toda empresa publica tres informes. Piensa en las finanzas de una persona: su <b>nómina</b> muestra lo que ganó este año (la <b>cuenta de resultados</b>), una lista de su casa, su coche, sus ahorros y su hipoteca muestra cómo está hoy (el <b>balance</b>), y su <b>extracto bancario</b> muestra el dinero que de verdad entró y salió (el <b>estado de flujos de efectivo</b>).</p><p>Están conectados: el beneficio del año aumenta lo que tienes, y el extracto explica por qué tus ahorros subieron o bajaron. En esta lección aprendes cómo un cambio en un informe se propaga a los otros dos, la pregunta de entrevista más típica que existe.</p>`],
  f0l2: ['Pelando la cebolla del beneficio', `<p>Partiendo de todo lo que pagaron los clientes (las ventas), vas quitando costes capa a capa. Primero el coste del propio producto y después los costes de funcionamiento, como el alquiler y los sueldos. Lo que queda es el <b>EBITDA</b>: el beneficio que el negocio obtiene de su operativa diaria.</p><p>Los banqueros dedican mucho tiempo a que el EBITDA esté “limpio”: quitan partidas puntuales, como un juicio o el cierre de una fábrica, para que muestre lo que el negocio gana normalmente. Las cifras limpias son las que se comparan y se valoran.</p>`],
  f0l3: ['El dinero que necesita un negocio solo para seguir funcionando', `<p>Una tienda tiene que comprar el género antes de venderlo, y algunos clientes pagan tarde. Ese dinero está “atrapado” en el negocio: es el <b>capital circulante</b>. Además, las máquinas se desgastan y hay que sustituirlas o mejorarlas: es el <b>capex</b> (inversión en inmovilizado).</p><p>Ambos consumen caja sin aparecer del todo como coste en el beneficio. Por eso dos empresas con el mismo beneficio pueden generar cantidades de caja muy distintas. Esta lección te enseña a medir los dos.</p>`],
  f0l4: ['Quién trabaja en un banco y qué hace', `<p>Un banco de inversión es, sobre todo, un equipo de asesores. Unos ayudan a las empresas a comprar o vender otras empresas (<b>M&amp;A</b>), otros a captar dinero vendiendo acciones o pidiendo prestado (<b>mercados de capitales</b>), y otros negocian y venden esos valores a los inversores.</p><p>Los juniors (analistas y asociados) hacen los números y las presentaciones; los sénior (VP, directores, managing directors) gestionan clientes y consiguen negocio. Saber cómo funciona la máquina te ayuda a explicar por qué quieres formar parte de ella.</p>`],
  // Comparables
  c1l1: ['Valóralo como una casa: mira a los vecinos', `<p>Para poner precio a un piso, un agente inmobiliario mira a cuánto se venden pisos parecidos en la misma zona. El <b>análisis de compañías comparables</b> (“comps”) hace lo mismo con una empresa: busca empresas cotizadas parecidas y mira cómo las valora la bolsa.</p><p>Lo difícil es decidir quién cuenta como “parecido”: mismo sector, mismo tipo de clientes, tamaño y crecimiento similares. Si eliges mal a los vecinos, el precio sale mal. Esta lección trata de construir ese grupo de comparables.</p>`],
  c1l2: ['De dónde salen los números', `<p>Las empresas cotizadas tienen que publicar sus resultados. En EE. UU. los presentan ante el regulador (la <b>SEC</b>): un gran informe anual (<b>10-K</b>), informes trimestrales más cortos (<b>10-Q</b>) y avisos rápidos de hechos relevantes (<b>8-K</b>).</p><p>Los banqueros también usan las previsiones de los analistas de research y bases de datos como Bloomberg o FactSet. Esta lección te dice qué fuente usar para cada número, para que tus comparables se apoyen en datos sólidos.</p>`],
  c1l3: ['¿Cómo de grande es, y cuánto cuesta de verdad?', `<p>Antes de comparar empresas las mides: cuánto venden, cuánto beneficio obtienen y a qué ritmo crecen.</p><p>Después calculas su valor de dos maneras. El <b>valor del capital</b> es lo que valen todas las acciones (precio por acción × número de acciones). El <b>valor de empresa</b> es lo que pagarías de verdad por todo el negocio: las acciones más la deuda que asumes, menos la caja que encuentras dentro, exactamente como una casa con hipoteca y dinero en un cajón.</p>`],
  c1l4: ['¿Es un buen negocio y es seguro?', `<p>Dos empresas pueden tener el mismo tamaño, pero una puede ganar mucho más con el dinero invertido en ella. Las medidas de <b>rentabilidad</b> (como el ROIC, la rentabilidad sobre el capital invertido) te dicen lo bien que la dirección convierte el dinero en beneficio.</p><p>Las medidas de <b>crédito</b> te dicen lo arriesgada que es la deuda de la empresa: cuántos años de beneficio harían falta para devolverla (<b>apalancamiento</b>) y con qué holgura paga sus intereses (<b>cobertura</b>). Los negocios mejores y más seguros suelen merecer valoraciones más altas.</p>`],
  c1l5: ['Hacer comparables los números', `<p>Las empresas cierran su ejercicio en fechas distintas y a veces tienen hechos puntuales. Para comparar con justicia necesitas la misma ventana de tiempo y cifras “normales”.</p><p>El <b>LTM</b> (últimos doce meses) te da el año completo más reciente. La <b>calendarización</b> alinea una empresa que cierra en junio con comparables que cierran en diciembre. Los <b>ajustes</b> quitan partidas puntuales como un gran juicio. Peras con peras.</p>`],
  c1l6: ['La valoración como un simple cociente', `<p>Un <b>múltiplo</b> es un precio dividido entre una medida de beneficio. Si una empresa vale 800 M$ y genera 100 M$ de EBITDA, cotiza a <b>8x EBITDA</b>: pagas 8 años del EBITDA actual por comprarla.</p><p>Los múltiplos permiten comparar empresas de tamaños distintos. La regla clave: comparar lo comparable. El valor de empresa va con cifras antes de intereses (ventas, EBITDA, EBIT); el valor del capital va con cifras después de intereses (beneficio neto, BPA).</p>`],
  c1l7: ['Del grupo de comparables a un precio', `<p>Cuando tienes los múltiplos de los comparables, miras cuáles se parecen más a tu empresa y eliges un rango razonable, por ejemplo 7x–9x EBITDA. Multiplicas el EBITDA de tu empresa por ese rango y obtienes su valor implícito.</p><p>Los comparables son rápidos y se basan en precios reales de mercado, pero el mercado puede equivocarse (ser demasiado optimista o pesimista) y a veces no hay empresas realmente parecidas. Aprendes cuándo fiarte de ellos y cuándo no.</p>`],
  c1l8: ['Todo junto en una empresa', `<p>Esta lección recorre un análisis de comparables completo para una empresa de ejemplo, ValueCo, de principio a fin: elegir los comparables, recopilar sus cifras, calcular los múltiplos y llegar a un rango de valor.</p><p>Ver cada paso en un único ejemplo es la mejor forma de que el método se te quede. En una entrevista, saber recorrerlo de principio a fin es justo lo que evalúan.</p>`],
  // Precedentes
  c2l1: ['¿Cuánto pagaron los compradores la última vez?', `<p>Los comparables miran lo que la bolsa paga por un <b>trocito</b> de una empresa (una acción). Las <b>transacciones precedentes</b> miran lo que los compradores pagaron de verdad por <b>comprar empresas enteras</b> en el pasado.</p><p>Comprar la empresa entera te da el control, así que los compradores suelen pagar más que el precio de mercado: una <b>prima de control</b>. Por eso los precedentes suelen dar valores más altos que los comparables. Primer paso: encontrar operaciones pasadas que de verdad se parezcan.</p>`],
  c2l2: ['Desenterrando los detalles de la operación', `<p>Cuando se compra una empresa cotizada se publican muchos documentos: el anuncio de la fusión, la proxy statement que votan los accionistas, los documentos de la OPA. Revelan el precio, cómo se pagó y por qué el consejo aceptó.</p><p>En operaciones con empresas privadas la información escasea y dependes de notas de prensa y bases de datos. Esta lección te dice dónde buscar cada dato.</p>`],
  c2l3: ['Cómo se paga el precio', `<p>Un comprador puede pagar en <b>efectivo</b>, con sus propias <b>acciones</b> o con una mezcla. Pagar con acciones significa que los accionistas del vendedor pasan a ser copropietarios del comprador.</p><p>Si la empresa objetivo cotiza, el precio por acción por sus acciones da el <b>valor de la oferta</b> (capital), y sumándole su deuda menos su caja se obtiene el <b>valor de la transacción</b> (el valor de empresa pagado). Cuando se paga con acciones, la <b>ecuación de canje</b> dice cuántas acciones del comprador recibe cada acción del objetivo.</p>`],
  c2l4: ['Múltiplos de operación y la prima', `<p>Divide el valor de la transacción entre el EBITDA de la empresa comprada y obtienes el múltiplo que pagó el comprador, por ejemplo 10x. Si reúnes esos múltiplos de operaciones pasadas, tienes un rango para tu empresa.</p><p>También mides la <b>prima pagada</b>: cuánto por encima del precio de la acción antes del anuncio ofreció el comprador, a menudo un 20–40%. Esa prima es el precio del control.</p>`],
  c2l5: ['Convertir operaciones pasadas en un valor', `<p>Como en los comparables, eliges las operaciones más relevantes, decides un rango de múltiplos y lo aplicas a tu empresa. El resultado es el valor que un comprador podría pagar hoy por tomar el control.</p><p>El punto débil: las operaciones se cierran en condiciones de mercado distintas (deuda barata, mercados eufóricos), así que las antiguas pueden no reflejar el presente. Pesas lo recientes y parecidas que son.</p>`],
  // DCF
  c3l1: ['Valor de dentro hacia fuera', `<p>Comparables y precedentes preguntan “¿cuánto valen los demás?”. Un <b>descuento de flujos de caja</b> (DCF) pregunta “¿cuánto vale <b>esta</b> empresa por sí misma?”.</p><p>La idea: un negocio vale la caja que producirá en el futuro, convertida a dinero de hoy. Antes de proyectar tienes que entender qué mueve el negocio: qué hace crecer las ventas, qué mueve los costes, qué podría salir mal. Esta lección es esos deberes.</p>`],
  c3l2: ['Proyectar ventas y beneficio', `<p>Construyes una previsión, normalmente a 5 años: ¿cuánto venderá la empresa cada año y cuánto beneficio obtendrá? Te basas en su historia, en las perspectivas del sector, en los planes de la dirección y en las estimaciones de los analistas.</p><p>Los banqueros suelen preparar varios escenarios (base, optimista, pesimista) porque el futuro es incierto. Una previsión es tan buena como sus hipótesis, así que tienes que saber defenderlas.</p>`],
  c3l3: ['¿Cuánta caja es realmente libre?', `<p>El beneficio no es caja. Para saber cuánta caja genera de verdad el negocio para sus inversores, partes del beneficio operativo, restas los impuestos, sumas los costes no monetarios (depreciación) y restas el dinero que necesita reinvertir: equipos nuevos (capex) y capital circulante.</p><p>Lo que queda es el <b>flujo de caja libre sin apalancar</b> (unlevered free cash flow): la caja disponible para todos los que financian la empresa, prestamistas y accionistas.</p>`],
  c3l4: ['Cómo se financia la empresa y cuánto cuesta la deuda', `<p>Para traer la caja futura a hoy necesitas una tasa de descuento: la rentabilidad que exigen los inversores. Una empresa la financian prestamistas y accionistas, y cada uno quiere una rentabilidad distinta.</p><p>Primero decides la mezcla de deuda y capital a largo plazo (la <b>estructura de capital</b>). Después calculas lo que cuesta la deuda: el tipo de interés que cobran los prestamistas, reducido por el ahorro fiscal, porque los intereses son deducibles.</p>`],
  c3l5: ['Lo que exigen los accionistas y el tipo combinado', `<p>Los accionistas asumen más riesgo que los prestamistas, así que exigen más. El <b>CAPM</b> estima su rentabilidad exigida: el tipo de un bono del Estado sin riesgo, más una prima por invertir en acciones, ajustada por lo volátil que es esta empresa frente al mercado (su <b>beta</b>).</p><p>Combina el coste de la deuda y el coste del capital según cuánto usa de cada uno y obtienes el <b>WACC</b>: la tasa de descuento del DCF.</p>`],
  c3l6: ['¿Y todo lo que viene después del año 5?', `<p>No puedes proyectar para siempre, pero la empresa no deja de existir después del año 5. El <b>valor terminal</b> recoge en un solo número todo el valor posterior al periodo de proyección, y a menudo es más de la mitad del valor total.</p><p>Dos formas: suponer que la empresa se vende a un múltiplo típico de su EBITDA (<b>múltiplo de salida</b>), o suponer que su flujo de caja sigue creciendo despacio para siempre (<b>crecimiento a perpetuidad</b>). Los buenos banqueros comprueban que ambos den respuestas parecidas.</p>`],
  c3l7: ['Traerlo todo a hoy', `<p>Cada flujo de caja futuro y el valor terminal se dividen entre (1 + WACC) por cada año de espera y luego se suman. Eso da el valor de empresa. Restas la deuda y sumas la caja para obtener el valor del capital y, dividiendo entre las acciones, un valor por acción.</p><p>Como pequeños cambios en el WACC o en el crecimiento mueven mucho el resultado, los banqueros muestran una <b>tabla de sensibilidad</b>: una cuadrícula de valores con distintas hipótesis.</p>`],
  c3l8: ['Un DCF completo en una empresa', `<p>Esta lección construye un DCF completo para ValueCo paso a paso: proyección, flujo de caja libre, WACC, valor terminal, valor actual y el rango final.</p><p>Seguir cada número en un ejemplo es como el método se vuelve automático, y “explícame un DCF” es una de las preguntas de entrevista más frecuentes.</p>`],
  // Conceptos de LBO
  c4l1: ['Comprar una empresa como quien compra un piso para alquilar', `<p>Imagina que compras un piso para alquilarlo: pones el 30%, pides el 70% en hipoteca y el alquiler del inquilino va pagando la hipoteca. Años después lo vendes y casi todo el piso es tuyo.</p><p>Una <b>compra apalancada (LBO)</b> es lo mismo con una empresa. Una firma de <b>private equity</b> la compra con poco dinero propio y mucho prestado, y la propia caja de la empresa va devolviendo la deuda. Esta lección presenta a todos los que intervienen: el fondo de PE, los bancos y prestamistas, los inversores que compran la deuda, la dirección de la empresa y los asesores.</p>`],
  c4l2: ['¿Qué hace que una empresa sea buena para comprarla con deuda?', `<p>Si cargas una empresa de deuda, tiene que pagar los intereses sin falta cada año. Así que el candidato ideal tiene <b>una caja estable y previsible</b>, una posición de mercado fuerte, margen de mejora, poca necesidad de nuevas inversiones, activos sólidos y un buen equipo directivo.</p><p>Apalancar una empresa con beneficios irregulares e imprevisibles es peligroso, igual que no pedirías una gran hipoteca con unos ingresos inestables.</p>`],
  c4l3: ['¿Ha salido bien la inversión?', `<p>Un fondo de PE mide el éxito de dos maneras: cuántas veces ha recuperado su dinero (<b>múltiplo sobre lo invertido</b>, por ejemplo 2,5x) y a qué velocidad, como tipo anual (<b>TIR</b>, por ejemplo un 20%).</p><p>La mayoría de los fondos buscan una TIR del 20–25%. La rentabilidad sale de tres fuentes: hacer crecer el beneficio de la empresa, devolver deuda y vender a un múltiplo más alto que el pagado.</p>`],
  c4l4: ['Por qué pedir prestado dispara la rentabilidad', `<p>Si compras algo por 100 $ solo con tu dinero y lo vendes por 150 $, ganas un 50%. Si solo pones 30 $ y pides prestados 70 $, tras devolver los 70 $ te quedan 80 $ por tus 30 $: más del doble de tu dinero.</p><p>La deuda amplifica la rentabilidad porque lo que ganan los prestamistas está limitado a sus intereses; toda la ganancia extra es para los dueños. También amplifica las pérdidas, y ese es el riesgo.</p>`],
  c4l5: ['Cómo recupera el fondo su dinero', `<p>Un fondo de PE solo gana dinero cuando <b>sale</b> de la inversión: normalmente al cabo de 3–7 años. Puede vender la empresa a un comprador estratégico (una empresa del mismo sector), venderla a otro fondo de PE o sacarla a bolsa (OPV).</p><p>También puede recuperar parte del dinero antes sin vender, haciendo que la empresa pida más deuda y pague un gran dividendo (una <b>recapitalización con dividendo</b>).</p>`],
  c4l6: ['Las capas del dinero prestado', `<p>La deuda de un LBO viene por capas, como las plantas de un edificio. La planta baja es la <b>deuda bancaria con garantía</b>: la más barata y segura, respaldada por los activos de la empresa y la primera en cobrar. Por encima hay capas más arriesgadas que pagan más interés.</p><p>La deuda bancaria incluye un <b>revolving</b> (una especie de tarjeta de crédito para las necesidades del día a día) y <b>préstamos a plazo</b> (term loans: se piden al principio y se devuelven con el tiempo). Esta lección explica cada uno.</p>`],
  c4l7: ['Las capas más arriesgadas y el dinero de los dueños', `<p>Por encima de la deuda bancaria están los <b>bonos high yield</b> (sin garantía, más interés y más plazo para devolverlos) y la deuda <b>mezzanine</b> (todavía más arriesgada, a veces se paga en parte con deuda nueva en vez de efectivo y lleva un trozo del potencial de subida).</p><p>Arriba del todo está el <b>capital</b> (equity), el dinero propio del fondo, normalmente un 30–50% del precio. Cobra el último, pero se queda con todo el potencial de subida.</p>`],
  c4l8: ['La letra pequeña de un préstamo', `<p>Todo préstamo tiene condiciones que deciden lo arriesgado que es para el prestamista: ¿está respaldado por activos (<b>garantía</b>)? ¿Quién cobra primero (<b>prelación</b>)? ¿Cuándo hay que devolverlo (<b>vencimiento</b>)? ¿Qué interés paga (<b>cupón</b>)? ¿Se puede devolver antes y a qué coste (<b>protección frente a amortización anticipada</b>)?</p><p>Entender estas condiciones te permite explicar por qué un tramo de deuda cuesta un 7% y otro un 12%.</p>`],
  c4l9: ['Las reglas que ponen los prestamistas', `<p>Los prestamistas se protegen con <b>covenants</b>: reglas que la empresa debe cumplir, como “que la deuda no supere 5x el EBITDA” o “no pedir más deuda sin permiso”. Incumplirlas puede permitir a los prestamistas exigir la devolución.</p><p>Todas las condiciones clave se resumen en un <b>term sheet</b> (hoja de términos). También aprendes cuánta deuda puede soportar una empresa con seguridad, normalmente expresada como un múltiplo de su EBITDA.</p>`],
  // Análisis LBO
  c5l1: ['Construir el modelo LBO, primer paso', `<p>Un <b>modelo LBO</b> es una hoja de cálculo que responde: si compramos esta empresa a este precio con tanta deuda, ¿qué rentabilidad obtenemos?</p><p>Primero reúnes información de la empresa (los documentos de venta, las previsiones de la dirección) y construyes su proyección financiera antes de cualquier operación: ventas, beneficio y caja para los próximos 5–7 años.</p>`],
  c5l2: ['Lo que pagamos y de dónde sale el dinero', `<p>Toda operación tiene dos lados que deben cuadrar. <b>Usos</b>: en qué se gasta el dinero (comprar las acciones, devolver la deuda antigua, pagar a los asesores). <b>Fuentes</b>: de dónde sale (préstamos nuevos, bonos, el capital del fondo).</p><p>Las fuentes tienen que ser iguales a los usos, exactamente como al comprar una casa: precio más gastos es igual a hipoteca más tu entrada.</p>`],
  c5l3: ['El balance después de la operación', `<p>Tras la compra cambia el balance de la empresa: la deuda antigua se sustituye por la nueva, el capital antiguo desaparece y entra el capital del fondo.</p><p>Si el comprador pagó más que el valor contable de los activos de la empresa, la diferencia se registra como <b>fondo de comercio</b> (goodwill). Las comisiones pagadas por estructurar la deuda se reparten en el tiempo. Esta lección muestra cada ajuste.</p>`],
  c5l4: ['Seguir la deuda año a año', `<p>El corazón de un LBO es el <b>calendario de deuda</b>: cada año, cuánto interés paga la empresa, cuánta deuda devuelve y cuánta queda.</p><p>La caja sobrante suele dedicarse a devolver deuda (un <b>cash sweep</b>, barrido de caja). Al bajar la deuda bajan los intereses, lo que libera más caja para devolver deuda: un círculo virtuoso que va construyendo el patrimonio de los dueños.</p>`],
  c5l5: ['La empresa con sus nuevos dueños', `<p>Con la nueva deuda en su sitio, rehaces los tres estados financieros de los próximos años: más intereses en la cuenta de resultados, deuda que baja en el balance, devoluciones en el estado de flujos.</p><p>Así ves si la empresa puede soportar su deuda con comodidad y a qué ritmo se desapalanca.</p>`],
  c5l6: ['¿Es segura la deuda y es buena la rentabilidad?', `<p>Ahora compruebas dos cosas. Para los prestamistas: ¿el apalancamiento y la cobertura de intereses están en niveles razonables y la deuda baja lo bastante rápido? Para el fondo de PE: si vendemos en el año 5 a un múltiplo típico, ¿qué TIR y qué múltiplo sobre lo invertido obtenemos?</p><p>Luego ajustas la mezcla de deuda y capital hasta que tanto los prestamistas como el fondo estén contentos.</p>`],
  c5l7: ['¿Qué precio puede permitirse un comprador de PE?', `<p>Dale la vuelta a la pregunta: si el fondo necesita un 20% de rentabilidad, ¿cuál es el <b>precio máximo</b> que puede pagar? Eso da una valoración por LBO, a menudo un suelo de lo que vale la empresa, porque un comprador financiero podría pagar al menos eso.</p><p>Todos los resultados van a una página de <b>resumen de la operación</b>: precio, fuentes y usos, rentabilidad y ratios de crédito de un vistazo.</p>`],
  c5l8: ['Un LBO completo en una empresa', `<p>Esta lección hace un LBO completo para ValueCo: precio de compra, fuentes y usos, calendario de deuda, estados pro forma, rentabilidad y la valoración implícita.</p><p>“Explícame un LBO” es una pregunta central en las entrevistas de PE; seguir un ejemplo de principio a fin es la mejor preparación.</p>`],
  // Sell-side
  c6l1: ['Vender una empresa como quien subasta un cuadro', `<p>Para conseguir el mejor precio, un vendedor invita a muchos posibles compradores a competir, como en una subasta de arte. Una <b>subasta amplia</b> contacta con muchos compradores para maximizar la competencia; una <b>subasta dirigida</b> se centra en unos pocos compradores probables para que sea rápida y confidencial.</p><p>El banco que asesora al vendedor (<b>sell-side</b>) dirige todo el proceso y el calendario.</p>`],
  c6l2: ['Prepararse antes de contactar con nadie', `<p>Antes de salir al mercado, el banco y el vendedor se preparan: valoran la empresa, deciden a quién contactar y redactan los documentos de venta. El <b>teaser</b> es un resumen breve y anónimo para despertar interés; el <b>CIM</b> (cuaderno de venta, memorando de información confidencial) es el folleto de venta detallado.</p><p>Los compradores firman un <b>acuerdo de confidencialidad</b> antes de ver nada delicado.</p>`],
  c6l3: ['Primera ronda: ¿quién está interesado?', `<p>Los compradores reciben el teaser y el CIM y envían una primera oferta no vinculante (una <b>indicación de interés</b>, IOI), normalmente un rango de precio.</p><p>El vendedor elige entonces a los postores más atractivos, por precio pero también por lo probable que es que de verdad cierren la operación, y los invita a la segunda ronda.</p>`],
  c6l4: ['Segunda ronda: el análisis a fondo', `<p>Los postores que quedan tienen acceso completo a la empresa: una <b>data room</b> con todos los documentos, reuniones con la dirección, visitas a las instalaciones. Es la <b>due diligence</b>: comprobarlo todo antes de comprometerse.</p><p>Después presentan sus ofertas finales y vinculantes junto con sus comentarios al borrador del contrato de compraventa.</p>`],
  c6l5: ['Cerrar el acuerdo', `<p>El vendedor negocia con los uno o dos mejores postores el precio y las condiciones, y firma el <b>contrato definitivo</b>: el contrato de compraventa vinculante. Recoge el precio, lo que promete cada parte, las condiciones para cerrar y qué pasa si alguien se retira.</p><p>El consejo de un vendedor cotizado suele pedir a su banco una <b>fairness opinion</b> (opinión de equidad) que diga que el precio es justo.</p>`],
  c6l6: ['Llevar la operación hasta el final', `<p>Entre la firma y el cierre la operación necesita autorizaciones: las autoridades de competencia (en EE. UU., bajo la ley <b>HSR</b>), a veces los accionistas, y el comprador tiene que asegurar su financiación. Después cambian de manos el dinero y la propiedad.</p><p>No toda venta es una subasta: a veces el vendedor negocia con un único comprador (una <b>venta negociada</b>), renunciando a algo de tensión en el precio a cambio de rapidez y confidencialidad.</p>`],
  // Buy-side
  c7l1: ['¿Por qué compraría una empresa a otra?', `<p>Las empresas compran otras para crecer más rápido de lo que podrían solas: productos nuevos, clientes nuevos, países nuevos.</p><p>La palabra mágica son las <b>sinergias</b>: la empresa combinada vale más que las dos por separado, porque puede eliminar costes duplicados (una sede central en vez de dos) o vender más (venta cruzada a los clientes de la otra). Las sinergias son lo que justifica que un comprador pague una prima.</p>`],
  c7l2: ['Distintas formas de crecer comprando', `<p>Una empresa puede comprar a un competidor (<b>horizontal</b>), a un proveedor o a un cliente (<b>vertical</b>), o entrar en un área relacionada (<b>adyacente</b>). Cada estrategia tiene riesgos y sinergias distintos.</p><p>Los compradores de private equity también tienen su propia estrategia, como comprar una empresa <b>plataforma</b> y luego ir sumándole empresas más pequeñas (<b>add-ons</b>).</p>`],
  c7l3: ['Pagar con caja, deuda o acciones', `<p>El comprador puede pagar con la caja que ya tiene, con deuda nueva o emitiendo acciones nuevas. La caja y la deuda son más baratas pero añaden riesgo; las acciones son caras (los accionistas exigen mucha rentabilidad) y <b>diluyen</b> a los dueños actuales, pero mantienen el balance seguro.</p><p>La elección afecta al beneficio por acción del comprador y a su rating, así que es una gran decisión.</p>`],
  c7l4: ['Comprar las acciones o comprar los activos', `<p>Puedes comprar una empresa comprando sus acciones (te quedas con todo, incluidos sus problemas ocultos) o comprando solo determinados activos (eliges lo que quieres y dejas atrás los pasivos).</p><p>La elección tiene grandes efectos fiscales: comprar activos puede permitir al comprador deducir más depreciación en el futuro, lo cual es valioso. Algunas opciones fiscales de EE. UU. (como la <b>338(h)(10)</b>) permiten que una compra de acciones tribute como una compra de activos.</p>`],
  c7l5: ['¿Cuánto debería pagar el comprador?', `<p>El banco del comprador aplica todos los métodos de valoración (comparables, precedentes, DCF, LBO) y los muestra uno al lado del otro en un gráfico <b>football field</b>.</p><p>También comprueba qué le hace la operación al comprador a distintos precios y cuánto aporta cada empresa al beneficio combinado (<b>análisis de contribución</b>), para decidir una oferta razonable.</p>`],
  c7l6: ['La contabilidad después de la compra', `<p>Cuando un comprador paga más de lo que valen sobre el papel los activos de la empresa comprada, la diferencia se registra como <b>fondo de comercio</b> (goodwill). Antes, los activos de la empresa se revalorizan a valor razonable (<b>asignación del precio de compra</b>, PPA), lo que puede generar nueva depreciación y amortización y un pasivo por impuesto diferido.</p><p>Estos asientos cambian el balance combinado y los beneficios futuros.</p>`],
  c7l7: ['¿La operación sube o baja nuestro beneficio por acción?', `<p>Los accionistas de un comprador cotizado vigilan el <b>BPA</b> (beneficio por acción). Tras una operación, el comprador suma el beneficio de la empresa comprada, pero lo paga con los intereses de la deuda nueva, con los intereses que deja de cobrar por la caja gastada o con acciones nuevas.</p><p>Si el BPA combinado sube, la operación es <b>acretiva</b>; si baja, <b>dilutiva</b>. Regla sencilla: pagar con acciones es acretivo si el PER de la empresa comprada es menor que el del comprador.</p>`],
  c7l8: ['Probar distintas formas de pago', `<p>Esta lección hace la misma operación de tres formas (mitad caja y mitad acciones, toda en caja, toda en acciones) y compara el efecto en el BPA, en el nivel de deuda y en la propiedad.</p><p>Ver los pros y contras uno al lado del otro muestra por qué a los consejos les importa tanto cómo se financia una operación.</p>`],
  // OPV
  c8l1: ['Por qué una empresa vende acciones al público', `<p>Una empresa privada “sale a bolsa” en una <b>OPV</b> (oferta pública inicial, IPO) para captar dinero con el que crecer, para que fundadores e inversores iniciales vendan parte de su participación, para usar sus acciones como moneda en adquisiciones y para ganar notoriedad.</p><p>El coste: comisiones elevadas, mucha información pública, escrutinio cada trimestre y menos control.</p>`],
  c8l2: ['¿Qué hace que una empresa sea buena para salir a bolsa?', `<p>Los inversores quieren una historia convincente: una posición de mercado fuerte, un camino claro de crecimiento, un modelo de negocio sólido, un buen equipo directivo y, idealmente, beneficios (o una vía clara para tenerlos).</p><p>También quieren un tamaño suficiente para que las acciones se puedan negociar con facilidad. Cuanto más fuerte la historia, más alta la valoración.</p>`],
  c8l3: ['Quién interviene en una OPV', `<p>La empresa y sus accionistas venden; los <b>bancos de inversión</b> (las entidades colocadoras, underwriters) organizan la venta, valoran la empresa y buscan inversores; los abogados redactan los documentos; los auditores revisan las cifras; y la bolsa admite las acciones a cotización.</p><p>Los grandes inversores institucionales (fondos de inversión, hedge funds) compran la mayoría de las acciones.</p>`],
  c8l4: ['¿Qué tamaño, y de quién son las acciones?', `<p>Una OPV puede vender acciones <b>nuevas</b> (el dinero va a la empresa: <b>primaria</b>) o acciones <b>existentes</b> (el dinero va a los accionistas que venden: <b>secundaria</b>), o ambas.</p><p>Los bancos suelen tener derecho a vender un 15% más de acciones si la demanda es fuerte (el <b>greenshoe</b>, opción de sobreasignación), lo que también ayuda a estabilizar el precio tras empezar a cotizar.</p>`],
  c8l5: ['El sindicato de bancos, el lock-up y la comisión', `<p>Varios bancos se reparten el trabajo en un <b>sindicato</b>, liderado por los <b>bookrunners</b> (coordinadores globales). Los accionistas internos se comprometen a no vender sus acciones durante un periodo, normalmente 180 días (el <b>lock-up</b>), para no inundar el mercado.</p><p>Los bancos cobran un porcentaje del dinero captado (el <b>gross spread</b>, comisión bruta), y la empresa elige en qué bolsa cotizar (NYSE o Nasdaq).</p>`],
  c8l6: ['Otros caminos a la bolsa', `<p>Una empresa puede preparar a la vez una OPV y una venta y elegir la mejor oferta (<b>dual-track</b>). Puede fusionarse con una sociedad cotizada vacía creada para comprar un negocio (<b>SPAC</b>). O puede simplemente admitir a cotización sus acciones existentes sin captar dinero (<b>salida directa</b>, direct listing).</p><p>Cada camino equilibra de forma distinta precio, rapidez, certeza y coste.</p>`],
  c8l7: ['Después de la OPV', `<p>Una vez cotizada, una empresa puede vender más acciones más adelante (una <b>ampliación</b> o follow-on), y los accionistas existentes pueden vender paquetes de acciones. Son operaciones más rápidas y baratas que una OPV.</p><p>Esta lección también trata las grandes preguntas de toda OPV: cómo fijar el precio, cuánto descuento dar a los inversores y cómo mantener estable el precio después.</p>`],
  // Proceso de OPV
  c9l1: ['Poner la casa en orden', `<p>Antes de una OPV, la empresa forma su equipo (bancos, abogados, auditores) y se ordena: cuentas auditadas limpias, un consejo de verdad con consejeros independientes, controles internos sólidos y una estructura societaria adecuada para una empresa cotizada.</p><p>Esta preparación puede llevar muchos meses, y saltársela puede retrasar o hundir la OPV.</p>`],
  c9l2: ['La estructura jurídica y el momento', `<p>La empresa elige cómo se estructurará como sociedad cotizada, por ejemplo una <b>C Corp</b> estándar o una <b>Up-C</b>, que puede dar ventajas fiscales a los dueños actuales.</p><p>El momento también importa: los mercados tienen que estar abiertos y receptivos, y los estados financieros de los documentos no pueden ser demasiado antiguos (“caducan” pasado cierto plazo).</p>`],
  c9l3: ['Cuántas acciones, a qué precio, y el arranque', `<p>Los bancos y la empresa deciden cuánto captar, el reparto entre acciones nuevas y existentes y un rango de valoración inicial basado sobre todo en empresas cotizadas comparables, menos un descuento para atraer a los inversores.</p><p>La <b>reunión de organización</b> (org meeting) reúne a todo el equipo para acordar el calendario y las responsabilidades.</p>`],
  c9l4: ['Revisarlo todo y redactar el folleto', `<p>Los bancos investigan la empresa a fondo (<b>due diligence</b>) porque son legalmente responsables de lo que se cuenta a los inversores. Entre todos redactan el <b>documento de registro</b> (el S-1 en EE. UU.), cuya parte principal es el <b>folleto</b> (prospectus): el documento que leen los inversores.</p><p>Se presenta ante el regulador (la SEC), que lo revisa y hace preguntas antes de que la OPV pueda seguir adelante.</p>`],
  c9l5: ['Vender la historia a los inversores', `<p>Los banqueros y la dirección viajan para reunirse con inversores durante una o dos semanas: el <b>roadshow</b>. Presentan el negocio y responden preguntas.</p><p>Mientras tanto, los bancos recogen órdenes: cuántas acciones quiere cada inversor y a qué precio. Este <b>book-building</b> (prospección de la demanda) muestra la demanda real.</p>`],
  c9l6: ['Fijar el precio y empezar a cotizar', `<p>Al acabar el roadshow, la empresa y los bancos fijan el precio final según el libro de órdenes, buscando una subida moderada el primer día para premiar a los inversores. Después los bancos deciden quién recibe cuántas acciones (<b>adjudicación</b>), favoreciendo a los inversores de largo plazo.</p><p>La cotización empieza a la mañana siguiente y, unos días después, se intercambian el dinero y las acciones (<b>cierre</b>).</p>`],
  // Extras
  x1l1: ['Cómo se organiza un fondo de private equity', `<p>Una firma de PE no invierte sobre todo su propio dinero. Capta un fondo de grandes inversores como fondos de pensiones y aseguradoras, los <b>limited partners (LP)</b>, partícipes del fondo. La propia firma es el <b>general partner (GP)</b>, el gestor: elige las inversiones y las gestiona.</p><p>Un fondo suele durar unos 10 años: unos 5 para invertir y después tiempo para hacer crecer y vender las empresas.</p>`],
  x1l2: ['Cómo cobra la firma de PE', `<p>El esquema clásico es el “<b>2 y 20</b>”: el GP cobra una <b>comisión de gestión</b> anual de alrededor del 2% del fondo para pagar sueldos y gastos, y se queda con alrededor del 20% de los beneficios (el <b>carried interest</b>, o “carry”).</p><p>El carry normalmente solo se cobra cuando los LP han obtenido una rentabilidad mínima (el <b>hurdle</b>, a menudo un 8%), así que el GP gana si de verdad lo hace bien.</p>`],
  x1l3: ['Cómo hacen las firmas de PE que las empresas valgan más', `<p>La rentabilidad del PE sale de tres palancas: hacer crecer el beneficio (vender más, recortar costes, comprar add-ons), devolver deuda con la caja de la empresa y vender a un múltiplo más alto que el de compra.</p><p>Las buenas firmas de PE trabajan activamente con la dirección con un plan claro para los primeros 100 días y más allá, y ligan la retribución de la dirección a los resultados.</p>`],
  x2l1: ['Cuando una empresa está en apuros', `<p>Una empresa está en <b>dificultades</b> (distressed) cuando le cuesta pagar sus deudas: beneficios que caen, demasiada deuda, un gran préstamo que vence y no puede refinanciar.</p><p>Sus opciones van de arreglos amistosos con los prestamistas (alargar plazos, cambiar deuda por acciones) a un proceso judicial formal. Los banqueros de reestructuración ayudan a encontrar el camino menos dañino.</p>`],
  x2l2: ['El concurso, paso a paso', `<p>En EE. UU., el <b>Chapter 11</b> permite a una empresa seguir funcionando mientras reorganiza sus deudas bajo protección judicial. Los acreedores no pueden quedarse con activos mientras dura el proceso (la <b>suspensión automática</b>, automatic stay), y la empresa puede pedir dinero nuevo que cobra antes que la deuda antigua (la <b>financiación DIP</b>).</p><p>El objetivo es un plan que reduzca la deuda a un nivel que el negocio pueda soportar.</p>`],
  x2l3: ['Quién se lleva qué cuando no llega para todos', `<p>Cuando una empresa vale menos de lo que debe, el valor se reparte por orden de prelación: primero los prestamistas con garantía, después los acreedores sin garantía, y los accionistas normalmente no reciben nada. Es la <b>cascada</b> (waterfall).</p><p>La clase de deuda en la que “se acaba” el valor suele terminar siendo la dueña de la empresa: es el <b>fulcrum security</b> (el título pivote).</p>`],
  x3l1: ['Cómo gana dinero un banco', `<p>Un banco se financia barato (con los depositantes, a los que paga poco interés) y presta a tipos más altos (hipotecas, préstamos a empresas). La diferencia es su principal ingreso: el <b>margen de intereses</b>. También cobra <b>comisiones</b> (tarjetas, asesoramiento, trading).</p><p>Sus riesgos principales: que los prestatarios no devuelvan el dinero (<b>riesgo de crédito</b>) y que los depositantes quieran su dinero todos a la vez (<b>riesgo de liquidez</b>).</p>`],
  x3l2: ['Por qué los bancos están tan regulados', `<p>Los bancos son tan importantes que, si quiebran, sufre toda la economía. Por eso los reguladores les obligan a tener un colchón de dinero propio, el <b>capital</b>, para absorber pérdidas, medido como porcentaje de sus activos de riesgo (como el <b>ratio CET1</b>).</p><p>También deben tener suficientes activos líquidos para aguantar una avalancha de retiradas.</p>`],
  x3l3: ['Valorar bancos y aseguradoras es distinto', `<p>Para los bancos la deuda es la materia prima, no solo financiación, así que el EV y el EBITDA no tienen sentido. En su lugar los banqueros usan medidas de capital: <b>precio sobre valor en libros</b> y <b>PER</b>, y miran la <b>rentabilidad sobre fondos propios</b> (ROE).</p><p>Las aseguradoras cobran las primas por adelantado y pagan los siniestros después; las medidas clave son si ganan dinero con la suscripción (<b>ratio combinado</b>) y con la inversión de las primas.</p>`],
  x3l4: ['Bonos: prestar dinero a cambio de intereses', `<p>Un <b>bono</b> es un préstamo que se puede comprar y vender. Prestas, por ejemplo, 1.000 $, recibes un interés fijo (el <b>cupón</b>) cada año y te devuelven los 1.000 $ al vencimiento.</p><p>Si los tipos de interés del mercado suben, los bonos existentes con cupones más bajos se vuelven menos atractivos, así que su precio baja. <b>El precio y la rentabilidad de un bono se mueven en sentido contrario.</b></p>`]
};

// Glosario para principiantes: las palabras cotidianas que las lecciones técnicas dan por sabidas.
GLOSS.push(
  ['Ingresos (ventas)', 'Dinero cobrado a los clientes por productos o servicios. La primera línea de la cuenta de resultados (revenue, sales).'],
  ['COGS', 'Coste de los bienes vendidos: costes ligados directamente a fabricar el producto (materiales, mano de obra directa).'],
  ['Margen bruto', 'Ingresos menos COGS (gross profit). En %: margen bruto ÷ ingresos.'],
  ['SG&A', 'Gastos de venta, generales y de administración: alquiler, sueldos, marketing, sede central. Los principales gastos operativos.'],
  ['D&A', 'Depreciación y amortización: el cargo anual que reparte el coste de activos de larga duración (máquinas, software) a lo largo de su vida. No supone salida de caja.'],
  ['Depreciación', 'Repartir el coste de un activo físico (máquina, edificio) a lo largo de su vida útil. Cargo no monetario.'],
  ['Amortización', 'Repartir el coste de un activo intangible (patente, licencia, cartera de clientes adquirida) a lo largo de su vida. Cargo no monetario.'],
  ['EBIT', 'Beneficio antes de intereses e impuestos, también llamado resultado operativo. EBITDA menos D&A.'],
  ['EBT', 'Beneficio antes de impuestos. EBIT menos gastos por intereses.'],
  ['Beneficio neto', 'La última línea (net income): el beneficio después de todos los costes, intereses e impuestos. Pertenece a los accionistas.'],
  ['BPA', 'Beneficio por acción (EPS): beneficio neto ÷ acciones diluidas.'],
  ['Margen', 'Una línea de beneficio dividida entre los ingresos, por ejemplo margen EBITDA = EBITDA ÷ ingresos.'],
  ['Activos', 'Lo que tiene una empresa y vale algo: caja, cuentas por cobrar, existencias, equipos, intangibles.'],
  ['Pasivos', 'Lo que debe una empresa: facturas de proveedores, deuda, impuestos pendientes.'],
  ['Patrimonio neto', 'Activos menos pasivos (fondos propios): el valor contable que pertenece a los dueños.'],
  ['Cuentas por cobrar', 'Dinero que los clientes deben a la empresa por ventas ya hechas. Activo corriente.'],
  ['Cuentas por pagar', 'Dinero que la empresa debe a proveedores por mercancía ya recibida. Pasivo corriente.'],
  ['Existencias', 'Productos y materiales que se tienen antes de venderlos (inventario). Activo corriente.'],
  ['PP&E', 'Inmovilizado material (property, plant and equipment): activos físicos de largo plazo como edificios y máquinas.'],
  ['Beneficios retenidos', 'Todo el beneficio neto pasado que se quedó en la empresa en vez de repartirse como dividendo (retained earnings). Forma parte del patrimonio neto.'],
  ['Dividendo', 'Efectivo que una empresa paga a sus accionistas con cargo a sus beneficios.'],
  ['Capex', 'Inversión en inmovilizado (capital expenditures): caja gastada en comprar o mejorar activos de largo plazo como equipos.'],
  ['Flujo de caja libre', 'La caja que genera un negocio después de costes operativos, impuestos, circulante y capex (free cash flow). Lo que realmente está disponible para los inversores.'],
  ['Capital circulante', 'Dinero atrapado en la operativa diaria: cuentas por cobrar y existencias menos cuentas por pagar (working capital).'],
  ['Deuda', 'Dinero prestado que hay que devolver con intereses en una fecha fijada.'],
  ['Interés', 'El precio de pedir dinero prestado, que se paga periódicamente a los prestamistas.'],
  ['Apalancamiento', 'Usar deuda para financiar una empresa u operación (leverage). También el ratio deuda ÷ EBITDA.'],
  ['Estructura de capital', 'La combinación de deuda y capital que usa una empresa para financiarse.'],
  ['Prelación', 'El orden en que se pagan las deudas si una empresa quiebra (seniority). La deuda sénior cobra antes que la subordinada y que el capital.'],
  ['Colateral', 'Activos dados en garantía a un prestamista, que puede quedárselos si no se devuelve el préstamo.'],
  ['Vencimiento', 'La fecha en la que hay que devolver un préstamo o un bono (maturity).'],
  ['Cupón', 'El tipo de interés que paga un bono, como porcentaje de su valor nominal.'],
  ['Acciones', 'Unidades de propiedad de una empresa (shares, stock).'],
  ['Capitalización bursátil', 'Precio por acción × acciones en circulación (market cap). El valor del capital de una empresa cotizada.'],
  ['Dilución', 'La caída del porcentaje de propiedad (o del BPA) de los dueños actuales cuando se emiten acciones nuevas.'],
  ['Opciones sobre acciones', 'El derecho a comprar una acción a un precio fijo (strike). Están dentro del dinero cuando la acción cotiza por encima del strike.'],
  ['Múltiplo', 'Un valor dividido entre una cifra financiera, por ejemplo EV/EBITDA de 8x.'],
  ['PER', 'Precio ÷ beneficio por acción (P/E), o valor del capital ÷ beneficio neto.'],
  ['Valor actual', 'Lo que vale hoy una cantidad de dinero futura, después de descontarla (present value).'],
  ['Tasa de descuento', 'La rentabilidad exigida a una inversión de un riesgo dado, usada para convertir la caja futura en valor de hoy.'],
  ['Valor temporal del dinero', 'La idea de que el dinero de hoy vale más que la misma cantidad en el futuro, porque puede generar rentabilidad.'],
  ['Private equity', 'Firmas que captan fondos de inversores para comprar empresas (a menudo con deuda), mejorarlas y venderlas unos años después (capital riesgo).'],
  ['M&A', 'Fusiones y adquisiciones: comprar, vender y combinar empresas.'],
  ['OPV', 'Oferta pública inicial (IPO): una empresa privada vende acciones al público y empieza a cotizar en bolsa por primera vez.'],
  ['Due diligence', 'La revisión que hace un comprador, prestamista o colocador para comprobar una empresa antes de comprometerse.'],
  ['Prima de control', 'Lo que paga un comprador por encima del precio de mercado de la acción para hacerse con el control de una empresa.'],
  ['Compañías comparables', 'Valoración usando los múltiplos de cotización de empresas cotizadas similares (comps).'],
  ['Transacciones precedentes', 'Valoración usando los múltiplos pagados en adquisiciones pasadas de empresas similares.']
);

// ---------- Estado ----------
const KEY = 'dealbook-en-v1', DAY = 864e5, HEART_MS = 30 * 60e3, MAXH = 5;
const SRS_DAYS = [0, 1, 3, 7, 16, 35];
function def() { return { xp: 0, hearts: MAXH, hts: Date.now(), streak: 0, best: 0, last: null, goal: 50, log: {}, done: {}, srs: {}, ok: 0, ko: 0, inf: false, all: false, tab: 'path' }; }
let S = def();
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(def(), JSON.parse(r)); } catch (e) {}
const sig = () => { const { tab, ts, ...rest } = S; return JSON.stringify(rest); };
let lastSig = sig();
function save() {
  const g = sig(); if (g !== lastSig) { lastSig = g; S.ts = Date.now(); Cloud.push(); }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
// ---------- Sincronización con la cuenta ----------
// El progreso se guarda también en un documento privado del usuario (data/users/<id>/progress), así sigue entre dispositivos y no depende del almacenamiento del navegador.
const Cloud = {
  doc: null, state: 'local', busy: false, again: false, timer: 0,
  async init() {
    try {
      if (!window.claude || !claude.use) return;
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const uid = user && await user.id();
      if (!db || !uid) return;
      this.doc = db.doc('data/users/' + uid + '/progress');
      await this.pull();
      document.addEventListener('visibilitychange', () => { if (document.hidden) this.flush(); else this.pull(); });
    } catch (e) { this.state = 'local'; }
  },
  async pull() {
    if (!this.doc || SES) return;
    try {
      const snap = await this.doc.get();
      const r = snap.exists ? snap.data() : null;
      if (r && typeof r.s === 'string' && (r.ts || 0) > (S.ts || 0)) {
        const tab = S.tab; S = Object.assign(def(), JSON.parse(r.s)); S.tab = tab; lastSig = sig();
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        if (!SES) render();
      } else if (!r || (S.ts || 0) > (r.ts || 0)) { this.state = 'synced'; await this.write(); }
      this.state = 'synced'; if (S.tab === 'me' && !SES) render();
    } catch (e) { this.state = 'error'; }
  },
  push() { if (!this.doc) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.write(), 1500); },
  flush() { if (!this.doc) return; clearTimeout(this.timer); this.write(); },
  async write() {
    if (!this.doc) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try { const { tab, ...rest } = S; await this.doc.set({ s: JSON.stringify(rest), ts: S.ts || 0 }); this.state = 'synced'; }
    catch (e) { this.state = 'error'; }
    this.busy = false;
    if (this.again) { this.again = false; this.write(); }
  }
};
const dstr = d => { const z = new Date(d); return z.getFullYear() + '-' + String(z.getMonth() + 1).padStart(2, '0') + '-' + String(z.getDate()).padStart(2, '0'); };
const today = () => dstr(Date.now());
function regen() {
  if (S.hearts >= MAXH) { S.hts = Date.now(); return; }
  const n = Math.floor((Date.now() - S.hts) / HEART_MS);
  if (n > 0) { S.hearts = Math.min(MAXH, S.hearts + n); S.hts += n * HEART_MS; if (S.hearts >= MAXH) S.hts = Date.now(); save(); }
}
function streakNow() { return (S.last === today() || S.last === dstr(Date.now() - DAY)) ? S.streak : 0; }
function touchStreak() {
  const t = today(); if (S.last === t) return;
  S.streak = S.last === dstr(Date.now() - DAY) ? S.streak + 1 : 1; S.last = t; S.best = Math.max(S.best, S.streak);
}
function addXP(n) { S.xp += n; const t = today(); S.log[t] = (S.log[t] || 0) + n; }
function srsMark(id, ok) {
  const r = S.srs[id] || { b: 0, due: 0, w: 0, n: 0 };
  r.n++; if (ok) r.b = Math.min(r.b + 1, SRS_DAYS.length - 1); else { r.b = 0; r.w++; }
  r.due = Date.now() + (ok ? SRS_DAYS[r.b] * DAY : 0);
  S.srs[id] = r;
}
const dueCount = () => Object.keys(S.srs).filter(id => EXI[id] && S.srs[id].due <= Date.now()).length;
const unlocked = () => true; // sin bloqueos: cualquier lección está abierta

// ---------- Utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => n.toLocaleString('es-ES', { maximumFractionDigits: 3 });
const strip = s => s.replace(/<[^>]+>/g, '');
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function parseNums(s) {
  s = s.trim().replace(/[−–]/g, '-').replace(/[\s%x€$]|pb|bps?|m$/gi, '');
  if (!s) return [];
  const out = [];
  [s.replace(/\./g, '').replace(',', '.'), s.replace(/,/g, '')].forEach(v => { if (/^-?\d*\.?\d+$/.test(v)) out.push(parseFloat(v)); });
  return out;
}

  const curIdx = LESSONS.findIndex(l => unlocked(l) && !S.done[l.id]);
  const offs = [0, 52, 78, 52, 0, -52, -78, -52];
  UNITS.forEach((u, ui) => {
    const doneN = u.lessons.filter(l => S.done[l.id]).length;
