<style>
/* Layout: una columna tipo app móvil (máx. 560px), ruta de lecciones en zigzag, barra inferior fija, lección a pantalla completa */
:root {

  --blue: #2D6CD2; --blue-d: #1F4F9E; --blue-soft: #E1EBFB;
  --u1: #0E8A62; --u2: #2D6CD2; --u3: #7A4CC2; --u4: #C2572B; --u5: #0F7C8C; --u6: #B03A6E; --u7: #4B5BD4; --u8: #8E6A0E; --u9: #3D7040; --u10: #A04A1E; --u11: #56606B; --u12: #1D6A8E;

    --accent: #2AB585; --accent-d: #167A57; --accent-soft: #123528;
    --gold: #EBB23E; --gold-soft: #372B12; --red: #EE6A62; --red-d: #A63F3A; --red-soft: #3B1E1C;

}

  --bg: #0C1613; --surface: #13211D; --surface-2: #1A2B26; --ink: #E4EEEA; --muted: #91A59E; --line: #273A34;
  --accent: #2AB585; --accent-d: #167A57; --accent-soft: #123528;
  --gold: #EBB23E; --gold-soft: #372B12; --red: #EE6A62; --red-d: #A63F3A; --red-soft: #3B1E1C;

}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 2px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; padding-block: 10px; gap: 12px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: #fff; font-style: normal; font-size: 14px; box-shadow: 0 3px 0 var(--accent-d); }
.stats { display: flex; gap: 14px; }

.stat svg { width: 22px; height: 22px; }

.stat.xp { color: var(--blue); } .stat.heart { color: var(--red); }

.goal b { font-size: 14px; } .goal span { font-size: 13px; color: var(--muted); font-family: var(--f-mono); }
.bar { grid-column: 1 / -1; height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--gold); border-radius: 99px; transition: width .5s; }

/* Ruta */
.unit { margin-top: 22px; }
.uhead { background: var(--c); color: #fff; border-radius: 18px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 65%, #000); }

.path { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 26px 0 8px; }
.nodewrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.node { width: 72px; height: 66px; border-radius: 50%; border: 0; background: var(--c); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 62%, #000); transition: transform .08s, box-shadow .08s; }
.node:active { transform: translateY(5px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 62%, #000); }
.node svg { width: 30px; height: 30px; }
.node.locked { background: var(--surface-2); color: var(--muted); box-shadow: 0 6px 0 var(--line); }
.node.done { background: var(--gold); box-shadow: 0 6px 0 color-mix(in srgb, var(--gold) 62%, #000); }

.nlabel.on { color: var(--ink); }
.tip { position: absolute; top: -34px; background: var(--surface); border: 2px solid var(--line); color: var(--c); font-weight: 800; font-size: 12px; letter-spacing: .08em; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
.lvl { position: absolute; right: -8px; top: -4px; background: var(--surface); border: 2px solid var(--line); border-radius: 99px; font-size: 11px; font-weight: 800; font-family: var(--f-mono); padding: 0 6px; color: var(--gold); }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 800; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-d); transition: transform .06s, box-shadow .06s; width: 100%; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-d); }
.btn:disabled { background: var(--surface-2); color: var(--muted); box-shadow: 0 4px 0 var(--line); cursor: default; }
.btn.ghost { background: var(--surface); color: var(--blue); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn.red { background: var(--red); box-shadow: 0 4px 0 var(--red-d); }
.btn.blue { background: var(--blue); box-shadow: 0 4px 0 var(--blue-d); }
.btn.sm { padding: 10px 14px; font-size: 13px; width: auto; }
.row { display: flex; gap: 10px; flex-wrap: wrap; } .row > * { flex: 1 1 140px; }

/* Hoja inferior */
.scrim { position: fixed; inset: 0; background: rgba(5, 15, 12, .5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 88%; overflow: auto; border-radius: 22px 22px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { font-size: 22px; }
.sheet .meta { color: var(--muted); font-size: 14px; margin: 0; }

/* Navegación inferior */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding-block: 6px; }
.nav button { background: none; border: 2px solid transparent; border-radius: 12px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); position: relative; }
.nav button svg { width: 24px; height: 24px; }
.nav button.on { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.badge { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--red); color: #fff; font-size: 10px; font-weight: 800; border-radius: 99px; padding: 0 5px; font-family: var(--f-mono); }

/* Paneles genéricos */
.sec { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
.sec > h2 { font-size: 24px; font-weight: 800; }
.lead { color: var(--muted); margin: 0; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.tile b { font-family: var(--f-mono); font-size: 22px; }
.tile span { font-size: 13px; color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 130px; padding-top: 8px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; font-size: 11px; color: var(--muted); }
.week i { width: 100%; max-width: 30px; background: var(--blue); border-radius: 6px 6px 2px 2px; min-height: 3px; display: block; }
.week i.today { background: var(--gold); }
.week em { font-style: normal; font-family: var(--f-mono); font-size: 10px; color: var(--ink); }
.list { display: flex; flex-direction: column; gap: 8px; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.li small { color: var(--muted); font-size: 13px; grid-column: 1; }
.li > div { min-width: 0; }
.pill { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-family: var(--f-mono); }
.pill.r { background: var(--red-soft); color: var(--red); } .pill.g { background: var(--accent-soft); color: var(--accent); }
.seg { display: flex; gap: 6px; } .seg button { flex: 1; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 0; font-weight: 700; }
.seg button.on { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tog input { width: 46px; height: 26px; accent-color: var(--accent); }
textarea, input[type=text], input[type=search] { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; }
textarea { min-height: 90px; resize: vertical; }
details.note { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; }
details.note summary { padding: 12px 14px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.note summary::after { content: "+"; font-family: var(--f-mono); color: var(--muted); }
details.note[open] summary::after { content: "−"; }
details.note .nb { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.gl dt { font-weight: 800; } .gl dd { margin: 0 0 10px; color: var(--muted); }
.gl { margin: 0; }

/* Contenido teórico */
.th h3 { font-size: 22px; margin-bottom: 10px; }
.th p { margin: 0 0 10px; }
.th ul, .th ol { margin: 0 0 10px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.f { font-family: var(--f-mono); font-size: 14px; background: var(--surface-2); border: 2px dashed var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0 12px; overflow-x: auto; line-height: 1.5; display: block; }
span.f { display: block; }

/* Lección a pantalla completa */
.lesson { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.lhead { width: 100%; display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.lhead .x { background: none; border: 0; padding: 4px; color: var(--muted); display: grid; } .lhead .x svg { width: 26px; height: 26px; }
.lprog { flex: 1; height: 16px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.lprog > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
.lhead .thbtn { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px; font-size: 12px; font-weight: 800; color: var(--blue); }
.lbody { flex: 1; overflow-y: auto; padding-block: 8px 24px; }
.lbody .wrap { display: flex; flex-direction: column; gap: 16px; }
.kind { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); display: flex; align-items: center; gap: 8px; }
.kind.int { color: var(--u6); } .kind.th { color: var(--accent); }

.opt kbd { font-family: var(--f-mono); font-size: 12px; min-width: 24px; height: 24px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 7px; color: var(--muted); flex: none; }
.opt.sel { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 3px 0 var(--blue); color: var(--blue); }
.opt.sel kbd { border-color: var(--blue); color: var(--blue); }
.opt.good { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 3px 0 var(--accent); color: var(--accent); }
.opt.good kbd { border-color: var(--accent); color: var(--accent); }
.opt.bad { border-color: var(--red); background: var(--red-soft); box-shadow: 0 3px 0 var(--red); color: var(--red); }
.opt.bad kbd { border-color: var(--red); color: var(--red); }
.opt:disabled { cursor: default; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf .opt { justify-content: center; padding: 22px 10px; font-size: 17px; }
.sentence { font-family: var(--f-display); font-size: 22px; line-height: 1.6; }
.blank { display: inline-block; min-width: 110px; border-bottom: 3px solid var(--line); padding: 0 6px; color: var(--blue); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.answer:empty::before { content: "Toca los elementos en el orden correcto"; color: var(--muted); font-size: 14px; padding: 10px; }
.answer .chip { display: flex; gap: 10px; align-items: center; }
.answer .chip b { font-family: var(--f-mono); color: var(--muted); font-size: 13px; }
.bank { display: flex; flex-direction: column; gap: 8px; }
.numin { display: flex; align-items: center; gap: 10px; }

.numin span { font-family: var(--f-mono); font-size: 20px; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.match .opt { font-size: 14px; padding: 11px 12px; min-height: 64px; }

.lfoot { border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }

.lfoot.good { background: var(--accent-soft); border-color: transparent; }
.lfoot.bad { background: var(--red-soft); border-color: transparent; }
.fb { display: flex; flex-direction: column; gap: 4px; max-height: 34vh; overflow-y: auto; }
.fb h4 { margin: 0; font-family: var(--f-display); font-size: 20px; display: flex; align-items: center; gap: 8px; }
.lfoot.good .fb h4 { color: var(--accent); } .lfoot.bad .fb h4 { color: var(--red); }
.fb p { margin: 0; font-size: 15px; }
.fb .sol { font-weight: 700; }
.lfoot.bad .btn { background: var(--red); box-shadow: 0 4px 0 var(--red-d); }

.end { text-align: center; align-items: center; padding-top: 30px; }

<script>

const UNITS = [];

UNITS.push({
  id: 'f0', title: 'Foundations', sub: 'The accounting and industry basics every chapter of the book assumes', ch: 'Before Part One', col: 'var(--u1)',
  lessons: [
    {
      id: 'f0l1', title: 'The three financial statements',
      th: [
        { h: 'Three views of one company', b: `<ul><li><b>Income statement</b>: revenue, costs and profit over a <i>period</i> (a quarter, a year).</li>
<li><b>Balance sheet</b>: what the company owns and owes at a <i>point in time</i>. It always balances: <span class="f">Assets = Liabilities + Shareholders' equity</span></li>
<li><b>Cash flow statement</b>: actual cash in and out, split into operating, investing and financing activities.</li></ul>` },
        { h: 'How they link', b: `<p><b>Net income</b> from the income statement is the first line of cash flow from operations and flows into <b>retained earnings</b> on the balance sheet.</p>
<p>Non-cash items are then adjusted: <b>D&amp;A</b> is added back because it reduced profit without any cash leaving. Changes in working capital adjust it further.</p>
<p><b>Ending cash</b> on the cash flow statement becomes cash on the balance sheet. That closes the loop.</p>` },
        { h: 'Worked example: the classic question', b: `<p><i>"Depreciation goes up by $10 and the tax rate is 25%. Walk me through the three statements."</i></p>
<ul><li><b>IS:</b> EBIT −10, taxes −2.5, net income <b>−7.5</b>.</li>
<li><b>CFS:</b> net income −7.5, add back depreciation +10 → cash <b>+2.5</b>.</li>
<li><b>BS:</b> PP&amp;E −10, cash +2.5 → assets −7.5. Retained earnings −7.5 → equity −7.5. It balances.</li></ul>
<p>Cash goes up because depreciation is tax-deductible but not a cash payment: the <b>tax shield</b>.</p>` }
      ],
      ex: [
        { t: 'mc', q: 'Which statement shows a company’s position at a single point in time?', o: ['Balance sheet', 'Income statement', 'Cash flow statement', 'Proxy statement'], a: 0, e: 'The balance sheet is a snapshot. The income statement and cash flow statement cover a period.' },
        { t: 'fill', q: 'Assets = Liabilities + ___', o: ['Shareholders’ equity', 'Net income', 'Cash', 'Revenue'], a: 0, e: 'Everything the company owns is funded either by obligations (liabilities) or by the owners (equity).' },
        { t: 'match', q: 'Match each item to what it shows', p: [['Income statement', 'Profit over a period'], ['Balance sheet', 'Assets and liabilities at a date'], ['Cash flow statement', 'Actual movements of cash'], ['Retained earnings', 'Accumulated undistributed profits']] },
        { t: 'num', q: 'Depreciation rises by $10 and the tax rate is 25%. By how much does net income change?', a: -7.5, e: 'EBIT −10, taxes −2.5, so net income −7.5.' },
        { t: 'num', q: 'Same case: depreciation +$10, 25% tax rate. By how much does cash change?', a: 2.5, e: 'Net income −7.5, add back the non-cash depreciation +10 = +2.5.' },
        { t: 'tf', q: 'Capital expenditures appear in cash flow from investing activities.', a: true, e: 'Operating = day-to-day business; investing = capex and acquisitions; financing = debt, dividends, buybacks.' },
        { t: 'ord', q: 'Put the income statement in order, top to bottom', o: ['Sales', 'Cost of goods sold', 'Gross profit', 'SG&A', 'EBIT', 'Interest expense', 'Taxes', 'Net income'], e: 'From the "top line" to the "bottom line".' },
        { t: 'int', q: 'Interview: "A company buys a $100 machine with cash. What happens on the three statements at the moment of purchase?"', m: '<b>IS:</b> nothing yet; the machine will be depreciated over time. <b>CFS:</b> capex of −$100 in investing, cash −$100. <b>BS:</b> cash −$100, PP&amp;E +$100. Total assets are unchanged and the balance sheet balances.' },
        { t: 'int', q: 'Interview: "If you could only look at one statement to value a company, which would you pick?"', m: 'The <b>cash flow statement</b>, because value comes from cash the business generates and cash is harder to manipulate than earnings. If I got a second, I would add the balance sheet to see debt and cash.' }
      ]
    },
    {
      id: 'f0l2', title: 'From sales to EBITDA',
      th: [
        { h: 'Profit metrics', b: `<ul><li><b>Gross profit</b> = Sales − COGS</li><li><b>EBITDA</b> = Gross profit − SG&amp;A (and other operating expenses), before D&amp;A</li><li><b>EBIT</b> = EBITDA − D&amp;A (operating income)</li><li><b>EBT</b> = EBIT − Interest expense</li><li><b>Net income</b> = EBT − Taxes</li></ul>
<p>Each <b>margin</b> is the metric divided by sales.</p>` },
        { h: 'Why bankers love EBITDA', b: `<p>EBITDA is independent of <b>capital structure</b> (before interest), <b>taxes</b> and <b>D&amp;A policies</b>, so it is the best starting point for comparing companies. It drives EV/EBITDA and leverage ratios like Debt/EBITDA.</p>
<p>Caveat: it is <b>not cash flow</b>. It ignores capex and working capital, and it is a <i>non-GAAP</i> metric.</p>` },
        { h: 'Normalizing', b: `<p>Valuation needs <b>recurring</b> earnings. Strip out non-recurring items:</p>
<ul><li>Restructuring charges, litigation, impairments: <b>add back</b>.</li><li>Gains on asset sales: <b>subtract</b>.</li></ul>
<p>Worked example: sales $1,000, COGS $600, SG&amp;A $150, D&amp;A $50 (separate line) → gross profit $400 (40%), EBITDA $250 (25%), EBIT $200 (20%).</p>` }
      ],
      ex: [
        { t: 'num', q: 'Sales $1,000, COGS $600, SG&A $150, D&A $50 (separate line). EBITDA?', a: 250, e: 'Gross profit 400 − SG&A 150 = 250. D&A is subtracted afterwards to get EBIT of 200.' },
        { t: 'num', q: 'EBITDA $250 on sales of $1,000. EBITDA margin (%)?', a: 25, u: '%', e: '250 / 1,000 = 25%.' },
        { t: 'mc', q: 'Why is EBITDA useful for comparing companies?', o: ['It is independent of capital structure, taxes and D&A policy', 'It equals free cash flow', 'It is an official GAAP metric', 'It includes capex'], a: 0, e: 'It isolates operating profitability. It is not cash: no capex or working capital.' },
        { t: 'tf', q: 'EBITDA is an official GAAP / IFRS measure.', a: false, e: 'It is non-GAAP, which is why bankers recalculate and adjust it themselves.' },
        { t: 'num', q: 'Reported EBITDA $90 includes a one-time $15 restructuring charge and a $5 gain on selling a warehouse. Adjusted EBITDA?', a: 100, e: '90 + 15 − 5 = 100.' },
        { t: 'num', q: 'Net income $120 and 40 million fully diluted shares. Diluted EPS?', a: 3, e: '120 / 40 = $3.00.' },
        { t: 'int', q: 'Interview: "Why can EBITDA be misleading?"', m: 'Because it is <b>not cash</b>. It ignores <b>capex</b> (huge for asset-heavy businesses), <b>working capital</b>, <b>interest</b> and <b>taxes</b>, which are all real payments. It is non-GAAP, so companies can "adjust" it generously. For capital-intensive businesses I would look at EBITDA − capex or free cash flow.' }
      ]
    },
    {
      id: 'f0l3', title: 'Working capital and capex',
      th: [
        { h: 'Net working capital', b: `<div class="f">NWC = (Receivables + Inventory + Prepaid expenses) − (Payables + Accrued liabilities + Other current liabilities)</div>
<p>It excludes cash and debt. It is cash tied up in the operating cycle. <b>An increase in NWC is a use of cash</b>; a decrease is a source.</p>` },
        { h: 'Days ratios', b: `<ul><li><b>DSO</b> = Receivables / Sales × 365</li><li><b>DIO</b> = Inventory / COGS × 365</li><li><b>DPO</b> = Payables / COGS × 365</li></ul>
<p>Projection models drive working capital with these ratios or as % of sales. A supermarket collects in cash and pays suppliers in 60 days: negative NWC, so growth <i>generates</i> cash.</p>` },
        { h: 'Capex', b: `<p><b>Maintenance capex</b> keeps the asset base running (often close to D&amp;A). <b>Growth capex</b> adds capacity. LBO sponsors prefer businesses with low maintenance capex because more cash is left to repay debt.</p>` }
      ],
      ex: [
        { t: 'mc', q: 'Accounts receivable increase by $20. Effect on cash?', o: ['Cash decreases by $20', 'Cash increases by $20', 'No effect', 'Only net income changes'], a: 0, e: 'You booked the sale but have not collected the cash.' },
        { t: 'num', q: 'NWC goes from $100 to $130. Impact on cash?', a: -30, e: 'A $30 increase in NWC uses $30 of cash.' },
        { t: 'num', q: 'Receivables $50, annual sales $365. DSO (days)?', a: 50, e: '50 / 365 × 365 = 50 days.' },
        { t: 'tf', q: 'An increase in accounts payable is a source of cash.', a: true, e: 'You pay suppliers later, keeping the cash longer.' },
        { t: 'mc', q: 'Which business typically has negative working capital?', o: ['A supermarket paid in cash that pays suppliers in 60 days', 'An aircraft maker with large inventories', 'A builder paid at project completion', 'A distributor offering 90-day terms'], a: 0, e: 'Suppliers finance its operating cycle.' },
        { t: 'int', q: 'Interview: "How can a profitable company go bankrupt?"', m: 'Through <b>illiquidity</b>. Profit is not cash: a fast-growing company can tie up more and more cash in receivables and inventory, plus heavy capex. With debt maturities coming due, it can run out of cash even with a positive income statement.' }
      ]
    },
    {
      id: 'f0l4', title: 'Inside an investment bank',
      th: [
        { h: 'Divisions', b: `<ul><li><b>Investment Banking Division (IBD)</b>: advises companies on <b>M&amp;A</b> and capital raising. Split into <b>coverage</b> groups (by industry: TMT, healthcare, industrials, FIG…) and <b>product</b> groups (M&amp;A, ECM, DCM, Leveraged Finance, Restructuring).</li>
<li><b>Sales &amp; Trading</b>, <b>Research</b>, <b>Asset / Wealth Management</b>.</li></ul>
<p>The <b>information wall</b> separates the private side (IBD) from the public side (S&amp;T, research).</p>` },
        { h: 'Hierarchy and the work', b: `<p><b>Analyst → Associate → Vice President → Director / ED → Managing Director</b>.</p>
<p>Analysts and associates build models, <b>pitch books</b> and deal materials. VPs run execution. MDs originate business and own client relationships.</p>
<p><b>Underwriting</b>: the bank buys a securities issue and resells it, taking the risk of not placing it, in exchange for a <b>gross spread</b>.</p>` }
      ],
      ex: [

        { t: 'match', q: 'Match each group to its role', p: [['ECM', 'Equity offerings (IPOs, follow-ons)'], ['DCM', 'Investment grade bond issues'], ['Leveraged Finance', 'LBO loans and high yield'], ['Sales & Trading', 'Trading securities for clients']] },
        { t: 'tf', q: 'The information wall separates people with material non-public information from those trading in the market.', a: true, e: 'It prevents insider trading.' },
        { t: 'mc', q: 'Coverage group vs product group:', o: ['Coverage is organized by industry/client, product by type of transaction', 'They are the same', 'Coverage only trades', 'Product only does research'], a: 0, e: 'Deals usually combine both, e.g. TMT coverage with M&A.' },
        { t: 'int', q: 'Interview: "Why investment banking?"', m: 'In about a minute: the <b>steep learning curve</b>, exposure to <b>live transactions</b> and senior management, the <b>analytical</b> and team-based work, and the foundation it gives for a career in finance. Tie it to your story with a concrete example, and avoid talking about money.' }

<p><b>Screen for comparables</b>: the target's own 10-K and proxy (competitors and compensation peer group), equity research, comps from prior deals in the sector, screening tools (Capital IQ, Bloomberg, FactSet) using industry codes (SIC/NAICS), and senior bankers' judgment. Often you build a core group and a broader group.</p>` }

        { h: 'SEC filings', b: `<ul><li><b>10-K</b>: annual report with audited financials, MD&amp;A, business description, risk factors.</li><li><b>10-Q</b>: quarterly report (unaudited) for the first three quarters.</li><li><b>8-K</b>: current report for material events (earnings releases, M&amp;A, financings, management changes).</li><li><b>Proxy statement</b> (DEF14A): annual meeting materials: executive compensation, board, voting items, and the peer group.</li></ul>

        { t: 'num', q: 'FY2023 sales $1,000; 9M 2024 sales $800; 9M 2023 sales $700. LTM sales?', a: 1100, e: '1,000 + 800 − 700 = 1,100.' },
        { t: 'num', q: 'Fiscal year ends June 30. FY2024 EBITDA $100, FY2025 EBITDA $120. Calendar 2024 EBITDA?', a: 110, e: 'Half of each fiscal year: 50 + 60 = 110.' },
        { t: 'num', q: 'Fiscal year ends March 31. FY2025 (Apr-24 to Mar-25) EBITDA $200, FY2026 $240. Calendar 2025 EBITDA?', a: 230, e: 'CY2025 = 3/12 × 200 + 9/12 × 240 = 50 + 180 = 230.' },
        { t: 'num', q: 'A one-time $20 restructuring charge with a 25% tax rate. Increase in adjusted net income?', a: 15, e: '20 × (1 − 25%) = 15.' },
        { t: 'mc', q: 'A $30 gain on the sale of a division sits in EBIT. When normalizing you:', o: ['Subtract it', 'Add it', 'Leave it', 'Double it'], a: 0, e: 'It is a non-recurring gain that inflates earnings.' },
        { t: 'tf', q: 'If a comparable completed a large acquisition after its last 10-Q, you should adjust its financials pro forma.', a: true, e: 'Otherwise its EV (which reflects the deal) would be divided by metrics that do not include the acquired business.' },
        { t: 'int', q: 'Interview: "Why use LTM rather than the last fiscal year?"', m: 'LTM is the <b>most recent</b> twelve months available, capturing the latest reported quarters. In October, the last fiscal year may be almost ten months old. LTM better reflects current performance, especially for companies that are growing or changing quickly.' }
      ]
    },
    {
      id: 'c1l6', title: 'Calculating key trading multiples',
      th: [
        { h: 'Equity value multiples', b: `<div class="f">P/E = Share price / Diluted EPS = Equity value / Net income</div>
<p>P/E is the most widely used equity multiple, typically on forward EPS (current year and next year). It is affected by capital structure and taxes.</p>` },
        { h: 'Enterprise value multiples', b: `<ul><li><b>EV/EBITDA</b>: the most common; independent of capital structure, taxes and D&amp;A.</li><li><b>EV/EBIT</b>: useful when D&amp;A is significant and differs across peers.</li><li><b>EV/Sales</b>: for companies with little or negative earnings.</li></ul>
<p>Rule: match numerator and denominator. EV pairs with pre-interest metrics; equity value pairs with post-interest metrics.</p>` },
        { h: 'Sector-specific multiples', b: `<ul><li>EV/EBITDAR (retail, airlines: adds back rent)</li><li>EV/Subscribers, EV/Users (telecom, media)</li><li>P/FFO and P/AFFO (REITs)</li><li>P/BV and P/TBV (banks, insurers)</li><li>EV/Reserves, EV/Production (natural resources)</li><li>EV/Capacity (e.g. per MW or per bed)</li></ul>
<p><b>PEG</b> = P/E ÷ expected EPS growth rate. It adjusts P/E for growth.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Share price $30, diluted EPS $2. P/E (x)?', a: 15, u: 'x', e: '30 / 2 = 15.0x.' },
        { t: 'num', q: 'EV $1,300, EBITDA $130. EV/EBITDA (x)?', a: 10, u: 'x', e: '1,300 / 130 = 10.0x.' },
        { t: 'mc', q: 'Which multiple is internally consistent?', o: ['EV / EBIT', 'EV / Net income', 'Equity value / EBITDA', 'Share price / Sales'], a: 0, e: 'EBIT is pre-interest, so it pairs with EV.' },
        { t: 'match', q: 'Match each sector to its characteristic multiple', p: [['Banks', 'P / Tangible book value'], ['REITs', 'P / FFO'], ['Early-stage software', 'EV / Sales'], ['Airlines and retail', 'EV / EBITDAR']] },
        { t: 'num', q: 'P/E of 20x and expected EPS growth of 16%. PEG ratio (x)?', a: 1.25, tol: 0.01, u: 'x', e: '20 / 16 = 1.25x.' },
        { t: 'tf', q: 'For a growing company, the forward EV/EBITDA multiple is usually lower than the LTM multiple.', a: true, e: 'Same EV divided by a larger future EBITDA.' },
        { t: 'int', q: 'Interview: "When would you use EV/EBIT instead of EV/EBITDA?"', m: 'When <b>D&amp;A is a real economic cost</b> that differs across peers: capital-intensive businesses where capex roughly equals D&amp;A, or when comparing companies with very different asset intensity (e.g. owning vs leasing assets). EV/EBIT captures the cost of maintaining the asset base that EBITDA ignores.' }
      ]
    },
    {
      id: 'c1l7', title: 'Steps IV and V: benchmark and value',
      th: [
        { h: 'Step IV: benchmark', b: `<p>Lay out the comps’ <b>financial statistics and ratios</b> (size, margins, growth, returns, credit) next to the target to see who is truly closest. Then benchmark the <b>trading multiples</b> with mean, median, high and low.</p>
<p>Often you tier the group and identify the 2-3 <b>closest comparables</b>, which anchor the range. Outliers are examined and possibly excluded.</p>` },
        { h: 'Step V: determine valuation', b: `<p>Apply a selected multiple range to the target’s metric.</p>
<p><b>EV/EBITDA</b>: range 7.0x-9.0x, EBITDA $50 → EV $350-450. Less net debt $100 → equity $250-350. ÷ 30M shares → <b>$8.33-$11.67 per share</b>.</p>
<p><b>P/E</b>: 15x × EPS $2 → <b>$30 per share</b> directly.</p>
<p>The ranges are shown on a "football field" with other methods.</p>` },
        { h: 'Key pros and cons', b: `<p><b>Pros</b>: market-based; relativity (easy to explain); quick and convenient; current.</p>
<p><b>Cons</b>: market-based (bubbles and panics flow straight through); absence of relevant comparables; potential disconnect from cash flow; company-specific issues not captured.</p>` }
      ],
      ex: [
        { t: 'num', q: 'EV/EBITDA range 7x-9x and EBITDA $50. EV at the midpoint?', a: 400, e: '8x × 50 = 400.' },
        { t: 'num', q: 'Implied EV $400, net debt $100, 30M shares. Implied share price?', a: 10, e: '(400 − 100) / 30 = 10.' },
        { t: 'num', q: 'P/E range midpoint 15x and target EPS $2. Implied share price?', a: 30, e: '15 × 2 = 30.' },
        { t: 'mc', q: 'Why look at the median as well as the mean?', o: ['It reduces the effect of outliers', 'It is always higher', 'The SEC requires it', 'It includes a control premium'], a: 0, e: 'One comp at 25x in a group at 8x distorts the mean much more than the median.' },
        { t: 'mc', q: 'The target grows faster and has higher margins than its peers. Where do you place it?', o: ['Toward the high end of the range', 'Toward the low end', 'Exactly at the mean', 'Below the range'], a: 0, e: 'Superior growth and profitability justify a higher multiple.' },
        { t: 'match', q: 'Classify each point', p: [['Current', 'Pro: reflects the latest market conditions'], ['Relativity', 'Pro: easy to explain to a board'], ['Market-based', 'Con: bubbles and panics flow into value'], ['Absence of comparables', 'Con: few true peers in niche sectors']] },
        { t: 'int', q: 'Interview: "Two identical companies trade at 8x and 12x EV/EBITDA. Why?"', m: 'Differences in <b>expected growth</b> (the main one), <b>returns on capital</b>, <b>risk</b> (cyclicality, customer concentration, leverage), <b>capex intensity</b>, management quality, share <b>liquidity</b> or M&amp;A speculation. If they truly were identical, it would be an arbitrage opportunity.' }
      ]
    },
    {
      id: 'c1l8', title: 'Illustrative comps for ValueCo',
      th: [
        { h: 'The case', b: `<p>You are valuing <b>ValueCo</b>, a private company (the book’s running example). LTM EBITDA $700M, projected EPS not relevant since private.</p>
<p>Comps (illustrative): six peers with EV/LTM EBITDA of 6.8x, 7.2x, 7.5x, 8.0x, 8.3x and 9.6x.</p>
<ul><li>Mean = 7.9x; median = 7.75x</li><li>Closest peers trade around 7.0x-8.0x → selected range <b>7.0x-8.0x</b></li></ul>
<p>Implied EV = 7.0 × 700 to 8.0 × 700 = <b>$4,900M-$5,600M</b>.</p>` },
        { h: 'From EV to equity', b: `<p>With net debt of $1,500M: implied equity value $3,400M-$4,100M.</p>
<p>For a public target you would divide by fully diluted shares, recomputed at each implied price because the TSM depends on price.</p>
<p>Notice how much the range moves with the multiple: each 0.5x turn of EBITDA is $350M of EV, or roughly 10% of equity value.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Six comps at 6.8x, 7.2x, 7.5x, 8.0x, 8.3x and 9.6x EV/EBITDA. Mean (x, 1 decimal)?', a: 7.9, tol: 0.05, u: 'x', e: 'Sum 47.4 / 6 = 7.9x.' },
        { t: 'num', q: 'Same six comps (6.8, 7.2, 7.5, 8.0, 8.3, 9.6). Median (x, 2 decimals)?', a: 7.75, tol: 0.01, u: 'x', e: 'Average of the middle two: (7.5 + 8.0) / 2 = 7.75x.' },
        { t: 'num', q: 'ValueCo LTM EBITDA $700M at 8.0x. Implied EV ($M)?', a: 5600, e: '8.0 × 700 = 5,600.' },
        { t: 'num', q: 'Implied EV $4,900M, net debt $1,500M. Implied equity value ($M)?', a: 3400, e: '4,900 − 1,500 = 3,400.' },
        { t: 'num', q: 'ValueCo EBITDA $700M. How much EV does each 0.5x turn of multiple represent ($M)?', a: 350, e: '0.5 × 700 = 350.' },
        { t: 'tf', q: 'For a public target, fully diluted shares should be recalculated at each implied share price.', a: true, e: 'The TSM depends on the share price, so dilution changes with the price.' },
        { t: 'int', q: 'Interview: "Walk me through a comps analysis."', m: '<b>1)</b> Study the target and select peers with similar business and financial profiles. <b>2)</b> Gather filings, research estimates and market data. <b>3)</b> Spread size, margins, growth, returns, credit stats and calculate equity value, EV and multiples (EV/EBITDA, EV/Sales, P/E), adjusting for non-recurring items and calendarizing. <b>4)</b> Benchmark the peers to find the closest ones. <b>5)</b> Select a multiple range, apply it to the target’s metrics and bridge from EV to equity value and price per share.' }
      ]
    }
  ]
});
UNITS.push({
  id: 'c2', title: 'Precedent Transactions Analysis', sub: 'Valuing a company from the multiples paid for similar companies', ch: 'Chapter 2', col: 'var(--u3)',
  lessons: [
    {
      id: 'c2l1', title: 'Steps and Step I: selecting deals',
      th: [
        { h: 'The idea', b: `<p>Precedent transactions analysis ("transaction comps") values a target using the <b>multiples paid for comparable companies in prior M&amp;A deals</b>. Same five steps as comps, applied to transactions:</p>
<ol><li>Select the universe of comparable acquisitions</li><li>Locate the necessary deal-related and financial information</li><li>Spread key statistics, ratios and transaction multiples</li><li>Benchmark the comparable acquisitions</li><li>Determine valuation</li></ol>
<p>Multiples are usually <b>higher</b> than trading comps because they include a <b>control premium</b> and often part of expected <b>synergies</b>.</p>` },
        { h: 'Screening for comparable acquisitions', b: `<p>Start from the comps universe: deals involving those companies or similar targets. Search M&amp;A databases (Dealogic, Capital IQ, Mergermarket, Bloomberg), merger proxies of prior deals (which list the precedents their advisors used), and the bank’s internal deal records. <b>Recency</b> matters: deals from the last 3-5 years are usually most relevant.</p>` },
        { h: 'Examine other considerations', b: `<p><b>Market conditions</b>: credit availability, equity markets and the economic cycle at signing. Deals done in 2007 or 2021 with cheap, abundant financing set high multiples.</p>
<p><b>Deal dynamics</b>:</p><ul><li>Buyer type: <b>strategic</b> (synergies, often pays more) vs <b>financial sponsor</b> (returns-driven, depends on leverage)</li><li>Form of consideration: cash vs stock</li><li>Process: auction vs negotiated, competitive tension, hostile vs friendly</li><li>Motivations: distressed seller, must-win asset, regulatory constraints</li></ul>` }
      ],
      ex: [
        { t: 'ord', q: 'Order the steps of precedent transactions analysis', o: ['Select the universe of comparable acquisitions', 'Locate the necessary deal-related and financial information', 'Spread key statistics, ratios and transaction multiples', 'Benchmark the comparable acquisitions', 'Determine valuation'], e: 'Same structure as comps, applied to deals.' },
        { t: 'tf', q: 'Precedent transaction multiples are usually higher than trading comps multiples.', a: true, e: 'They include a control premium and often synergies.' },
        { t: 'mc', q: 'Why can a strategic buyer typically pay more than a sponsor?', o: ['It can realize synergies', 'It never uses debt', 'It skips due diligence', 'It is legally required to'], a: 0, e: 'Cost and revenue synergies raise the value to the strategic buyer.' },
        { t: 'mc', q: 'Deals signed during periods of cheap, abundant credit tend to show:', o: ['Higher multiples', 'Lower multiples', 'No difference', 'Lower premiums only'], a: 0, e: 'Sponsors can lever more and still hit returns, and strategics are emboldened.' },
        { t: 'match', q: 'Match each deal dynamic to its typical effect', p: [['Competitive auction', 'Pushes the price up'], ['Distressed seller', 'Pushes the price down'], ['Large synergies', 'Supports a higher premium'], ['Tight credit markets', 'Limits sponsor bids']] },
        { t: 'int', q: 'Interview: "Why might a precedent from 2021 be misleading today?"', m: 'Because <b>market conditions</b> were very different: near-zero rates, abundant credit and high equity valuations pushed multiples up. Financing costs, the economic outlook and sector dynamics may have changed. I would weight recent deals more and explain any older outliers.' }
      ]
    },
    {
      id: 'c2l2', title: 'Step II: deal information and SEC filings',
      th: [
        { h: 'Public targets', b: `<ul><li><b>Merger proxy</b> (DEFM14A): sent to target shareholders to vote on a merger. Includes the "<b>background of the merger</b>", the board’s reasons, a summary of the <b>fairness opinion</b> analyses, and the merger agreement.</li><li><b>Registration statement / prospectus</b> (S-4): when the buyer issues shares as consideration.</li><li><b>Schedule TO</b>: filed by the buyer in a <b>tender offer</b>.</li><li><b>Schedule 14D-9</b>: the target board’s recommendation on a tender offer.</li><li><b>Schedule 13E-3</b>: going-private transactions with affiliates (e.g. management buyouts).</li><li><b>8-K</b>: announcement of the deal and the definitive agreement.</li><li><b>10-K / 10-Q</b> for the target’s financials at announcement.</li></ul>` },
        { h: 'Private targets', b: `<p>No filing obligation, so information is limited: press releases, news runs, M&amp;A databases, the buyer’s filings if the deal is material to it. Often the price is <b>not disclosed</b>, or the multiple is a rumored figure.</p>` }
      ],
      ex: [
        { t: 'match', q: 'Match each filing to its purpose', p: [['Schedule TO', 'Buyer’s tender offer document'], ['Schedule 14D-9', 'Target board recommendation'], ['DEFM14A', 'Merger proxy for shareholder vote'], ['S-4', 'Registration of shares issued as consideration']] },
        { t: 'mc', q: 'Which section of a merger proxy tells the story of the negotiations?', o: ['Background of the merger', 'Risk factors', 'Executive compensation', 'Legal proceedings'], a: 0, e: 'It describes how the deal came about, other bidders and how the price was reached.' },
        { t: 'mc', q: 'A management buyout of a public company requires which additional filing?', o: ['Schedule 13E-3', 'Form 10-Q', 'Schedule 14A only', 'Form S-1'], a: 0, e: 'Going-private deals with affiliates need extra disclosure due to conflicts of interest.' },
        { t: 'tf', q: 'For private targets, the purchase price is often not publicly disclosed.', a: true, e: 'That is a key limitation of precedents involving private companies.' },
        { t: 'mc', q: 'A buyer pays the target’s shareholders in its own stock. Which document registers those shares?', o: ['S-4', 'Schedule TO', '13E-3', '8-K only'], a: 0, e: 'Issuing securities in a merger requires a registration statement, often combined with the proxy.' },
        { t: 'int', q: 'Interview: "Where would you look to understand how a public company deal was negotiated?"', m: 'The <b>merger proxy</b> (or the 14D-9 in a tender offer), specifically the "<b>background of the merger</b>" section: who approached whom, other bidders, price revisions and the timeline. The fairness opinion summary shows the valuation analyses the advisors ran. The 8-K and merger agreement give the key terms.' }

    {
      id: 'c2l3', title: 'Step III: purchase consideration and offer value',
      th: [
        { h: 'Form of consideration', b: `<p><b>Cash</b>, <b>stock</b> of the acquirer, or a <b>mix</b>. Cash gives the seller certainty; stock lets the seller share in upside and synergies (and may be tax-deferred) but bear the acquirer’s share price risk.</p>

<p><b>Floating exchange ratio</b>: fixed value per share; number of shares adjusts. <b>Collars</b> limit the range over which the ratio floats.</p>` },
        { h: 'Offer value and enterprise value', b: `<div class="f">Implied equity value (offer value) = Offer price per share × Target fully diluted shares</div>

<p>Example: offer $26 × 40M shares = $1,040M offer value; + net debt $260M = <b>EV $1,300M</b>.</p>` }
      ],

        { t: 'tf', q: 'Under a floating exchange ratio, value per share is fixed and the number of shares adjusts.', a: true, e: 'It protects the seller; the acquirer bears dilution risk if its stock falls.' },
        { t: 'num', q: 'Offer $26 per share, 40M fully diluted shares, net debt $260M. Implied EV ($M)?', a: 1300, e: '26 × 40 = 1,040 + 260 = 1,300.' },
        { t: 'mc', q: 'What is a collar in a stock deal?', o: ['A range that limits how the exchange ratio or value can move', 'A break-up fee', 'A type of bond', 'A no-shop clause'], a: 0, e: 'It shares share-price risk between buyer and seller within bounds.' },
        { t: 'int', q: 'Interview: "Would a seller prefer cash or stock?"', m: 'It depends. <b>Cash</b> gives certainty and immediate liquidity. <b>Stock</b> lets the seller share in synergies and the acquirer’s upside and can be tax-deferred, but exposes it to the acquirer’s share price. Confidence in the combined company, tax position and desire for liquidity drive the choice.' }
      ]
    },
    {
      id: 'c2l4', title: 'Step III: transaction multiples and premiums',
      th: [
        { h: 'Transaction multiples', b: `<ul><li><b>Equity value multiples</b>: offer value / LTM net income, i.e. offer price / LTM diluted EPS.</li><li><b>EV multiples</b>: EV / LTM EBITDA (the most important), EV / LTM sales, EV / LTM EBIT.</li></ul>

        { h: 'Premiums paid', b: `<div class="f">Premium = Offer price / Unaffected share price − 1</div>

        { t: 'num', q: 'Offer price $26, LTM diluted EPS $1.30. Offer price / LTM EPS (x)?', a: 20, u: 'x', e: '26 / 1.30 = 20.0x.' },

        { t: 'mc', q: 'Why measure the premium against the unaffected price?', o: ['To strip out the run-up from rumors and speculation', 'Because it is always the lowest price', 'Because closing prices are unavailable', 'Regulatory requirement'], a: 0, e: 'Leaks inflate the price before announcement.' },

        { t: 'int', q: 'Interview: "Why do precedents usually give higher values than comps?"', m: 'Because they price the purchase of the <b>whole company</b>: they include a <b>control premium</b> (typically 25-40%) and often part of the expected <b>synergies</b>. Comps reflect minority trading prices. The exception is when the precedents come from a depressed market.' }
      ]

        { t: 'mc', q: 'Which is a con specific to precedent transactions?', o: ['Time lag: deals may reflect old market conditions', 'They ignore control', 'They require 10-year projections', 'They only work for banks'], a: 0, e: 'Also: limited information and acquirer-specific motivations.' },
        { t: 'tf', q: 'A buyer’s unique synergies can make a precedent multiple less relevant for another buyer.', a: true, e: 'This is the "acquirer’s basis for valuation" con.' },
        { t: 'mc', q: 'In a football field, the precedents bar for a typical target usually sits:', o: ['Above the comps bar', 'Below the LBO bar', 'Exactly on the current price', 'It is never shown'], a: 0, e: 'Control premium and synergies push it higher.' },
        { t: 'int', q: 'Interview: "Rank DCF, comps, precedents and LBO from highest to lowest valuation."', m: 'There is no fixed rule, but typically <b>precedents</b> are highest (control premium and synergies), the <b>DCF</b> varies widely with assumptions and is often high, <b>comps</b> sit in the middle, and the <b>LBO</b> is lowest because it shows what a sponsor can pay to hit its target return: effectively a floor. I would always caveat it with market conditions.' }

    {
      id: 'c3l1', title: 'Steps and Step I: study the target and its drivers',
      th: [
        { h: 'The idea', b: `<p>A DCF values a company as the <b>present value of its projected free cash flow</b>. It is <b>intrinsic</b>: it does not depend on how the market prices peers today.</p>

        { h: 'Key performance drivers', b: `<p>Understand the business model, competitive position, customers, suppliers and sector trends. Then identify the <b>value drivers</b>:</p>
