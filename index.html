<!doctype html><html lang="es"><head><meta charset="utf-8">

<meta name="theme-color" content="#0E8A62"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Dealbook">

<title>Dealbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: una columna tipo app móvil (máx. 560px), ruta de lecciones en zigzag, barra inferior fija, lección a pantalla completa */
:root {
  --bg: #F3F6F4; --surface: #FFFFFF; --surface-2: #E8EEEB; --ink: #11231E; --muted: #5B6D67; --line: #D3DDD8;
  --accent: #0E8A62; --accent-d: #0A6448; --accent-soft: #DCF1E8;
  --gold: #B87D0C; --gold-soft: #FBEFD5; --red: #CF423C; --red-d: #9E302C; --red-soft: #FBE3E1;
  --blue: #2D6CD2; --blue-d: #1F4F9E; --blue-soft: #E1EBFB;
  --u1: #0E8A62; --u2: #2D6CD2; --u3: #7A4CC2; --u4: #C2572B; --u5: #0F7C8C; --u6: #B03A6E; --u7: #4B5BD4; --u8: #8E6A0E; --u9: #3D7040; --u10: #A04A1E; --u11: #56606B; --u12: #1D6A8E;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1613; --surface: #13211D; --surface-2: #1A2B26; --ink: #E4EEEA; --muted: #91A59E; --line: #273A34;
    --accent: #2AB585; --accent-d: #167A57; --accent-soft: #123528;
    --gold: #EBB23E; --gold-soft: #372B12; --red: #EE6A62; --red-d: #A63F3A; --red-soft: #3B1E1C;
    --blue: #5D95EF; --blue-d: #2F5FAF; --blue-soft: #18294A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1613; --surface: #13211D; --surface-2: #1A2B26; --ink: #E4EEEA; --muted: #91A59E; --line: #273A34;
  --accent: #2AB585; --accent-d: #167A57; --accent-soft: #123528;
  --gold: #EBB23E; --gold-soft: #372B12; --red: #EE6A62; --red-d: #A63F3A; --red-soft: #3B1E1C;
  --blue: #5D95EF; --blue-d: #2F5FAF; --blue-soft: #18294A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 2px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; padding-block: 10px; gap: 12px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: #fff; font-style: normal; font-size: 14px; box-shadow: 0 3px 0 var(--accent-d); }
.stats { display: flex; gap: 14px; }
.stat { display: flex; align-items: center; gap: 4px; font-weight: 800; font-family: var(--f-mono); font-size: 15px; }
.stat svg { width: 22px; height: 22px; }
.stat.fire { color: var(--gold); } .stat.fire.off { color: var(--muted); }
.stat.xp { color: var(--blue); } .stat.heart { color: var(--red); }

main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

/* Meta diaria */
.goal { margin-top: 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.goal b { font-size: 14px; } .goal span { font-size: 13px; color: var(--muted); font-family: var(--f-mono); }
.bar { grid-column: 1 / -1; height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--gold); border-radius: 99px; transition: width .5s; }

/* Ruta */
.unit { margin-top: 22px; }
.uhead { background: var(--c); color: #fff; border-radius: 18px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 65%, #000); }
.uhead > * { grid-column: 1; }
.uhead small { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.uhead h2 { font-size: 21px; font-weight: 800; }
.uhead p { margin: 0; font-size: 14px; opacity: .92; grid-column: 1; }
.uhead .ch { font-size: 12px; opacity: .8; grid-column: 1; }
.uhead .ubtn { grid-row: 1 / span 4; grid-column: 2; align-self: center; background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.35); border-radius: 12px; padding: 8px 10px; color: #fff; font-weight: 700; font-size: 13px; }
.path { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 26px 0 8px; }
.nodewrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.node { width: 72px; height: 66px; border-radius: 50%; border: 0; background: var(--c); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 62%, #000); transition: transform .08s, box-shadow .08s; }
.node:active { transform: translateY(5px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 62%, #000); }
.node svg { width: 30px; height: 30px; }
.node.locked { background: var(--surface-2); color: var(--muted); box-shadow: 0 6px 0 var(--line); }
.node.done { background: var(--gold); box-shadow: 0 6px 0 color-mix(in srgb, var(--gold) 62%, #000); }
.node.cur { outline: 5px solid color-mix(in srgb, var(--c) 30%, transparent); outline-offset: 5px; }
@media (prefers-reduced-motion: no-preference) { .node.cur { animation: bob 1.8s ease-in-out infinite; } }
@keyframes bob { 50% { transform: translateY(-4px); } }
.nlabel { font-size: 13px; font-weight: 700; color: var(--muted); max-width: 170px; text-align: center; line-height: 1.25; }
.nlabel.on { color: var(--ink); }
.tip { position: absolute; top: -34px; background: var(--surface); border: 2px solid var(--line); color: var(--c); font-weight: 800; font-size: 12px; letter-spacing: .08em; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
.lvl { position: absolute; right: -8px; top: -4px; background: var(--surface); border: 2px solid var(--line); border-radius: 99px; font-size: 11px; font-weight: 800; font-family: var(--f-mono); padding: 0 6px; color: var(--gold); }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 800; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-d); transition: transform .06s, box-shadow .06s; width: 100%; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-d); }
.btn:disabled { background: var(--surface-2); color: var(--muted); box-shadow: 0 4px 0 var(--line); cursor: default; }
.btn.ghost { background: var(--surface); color: var(--blue); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn.red { background: var(--red); box-shadow: 0 4px 0 var(--red-d); }
.btn.blue { background: var(--blue); box-shadow: 0 4px 0 var(--blue-d); }
.btn.sm { padding: 10px 14px; font-size: 13px; width: auto; }
.row { display: flex; gap: 10px; flex-wrap: wrap; } .row > * { flex: 1 1 140px; }

/* Hoja inferior */
.scrim { position: fixed; inset: 0; background: rgba(5, 15, 12, .5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 88%; overflow: auto; border-radius: 22px 22px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { font-size: 22px; }
.sheet .meta { color: var(--muted); font-size: 14px; margin: 0; }

/* Navegación inferior */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding-block: 6px; }
.nav button { background: none; border: 2px solid transparent; border-radius: 12px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); position: relative; }
.nav button svg { width: 24px; height: 24px; }
.nav button.on { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.badge { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--red); color: #fff; font-size: 10px; font-weight: 800; border-radius: 99px; padding: 0 5px; font-family: var(--f-mono); }

/* Paneles genéricos */
.sec { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
.sec > h2 { font-size: 24px; font-weight: 800; }
.lead { color: var(--muted); margin: 0; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.tile b { font-family: var(--f-mono); font-size: 22px; }
.tile span { font-size: 13px; color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 130px; padding-top: 8px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; font-size: 11px; color: var(--muted); }
.week i { width: 100%; max-width: 30px; background: var(--blue); border-radius: 6px 6px 2px 2px; min-height: 3px; display: block; }
.week i.today { background: var(--gold); }
.week em { font-style: normal; font-family: var(--f-mono); font-size: 10px; color: var(--ink); }
.list { display: flex; flex-direction: column; gap: 8px; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.li small { color: var(--muted); font-size: 13px; grid-column: 1; }
.li > div { min-width: 0; }
.pill { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-family: var(--f-mono); }
.pill.r { background: var(--red-soft); color: var(--red); } .pill.g { background: var(--accent-soft); color: var(--accent); }
.seg { display: flex; gap: 6px; } .seg button { flex: 1; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 0; font-weight: 700; }
.seg button.on { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tog input { width: 46px; height: 26px; accent-color: var(--accent); }
textarea, input[type=text], input[type=search] { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; }
textarea { min-height: 90px; resize: vertical; }
details.note { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; }
details.note summary { padding: 12px 14px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.note summary::after { content: "+"; font-family: var(--f-mono); color: var(--muted); }
details.note[open] summary::after { content: "−"; }
details.note .nb { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.gl dt { font-weight: 800; } .gl dd { margin: 0 0 10px; color: var(--muted); }
.gl { margin: 0; }

/* Contenido teórico */
.th h3 { font-size: 22px; margin-bottom: 10px; }
.th p { margin: 0 0 10px; }
.th ul, .th ol { margin: 0 0 10px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.f { font-family: var(--f-mono); font-size: 14px; background: var(--surface-2); border: 2px dashed var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0 12px; overflow-x: auto; line-height: 1.5; display: block; }
span.f { display: block; }
.formula { font-family: var(--f-mono); font-size: 14px; background: var(--surface-2); border: 2px dashed var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0 12px; overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-family: var(--f-mono); font-size: 14px; margin: 4px 0 12px; }
.tbl td { padding: 5px 8px; border-bottom: 1px solid var(--line); }
.tbl td:last-child { text-align: right; }
/* Tarjeta "en lenguaje llano" al inicio de cada lección */
.th.plain { border: 2px solid var(--accent); border-radius: 16px; padding: 14px 16px; background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.th.plain .tag { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
/* Términos del glosario: se pueden tocar para ver la definición */
.gt { border-bottom: 2px dotted var(--accent); cursor: help; }
.gpop { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100vw - 32px)); z-index: 60; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 15px; }
.gpop b { display: block; font-family: var(--f-display); font-size: 17px; margin-bottom: 4px; }

/* Lección a pantalla completa */
.lesson { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.lhead { width: 100%; display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.lhead .x { background: none; border: 0; padding: 4px; color: var(--muted); display: grid; } .lhead .x svg { width: 26px; height: 26px; }
.lprog { flex: 1; height: 16px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.lprog > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
.lhead .thbtn { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px; font-size: 12px; font-weight: 800; color: var(--blue); }
.lbody { flex: 1; overflow-y: auto; padding-block: 8px 24px; }
.lbody .wrap { display: flex; flex-direction: column; gap: 16px; }
.kind { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); display: flex; align-items: center; gap: 8px; }
.kind.int { color: var(--u6); } .kind.th { color: var(--accent); }
.q { font-family: var(--f-display); font-size: 22px; font-weight: 600; line-height: 1.3; margin: 0; text-wrap: pretty; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 13px 14px; box-shadow: 0 3px 0 var(--line); display: flex; gap: 12px; align-items: center; font-weight: 600; }
.opt kbd { font-family: var(--f-mono); font-size: 12px; min-width: 24px; height: 24px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 7px; color: var(--muted); flex: none; }
.opt.sel { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 3px 0 var(--blue); color: var(--blue); }
.opt.sel kbd { border-color: var(--blue); color: var(--blue); }
.opt.good { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 3px 0 var(--accent); color: var(--accent); }
.opt.good kbd { border-color: var(--accent); color: var(--accent); }
.opt.bad { border-color: var(--red); background: var(--red-soft); box-shadow: 0 3px 0 var(--red); color: var(--red); }
.opt.bad kbd { border-color: var(--red); color: var(--red); }
.opt:disabled { cursor: default; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf .opt { justify-content: center; padding: 22px 10px; font-size: 17px; }
.sentence { font-family: var(--f-display); font-size: 22px; line-height: 1.6; }
.blank { display: inline-block; min-width: 110px; border-bottom: 3px solid var(--line); padding: 0 6px; color: var(--blue); }
.blank.filled { border-color: var(--blue); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 9px 12px; box-shadow: 0 3px 0 var(--line); font-weight: 600; text-align: left; }
.chip.used { visibility: hidden; }
.answer { min-height: 64px; border: 2px dashed var(--line); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.answer:empty::before { content: "Toca los elementos en el orden correcto"; color: var(--muted); font-size: 14px; padding: 10px; }
.answer .chip { display: flex; gap: 10px; align-items: center; }
.answer .chip b { font-family: var(--f-mono); color: var(--muted); font-size: 13px; }
.bank { display: flex; flex-direction: column; gap: 8px; }
.numin { display: flex; align-items: center; gap: 10px; }
.numin input { font-family: var(--f-mono); font-size: 24px; padding: 14px 16px; width: 100%; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; }
.numin span { font-family: var(--f-mono); font-size: 20px; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.match .opt { font-size: 14px; padding: 11px 12px; min-height: 64px; }
.match .opt.ok { opacity: .35; border-color: var(--accent); box-shadow: none; }
.match .opt.wrong { border-color: var(--red); background: var(--red-soft); }
.model { background: var(--surface); border: 2px solid var(--line); border-left-width: 2px; border-radius: 14px; padding: 14px 16px; }
.model h4 { margin: 0 0 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--u6); }
.model p { margin: 0; }
.lfoot { border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
.lfoot .wrap { padding-block: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.lfoot.good { background: var(--accent-soft); border-color: transparent; }
.lfoot.bad { background: var(--red-soft); border-color: transparent; }
.fb { display: flex; flex-direction: column; gap: 4px; max-height: 34vh; overflow-y: auto; }
.fb h4 { margin: 0; font-family: var(--f-display); font-size: 20px; display: flex; align-items: center; gap: 8px; }
.lfoot.good .fb h4 { color: var(--accent); } .lfoot.bad .fb h4 { color: var(--red); }
.fb p { margin: 0; font-size: 15px; }
.fb .sol { font-weight: 700; }
.lfoot.bad .btn { background: var(--red); box-shadow: 0 4px 0 var(--red-d); }

/* Fin de lección */
.end { text-align: center; align-items: center; padding-top: 30px; }
.end h2 { font-size: 30px; font-weight: 800; }
.end .tiles { grid-template-columns: repeat(3, 1fr); width: 100%; }
.end .tile { align-items: center; }
.end .tile.gold { border-color: var(--gold); } .end .tile.gold b { color: var(--gold); }
.end .tile.grn { border-color: var(--accent); } .end .tile.grn b { color: var(--accent); }
.end .tile.blu { border-color: var(--blue); } .end .tile.blu b { color: var(--blue); }
.medal { width: 120px; height: 120px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; color: #fff; box-shadow: 0 8px 0 color-mix(in srgb, var(--gold) 62%, #000); }

.medal.sad { background: var(--red); box-shadow: 0 8px 0 var(--red-d); }

<script>
// Contenido. Tipos: mc, tf, fill, num, ord, match, int (pregunta de entrevista con respuesta modelo)
const UNITS = [];

UNITS.push({
  id: 'f0', title: 'Fundamentos', sub: 'La base contable y del sector que todos los capítulos del libro dan por sabida', ch: 'Antes de la Parte I', col: 'var(--u1)',
  lessons: [
    {
      id: 'f0l1', title: 'Los tres estados financieros',
      th: [
        { h: 'Tres vistas de una misma empresa', b: `<ul><li><b>Cuenta de resultados</b> (income statement): ingresos, costes y beneficio durante un <i>periodo</i> (un trimestre, un año).</li>
<li><b>Balance</b> (balance sheet): lo que la empresa tiene y debe en un <i>momento concreto</i>. Siempre cuadra: <span class="f">Activos = Pasivos + Patrimonio neto</span></li>
<li><b>Estado de flujos de efectivo</b> (cash flow statement): la caja que realmente entra y sale, dividida en actividades de operación, inversión y financiación.</li></ul>` },
        { h: 'Cómo se conectan', b: `<p>El <b>beneficio neto</b> de la cuenta de resultados es la primera línea del flujo de operaciones y se suma a los <b>beneficios retenidos</b> del balance.</p>
<p>Después se ajustan las partidas no monetarias: la <b>D&amp;A</b> se suma de nuevo porque redujo el beneficio sin que saliera caja. Los cambios en el capital circulante lo ajustan aún más.</p>
<p>La <b>caja final</b> del estado de flujos pasa a ser la caja del balance. Así se cierra el círculo.</p>` },
        { h: 'Ejemplo resuelto: la pregunta clásica', b: `<p><i>"La depreciación sube 10 $ y el tipo impositivo es del 25%. Explícame qué pasa en los tres estados."</i></p>
<ul><li><b>Cuenta de resultados:</b> EBIT −10, impuestos −2,5, beneficio neto <b>−7,5</b>.</li>
<li><b>Flujos:</b> beneficio neto −7,5, sumamos la depreciación +10 → caja <b>+2,5</b>.</li>
<li><b>Balance:</b> PP&amp;E −10, caja +2,5 → activos −7,5. Beneficios retenidos −7,5 → patrimonio −7,5. Cuadra.</li></ul>
<p>La caja sube porque la depreciación es deducible pero no es un pago en efectivo: el <b>escudo fiscal</b>.</p>` }
      ],
      ex: [
        { t: 'mc', q: '¿Qué estado muestra la posición de una empresa en un momento concreto?', o: ['Balance', 'Cuenta de resultados', 'Estado de flujos de efectivo', 'Proxy statement'], a: 0, e: 'El balance es una foto. La cuenta de resultados y el estado de flujos cubren un periodo.' },
        { t: 'fill', q: 'Activos = Pasivos + ___', o: ['Patrimonio neto', 'Beneficio neto', 'Caja', 'Ingresos'], a: 0, e: 'Todo lo que tiene la empresa lo financian obligaciones (pasivos) o los dueños (patrimonio neto).' },
        { t: 'match', q: 'Empareja cada elemento con lo que muestra', p: [['Cuenta de resultados', 'Beneficio durante un periodo'], ['Balance', 'Activos y pasivos en una fecha'], ['Estado de flujos de efectivo', 'Movimientos reales de caja'], ['Beneficios retenidos', 'Beneficios acumulados no repartidos']] },
        { t: 'num', q: 'La depreciación sube 10 $ y el tipo impositivo es del 25%. ¿Cuánto cambia el beneficio neto?', a: -7.5, e: 'EBIT −10, impuestos −2,5, así que el beneficio neto −7,5.' },
        { t: 'num', q: 'Mismo caso: depreciación +10 $, tipo impositivo del 25%. ¿Cuánto cambia la caja?', a: 2.5, e: 'Beneficio neto −7,5 más la depreciación no monetaria +10 = +2,5.' },
        { t: 'tf', q: 'El capex aparece en el flujo de actividades de inversión.', a: true, e: 'Operación = el negocio del día a día; inversión = capex y adquisiciones; financiación = deuda, dividendos, recompras.' },
        { t: 'ord', q: 'Ordena la cuenta de resultados, de arriba abajo', o: ['Ventas', 'Coste de los bienes vendidos', 'Margen bruto', 'SG&A', 'EBIT', 'Gastos por intereses', 'Impuestos', 'Beneficio neto'], e: 'De la "primera línea" a la "última línea".' },
        { t: 'int', q: 'Entrevista: "Una empresa compra una máquina de 100 $ en efectivo. ¿Qué pasa en los tres estados en el momento de la compra?"', m: '<b>Cuenta de resultados:</b> nada todavía; la máquina se depreciará con el tiempo. <b>Flujos:</b> capex de −100 $ en inversión, caja −100 $. <b>Balance:</b> caja −100 $, PP&amp;E +100 $. El total de activos no cambia y el balance cuadra.' },
        { t: 'int', q: 'Entrevista: "Si solo pudieras mirar un estado para valorar una empresa, ¿cuál elegirías?"', m: 'El <b>estado de flujos de efectivo</b>, porque el valor sale de la caja que genera el negocio y la caja es más difícil de manipular que el beneficio. Si pudiera mirar un segundo, añadiría el balance para ver la deuda y la caja.' }
      ]
    },
    {
      id: 'f0l2', title: 'De las ventas al EBITDA',
      th: [
        { h: 'Medidas de beneficio', b: `<ul><li><b>Margen bruto</b> = Ventas − COGS</li><li><b>EBITDA</b> = Margen bruto − SG&amp;A (y otros gastos operativos), antes de la D&amp;A</li><li><b>EBIT</b> = EBITDA − D&amp;A (resultado operativo)</li><li><b>EBT</b> = EBIT − Gastos por intereses</li><li><b>Beneficio neto</b> = EBT − Impuestos</li></ul>
<p>Cada <b>margen</b> es la medida dividida entre las ventas.</p>` },
        { h: 'Por qué a los banqueros les encanta el EBITDA', b: `<p>El EBITDA no depende de la <b>estructura de capital</b> (es antes de intereses), de los <b>impuestos</b> ni de las <b>políticas de D&amp;A</b>, así que es el mejor punto de partida para comparar empresas. Es la base del EV/EBITDA y de ratios de apalancamiento como Deuda/EBITDA.</p>
<p>Ojo: <b>no es flujo de caja</b>. Ignora el capex y el circulante, y es una medida <i>non-GAAP</i> (no oficial).</p>` },
        { h: 'Normalizar', b: `<p>Para valorar hace falta beneficio <b>recurrente</b>. Quita las partidas no recurrentes:</p>
<ul><li>Costes de reestructuración, litigios, deterioros: <b>se suman</b>.</li><li>Plusvalías por venta de activos: <b>se restan</b>.</li></ul>
<p>Ejemplo resuelto: ventas 1.000 $, COGS 600 $, SG&amp;A 150 $, D&amp;A 50 $ (línea aparte) → margen bruto 400 $ (40%), EBITDA 250 $ (25%), EBIT 200 $ (20%).</p>` }
      ],
      ex: [
        { t: 'num', q: 'Ventas 1.000 $, COGS 600 $, SG&A 150 $, D&A 50 $ (línea aparte). ¿EBITDA?', a: 250, e: 'Margen bruto 400 − SG&A 150 = 250. La D&A se resta después para llegar a un EBIT de 200.' },
        { t: 'num', q: 'EBITDA de 250 $ con ventas de 1.000 $. ¿Margen EBITDA (%)?', a: 25, u: '%', e: '250 / 1.000 = 25%.' },
        { t: 'mc', q: '¿Por qué es útil el EBITDA para comparar empresas?', o: ['No depende de la estructura de capital, los impuestos ni la política de D&A', 'Es igual al flujo de caja libre', 'Es una medida oficial GAAP', 'Incluye el capex'], a: 0, e: 'Aísla la rentabilidad operativa. No es caja: no incluye capex ni circulante.' },
        { t: 'tf', q: 'El EBITDA es una medida oficial GAAP / NIIF.', a: false, e: 'Es non-GAAP, por eso los banqueros lo recalculan y ajustan ellos mismos.' },
        { t: 'num', q: 'El EBITDA publicado de 90 $ incluye un coste puntual de reestructuración de 15 $ y una plusvalía de 5 $ por vender un almacén. ¿EBITDA ajustado?', a: 100, e: '90 + 15 − 5 = 100.' },
        { t: 'num', q: 'Beneficio neto de 120 $ y 40 millones de acciones totalmente diluidas. ¿BPA diluido?', a: 3, e: '120 / 40 = 3,00 $.' },
        { t: 'int', q: 'Entrevista: "¿Por qué puede ser engañoso el EBITDA?"', m: 'Porque <b>no es caja</b>. Ignora el <b>capex</b> (enorme en negocios intensivos en activos), el <b>circulante</b>, los <b>intereses</b> y los <b>impuestos</b>, que son pagos reales. Es non-GAAP, así que las empresas pueden "ajustarlo" con generosidad. En negocios intensivos en capital miraría EBITDA − capex o el flujo de caja libre.' }
      ]
    },
    {
      id: 'f0l3', title: 'Capital circulante y capex',
      th: [
        { h: 'Capital circulante neto', b: `<div class="f">NWC = (Cuentas por cobrar + Existencias + Gastos anticipados) − (Cuentas por pagar + Gastos devengados + Otros pasivos corrientes)</div>
<p>No incluye caja ni deuda. Es la caja atrapada en el ciclo operativo. <b>Un aumento del NWC consume caja</b>; una disminución la libera.</p>` },
        { h: 'Ratios de días', b: `<ul><li><b>DSO</b> (días de cobro) = Cuentas por cobrar / Ventas × 365</li><li><b>DIO</b> (días de existencias) = Existencias / COGS × 365</li><li><b>DPO</b> (días de pago) = Cuentas por pagar / COGS × 365</li></ul>
<p>Los modelos de proyección calculan el circulante con estos ratios o como % de las ventas. Un supermercado cobra en efectivo y paga a sus proveedores a 60 días: NWC negativo, así que crecer le <i>genera</i> caja.</p>` },
        { h: 'Capex', b: `<p>El <b>capex de mantenimiento</b> mantiene funcionando los activos (a menudo cercano a la D&amp;A). El <b>capex de crecimiento</b> añade capacidad. Los fondos de LBO prefieren negocios con poco capex de mantenimiento porque queda más caja para devolver deuda.</p>` }
      ],
      ex: [
        { t: 'mc', q: 'Las cuentas por cobrar aumentan 20 $. ¿Efecto en la caja?', o: ['La caja baja 20 $', 'La caja sube 20 $', 'Ningún efecto', 'Solo cambia el beneficio neto'], a: 0, e: 'Has registrado la venta pero no has cobrado.' },
        { t: 'num', q: 'El NWC pasa de 100 $ a 130 $. ¿Impacto en la caja?', a: -30, e: 'Un aumento de 30 $ del NWC consume 30 $ de caja.' },
        { t: 'num', q: 'Cuentas por cobrar de 50 $, ventas anuales de 365 $. ¿DSO (días)?', a: 50, e: '50 / 365 × 365 = 50 días.' },
        { t: 'tf', q: 'Un aumento de las cuentas por pagar es una fuente de caja.', a: true, e: 'Pagas más tarde a los proveedores y te quedas la caja más tiempo.' },
        { t: 'mc', q: '¿Qué negocio suele tener capital circulante negativo?', o: ['Un supermercado que cobra en efectivo y paga a proveedores a 60 días', 'Un fabricante de aviones con grandes existencias', 'Una constructora que cobra al terminar la obra', 'Un distribuidor que da 90 días de plazo'], a: 0, e: 'Los proveedores le financian el ciclo operativo.' },
        { t: 'int', q: 'Entrevista: "¿Cómo puede quebrar una empresa con beneficios?"', m: 'Por <b>falta de liquidez</b>. El beneficio no es caja: una empresa que crece rápido puede atrapar cada vez más caja en cuentas por cobrar y existencias, además de un capex elevado. Si le vencen deudas, puede quedarse sin caja aunque su cuenta de resultados sea positiva.' }
      ]
    },
    {
      id: 'f0l4', title: 'Dentro de un banco de inversión',
      th: [
        { h: 'Divisiones', b: `<ul><li><b>Banca de inversión (IBD)</b>: asesora a empresas en <b>M&amp;A</b> y en captación de financiación. Se divide en grupos de <b>cobertura</b> (por sector: TMT, salud, industria, FIG…) y grupos de <b>producto</b> (M&amp;A, ECM, DCM, financiación apalancada, reestructuraciones).</li>
<li><b>Sales &amp; Trading</b>, <b>Research</b> (análisis), <b>gestión de activos / patrimonios</b>.</li></ul>
<p>La <b>muralla china</b> (information wall) separa el lado privado (IBD) del lado público (S&amp;T, research).</p>` },
        { h: 'Jerarquía y trabajo', b: `<p><b>Analista → Asociado → Vice President → Director / ED → Managing Director</b>.</p>
<p>Analistas y asociados construyen modelos, <b>pitch books</b> y material de las operaciones. Los VP dirigen la ejecución. Los MD consiguen negocio y llevan la relación con los clientes.</p>
<p><b>Aseguramiento</b> (underwriting): el banco compra una emisión de valores y la revende, asumiendo el riesgo de no colocarla, a cambio de un <b>gross spread</b> (comisión bruta).</p>` }
      ],
      ex: [
        { t: 'ord', q: 'Ordena la jerarquía de un banco, de junior a sénior', o: ['Analista', 'Asociado', 'Vice President', 'Director', 'Managing Director'], e: 'Los títulos varían un poco según el banco, pero la escalera es esta.' },
        { t: 'match', q: 'Empareja cada grupo con su función', p: [['ECM', 'Emisiones de acciones (OPV, ampliaciones)'], ['DCM', 'Emisiones de bonos investment grade'], ['Financiación apalancada', 'Préstamos de LBO y high yield'], ['Sales & Trading', 'Negociar valores para clientes']] },
        { t: 'tf', q: 'La muralla china separa a quienes tienen información privilegiada de quienes negocian en el mercado.', a: true, e: 'Evita el uso de información privilegiada.' },
        { t: 'mc', q: 'Grupo de cobertura frente a grupo de producto:', o: ['La cobertura se organiza por sector/cliente y el producto por tipo de operación', 'Son lo mismo', 'La cobertura solo negocia valores', 'El producto solo hace análisis'], a: 0, e: 'Las operaciones suelen combinar ambos, por ejemplo cobertura de TMT con M&A.' },
        { t: 'int', q: 'Entrevista: "¿Por qué banca de inversión?"', m: 'En un minuto más o menos: la <b>curva de aprendizaje</b> tan pronunciada, la exposición a <b>operaciones reales</b> y a la alta dirección, el trabajo <b>analítico</b> y en equipo, y la base que da para una carrera en finanzas. Únelo a tu historia con un ejemplo concreto y no hables de dinero.' }
      ]
    }
  ]
});

UNITS.push({
  id: 'c1', title: 'Análisis de compañías comparables', sub: 'Trading comps: valorar una empresa por cómo cotizan sus comparables', ch: 'Capítulo 1', col: 'var(--u2)',
  lessons: [
    {
      id: 'c1l1', title: 'Los pasos y el Paso I: seleccionar el universo',
      th: [
        { h: 'La idea', b: `<p>El análisis de compañías comparables ("trading comps") se basa en una premisa: <b>empresas similares son una referencia muy relevante para valorar una empresa objetivo</b>, porque comparten características clave de negocio y financieras, impulsores de resultados y riesgos.</p>
<p>Da una foto actual y <b>basada en el mercado</b>. Como el precio de las acciones refleja participaciones minoritarias, <b>no</b> incluye prima de control.</p>` },
        { h: 'Resumen de los cinco pasos', b: `<ol><li><b>Seleccionar el universo</b> de compañías comparables</li><li><b>Localizar</b> la información financiera necesaria</li><li><b>Calcular</b> las principales magnitudes, ratios y múltiplos de cotización</li><li><b>Comparar</b> (benchmark) las compañías comparables</li><li><b>Determinar la valoración</b></li></ol>` },
        { h: 'Paso I: estudiar el objetivo y luego filtrar', b: `<p><b>Estudia la empresa objetivo</b>: modelo de negocio, productos, clientes, competidores, historial financiero.</p>
<p><b>Identifica las características clave para comparar</b>:</p>
<ul><li><b>Perfil de negocio</b>: sector, productos y servicios, clientes y mercados finales, canales de distribución, geografía.</li><li><b>Perfil financiero</b>: tamaño, rentabilidad, perfil de crecimiento, rentabilidad sobre la inversión, perfil crediticio.</li></ul>
<p><b>Busca comparables</b>: el propio 10-K y la proxy del objetivo (competidores y grupo de referencia para la retribución), el research, los comps de operaciones anteriores del sector, herramientas de filtrado (Capital IQ, Bloomberg, FactSet) con códigos de sector (SIC/NAICS) y el criterio de los banqueros sénior. A menudo se crea un grupo principal y un grupo más amplio.</p>` }
      ],
      ex: [
        { t: 'ord', q: 'Ordena los cinco pasos del análisis de compañías comparables', o: ['Seleccionar el universo de compañías comparables', 'Localizar la información financiera necesaria', 'Calcular magnitudes, ratios y múltiplos de cotización', 'Comparar las compañías comparables', 'Determinar la valoración'], e: 'Resumen de pasos del capítulo 1.' },
        { t: 'mc', q: '¿Qué forma parte del perfil financiero y no del perfil de negocio?', o: ['La rentabilidad sobre la inversión', 'Los canales de distribución', 'Los mercados finales', 'La geografía'], a: 0, e: 'Perfil financiero: tamaño, rentabilidad, crecimiento, rentabilidad sobre la inversión, perfil crediticio.' },
        { t: 'match', q: 'Clasifica cada característica', p: [['Clientes y mercados finales', 'Perfil de negocio: quién compra'], ['Canales de distribución', 'Perfil de negocio: cómo vende'], ['Perfil crediticio', 'Perfil financiero: apalancamiento y cobertura'], ['Perfil de crecimiento', 'Perfil financiero: crecimiento histórico y proyectado']] },
        { t: 'mc', q: '¿Dónde podrías encontrar el grupo de comparables que usa la propia empresa?', o: ['En el grupo de referencia de retribución de su proxy statement', 'En su 8-K sobre dividendos', 'En la curva de tipos del Tesoro', 'En su declaración de impuestos'], a: 0, e: 'La proxy revela las empresas con las que se compara la retribución de los directivos, un filtro útil.' },
        { t: 'tf', q: 'Los trading comps incluyen una prima de control.', a: false, e: 'El precio de las acciones cotizadas refleja participaciones minoritarias. La prima de control aparece en las transacciones precedentes.' },
        { t: 'mc', q: 'Encuentras comparables de negocio excelentes pero diez veces más grandes que el objetivo. ¿Qué haces?', o: ['Incluirlos, anotando el efecto tamaño, y dar más peso a los más parecidos', 'Excluirlos siempre', 'Usarlos sin comentarios', 'Sustituirlos por empresas del mismo tamaño de otro sector'], a: 0, e: 'Elegir comparables es arte y ciencia. El tamaño importa, pero un negocio muy parecido tiene valor. Lo documentas y ajustas el rango.' },
        { t: 'int', q: 'Entrevista: "¿Cómo elegirías comparables para una cadena de gimnasios low cost?"', m: 'Empezaría por el <b>perfil de negocio</b>: operadores de gimnasios cotizados (idealmente low cost) y después otros negocios de ocio por suscripción. Luego afinaría por <b>perfil financiero</b>: tamaño, crecimiento, márgenes, apalancamiento. Fuentes: la sección de competencia del 10-K, el grupo de referencia de la proxy, el research y comps anteriores. Acabaría con un grupo principal ajustado más un grupo amplio.' }
      ]
    },
    {
      id: 'c1l2', title: 'Paso II: localizar la información',
      th: [
        { h: 'Documentos presentados ante la SEC', b: `<ul><li><b>10-K</b>: informe anual con estados financieros auditados, MD&amp;A (análisis de la dirección), descripción del negocio y factores de riesgo.</li><li><b>10-Q</b>: informe trimestral (sin auditar) de los tres primeros trimestres.</li><li><b>8-K</b>: informe de hechos relevantes (resultados, M&amp;A, financiaciones, cambios en la dirección).</li><li><b>Proxy statement</b> (DEF14A): documentación de la junta anual: retribución de directivos, consejo, puntos a votar y grupo de comparables.</li></ul>
<p>El número de acciones más reciente suele estar en la portada del último 10-K/10-Q; las opciones y convertibles, en las notas.</p>` },
        { h: 'Otras fuentes', b: `<ul><li><b>Research</b>: informes de analistas con proyecciones, visión del sector y estimaciones de consenso. Los informes de inicio de cobertura son especialmente detallados.</li><li><b>Estimaciones de consenso</b> (por ejemplo FactSet, Bloomberg, Refinitiv): se usan para las proyecciones de los comparables.</li><li><b>Notas de prensa y noticias</b>: resultados, M&amp;A, financiaciones que pueden requerir ajustes.</li><li><b>Proveedores de información financiera</b>: Bloomberg, Capital IQ, FactSet para precios, documentos y filtros.</li></ul>
<p>Resumen de fuentes principales: cifras históricas de los documentos de la SEC; proyecciones del research y el consenso; datos de mercado (precio de la acción, beta, ratings) de los proveedores de información.</p>` }
      ],
      ex: [
        { t: 'match', q: 'Empareja cada documento con su contenido', p: [['10-K', 'Informe anual auditado'], ['10-Q', 'Informe trimestral sin auditar'], ['8-K', 'Informe de hechos relevantes'], ['Proxy statement', 'Junta anual y retribución de directivos']] },
        { t: 'mc', q: '¿De dónde sueles sacar el BPA proyectado de los comparables?', o: ['De las estimaciones de consenso del research', 'Del 10-K', 'De la proxy statement', 'De las declaraciones fiscales de la empresa'], a: 0, e: 'Las empresas casi nunca publican proyecciones detalladas, así que los banqueros usan el consenso.' },
        { t: 'mc', q: 'Un comparable anunció una gran adquisición la semana pasada. ¿Dónde encontrarías los detalles?', o: ['En el 8-K y la nota de prensa', 'En el 10-K del año pasado', 'En la proxy statement', 'En ningún sitio hasta el siguiente 10-K'], a: 0, e: 'Los hechos relevantes se comunican rápido mediante 8-K y nota de prensa; quizá tengas que ajustar el comparable pro forma.' },
        { t: 'tf', q: 'El número de acciones básicas más reciente suele estar en la portada del último 10-K o 10-Q.', a: true, e: 'Después se suman los valores dilutivos de las notas para obtener las acciones totalmente diluidas.' },
        { t: 'fill', q: 'El primer informe de research, muy detallado, sobre una empresa se llama informe de ___', o: ['inicio de cobertura', 'resultados', 'proxy', 'tombstone'], a: 0, e: 'Los informes de inicio de cobertura analizan a fondo el negocio y el sector.' },
        { t: 'int', q: 'Entrevista: "¿Dónde buscarías los datos para construir una tabla de comparables?"', m: 'Las <b>cifras históricas</b> y los datos de acciones en los documentos de la SEC: 10-K, 10-Q y los 8-K para hechos recientes, además de la proxy. Las <b>proyecciones</b> del research y de las estimaciones de consenso. Los <b>datos de mercado</b> (precios, betas, ratings) de Bloomberg, Capital IQ o FactSet. También revisaría las notas de prensa por si hay partidas no recurrentes u operaciones que requieran ajustes.' }
      ]
    },
    {
      id: 'c1l3', title: 'Paso III: tamaño, valor del capital y EV',
      th: [
        { h: 'Valor del capital', b: `<div class="f">Valor del capital = Precio por acción × Acciones totalmente diluidas</div>
<p>Las <b>acciones totalmente diluidas</b> suman las opciones y warrants dentro del dinero (método de autocartera, treasury stock method) y los convertibles dentro del dinero (método de conversión, if-converted).</p>
<p><b>Método de autocartera (TSM)</b>: se supone que las opciones dentro del dinero se ejercen y que lo cobrado se usa para recomprar acciones al precio actual. Ejemplo: 10 M de opciones, strike 10 $, precio 20 $ → lo cobrado, 100 M$, recompra 5 M de acciones → <b>+5 M de acciones netas</b>. En la práctica se hace tramo a tramo.</p>` },
        { h: 'Valor de empresa', b: `<div class="f">EV = Valor del capital + Deuda total + Acciones preferentes + Minoritarios − Caja y equivalentes</div>
<p>El EV es el valor del negocio operativo para <b>todos</b> los que aportan capital. La deuda y las preferentes tienen derechos por delante de las acciones ordinarias; los <b>minoritarios</b> (noncontrolling interest) se suman porque el EBITDA consolidado incluye el 100% de filiales que no son 100% propiedad; la caja se resta porque no hace falta para operar y, en la práctica, reduce el coste de comprar el negocio.</p>
<p>Ejemplo: valor del capital 1.000 $, deuda 400 $, caja 100 $ → EV 1.300 $.</p>` },
        { h: 'Tamaño, rentabilidad y crecimiento', b: `<ul><li><b>Tamaño</b>: ventas, margen bruto, EBITDA, EBIT, beneficio neto, valor del capital y EV. Las empresas grandes suelen cotizar con prima (escala, diversificación, liquidez).</li><li><b>Rentabilidad</b>: márgenes bruto, EBITDA, EBIT y neto.</li><li><b>Perfil de crecimiento</b>: crecimiento histórico y proyectado (a 1 año, <b>TACC</b> a 2-3 años) de ventas, EBITDA y BPA; la tasa de crecimiento del BPA a largo plazo del research.</li></ul>
<div class="f">TACC = (Valor final / Valor inicial)^(1/años) − 1</div>` }
      ],
      ex: [
        { t: 'num', q: 'Precio por acción 20 $, 50 M de acciones totalmente diluidas. ¿Valor del capital (M$)?', a: 1000, e: '20 × 50 = 1.000.' },
        { t: 'num', q: '10 M de opciones con strike de 10 $; precio de la acción 20 $. ¿Acciones nuevas netas por el método de autocartera (M)?', a: 5, e: 'Lo cobrado, 100 M$ / 20 $ = 5 M recompradas; 10 − 5 = 5 M netas.' },
        { t: 'num', q: 'Valor del capital 1.000 $, deuda 400 $, preferentes 50 $, minoritarios 30 $, caja 100 $. ¿EV?', a: 1380, e: '1.000 + 400 + 50 + 30 − 100 = 1.380.' },
        { t: 'tf', q: 'Los minoritarios se suman al EV porque el EBITDA consolidado incluye el 100% de las filiales con participación mayoritaria.', a: true, e: 'Así numerador y denominador son coherentes.' },
        { t: 'num', q: 'Las ventas crecen de 100 $ a 133,1 $ en 3 años. ¿TACC (%)?', a: 10, u: '%', e: '(133,1/100)^(1/3) − 1 = 10%.' },
        { t: 'mc', q: 'Las opciones con un strike por encima del precio actual de la acción…', o: ['Están fuera del dinero y no se incluyen en las acciones diluidas', 'Se incluyen siempre', 'Se suman a su valor de strike', 'Se restan de las acciones'], a: 0, e: 'Solo los valores dentro del dinero son dilutivos.' },
        { t: 'mc', q: 'Una empresa emite 100 $ de acciones nuevas y guarda la caja. El EV:', o: ['No cambia', 'Sube 100 $', 'Baja 100 $', 'Sube 200 $'], a: 0, e: 'Valor del capital +100, caja +100 (que se resta). El negocio operativo es el mismo.' },
        { t: 'int', q: 'Entrevista: "¿Por qué restamos la caja al calcular el valor de empresa?"', m: 'El EV mide el valor del <b>negocio operativo</b>. La caja es un activo no operativo: el comprador se la queda con la empresa y puede usarla para pagar parte del precio o de la deuda, así que reduce el coste neto de comprar el negocio. Dicho de otra forma, la caja ya está dentro del valor del capital; al restarla aislamos la operación.' },
        { t: 'int', q: 'Entrevista: "¿Puede ser negativo el valor de empresa?"', m: 'Sí, si la <b>caja supera</b> al valor del capital más la deuda. El mercado está valorando el negocio operativo por debajo de cero, porque espera que queme caja o desconfía de la dirección. Pasa con empresas en declive con mucha caja o con biotecnológicas tras ensayos fallidos.' }
      ]
    },
    {
      id: 'c1l4', title: 'Paso III: rentabilidad y perfil crediticio',
      th: [
        { h: 'Rentabilidad sobre la inversión', b: `<ul><li><b>ROIC</b> = EBIT / (Deuda neta media + Patrimonio medio). Rentabilidad para todos los que aportan capital.</li><li><b>ROE</b> = Beneficio neto / Patrimonio neto medio.</li><li><b>ROA</b> = Beneficio neto / Activos totales medios. Clave en negocios intensivos en activos y financieros.</li><li><b>Rentabilidad por dividendo</b> = Dividendo anual por acción / Precio de la acción.</li></ul>
<p>Una mayor rentabilidad sobre el capital suele justificar múltiplos más altos.</p>` },
        { h: 'Perfil crediticio', b: `<ul><li><b>Apalancamiento</b>: Deuda / EBITDA, Deuda neta / EBITDA, Deuda / Capitalización total (deuda + capital).</li><li><b>Cobertura</b>: EBITDA / Gastos por intereses, (EBITDA − Capex) / Gastos por intereses, EBIT / Intereses.</li><li><b>Ratings</b>: Moody’s (Aaa…Baa3 es investment grade) y S&amp;P / Fitch (AAA…BBB−). Por debajo es high yield.</li></ul>
<p>Ejemplo: deuda 500 $, EBITDA 100 $, intereses 25 $ → apalancamiento 5,0x, cobertura 4,0x.</p>` }
      ],
      ex: [
        { t: 'num', q: 'EBIT 120 $, deuda neta media 400 $, patrimonio medio 600 $. ¿ROIC (%)?', a: 12, u: '%', e: '120 / 1.000 = 12%.' },
        { t: 'num', q: 'Beneficio neto 60 $, patrimonio neto medio 500 $. ¿ROE (%)?', a: 12, u: '%', e: '60 / 500 = 12%.' },
        { t: 'num', q: 'Dividendo trimestral de 0,50 $, precio de la acción 40 $. ¿Rentabilidad por dividendo (%)?', a: 5, u: '%', e: 'Anualizado 2,00 $ / 40 $ = 5%.' },
        { t: 'num', q: 'Deuda 500 $, EBITDA 100 $. ¿Apalancamiento (x)?', a: 5, u: 'x', e: '500 / 100 = 5,0x.' },
        { t: 'num', q: 'EBITDA 100 $, capex 20 $, intereses 25 $. ¿(EBITDA − Capex) / Intereses (x)?', a: 3.2, u: 'x', e: '80 / 25 = 3,2x.' },
        { t: 'tf', q: 'Un rating BB+ de S&P es investment grade.', a: false, e: 'El rating investment grade más bajo es BBB− (Baa3 en Moody’s).' },
        { t: 'match', q: 'Empareja cada ratio con su categoría', p: [['ROIC', 'Rentabilidad sobre la inversión'], ['EBITDA / Intereses', 'Cobertura'], ['Deuda / Capitalización total', 'Apalancamiento'], ['Rentabilidad por dividendo', 'Retorno para el accionista']] },
        { t: 'int', q: 'Entrevista: "¿Por qué dos empresas con el mismo margen EBITDA podrían cotizar a múltiplos distintos?"', m: 'Los múltiplos reflejan <b>crecimiento</b>, <b>rentabilidad sobre el capital</b> y <b>riesgo</b>. Más crecimiento esperado, más ROIC (menos capital para crecer), menos intensidad de capex, mejor perfil crediticio, más tamaño e ingresos más estables o diversificados justifican un múltiplo mayor. El margen por sí solo no basta.' }
      ]
    },
    {
      id: 'c1l5', title: 'Conceptos complementarios: LTM, calendarización y ajustes',
      th: [
        { h: 'LTM', b: `<div class="f">LTM = Último ejercicio + Acumulado del año actual − Acumulado del mismo periodo del año anterior</div>
<p>Ejemplo: ventas del ejercicio 2023, 1.000 $; 9 meses de 2024, 800 $; 9 meses de 2023, 700 $ → LTM 1.100 $. El LTM da la foto anual más reciente.</p>` },
        { h: 'Calendarización', b: `<p>Las empresas cuyo ejercicio fiscal acaba en meses distintos se alinean al año natural para que los periodos coincidan.</p>
<p>Ejemplo: el ejercicio acaba el 30 de junio. EBITDA del ejercicio 2024 (jul-23 a jun-24) 100 $; del ejercicio 2025, 120 $.</p>
<div class="f">Año natural 2024 = 6/12 × 100 + 6/12 × 120 = 110</div>` },
        { h: 'Partidas no recurrentes y hechos recientes', b: `<p><b>Partidas no recurrentes</b>: costes de reestructuración, litigios, saneamientos de existencias, deterioros, plusvalías/minusvalías por venta de activos, cancelación de deuda. Se eliminan, <b>netas de impuestos</b> cuando afectan al beneficio neto o al BPA. Un coste de reestructuración de 20 $ con un 25% de impuestos → EBIT +20, beneficio neto +15.</p>
<p><b>Hechos recientes</b>: si un comparable ha hecho una adquisición, una desinversión, una ampliación de capital o una recompra de acciones relevante después de su último informe, ajusta sus cifras y su número de acciones <b>pro forma</b> para que los múltiplos sean coherentes.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Ventas del ejercicio 2023: 1.000 $; 9 meses de 2024: 800 $; 9 meses de 2023: 700 $. ¿Ventas LTM?', a: 1100, e: '1.000 + 800 − 700 = 1.100.' },
        { t: 'num', q: 'El ejercicio acaba el 30 de junio. EBITDA del ejercicio 2024: 100 $; del ejercicio 2025: 120 $. ¿EBITDA del año natural 2024?', a: 110, e: 'La mitad de cada ejercicio: 50 + 60 = 110.' },
        { t: 'num', q: 'El ejercicio acaba el 31 de marzo. EBITDA del ejercicio 2025 (abr-24 a mar-25): 200 $; del 2026: 240 $. ¿EBITDA del año natural 2025?', a: 230, e: 'Año natural 2025 = 3/12 × 200 + 9/12 × 240 = 50 + 180 = 230.' },
        { t: 'num', q: 'Un coste puntual de reestructuración de 20 $ con un tipo impositivo del 25%. ¿Cuánto aumenta el beneficio neto ajustado?', a: 15, e: '20 × (1 − 25%) = 15.' },
        { t: 'mc', q: 'Una plusvalía de 30 $ por la venta de una división está dentro del EBIT. Al normalizar:', o: ['La restas', 'La sumas', 'La dejas', 'La duplicas'], a: 0, e: 'Es una ganancia no recurrente que infla el beneficio.' },
        { t: 'tf', q: 'Si un comparable cerró una gran adquisición después de su último 10-Q, debes ajustar sus cifras pro forma.', a: true, e: 'Si no, su EV (que ya refleja la operación) se dividiría entre cifras que no incluyen el negocio adquirido.' },
        { t: 'int', q: 'Entrevista: "¿Por qué usar el LTM en lugar del último ejercicio?"', m: 'El LTM son los doce meses <b>más recientes</b> disponibles e incluye los últimos trimestres publicados. En octubre, el último ejercicio puede tener casi diez meses de antigüedad. El LTM refleja mejor los resultados actuales, sobre todo en empresas que crecen o cambian rápido.' }
      ]
    },
    {
      id: 'c1l6', title: 'Calcular los principales múltiplos de cotización',
      th: [
        { h: 'Múltiplos sobre el valor del capital', b: `<div class="f">PER = Precio por acción / BPA diluido = Valor del capital / Beneficio neto</div>
<p>El PER (P/E) es el múltiplo de capital más usado, normalmente sobre el BPA futuro (año actual y siguiente). Le afectan la estructura de capital y los impuestos.</p>` },
        { h: 'Múltiplos sobre el valor de empresa', b: `<ul><li><b>EV/EBITDA</b>: el más común; no depende de la estructura de capital, los impuestos ni la D&amp;A.</li><li><b>EV/EBIT</b>: útil cuando la D&amp;A es importante y varía entre comparables.</li><li><b>EV/Ventas</b>: para empresas con poco beneficio o beneficio negativo.</li></ul>
<p>Regla: numerador y denominador deben casar. El EV va con cifras antes de intereses; el valor del capital, con cifras después de intereses.</p>` },

<p><b>PEG</b> = PER ÷ crecimiento esperado del BPA. Ajusta el PER por crecimiento.</p>` }
      ],

        { t: 'mc', q: '¿Qué múltiplo es coherente?', o: ['EV / EBIT', 'EV / Beneficio neto', 'Valor del capital / EBITDA', 'Precio por acción / Ventas'], a: 0, e: 'El EBIT es antes de intereses, así que va con el EV.' },
        { t: 'match', q: 'Empareja cada sector con su múltiplo característico', p: [['Bancos', 'P / Valor contable tangible'], ['REIT', 'P / FFO'], ['Software en fase inicial', 'EV / Ventas'], ['Aerolíneas y retail', 'EV / EBITDAR']] },

        { t: 'tf', q: 'En una empresa que crece, el múltiplo EV/EBITDA futuro suele ser menor que el LTM.', a: true, e: 'El mismo EV dividido entre un EBITDA futuro mayor.' },
        { t: 'int', q: 'Entrevista: "¿Cuándo usarías EV/EBIT en vez de EV/EBITDA?"', m: 'Cuando la <b>D&amp;A es un coste económico real</b> que varía entre comparables: negocios intensivos en capital en los que el capex es parecido a la D&amp;A, o al comparar empresas con intensidades de activos muy distintas (por ejemplo, tener los activos en propiedad frente a alquilarlos). El EV/EBIT recoge el coste de mantener los activos que el EBITDA ignora.' }
      ]
    },
    {
      id: 'c1l7', title: 'Pasos IV y V: comparar y valorar',
      th: [
        { h: 'Paso IV: comparar', b: `<p>Pon las <b>magnitudes y ratios financieros</b> de los comparables (tamaño, márgenes, crecimiento, rentabilidad, crédito) junto a los del objetivo para ver cuáles se parecen de verdad. Después compara los <b>múltiplos de cotización</b> con la media, la mediana, el máximo y el mínimo.</p>
<p>A menudo se divide el grupo por niveles y se identifican los 2-3 <b>comparables más cercanos</b>, que anclan el rango. Los valores atípicos se analizan y quizá se excluyen.</p>` },
        { h: 'Paso V: determinar la valoración', b: `<p>Aplica un rango de múltiplos elegido a la cifra del objetivo.</p>
<p><b>EV/EBITDA</b>: rango 7,0x-9,0x, EBITDA 50 $ → EV 350-450 $. Menos deuda neta de 100 $ → capital 250-350 $. ÷ 30 M de acciones → <b>8,33-11,67 $ por acción</b>.</p>
<p><b>PER</b>: 15x × BPA de 2 $ → <b>30 $ por acción</b> directamente.</p>
<p>Los rangos se muestran en un "football field" junto con los demás métodos.</p>` },
        { h: 'Principales ventajas e inconvenientes', b: `<p><b>Ventajas</b>: basado en el mercado; relatividad (fácil de explicar); rápido y cómodo; actual.</p>
<p><b>Inconvenientes</b>: basado en el mercado (las burbujas y los pánicos se trasladan directamente); falta de comparables relevantes; posible desconexión del flujo de caja; no recoge cuestiones específicas de la empresa.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Rango EV/EBITDA de 7x-9x y EBITDA de 50 $. ¿EV en el punto medio?', a: 400, e: '8x × 50 = 400.' },
        { t: 'num', q: 'EV implícito 400 $, deuda neta 100 $, 30 M de acciones. ¿Precio por acción implícito?', a: 10, e: '(400 − 100) / 30 = 10.' },
        { t: 'num', q: 'Punto medio del rango de PER 15x y BPA del objetivo 2 $. ¿Precio por acción implícito?', a: 30, e: '15 × 2 = 30.' },
        { t: 'mc', q: '¿Por qué mirar la mediana además de la media?', o: ['Reduce el efecto de los valores atípicos', 'Siempre es más alta', 'Lo exige la SEC', 'Incluye una prima de control'], a: 0, e: 'Un comparable a 25x en un grupo a 8x distorsiona mucho más la media que la mediana.' },

        { t: 'match', q: 'Clasifica cada punto', p: [['Actual', 'Ventaja: refleja las condiciones de mercado más recientes'], ['Relatividad', 'Ventaja: fácil de explicar a un consejo'], ['Basado en el mercado', 'Inconveniente: burbujas y pánicos pasan al valor'], ['Falta de comparables', 'Inconveniente: pocos comparables reales en nichos']] },
        { t: 'int', q: 'Entrevista: "Dos empresas idénticas cotizan a 8x y 12x EV/EBITDA. ¿Por qué?"', m: 'Por diferencias en el <b>crecimiento esperado</b> (la principal), la <b>rentabilidad sobre el capital</b>, el <b>riesgo</b> (ciclicidad, concentración de clientes, apalancamiento), la <b>intensidad de capex</b>, la calidad de la dirección, la <b>liquidez</b> de la acción o la especulación sobre M&amp;A. Si de verdad fueran idénticas, sería una oportunidad de arbitraje.' }
      ]

        { h: 'El caso', b: `<p>Estás valorando <b>ValueCo</b>, una empresa privada (el ejemplo que recorre el libro). EBITDA LTM de 700 M$; el BPA proyectado no es relevante al ser privada.</p>

      ],
      ex: [
        { t: 'num', q: 'Seis comparables a 6,8x, 7,2x, 7,5x, 8,0x, 8,3x y 9,6x EV/EBITDA. ¿Media (x, 1 decimal)?', a: 7.9, tol: 0.05, u: 'x', e: 'Suma 47,4 / 6 = 7,9x.' },
