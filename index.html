      ],
      ex: [
        { t: 'num', q: 'Break-up fee of 3% on equity value of $2,000. Amount?', a: 60, e: '3% × 2,000 = 60.' },
        { t: 'mc', q: 'Who pays a reverse termination fee?', o: ['The buyer, if it fails to close', 'The target, if it accepts another bid', 'The banks', 'The regulator'], a: 0, e: 'Common where financing or antitrust risk exists.' },
        { t: 'tf', q: 'A go-shop lets the target actively seek superior bids for a limited period after signing.', a: true, e: 'Often used in sponsor deals negotiated with one buyer.' },
        { t: 'match', q: 'Match each provision to its meaning', p: [['No-shop', 'Target may not solicit other bids'], ['Fiduciary out', 'Board may accept a superior unsolicited offer'], ['MAC clause', 'Buyer may walk on a material adverse change'], ['Indemnification', 'Seller compensates for breaches of reps']] },
        { t: 'mc', q: 'A fairness opinion states that the price is:', o: ['Fair from a financial point of view', 'The highest possible', 'Approved by regulators', 'Tax efficient'], a: 0, e: 'It supports the board’s fiduciary duties.' },
        { t: 'int', q: 'Interview: "What is a fairness opinion and why does the board want one?"', m: 'A letter from an investment bank concluding that the consideration is <b>fair from a financial point of view</b> to shareholders, supported by comps, precedents, DCF and LBO analyses. It helps the board show it met its <b>fiduciary duties</b> and defend against litigation. It does not say the price is the best obtainable.' }
      ]
    },
    {
      id: 'c6l6', title: 'Closing and negotiated sales',
      th: [
        { h: 'Obtain necessary approvals', b: `<p><b>Regulatory</b>: in the US, <b>Hart-Scott-Rodino (HSR)</b> antitrust filing with a <b>30-day</b> initial waiting period (which can be extended by a "second request"); foreign antitrust (e.g. European Commission), <b>CFIUS</b> for foreign buyers in sensitive sectors, and industry regulators.</p>
<p><b>Shareholder approval</b> for public targets:</p>
<ul><li><b>One-step merger</b>: shareholders vote at a meeting after the proxy is filed and cleared. Slower.</li><li><b>Two-step tender offer</b>: the buyer tenders directly to shareholders; once it gets a majority it completes a back-end merger to squeeze out the rest. Faster, typical in cash deals.</li></ul>
<p><b>Financing and closing</b>: lenders fund, the price is paid, the deal closes.</p>` },
        { h: 'Negotiated sale', b: `<p>A one-on-one process with a single buyer, often initiated by the buyer. Faster, more confidential and flexible, with less disruption; but with less competitive tension, so the seller relies on the fairness opinion, a go-shop or a credible alternative to support value.</p>` }
      ],
      ex: [
        { t: 'num', q: 'What is the initial HSR waiting period in days?', a: 30, e: 'It can be extended by a second request.' },
        { t: 'mc', q: 'Why use a two-step tender offer instead of a one-step merger?', o: ['It is faster: buyer tenders directly and squeezes out the rest', 'It avoids antitrust review', 'It is cheaper in all cases', 'It does not need board approval'], a: 0, e: 'Typical in all-cash deals.' },
        { t: 'match', q: 'Match each approval to its purpose', p: [['HSR', 'US antitrust review'], ['CFIUS', 'US national security review of foreign buyers'], ['Shareholder vote', 'Owners approve the merger'], ['Second request', 'Extended antitrust inquiry']] },
        { t: 'tf', q: 'A negotiated sale usually involves less competitive tension than an auction.', a: true, e: 'Hence the reliance on a fairness opinion or go-shop.' },
        { t: 'mc', q: 'When does a negotiated sale make most sense?', o: ['A clear natural buyer and high need for confidentiality', 'Many interested buyers and no time pressure', 'Always', 'Only for public companies'], a: 0, e: 'E.g. a strategic partner who already knows the business.' },
        { t: 'int', q: 'Interview: "Walk me through a sell-side M&A process."', m: '<b>Preparation</b>: seller objectives, due diligence, valuation, buyer list, teaser, CIM and CA. <b>First round</b>: contact buyers, sign CAs, send the CIM and bid procedures, receive indications of interest, select a short list. <b>Second round</b>: management presentations, site visits, data room, draft agreement, binding bids. <b>Negotiations</b>: evaluate bids, negotiate, fairness opinion, board approval, sign. <b>Closing</b>: regulatory and shareholder approvals, financing, close.' }
      ]
    }
  ]
});

UNITS.push({
  id: 'c7', title: 'Buy-Side M&A', sub: 'Why and how buyers acquire: synergies, financing, structure, valuation and merger consequences', ch: 'Chapter 7', col: 'var(--u7)',
  lessons: [
    {
      id: 'c7l1', title: 'Buyer motivation and synergies',
      th: [
        { h: 'Why buy', b: `<p>Acquisitions accelerate growth beyond what is achievable organically: new products, customers, geographies, technology or talent, scale and market share. The central justification for paying a premium is <b>synergies</b>.</p>` },
        { h: 'Cost and revenue synergies', b: `<p><b>Cost synergies</b>: headcount reduction, consolidation of facilities, procurement savings, shared overhead and IT. More <b>reliable</b> and easier to quantify, so buyers and markets give them more credit.</p>
<p><b>Revenue synergies</b>: cross-selling, new channels, pricing power, combined offerings. Harder to achieve and often discounted.</p>
<p>Example: $20 of run-rate cost synergies capitalized at 8x ≈ <b>$160</b> of value before integration costs. How much of that is "paid away" in the premium is a key negotiation.</p>` }
      ],
      ex: [
        { t: 'mc', q: 'Which synergies are more reliable?', o: ['Cost synergies', 'Revenue synergies', 'Both equally', 'Neither'], a: 0, e: 'Cutting duplication is within the buyer’s control; selling more depends on customers.' },
        { t: 'num', q: '$20 of annual run-rate cost synergies valued at 8x. Capitalized value?', a: 160, e: '20 × 8 = 160.' },
        { t: 'tf', q: 'Markets typically give less credit to revenue synergies than to cost synergies.', a: true, e: 'They are harder to deliver and measure.' },
        { t: 'match', q: 'Classify each synergy', p: [['Closing a duplicate headquarters', 'Cost: footprint'], ['Combined purchasing power', 'Cost: procurement'], ['Selling the target’s product to buyer’s clients', 'Revenue: cross-selling'], ['Higher prices from reduced competition', 'Revenue: pricing']] },
        { t: 'mc', q: 'The "winner’s curse" in an auction means:', o: ['The winner is often the bidder who most overestimated value', 'The winner cannot resell', 'The loser pays a fee', 'The winner assumes the bank’s debt'], a: 0, e: 'Price discipline is key for buyers.' },
        { t: 'int', q: 'Interview: "Why do many acquisitions fail?"', m: 'Buyers <b>overpay</b> (overestimated synergies, auction fever), <b>integration</b> fails (systems, cultures, loss of key talent), <b>revenue synergies</b> do not materialize, due diligence misses problems, or the environment changes. Strategic logic alone does not create value if the price is too high.' }
      ]
    },
    {
      id: 'c7l2', title: 'Acquisition strategies',
      th: [
        { h: 'Three strategies', b: `<ul><li><b>Horizontal integration</b>: buying a competitor in the same business. Scale, market share and cost synergies; antitrust scrutiny.</li><li><b>Vertical integration</b>: buying a supplier (backward) or customer/distributor (forward). Control of the supply chain, margin capture, security of supply.</li><li><b>Conglomeration</b>: buying unrelated businesses. Diversification, but limited synergies; markets often apply a <b>conglomerate discount</b>.</li></ul>
<p>Also common: <b>tuck-in</b> or bolt-on acquisitions, small deals integrated into an existing business.</p>` }
      ],
      ex: [
        { t: 'match', q: 'Match each deal to its strategy', p: [['A bank buys another bank', 'Horizontal'], ['A carmaker buys a battery supplier', 'Vertical (backward)'], ['A brewer buys its distributors', 'Vertical (forward)'], ['A utility buys a fashion brand', 'Conglomeration']] },
        { t: 'mc', q: 'Which strategy faces the most antitrust scrutiny?', o: ['Horizontal integration', 'Conglomeration', 'Tuck-in of an unrelated business', 'None'], a: 0, e: 'Combining competitors raises market concentration.' },
        { t: 'tf', q: 'Conglomerates often trade at a discount to the sum of their parts.', a: true, e: 'Limited synergies, complexity and capital misallocation concerns.' },
        { t: 'mc', q: 'A key benefit of vertical integration is:', o: ['Control of the supply chain and margin capture', 'Removing a competitor', 'Diversifying into unrelated sectors', 'Avoiding all integration risk'], a: 0, e: 'Security of supply and capturing the supplier’s margin.' },
        { t: 'int', q: 'Interview: "What are the risks of a vertical acquisition?"', m: 'Loss of flexibility (being tied to an in-house supplier that may not be best-in-class), <b>channel conflict</b> with other customers or suppliers who now see you as a competitor, managing a business with different economics and skills, and potential regulatory concerns about <b>foreclosure</b> of rivals.' }
      ]
    },
    {
      id: 'c7l3', title: 'Form of financing',
      th: [
        { h: 'Cash on hand, debt, equity', b: `<ul><li><b>Cash on hand</b>: cheapest (cost = forgone interest income), no dilution, no new leverage; limited by the balance sheet.</li><li><b>Debt financing</b>: cheaper than equity and tax-deductible, no dilution; increases leverage, can pressure credit ratings and reduces flexibility.</li><li><b>Equity financing</b>: issuing stock to the seller or the market. Preserves balance sheet capacity and shares risk with the seller, but is the most <b>expensive</b> and <b>dilutes</b> existing shareholders.</li></ul>` },
        { h: 'Debt vs equity: the acquirer’s view', b: `<p>Debt is attractive when rates are low and the buyer has capacity within its target rating. Equity is attractive when the buyer’s shares are richly valued (a high P/E acts as "expensive currency"), when the deal is very large, or when it wants the seller to share integration risk.</p>
<p>Example: paying $600 in stock at $30 per share → <b>20M</b> new shares.</p>` }
      ],
      ex: [
        { t: 'mc', q: 'Which form of financing is typically cheapest?', o: ['Cash on hand', 'New equity', 'Mezzanine', 'Preferred stock'], a: 0, e: 'Its cost is the forgone interest on the cash.' },
        { t: 'num', q: 'Paying $600 in acquirer stock priced at $30. New shares issued (M)?', a: 20, e: '600 / 30 = 20.' },
        { t: 'mc', q: 'The acquirer’s shares trade at a P/E of 35x, well above peers. It will likely prefer to pay in:', o: ['Stock', 'Cash', 'It does not matter', 'PIK notes'], a: 0, e: 'Expensive currency: fewer shares for the same value.' },
        { t: 'tf', q: 'Debt financing dilutes existing shareholders’ ownership.', a: false, e: 'It adds leverage, not shares.' },
        { t: 'match', q: 'Match each financing to its main drawback', p: [['Cash on hand', 'Limited by the balance sheet'], ['Debt', 'Higher leverage and rating pressure'], ['Equity', 'Dilution and highest cost'], ['Mix of debt and equity', 'Balances cost and leverage']] },
        { t: 'int', q: 'Interview: "Why would an acquirer pay in stock rather than cash?"', m: 'If its <b>shares are richly valued</b>, it lacks <b>cash or debt capacity</b> (or would breach its rating target), it wants the seller to <b>share the risk</b> of integration, or the deal is close to a merger of equals. The cost is <b>dilution</b> of existing shareholders and usually a higher cost of capital.' }
      ]
    },
    {
      id: 'c7l4', title: 'Deal structure: stock sale vs asset sale',
      th: [
        { h: 'Stock sale', b: `<p>The buyer acquires the target’s <b>stock</b> from its shareholders and inherits <b>all assets and liabilities</b>, including unknown ones. Simple to execute (contracts stay in place). The tax basis of assets carries over: <b>no step-up</b>. For the seller, gains are taxed once at the shareholder level.</p>` },
        { h: 'Asset sale', b: `<p>The buyer acquires specific <b>assets</b> and assumes chosen liabilities. It gets a <b>tax basis step-up</b> to the purchase price, creating tax-deductible depreciation and amortization (including goodwill, amortizable over 15 years for US tax). A C-corp seller may face <b>double taxation</b> (corporate gain, then distribution to shareholders). Requires more consents (contracts, permits).</p>` },
        { h: 'Stock sales treated as asset sales', b: `<p><b>Section 338(h)(10)</b> election: for targets that are subsidiaries of a corporation or S corporations, buyer and seller jointly elect to treat a stock purchase as an asset purchase for tax. The buyer gets the step-up with the legal simplicity of a stock deal. <b>Section 336(e)</b> provides a similar result in certain other situations. The buyer often pays more to compensate the seller for any extra tax.</p>` }
      ],
      ex: [
        { t: 'mc', q: 'A key advantage of an asset sale for the buyer is:', o: ['A tax basis step-up and choosing which liabilities to assume', 'Always paying less', 'Inheriting all liabilities', 'No contract needed'], a: 0, e: 'Future tax-deductible D&A.' },
        { t: 'tf', q: 'In a stock sale, the buyer inherits all of the target’s liabilities, known and unknown.', a: true, e: 'Hence the importance of reps, warranties and indemnities.' },
        { t: 'fill', q: 'A 338(h)(10) election lets a stock purchase be treated as a purchase of ___ for tax purposes', o: ['assets', 'debt', 'options', 'patents only'], a: 0, e: 'Combining legal simplicity with the tax step-up.' },
        { t: 'num', q: 'Tax basis step-up of $300 amortized over 15 years, tax rate 25%. Annual tax savings ($)?', a: 5, e: '300 / 15 = 20 of deductions × 25% = 5.' },
        { t: 'mc', q: 'Why might a C-corp seller resist an asset sale?', o: ['Double taxation: corporate gain, then distribution', 'It cannot sign contracts', 'It loses its auditors', 'It must buy back shares'], a: 0, e: 'Buyers may pay more to compensate.' },
        { t: 'int', q: 'Interview: "Stock deal or asset deal: what does each side prefer?"', m: 'The <b>buyer</b> generally prefers an <b>asset deal</b>: it picks the assets and liabilities it wants and gets a <b>step-up</b> in tax basis (valuable future deductions). The <b>seller</b> generally prefers a <b>stock deal</b>: a clean exit with all liabilities transferred and a single layer of tax. A 338(h)(10) election can bridge the gap when the target qualifies, with the buyer compensating the seller for any extra tax.' }
      ]
    },
    {
      id: 'c7l5', title: 'Buy-side valuation',
      th: [
        { h: 'Football field', b: `<p>The buyer’s banker presents valuation ranges from comps, precedents, DCF, LBO (and sometimes 52-week trading range and analyst price targets) on one chart, with the current price and potential offer prices marked. The buyer also values <b>synergies</b> separately.</p>` },
        { h: 'Analysis at various prices', b: `<p>For a range of offer prices, show the implied <b>premiums</b> (to the unaffected and 52-week high) and <b>multiples</b> (EV/EBITDA, P/E) to see where offers fall versus precedents.</p>
<p>Example: unaffected price $22. Offers of $25, $27.50 and $30 imply premiums of 13.6%, 25.0% and 36.4%.</p>` },
        { h: 'Contribution analysis', b: `<p>In stock-for-stock deals, compare each company’s <b>contribution</b> to the combined sales, EBITDA and net income with its <b>pro forma ownership</b>. If the target contributes 20% of EBITDA but its shareholders receive only 14% of the combined company, the deal looks favorable to the buyer.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Unaffected price $22, offer $27.50. Premium (%)?', a: 25, u: '%', e: '27.5 / 22 − 1 = 25%.' },
        { t: 'num', q: 'Unaffected price $22, offer $30. Premium (%, 1 decimal)?', a: 36.4, tol: 0.1, u: '%', e: '30 / 22 − 1 = 36.4%.' },
        { t: 'num', q: 'Buyer EBITDA $400, target EBITDA $100. Target’s contribution to combined EBITDA (%)?', a: 20, u: '%', e: '100 / 500 = 20%.' },
        { t: 'num', q: 'Buyer has 100M shares and issues 16.7M to the target. Target shareholders’ pro forma ownership (%, 1 decimal)?', a: 14.3, tol: 0.1, u: '%', e: '16.7 / 116.7 = 14.3%.' },
        { t: 'mc', q: 'Contribution analysis is most relevant for:', o: ['Stock-for-stock deals', 'All-cash deals', 'Debt refinancings', 'IPOs'], a: 0, e: 'It compares contributions with ownership in the combined company.' },
        { t: 'int', q: 'Interview: "How would you decide what to offer for a public target?"', m: 'Build the <b>football field</b> (comps, precedents, DCF, LBO, trading range) and the <b>value of synergies</b>. Run <b>analysis at various prices</b> to see premiums and multiples versus precedents. Check <b>merger consequences</b>: accretion/dilution, credit impact and, for stock deals, <b>contribution analysis</b>. Then pick an opening offer that is credible versus precedents but leaves room to negotiate, and a walk-away price below standalone value plus the synergies you are willing to share.' }
      ]
    },
    {
      id: 'c7l6', title: 'Merger consequences: purchase price and balance sheet effects',
      th: [
        { h: 'Purchase price assumptions', b: `<p>Offer price per share and premium, fully diluted shares, implied equity value and EV, the <b>consideration mix</b> (cash/stock), the financing (new debt terms, shares issued at what price), and transaction fees.</p>` },
        { h: 'Balance sheet effects', b: `<ul><li>Target assets and liabilities recorded at <b>fair value</b> (purchase price allocation): <b>write-ups</b> of PP&amp;E and new <b>identifiable intangibles</b> (customer relationships, brands, technology).</li><li><b>Goodwill</b> = purchase equity price − fair value of net identifiable assets (after write-ups and DTL).</li><li><b>Deferred tax liability (DTL)</b>: in a stock deal, book write-ups have no tax basis, so DTL = write-up × tax rate, which <b>increases</b> goodwill.</li><li>New debt, cash used, new shares; pro forma credit statistics.</li></ul>
<p>Example: price $1,000; book equity $400; intangible write-up $200; tax 25% → DTL $50; goodwill = 1,000 − (400 + 200 − 50) = <b>$450</b>.</p>
<p>Goodwill is not amortized (tested for impairment); write-ups and intangibles are, reducing future earnings.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Price $1,000, book equity $400, intangible write-up $200, no DTL. Goodwill?', a: 400, e: '1,000 − 600 = 400.' },
        { t: 'num', q: 'Stock deal: write-up of $200 with no tax basis, tax rate 25%. DTL created?', a: 50, e: '200 × 25% = 50.' },
        { t: 'num', q: 'Price $1,000, book equity $400, write-up $200, DTL $50. Goodwill?', a: 450, e: '1,000 − (400 + 200 − 50) = 450.' },
        { t: 'tf', q: 'Under US GAAP goodwill is amortized every year.', a: false, e: 'It is tested for impairment at least annually.' },
        { t: 'num', q: '$100 of new customer-relationship intangibles amortized over 10 years, tax 25%. After-tax annual hit to net income?', a: 7.5, e: '10 × 0.75 = 7.5.' },
        { t: 'mc', q: 'Goodwill represents:', o: ['The price paid above the fair value of identifiable net assets', 'The target’s cash', 'Assumed debt', 'Patents'], a: 0, e: 'Synergies, workforce, market position: unidentifiable value.' },
        { t: 'int', q: 'Interview: "Walk me through what happens to the three statements when goodwill is impaired by $100 (not tax-deductible)."', m: '<b>IS:</b> $100 impairment charge; not deductible, so net income falls $100. <b>CFS:</b> added back as non-cash; cash unchanged. <b>BS:</b> goodwill −100, retained earnings −100. If it were deductible, net income would fall $75 and cash would rise $25 from lower taxes.' }
      ]
    },
    {
      id: 'c7l7', title: 'Accretion/(dilution) analysis',
      th: [
        { h: 'The calculation', b: `<div class="f">Pro forma EPS = [Acquirer NI + Target NI + Synergies × (1−t) − New interest × (1−t) − Forgone interest on cash × (1−t) − New D&amp;A from write-ups × (1−t)] / (Acquirer shares + New shares)</div>
<p>Accretive if pro forma EPS > standalone EPS; dilutive if lower.</p>` },
        { h: 'Shortcuts', b: `<p><b>All-stock deal</b>: accretive (before synergies and adjustments) if the acquirer’s P/E is <b>higher</b> than the P/E paid for the target.</p>
<p><b>All-cash (debt) deal</b>: accretive if the target’s <b>earnings yield</b> (1 / P/E paid) exceeds the after-tax cost of debt.</p>
<p><b>Breakeven synergies</b>: the pre-tax synergies needed to make the deal neutral = after-tax dilution / (1 − t).</p>
<p>Accretion is not value creation: an accretive deal can still destroy value if overpaid.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Acquirer NI $100, 50M shares at $40. Target NI $20 bought for $300 in stock. Pro forma EPS (2 decimals)?', a: 2.09, tol: 0.01, e: '7.5M new shares; 120 / 57.5 = 2.087.' },
        { t: 'mc', q: 'All-stock deal: acquirer P/E 20x, P/E paid 15x. Result?', o: ['Accretive', 'Dilutive', 'Neutral', 'Cannot tell'], a: 0, e: 'The acquirer buys earnings more cheaply than its own.' },
        { t: 'num', q: 'Target NI $20, purchase price $300 paid with debt at 6%, tax 25%. Acquirer NI $100, 50M shares. Pro forma EPS (2 decimals)?', a: 2.13, tol: 0.01, e: 'After-tax interest 13.5; (120 − 13.5) / 50 = 2.13.' },
        { t: 'num', q: 'A deal is dilutive by $6 of net income; tax 25%. Breakeven pre-tax synergies?', a: 8, e: '6 / 0.75 = 8.' },
        { t: 'tf', q: 'A dilutive deal always destroys shareholder value.', a: false, e: 'It may be dilutive near term (amortization, integration) yet create value long term.' },
        { t: 'mc', q: 'In an all-debt deal, the deal is accretive if:', o: ['Target earnings yield > after-tax cost of debt', 'Target P/E is very high', 'The buyer has lots of cash', 'Rates are rising'], a: 0, e: '1 / P/E paid compared with rd × (1 − t).' },
        { t: 'int', q: 'Interview: "What makes an acquisition dilutive?"', m: 'The target’s earnings do not cover the cost of the financing: in stock, paying a <b>higher P/E</b> than your own; in cash or debt, an <b>after-tax cost</b> above the target’s earnings yield. Plus the <b>amortization of new intangibles</b> and write-ups, forgone interest on cash, and integration costs. <b>Synergies</b> offset the dilution.' }
      ]
    },
    {
      id: 'c7l8', title: 'Scenarios: 50/50, all cash, all stock',
      th: [
        { h: 'BuyerCo acquires ValueCo (simplified)', b: `<ul><li>BuyerCo: NI $200, 100M shares at $30 → EPS <b>$2.00</b>, P/E 15x.</li><li>ValueCo: NI $30; offer $500 (P/E paid 16.7x).</li><li>New debt at 6%; tax 25%; synergies $20 pre-tax ($15 after tax).</li></ul>` },
        { h: 'Three scenarios (with synergies)', b: `<ul><li><b>I) 50% stock / 50% cash</b>: debt 250 → after-tax interest 11.25; new shares 8.33. NI 233.75 / 108.33 = <b>$2.16 (+7.9%)</b>.</li><li><b>II) 100% cash</b>: debt 500 → after-tax interest 22.5. NI 222.5 / 100 = <b>$2.23 (+11.3%)</b>.</li><li><b>III) 100% stock</b>: 16.67M new shares. NI 245 / 116.67 = <b>$2.10 (+5.0%)</b>.</li></ul>
<p>Without synergies: 50/50 $2.02; all cash $2.08; all stock <b>$1.97 (dilutive)</b> because the P/E paid (16.7x) exceeds BuyerCo’s (15x).</p>
<p>All cash is most accretive but adds the most leverage: check the rating impact.</p>` }
      ],
      ex: [
        { t: 'num', q: 'BuyerCo pays $250 in its own stock at $30. New shares (M, 2 decimals)?', a: 8.33, tol: 0.01, e: '250 / 30 = 8.33.' },
        { t: 'num', q: '50/50 scenario: NI 200 + 30 − 11.25 + 15 over 108.33M shares. Pro forma EPS (2 decimals)?', a: 2.16, tol: 0.01, e: '233.75 / 108.33 = 2.16.' },
        { t: 'num', q: 'All-cash scenario: $500 of debt at 6%, tax 25%, synergies $15 after tax. Pro forma EPS (2 decimals)?', a: 2.23, tol: 0.01, e: '(200 + 30 − 22.5 + 15) / 100 = 2.225.' },
        { t: 'num', q: 'All-stock scenario: 16.67M new shares, NI 200 + 30 + 15. Pro forma EPS (2 decimals)?', a: 2.1, tol: 0.01, e: '245 / 116.67 = 2.10.' },
        { t: 'mc', q: 'Without synergies, why is the all-stock deal dilutive?', o: ['P/E paid (16.7x) is above BuyerCo’s P/E (15x)', 'Interest is too high', 'Taxes rise', 'Goodwill is amortized'], a: 0, e: 'Issuing shares at 15x to buy earnings at 16.7x dilutes.' },
        { t: 'num', q: 'ValueCo NI $30 bought for $500. Earnings yield (%)?', a: 6, u: '%', e: '30 / 500 = 6%, above the 4.5% after-tax cost of debt, so cash is accretive.' },
        { t: 'int', q: 'Interview: "The deal is 8% accretive. Would you tell the board to do it?"', m: 'Not on that basis alone. Accretion depends on the <b>financing mix</b> and accounting; it does not show value creation. I would check the price against <b>standalone valuation</b> (DCF, comps, precedents) plus a realistic value of <b>synergies</b> net of integration costs, the credibility of those synergies, the <b>credit impact</b> of new debt, and strategic fit. Without synergies this deal is roughly neutral, so most of its appeal depends on delivering them.' }
      ]
    }
  ]
});
UNITS.push({
  id: 'c8', title: 'Initial Public Offerings', sub: 'Why companies go public, who is involved, the key terms and the alternatives', ch: 'Chapter 8', col: 'var(--u9)',
  lessons: [
    {
      id: 'c8l1', title: 'Why companies go public',
      th: [
        { h: 'Reasons to IPO', b: `<ul><li><b>Access to capital</b>: primary proceeds fund growth, M&amp;A or deleveraging, and open the door to future equity and debt markets.</li><li><b>Liquidity and monetization</b> for founders, employees and investors (PE and VC), now and through later sell-downs.</li><li><b>Acquisition currency</b>: publicly traded stock can be used to pay for acquisitions.</li><li><b>Employee compensation</b>: liquid stock makes equity awards more valuable for hiring and retention.</li><li><b>Brand and profile</b> with customers, partners and suppliers; a market-based valuation.</li></ul>` },
        { h: 'The costs', b: `<p>Underwriting fees and expenses, ongoing <b>public company costs</b> (reporting, SOX compliance, investor relations), <b>disclosure</b> of sensitive information, quarterly earnings pressure, loss of some control, securities litigation exposure and market volatility.</p>` }
      ],
      ex: [
        { t: 'match', q: 'Match each benefit to its description', p: [['Access to capital', 'Primary proceeds fund growth'], ['Liquidity', 'Owners can sell shares over time'], ['Acquisition currency', 'Stock used to pay for deals'], ['Employee compensation', 'Liquid equity awards']] },
        { t: 'mc', q: 'Which is a cost of being public?', o: ['Ongoing reporting and SOX compliance', 'Access to equity markets', 'Liquid stock for employees', 'A market valuation'], a: 0, e: 'Public companies bear significant compliance and disclosure burdens.' },
        { t: 'tf', q: 'An IPO usually lets existing owners sell all their shares at once.', a: false, e: 'Owners typically sell a portion and the rest later, subject to lock-ups.' },
        { t: 'mc', q: 'Why does a public listing help with M&A?', o: ['Listed stock can be used as consideration', 'It removes antitrust review', 'It eliminates due diligence', 'It lowers taxes automatically'], a: 0, e: 'Stock is an acquisition currency.' },
        { t: 'int', q: 'Interview: "Why would a company IPO instead of selling to a sponsor?"', m: '<b>IPO</b>: owners keep control and upside, the company raises primary capital, gets an acquisition currency and liquid equity for employees, and a public profile. Costs: fees, disclosure, gradual exit, market risk. <b>Sale to a sponsor</b>: immediate, full liquidity with a control premium and more certainty, but owners give up the future upside. The choice depends on desire for liquidity, growth plans, market conditions and control.' }

    },
    {

<p>Together these form the <b>equity story</b> told to investors.</p>` }

        { t: 'match', q: 'Match each characteristic to an example', p: [['Moat', 'Strong network effects'], ['Attractive industry', 'Large and growing addressable market'], ['Favorable risk profile', 'Diversified customer base'], ['Healthy financial profile', 'Growth with improving margins']] },
        { t: 'tf', q: 'The equity story is the narrative that ties a company’s strengths to its investment case.', a: true, e: 'It frames the roadshow and prospectus.' },
        { t: 'mc', q: 'How do IPO candidates differ from ideal LBO candidates?', o: ['IPO investors prize growth; LBOs prize stable cash flow for debt service', 'They are identical', 'LBOs need faster growth', 'IPOs need more leverage'], a: 0, e: 'Different investors, different priorities.' },
        { t: 'int', q: 'Interview: "What makes a company a good IPO candidate?"', m: 'An <b>attractive industry</b> with a large addressable market, a <b>strong and defensible position</b> (moat, barriers to entry), <b>visible growth</b>, a <b>healthy financial profile</b> or a credible path to profitability, <b>differentiated products</b>, a <b>favorable risk profile</b>, and a <b>proven management team</b> that can meet public market expectations. Together they make a compelling equity story.' }

    {
      id: 'c8l3', title: 'Key participants',

        { h: 'Who does what', b: `<ul><li><b>Investment banks</b>: <b>bookrunners</b> (the lead-left runs the process and the book; active and passive bookrunners) and <b>co-managers</b>. They advise on structure and valuation, lead due diligence, draft the prospectus with counsel, market the deal, build the book, price, allocate and stabilize.</li>
<li><b>Company management</b>: CEO and CFO tell the equity story and lead the roadshow; the board approves.</li>

        { t: 'mc', q: 'What is a comfort letter?', o: ['Auditors’ letter to underwriters on the financial data in the prospectus', 'A thank-you letter to investors', 'A lock-up agreement', 'The fairness opinion'], a: 0, e: 'Supports the underwriters’ due diligence defense.' },

        { t: 'mc', q: 'Cornerstone or anchor investors:', o: ['Commit to buy a significant amount before or early in the offering', 'Run the stock exchange', 'Audit the company', 'Draft the prospectus'], a: 0, e: 'They lend credibility and de-risk the deal.' },
        { t: 'int', q: 'Interview: "What does an investment bank do in an IPO?"', m: 'It <b>advises</b> on timing, structure and valuation, leads <b>due diligence</b>, drafts the <b>registration statement</b> with counsel, positions the <b>equity story</b>, organizes research and the salesforce teach-in, runs the <b>roadshow</b>, builds the <b>order book</b>, recommends the <b>price</b> and <b>allocation</b>, <b>underwrites</b> the shares, and supports trading through <b>stabilization</b> and the greenshoe.' }

        { h: 'Primary vs secondary', b: `<p><b>Primary shares</b>: newly issued; proceeds go to the <b>company</b> (dilutive to existing owners). <b>Secondary shares</b>: sold by existing holders; proceeds go to the <b>sellers</b>. Investors prefer seeing proceeds used to grow the business and insiders keeping meaningful stakes.</p>
<p>Example: 6M primary shares at $20 → gross proceeds $120M; with a 7% gross spread the company nets <b>$111.6M</b> before other expenses.</p>` },

<ul><li>If the stock <b>trades up</b>, they exercise the option to cover the short.</li><li>If it <b>trades down</b>, they buy shares in the market to cover, supporting the price (<b>stabilization</b>).</li></ul>` }

        { t: 'num', q: '20M shares offered; 100M shares outstanding after the IPO. Float (%)?', a: 20, u: '%', e: '20 / 100 = 20%.' },
        { t: 'mc', q: 'Proceeds from secondary shares go to:', o: ['The selling shareholders', 'The company', 'The underwriters', 'The exchange'], a: 0, e: 'Primary proceeds go to the company.' },
        { t: 'mc', q: 'If the stock falls after the IPO, underwriters cover their greenshoe short by:', o: ['Buying shares in the market, supporting the price', 'Exercising the option', 'Cancelling the IPO', 'Issuing bonds'], a: 0, e: 'That is stabilization.' },
        { t: 'tf', q: 'Primary shares dilute existing shareholders’ ownership percentage.', a: true, e: 'New shares increase the total count.' },
        { t: 'int', q: 'Interview: "How does the greenshoe work and why is it useful?"', m: 'Underwriters <b>over-allot</b> up to 15% more shares than the base offering, going short, and hold a 30-day option to buy that many shares from the issuer at the IPO price. If the stock rises, they <b>exercise</b> the option to cover; if it falls, they <b>buy in the market</b>, which supports the price. It gives the deal flexibility to meet demand and a built-in <b>stabilization</b> mechanism.' }

    },
    {
      id: 'c8l5', title: 'Key terms: syndicate, lock-up, exchange, gross spread',
      th: [
        { h: 'Syndicate structure', b: `<p><b>Bookrunners</b> (lead-left, other active bookrunners, passive bookrunners) and <b>co-managers</b>. The issuer allocates <b>economics</b> (share of fees) by role; the lead-left usually gets the largest share and the "left" position on the prospectus cover.</p>` },
        { h: 'Lock-up and listing', b: `<p><b>Lock-up provision</b>: insiders and existing holders agree not to sell for a period, typically <b>180 days</b>, sometimes with staggered or performance-based early releases. Lock-up expiry can pressure the stock.</p>
<p><b>Listing exchange</b>: NYSE or Nasdaq, chosen on brand, peer listings, fees, listing standards and services. The exchange partner helps with marketing and listing day.</p>` },
        { h: 'Gross spread', b: `<p>The underwriting discount: the difference between the IPO price and what the issuer receives. Historically around <b>7%</b> for many mid-sized US IPOs, lower (e.g. 4-5% or less) for very large deals. Traditionally split into a <b>management fee</b> (~20%), <b>underwriting fee</b> (~20%) and <b>selling concession</b> (~60%).</p>

        { t: 'num', q: 'Typical IPO lock-up period in days?', a: 180, e: 'Sometimes with early releases.' },
        { t: 'tf', q: 'Lock-up expiry can put downward pressure on the stock.', a: true, e: 'A large supply of shares can come to market.' },
        { t: 'mc', q: 'The "lead-left" bookrunner is:', o: ['The bank running the book, listed top-left on the cover', 'The bank with the smallest fee', 'The issuer’s auditor', 'The exchange'], a: 0, e: 'It coordinates the syndicate and the process.' },
        { t: 'match', q: 'Match each term to its meaning', p: [['Gross spread', 'Underwriters’ discount on the IPO price'], ['Selling concession', 'Largest piece of the spread'], ['Lock-up', 'Insiders cannot sell for a period'], ['Passive bookrunner', 'Bookrunner title with a limited role']] },
        { t: 'int', q: 'Interview: "Why do insiders agree to a lock-up?"', m: 'Because new investors want reassurance that insiders will not dump shares right after the IPO, which would pressure the price and signal a lack of confidence. Underwriters require it to support an orderly <b>aftermarket</b>. In exchange, insiders benefit from a better-received deal and more stable trading.' }
      ]
    },
    {
      id: 'c8l6', title: 'Dual-track, SPACs and direct listings',
      th: [
        { h: 'Dual-track process', b: `<p>Preparing an IPO and running an <b>M&amp;A sale</b> in parallel. The IPO creates a valuation benchmark and competitive tension; the owners pick the better outcome (often a sale if a buyer pays a premium over the expected IPO value). It costs more time and money.</p>` },
        { h: 'SPACs', b: `<p>A <b>special purpose acquisition company</b> is a blank-check shell that IPOs (typically units at <b>$10</b>, each a share plus a fraction of a warrant), puts the cash in a <b>trust</b>, and has about <b>18-24 months</b> to merge with a private company (the <b>de-SPAC</b>).</p>
<ul><li>The <b>sponsor</b> receives a <b>promote</b>: founder shares equal to ~20% of post-IPO shares for a nominal price.</li><li>Public holders can <b>redeem</b> their shares for cash from the trust at the merger vote.</li><li>A <b>PIPE</b> often adds capital alongside.</li></ul>` },
        { h: 'Direct listings', b: `<p>Existing shares are listed and trade directly, without a traditional underwritten offering: no bookbuilding, typically no lock-up, lower fees. The opening price is set by the exchange’s <b>opening auction</b> (with a reference price). Originally no new capital was raised; exchanges now permit <b>primary direct listings</b>. Best for well-known companies that do not need capital.</p>` }
      ],
      ex: [
        { t: 'mc', q: 'What is a dual-track process?', o: ['Preparing an IPO while running a sale process in parallel', 'Listing on two exchanges', 'Selling two share classes', 'A two-round auction'], a: 0, e: 'Owners choose the better path.' },
        { t: 'num', q: 'A SPAC sells 20M public shares; the sponsor promote is 20% of post-IPO shares. Founder shares (M)?', a: 5, e: 'Founder = 20% of total → 0.25 × public = 5M (5 / 25 = 20%).' },
        { t: 'num', q: 'A SPAC trust holds $200M and 60% of public holders redeem. Cash left in trust ($M)?', a: 80, e: '40% × 200 = 80.' },
        { t: 'tf', q: 'A traditional direct listing involves underwriters building an order book.', a: false, e: 'No bookbuilding; the exchange auction sets the opening price.' },
        { t: 'match', q: 'Match each route to a feature', p: [['SPAC', 'Blank-check company with cash in trust'], ['Direct listing', 'Opening auction sets the price'], ['Traditional IPO', 'Bookbuilding and underwriting'], ['Dual-track', 'IPO and sale run in parallel']] },
        { t: 'mc', q: 'Why can a SPAC’s sponsor promote be costly for the target’s owners?', o: ['It dilutes the combined company for little capital contributed', 'It adds debt', 'It is paid by the SEC', 'It lowers the trust value'], a: 0, e: 'Plus warrants and redemptions add dilution.' },
        { t: 'int', q: 'Interview: "Compare an IPO, a direct listing and a SPAC merger."', m: '<b>IPO</b>: raises capital with underwriting and bookbuilding; price discovery and stabilization, but an IPO discount, fees and a lock-up. <b>Direct listing</b>: lists existing shares without underwriting; cheaper, no lock-up, no dilution, but less price support and suited to well-known companies. <b>SPAC</b>: a merger with a listed shell; negotiated valuation and speed, possible PIPE capital, but sponsor promote, warrants and redemptions create dilution and uncertainty.' }
      ]
    },
    {
      id: 'c8l7', title: 'Post-IPO offerings and IPO considerations',
      th: [
        { h: 'Post-IPO equity offerings', b: `<ul><li><b>Follow-on offerings</b>: primary (new capital) or secondary (sponsor sell-downs).</li><li><b>Marketed offering</b>: a short roadshow over a few days.</li><li><b>Overnight / accelerated bookbuild</b>: launched after the close, priced before the next open.</li><li><b>Block trade / bought deal</b>: a bank buys the block at a discount and resells it, taking the risk.</li><li><b>At-the-market (ATM) program</b>: the company sells shares gradually into the market.</li><li><b>Confidentially marketed public offering (CMPO)</b>, registered directs, and <b>convertibles</b>.</li></ul>` },
        { h: 'IPO considerations', b: `<p><b>Valuation</b>: based on peers’ forward multiples and DCF, then an <b>IPO discount</b> (often ~10-15%) to fair value so new investors earn a return and the stock trades well.</p>
<p>Also: use of proceeds, dividend policy, governance (dual-class shares, controlled company exemptions), board composition, equity incentive plans and the timing of future sell-downs.</p>
<p>Example: fair value $25 per share with a 15% IPO discount → <b>$21.25</b>.</p>` }
      ],
      ex: [

        { t: 'match', q: 'Match each offering to its feature', p: [['Overnight offering', 'Launched after close, priced before open'], ['Block trade', 'Bank buys the block and takes the risk'], ['ATM program', 'Gradual sales into the market'], ['Marketed follow-on', 'Short roadshow over a few days']] },
        { t: 'mc', q: 'Why price an IPO at a discount to fair value?', o: ['To attract investors and support aftermarket performance', 'Because the SEC requires it', 'To raise more money', 'To reduce fees'], a: 0, e: 'A good first-day trade builds a healthy shareholder base.' },
        { t: 'tf', q: 'A secondary follow-on offering by a PE sponsor raises new capital for the company.', a: false, e: 'Proceeds go to the selling sponsor.' },
        { t: 'mc', q: 'Dual-class share structures typically:', o: ['Give founders more voting control than their economic stake', 'Pay higher dividends', 'Remove the lock-up', 'Are banned on US exchanges'], a: 0, e: 'Common in tech IPOs; some index providers restrict them.' },
        { t: 'int', q: 'Interview: "How would you value a company for its IPO?"', m: 'Mainly with <b>comps</b>: forward multiples (EV/Sales, EV/EBITDA, P/E or sector metrics) of listed peers, adjusted for growth and margins, supported by a <b>DCF</b>. That gives a fair value range; then apply an <b>IPO discount</b> (often ~10-15%) to arrive at the price range. The range is refined with investor feedback from testing-the-waters and the order book.' }

        { h: 'Manage corporate housekeeping', b: `<ul><li><b>Governance</b>: independent directors, audit, compensation and nominating committees, charter and bylaws.</li><li><b>Financial reporting</b>: PCAOB-audited financials (two years for emerging growth companies, three otherwise), quarterly close readiness, internal controls and <b>SOX</b> compliance planning.</li><li><b>Capitalization clean-up</b>: share classes, convertible preferred conversion, equity plans.</li><li>Legal entity and <b>tax structure</b>, key contracts, IP, management team and IR function.</li></ul>` }

        { t: 'match', q: 'Match each housekeeping item to its purpose', p: [['Audit committee', 'Oversees financial reporting'], ['PCAOB audit', 'Financials meet public standards'], ['SOX planning', 'Internal controls readiness'], ['Preferred conversion', 'Simplify the cap table']] },
        { t: 'tf', q: 'Emerging growth companies may present two years of audited financials in their IPO registration statement.', a: true, e: 'Instead of three, under the JOBS Act.' },
        { t: 'mc', q: 'Why convert VC preferred stock at the IPO?', o: ['To simplify the capital structure into common stock', 'To raise more debt', 'To avoid audits', 'To delay the IPO'], a: 0, e: 'Public investors expect a clean common equity structure.' },
        { t: 'int', q: 'Interview: "What does a company need to do before it can IPO?"', m: 'Assemble the <b>team</b> (banks, lawyers, auditors, exchange), get <b>audited financials</b> to public standards and a reliable reporting process, build <b>governance</b> (independent board, committees), plan <b>SOX</b> compliance, clean up the <b>capital structure</b> and equity plans, decide the <b>tax/legal structure</b> (C corp vs Up-C), and develop the <b>equity story</b>, KPIs and investor relations capability.' }
      ]

    {
      id: 'c9l2', title: 'C Corp vs Up-C and IPO timing',
      th: [
        { h: 'C Corp vs Up-C', b: `<p>A standard <b>C corporation</b> IPO: the operating company is a corporation that lists directly and pays corporate tax.</p>
<p>An <b>Up-C</b> is used when the business is a pass-through (LLC/partnership):</p>
<ul><li>A new <b>PubCo</b> (a C corp) IPOs and uses proceeds to buy <b>units</b> in the operating partnership (OpCo).</li><li>Pre-IPO owners keep their OpCo units (still pass-through, avoiding entity-level tax) plus voting shares in PubCo; units are <b>exchangeable</b> into PubCo shares.</li><li>Exchanges give PubCo a <b>tax basis step-up</b>; under a <b>tax receivable agreement (TRA)</b> PubCo typically pays pre-IPO owners <b>85%</b> of the realized tax savings.</li></ul>` },
        { h: 'Determine IPO timing', b: `<p>Balance <b>market conditions</b> (equity market levels, volatility, recent IPO performance, investor appetite for the sector) with <b>company readiness</b> (financial results, a story of beats, not misses). Mind the <b>staleness</b> of financial statements: in the US they go stale 135 days after the period end, which constrains the launch window.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Up-C: PubCo realizes $40M of tax savings from exchanges, TRA at 85%. Payment to pre-IPO owners ($M)?', a: 34, e: '85% × 40 = 34.' },
        { t: 'mc', q: 'Why use an Up-C structure?', o: ['Pre-IPO owners of a pass-through keep single-level taxation and share in the step-up', 'It avoids SEC registration', 'It eliminates lock-ups', 'It raises more debt'], a: 0, e: 'Tax efficiency for existing owners.' },
        { t: 'tf', q: 'In an Up-C, pre-IPO owners can exchange their OpCo units for PubCo shares.', a: true, e: 'Usually one-for-one.' },
        { t: 'num', q: 'Days after the period end when US financial statements go stale for an IPO?', a: 135, e: 'You need newer financials after that.' },
        { t: 'mc', q: 'Which factor most supports opening an IPO window?', o: ['Low volatility and strong recent IPO performance', 'A sharp market sell-off', 'Missed earnings', 'Pending litigation'], a: 0, e: 'Investor appetite follows market conditions and recent deals.' },
        { t: 'int', q: 'Interview: "Explain an Up-C in simple terms."', m: 'The operating business stays a <b>partnership</b> owned partly by the original owners. A new <b>public corporation</b> sells shares in the IPO and uses the money to buy partnership units, so public investors own the business through PubCo. Original owners keep their units (taxed once, as a pass-through) and can <b>exchange</b> them for public shares later. Each exchange creates a <b>tax step-up</b> for PubCo, and a <b>TRA</b> pays most (typically 85%) of those savings back to the original owners.' }
      ]
    },
    {
      id: 'c9l3', title: 'Offering structure, valuation and the org meeting',
      th: [
        { h: 'Offering structure and preliminary valuation', b: `<p>Bankers and the company decide the <b>size</b>, <b>primary/secondary</b> mix, greenshoe, use of proceeds and post-IPO capitalization. Preliminary valuation uses <b>comps</b> (forward multiples), DCF and sometimes precedents, then an IPO discount.</p>
<p>Pre-money vs post-money: <b>post-money equity value = pre-money equity value + primary proceeds</b>. Example: pre-money $900M + $100M primary = post-money $1,000M; new investors own 10% of the company from primary shares.</p>` },
        { h: 'Organizational meeting', b: `<p>The <b>kick-off</b> ("org meeting") brings together the company, bookrunners, lawyers and auditors to agree the <b>timetable</b>, responsibilities, the equity story, due diligence plan and drafting sessions.</p>
<p>Indicative timeline: org meeting → drafting and diligence (~2-3 months) → confidential submission → SEC comments → public filing → testing-the-waters → launch and roadshow → pricing → closing.</p>` }

        { t: 'mc', q: 'What is the organizational meeting?', o: ['The kick-off that sets the timetable and responsibilities', 'The pricing call', 'The SEC hearing', 'The first board meeting after listing'], a: 0, e: 'It launches the working group.' },
        { t: 'tf', q: 'Secondary shares sold in the IPO do not change the post-money equity value.', a: true, e: 'They transfer existing shares; only primary proceeds add to equity value.' },
        { t: 'ord', q: 'Order a typical IPO timeline', o: ['Organizational meeting', 'Drafting and due diligence', 'Confidential submission to the SEC', 'Public filing', 'Launch and roadshow', 'Pricing', 'Closing'], e: 'Usually several months from kick-off to pricing.' },
        { t: 'int', q: 'Interview: "How do you decide the size of an IPO?"', m: 'Start with the company’s <b>capital needs</b> (primary) and the owners’ desire to <b>sell</b> (secondary), then check investor demand and the <b>float</b> needed for liquidity and index inclusion (often 15-25%+). Too large risks pricing pressure; too small hurts liquidity and investor interest. The greenshoe adds flexibility on top.' }
      ]
    },
    {
      id: 'c9l4', title: 'Due diligence, drafting and filing',
      th: [
        { h: 'Underwriter due diligence', b: `<p>Business, financial, legal and accounting diligence: management sessions, customer calls, document review, auditor <b>comfort letters</b> and legal <b>opinions</b>/<b>10b-5 letters</b>. It underpins the underwriters’ <b>due diligence defense</b> against liability under <b>Section 11</b> of the Securities Act of 1933 for misstatements in the registration statement.</p>` },
        { h: 'The registration statement', b: `<p>The <b>S-1</b> includes the prospectus: summary, <b>risk factors</b>, use of proceeds, dividend policy, capitalization, dilution, <b>MD&amp;A</b>, business, management and compensation, principal shareholders, description of capital stock, underwriting, and financial statements.</p>
<p>Companies can <b>submit confidentially</b> (draft registration statement) and must <b>publicly file</b> at least <b>15 days</b> before the roadshow launch.</p>` },
        { h: 'Other documents, research, SEC comments', b: `<p>Underwriting agreement, lock-up agreements, amended charter and bylaws, equity plans, listing application.</p>
<p><b>Equity research</b>: analysts get an analyst presentation but must stay independent; research is published after the post-IPO <b>quiet period</b> (market practice about 25 days).</p>
<p>The SEC sends <b>comment letters</b> (first round roughly a month after submission); the company responds and files <b>amendments</b> until comments are cleared.</p>` }
      ],
      ex: [
        { t: 'mc', q: 'Which law creates liability for misstatements in a registration statement?', o: ['Section 11 of the Securities Act of 1933', 'The Sherman Act', 'The Dodd-Frank Act only', 'The Bankruptcy Code'], a: 0, e: 'Underwriters rely on a due diligence defense.' },
        { t: 'match', q: 'Match each S-1 section to its content', p: [['Risk factors', 'Material risks of the business and offering'], ['Use of proceeds', 'How primary money will be spent'], ['MD&A', 'Management’s discussion of results'], ['Dilution', 'Effect on new investors’ per-share book value']] },
        { t: 'num', q: 'Minimum number of days before the roadshow that a confidentially submitted S-1 must be filed publicly?', a: 15, e: 'Then the roadshow can launch.' },
        { t: 'tf', q: 'Research analysts at the underwriters can be part of selling the IPO to investors.', a: false, e: 'Research must stay independent of investment banking and sales efforts.' },
        { t: 'mc', q: 'What does the company do after receiving SEC comment letters?', o: ['Responds and files amended registration statements', 'Prices immediately', 'Cancels the IPO', 'Nothing'], a: 0, e: 'Usually several rounds.' },
        { t: 'int', q: 'Interview: "Why do underwriters do so much due diligence in an IPO?"', m: 'Because they face <b>legal liability</b> (Section 11 and 12 of the Securities Act) for material misstatements or omissions in the prospectus, and a proper <b>due diligence defense</b> protects them. Diligence also protects their <b>reputation</b> with investors and makes sure the equity story is accurate and defensible on the roadshow.' }
      ]
    },
    {
      id: 'c9l5', title: 'Marketing and roadshow',
      th: [
        { h: 'Marketing materials and teach-in', b: `<p>The <b>roadshow presentation</b> (and often a recorded retail roadshow video) tells the equity story. At launch, the <b>preliminary prospectus</b> ("red herring") includes the <b>price range</b>.</p>
<p>The <b>salesforce teach-in</b>: management and bankers educate the underwriters’ equity sales teams so they can pitch the deal to investors. Before launch, companies can <b>test the waters</b> with institutional investors to gauge demand.</p>` },
        { h: 'Roadshow and order book', b: `<p>The <b>roadshow</b> (often about a week, much of it virtual) has management meet investors in group and one-on-one meetings.</p>
<p>The bookrunners <b>build the order book</b>: each investor submits an indication with size and, often, a <b>price limit</b>. Quality matters as much as quantity: long-term holders vs flippers. Demand is expressed as <b>coverage</b> (e.g. "10x oversubscribed").</p>
<p>Example: base deal 10M shares; orders for 120M shares → <b>12x</b> covered.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Base deal of 10M shares and orders for 120M shares. Coverage (x)?', a: 12, u: 'x', e: '120 / 10 = 12x.' },
        { t: 'mc', q: 'What is the "red herring"?', o: ['The preliminary prospectus with the price range', 'A misleading clue in the roadshow', 'The final pricing supplement', 'The lock-up letter'], a: 0, e: 'Named for the red legend on the cover.' },
        { t: 'mc', q: 'What is the salesforce teach-in?', o: ['Educating the underwriters’ sales teams on the equity story', 'Training the company’s sales staff', 'An SEC session', 'A board meeting'], a: 0, e: 'So salespeople can pitch investors effectively.' },
        { t: 'tf', q: 'Testing-the-waters meetings let the company gauge institutional interest before launching.', a: true, e: 'Now available to all issuers in the US.' },
        { t: 'mc', q: 'Why do bookrunners care about order book quality?', o: ['Long-term holders support the aftermarket; flippers sell quickly', 'Only total size matters', 'To lower fees', 'Regulation requires it'], a: 0, e: 'Allocation favors high-quality demand.' },
        { t: 'int', q: 'Interview: "What happens during an IPO roadshow?"', m: 'After launch with the <b>red herring</b> and price range, management and bankers meet institutional investors in <b>group and one-on-one meetings</b> over roughly a week to present the <b>equity story</b> and answer questions. Meanwhile the bookrunners <b>build the order book</b>, tracking size, price limits and investor quality, and feed back demand to calibrate pricing and allocation.' }
      ]
    },
    {
      id: 'c9l6', title: 'Pricing, allocation and closing',
      th: [
        { h: 'Price the offering', b: `<p>When the book closes (usually the evening before trading starts), the bookrunners recommend a <b>price</b> based on demand and price sensitivity. With strong demand the deal can price <b>above the range</b> or be <b>upsized</b>; with weak demand it prices below or is postponed. The goal is to balance maximizing proceeds with a healthy first-day trade (a modest "pop").</p>` },
        { h: 'Allocate shares and close', b: `<p><b>Allocation</b> prioritizes high-quality, long-term investors, while ensuring a broad shareholder base and some retail participation.</p>
<p>Trading begins the next morning. At <b>closing</b> (a couple of business days later) the company delivers the shares and underwriters pay the proceeds <b>net of the gross spread</b>. Afterwards: <b>stabilization</b> and greenshoe exercise, the research <b>quiet period</b>, and later the <b>lock-up</b> expiry.</p>
<p>Example: price $22 vs range $18-20 → priced <b>10%</b> above the top of the range.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Range $18-$20, priced at $22. How far above the top of the range (%)?', a: 10, u: '%', e: '22 / 20 − 1 = 10%.' },
        { t: 'num', q: 'IPO priced at $20 and closes its first day at $25. First-day pop (%)?', a: 25, u: '%', e: '25 / 20 − 1 = 25%.' },
        { t: 'mc', q: 'When is an IPO usually priced?', o: ['The evening before trading begins', 'A month before the roadshow', 'At the org meeting', 'After the lock-up'], a: 0, e: 'Right after the book closes.' },
        { t: 'tf', q: 'A very large first-day pop can mean the issuer left money on the table.', a: true, e: 'The company could have sold shares at a higher price.' },
        { t: 'ord', q: 'Order the final steps', o: ['Book closes', 'Price the offering', 'Allocate shares', 'Trading begins', 'Closing and payment of net proceeds'], e: 'Then stabilization and the greenshoe.' },
        { t: 'mc', q: 'At closing, the company receives:', o: ['Proceeds net of the gross spread', 'The gross proceeds plus fees', 'Only the greenshoe proceeds', 'Nothing until lock-up expiry'], a: 0, e: 'Underwriters keep the spread.' },
        { t: 'int', q: 'Interview: "Walk me through the IPO process."', m: '<b>Organization</b>: select banks, lawyers, auditors and exchange; corporate housekeeping; structure (C corp vs Up-C), timing, size and preliminary valuation; org meeting. <b>Due diligence, drafting and filing</b>: diligence, draft the S-1, confidential submission, SEC comments, public filing, research coordination. <b>Marketing</b>: testing-the-waters, salesforce teach-in, launch with the red herring, roadshow and order book. <b>Pricing and allocation</b>: set the price, allocate to quality investors, start trading, close, then stabilization and the greenshoe.' }
      ]
    }
  ]
});
UNITS.push({
  id: 'x1', title: 'Private Equity Funds', sub: 'How funds are structured, how GPs get paid and how they create value', ch: 'Beyond the book', col: 'var(--u8)',
  lessons: [
    {
      id: 'x1l1', title: 'Fund structure: GPs and LPs',
      th: [
        { h: 'GP and LPs', b: `<ul><li><b>General partner (GP)</b>: the PE firm. Sources, executes and manages investments, and commits 1-5% of the fund itself.</li><li><b>Limited partners (LPs)</b>: pension funds, insurers, sovereign wealth funds, endowments, family offices, funds of funds.</li></ul>
<p>LPs <b>commit</b> capital; the GP draws it down through <b>capital calls</b> as deals close. Committed but uninvested capital is <b>dry powder</b>.</p>` },
        { h: 'Fund life', b: `<p>Typically <b>10 years</b> (+1-2 extensions): ~5-year <b>investment period</b>, then harvesting. The <b>J-curve</b>: early returns are negative (fees, costs, unrealized investments) before exits turn them positive.</p>
<p><b>Buyout vs venture capital</b>: buyouts take <b>control</b> of mature companies with debt; VC takes <b>minority</b> stakes in startups without leverage. Growth equity sits in between.</p>` }
      ],
      ex: [
        { t: 'match', q: 'Match each term to its definition', p: [['GP', 'Manages the fund and makes decisions'], ['LP', 'Investor that commits capital'], ['Capital call', 'Request for LPs to fund'], ['Dry powder', 'Committed but uninvested capital']] },
        { t: 'tf', q: 'LPs wire their entire commitment on day one.', a: false, e: 'They fund as the GP issues capital calls.' },
        { t: 'mc', q: 'What explains the J-curve?', o: ['Early negative returns from fees and unrealized deals, then gains on exits', 'Falling interest rates', 'The shape of the capital stack', 'Tax timing'], a: 0, e: 'Cash goes out first; gains come with exits.' },
        { t: 'mc', q: 'Key difference between buyouts and venture capital:', o: ['Buyout: control and leverage in mature firms; VC: minority stakes in startups', 'They are the same', 'VC uses more leverage', 'Buyouts only fund startups'], a: 0, e: 'Growth equity is in between.' },
        { t: 'int', q: 'Interview: "Why private equity rather than banking?"', m: 'In banking you <b>advise</b> and the work ends at closing; in PE you are the <b>investor</b>: you decide what to buy with your own judgment and stay for years to <b>create value</b> alongside management. I am drawn to thinking like an owner, deep business analysis and seeing the results of decisions. Banking gives the technical base in modeling and processes.' }
      ]
    },
    {
      id: 'x1l2', title: 'Fund economics: 2 and 20',
      th: [
        { h: 'How the GP is paid', b: `<ul><li><b>Management fee</b>: ~<b>2%</b> per year on committed capital during the investment period (then often on invested capital).</li><li><b>Carried interest</b>: ~<b>20%</b> of fund profits.</li><li><b>Hurdle rate</b> (preferred return): usually <b>8%</b> per year to LPs before carry.</li><li><b>Catch-up</b>: after the hurdle, the GP takes a larger share until it has 20% of total profits.</li></ul>` },
        { h: 'Waterfalls and metrics', b: `<p><b>European (whole-fund) waterfall</b>: carry only after LPs get back all contributed capital plus the hurdle. <b>American (deal-by-deal)</b>: carry on each successful deal, with a <b>clawback</b> if the fund later underperforms.</p>
<ul><li><b>DPI</b> = Distributions / Paid-in capital</li><li><b>RVPI</b> = Residual value (NAV) / Paid-in</li><li><b>TVPI</b> = DPI + RVPI</li></ul>` }
      ],
      ex: [
        { t: 'num', q: '$1,000M fund with a 2% management fee. Annual fee ($M)?', a: 20, e: '2% × 1,000 = 20.' },
        { t: 'num', q: 'Fund profits of $500M, 20% carry with full catch-up. GP carry ($M)?', a: 100, e: '20% × 500 = 100.' },
        { t: 'fill', q: 'The minimum annual return LPs receive before the GP earns carry is the ___', o: ['hurdle rate', 'WACC', 'coupon', 'spread'], a: 0, e: 'Also called the preferred return, usually 8%.' },
        { t: 'mc', q: 'Under a European waterfall, the GP earns carry:', o: ['Only after LPs recover all capital plus the hurdle', 'On every profitable deal', 'At fund launch', 'Never'], a: 0, e: 'More LP-friendly.' },
        { t: 'num', q: 'LPs have paid in $100 and received $150 of distributions. DPI (x)?', a: 1.5, u: 'x', e: '150 / 100 = 1.5x.' },
        { t: 'num', q: 'DPI 0.8x and RVPI 1.0x. TVPI (x)?', a: 1.8, u: 'x', e: '0.8 + 1.0 = 1.8x.' },
        { t: 'int', q: 'Interview: "What aligns the GP with its LPs?"', m: '<b>Carried interest</b>: the GP only earns big money if LPs do. The <b>hurdle</b> guarantees a minimum return first. The GP’s own <b>commitment</b> (1-5%) makes it an investor too. <b>Clawbacks</b> and European waterfalls prevent carry on partial success. Management fees can misalign incentives by rewarding fund size.' }
      ]
    },
    {
      id: 'x1l3', title: 'Value creation in portfolio companies',
      th: [
        { h: 'Value bridge and tools', b: `<p>Equity gains split into <b>EBITDA growth</b>, <b>multiple expansion</b> and <b>debt paydown</b>. Example: entry 10x on $100 EBITDA, exit 10x on $150 → <b>$500</b> from EBITDA growth.</p>
<ul><li><b>100-day plan</b> of immediate priorities.</li><li><b>Operating partners</b> with functional expertise.</li><li><b>Buy-and-build</b>: buy a <b>platform</b>, then <b>add-ons</b> at lower multiples (<b>multiple arbitrage</b>: buy small at 6x, valued inside the platform at 10x).</li><li><b>Management equity plans</b> to align incentives.</li></ul>` }
      ],
      ex: [
        { t: 'num', q: 'Entry 10x on $100 EBITDA, exit 10x on $150. Value from EBITDA growth?', a: 500, e: 'EV 1,000 → 1,500 at the same multiple.' },
        { t: 'num', q: 'An add-on with $10 EBITDA is bought at 6x and valued inside a platform at 10x. Value created by multiple arbitrage?', a: 40, e: '10 × (10 − 6) = 40.' },
        { t: 'tf', q: 'Multiple expansion is the most controllable value lever for a sponsor.', a: false, e: 'It depends mainly on the market.' },
        { t: 'mc', q: 'What is a secondary buyout?', o: ['A sponsor sells a company to another sponsor', 'A second IPO', 'Buying loans in the secondary market', 'Selling a unit to employees'], a: 0, e: 'One of the most common exits.' },
        { t: 'int', q: 'Interview: "Pitch me a company you would buy as a PE investor."', m: 'Structure: <b>1)</b> what it does and why it is attractive (market, position, recurring revenue); <b>2)</b> why it suits an LBO (stable cash, low capex, debt capacity); <b>3)</b> the <b>value creation plan</b> (organic growth, margins, buy-and-build); <b>4)</b> key <b>risks</b> and mitigants; <b>5)</b> entry valuation, expected returns and <b>exit</b> (who buys it). Prepare a real example with numbers.' }
      ]
    }
  ]
});

UNITS.push({
  id: 'x2', title: 'Restructuring', sub: 'Distressed companies: options, Chapter 11 and recovery waterfalls', ch: 'Beyond the book', col: 'var(--u11)',
  lessons: [
    {
      id: 'x2l1', title: 'Distress signals and options',
      th: [
        { h: 'Liquidity vs solvency', b: `<p>A <b>liquidity</b> problem: not enough cash to meet obligations, even if the business is viable. A <b>solvency</b> problem: debt exceeds the value of the business, so equity is economically worthless.</p>
<p>Signals: leverage of 8x+, interest coverage below ~1.5x, bonds trading well below par (below ~70-80 is "distressed"), looming covenant breaches, a <b>maturity wall</b>.</p>` },
        { h: 'Options, least to most drastic', b: `<ol><li>Out of court: asset sales, equity raises, cost cuts</li><li><b>Amend &amp; extend</b> with lenders</li><li><b>Distressed exchange</b>: swap bonds for new ones with less principal or longer maturity (rated a selective default)</li><li><b>Pre-packaged</b> Chapter 11</li><li><b>Chapter 11</b>: reorganization under court protection while operating</li><li><b>Chapter 7</b>: liquidation</li></ol>` }
      ],
      ex: [
        { t: 'mc', q: 'A profitable company has a $500 maturity next week and $50 of cash. Its problem is:', o: ['Liquidity', 'Solvency', 'Profitability', 'None'], a: 0, e: 'The business may be viable; it lacks cash now.' },
        { t: 'mc', q: 'Chapter 11 vs Chapter 7:', o: ['Chapter 11 reorganizes and keeps operating; Chapter 7 liquidates', 'They are the same', 'Chapter 7 is for banks', 'Chapter 11 is always out of court'], a: 0, e: 'Chapter 11 preserves going-concern value.' },
        { t: 'ord', q: 'Order from least to most drastic', o: ['Asset sales and cost cuts', 'Amend & extend', 'Distressed exchange', 'Chapter 11', 'Chapter 7'], e: 'The later you act, the fewer options remain.' },
        { t: 'tf', q: 'A bond trading at 55 is generally considered distressed.', a: true, e: 'The market expects a default and partial recovery.' },
        { t: 'int', q: 'Interview: "Why file Chapter 11 rather than negotiate out of court?"', m: 'Out of court you need nearly all creditors to agree; a few <b>holdouts</b> can block a deal. Chapter 11 provides the <b>automatic stay</b>, access to <b>DIP financing</b>, the ability to <b>reject burdensome contracts</b>, and <b>cramdown</b> of dissenting classes. The cost: expense, time and publicity.' }
      ]
    },
    {
      id: 'x2l2', title: 'Chapter 11 mechanics',
      th: [
        { h: 'Key tools', b: `<ul><li><b>Automatic stay</b>: halts collection and enforcement actions.</li><li><b>DIP financing</b>: new money during the case with <b>superpriority</b>.</li><li><b>Plan of reorganization</b> voted by class (two-thirds in amount and a majority in number).</li><li><b>Cramdown</b>: court confirms the plan over a dissenting class if fair.</li><li><b>Section 363 sale</b> with a <b>stalking horse</b> bidder; secured creditors can <b>credit bid</b>.</li></ul>` },
        { h: 'Absolute priority rule', b: `<p>No junior class recovers until senior classes are paid in full: DIP → administrative claims → secured debt (up to collateral value) → priority claims → unsecured debt → subordinated debt → preferred → common equity.</p>
<p>The <b>fulcrum security</b> is the class where value runs out: it recovers partially and usually receives the <b>reorganized equity</b>. Distressed funds target it for control ("loan-to-own").</p>` }
      ],
      ex: [
        { t: 'mc', q: 'Why will a lender provide DIP financing to a bankrupt company?', o: ['It has superpriority over existing debt', 'It is legally forced to', 'It earns no interest', 'It receives all the equity'], a: 0, e: 'Low risk, attractive fees and spreads.' },
        { t: 'tf', q: 'Under the absolute priority rule, shareholders can recover before unsecured creditors are paid in full.', a: false, e: 'Not unless senior classes consent.' },
        { t: 'match', q: 'Match each term to its meaning', p: [['Cramdown', 'Plan imposed on a dissenting class'], ['Credit bid', 'Bidding with the debt itself'], ['Stalking horse', 'First bidder that sets the floor'], ['Fulcrum security', 'Class that receives the new equity']] },
        { t: 'ord', q: 'Order recovery priority in Chapter 11', o: ['DIP financing', 'Senior secured debt', 'Senior unsecured debt', 'Subordinated debt', 'Preferred stock', 'Common equity'], e: 'Absolute priority in practice.' },
        { t: 'int', q: 'Interview: "What is the fulcrum security and why do distressed investors care?"', m: 'It is the debt class where the <b>enterprise value runs out</b>: classes above recover in full, classes below get nothing, and it recovers partially. It usually converts into the <b>equity of the reorganized company</b>, so buying it at a discount can give a distressed fund <b>control</b> with upside if the business recovers.' }
      ]
    },
    {
      id: 'x2l3', title: 'Recovery waterfalls',
      th: [
        { h: 'Worked example', b: `<p>Reorganization EV <b>$500</b>. Claims: DIP $50, secured term loan $300, unsecured notes $200, subordinated notes $150, equity.</p>
<ul><li>DIP $50 → <b>100%</b> (450 left)</li><li>Secured $300 → <b>100%</b> (150 left)</li><li>Unsecured: $150 of $200 → <b>75%</b> ← fulcrum</li><li>Subordinated and equity: <b>0%</b></li></ul>
<p>At EV $600 the unsecured recover 100% and the subordinated 50/150 = 33%: the fulcrum shifts down.</p>
<p>Buying the unsecured notes at 60 with a 75 recovery returns 75/60 − 1 = <b>25%</b>.</p>` }
      ],
      ex: [
        { t: 'num', q: 'EV $500; DIP $50, secured $300, unsecured $200. Unsecured recovery (%)?', a: 75, u: '%', e: '150 / 200 = 75%.' },
        { t: 'num', q: 'Same structure plus $150 subordinated, EV $600. Subordinated recovery (%, whole number)?', a: 33, tol: 0.5, u: '%', e: '50 / 150 = 33%.' },
        { t: 'num', q: 'Buy bonds at 60 with an expected recovery of 75. Return (%)?', a: 25, u: '%', e: '75 / 60 − 1 = 25%.' },
        { t: 'num', q: 'EV $350; DIP $50, secured loan $400. Secured recovery (%)?', a: 75, u: '%', e: '300 / 400 = 75%; everything below gets zero.' },
        { t: 'tf', q: 'If reorganization EV rises, the fulcrum can move to a more junior class.', a: true, e: 'More value reaches more classes.' },
        { t: 'int', q: 'Interview: "A bond trades at 40. How would you decide whether to buy it?"', m: 'Estimate <b>recovery</b>: value the reorganized business (comps, precedents, DCF), build the <b>waterfall</b> with every claim ahead of the bond (including likely DIP and priority claims), and factor in <b>timing</b> and process costs. If expected recovery is, say, 60 in 18 months, the return is attractive. Also weigh legal risks (inter-creditor disputes, liens) and whether the bond could be the <b>fulcrum</b>.' }
      ]
    }
  ]
});

UNITS.push({
  id: 'x3', title: 'Banks, Insurers and Fixed Income', sub: 'FIG valuation and the bond math every banker should know', ch: 'Beyond the book', col: 'var(--u12)',
  lessons: [
    {
      id: 'x3l1', title: 'How a bank makes money',
      th: [
        { h: 'Balance sheet and P&L', b: `<p>Money is a bank’s raw material: <b>deposits</b> (liabilities) fund <b>loans</b> and securities (assets). So EV and EBITDA do not apply; banks are valued on <b>equity</b>.</p>
<ul><li><b>Net interest income (NII)</b> = interest earned − interest paid</li><li><b>NIM</b> = NII / average interest-earning assets</li><li>+ <b>Fee income</b>; − operating expenses (<b>efficiency ratio</b> = expenses / revenue); − <b>loan loss provisions</b></li><li><b>ROE</b> = net income / equity (and ROTE on tangible equity)</li></ul>` }
      ],
      ex: [
        { t: 'num', q: 'Interest earned $60, interest paid $25, interest-earning assets $1,000. NIM (%)?', a: 3.5, u: '%', e: 'NII 35 / 1,000 = 3.5%.' },
        { t: 'num', q: 'Revenue $100, operating expenses $55. Efficiency ratio (%)?', a: 55, u: '%', e: 'Lower is better.' },
        { t: 'mc', q: 'Why not value banks on EV/EBITDA?', o: ['Debt and interest are part of operations', 'Banks have no profits', 'It is prohibited', 'They have no assets'], a: 0, e: 'Use P/E, P/BV, P/TBV.' },
        { t: 'tf', q: 'Customer deposits are liabilities of a bank.', a: true, e: 'The bank owes them to depositors.' },
        { t: 'int', q: 'Interview: "What would you look at first in a bank’s financials?"', m: '<b>NII and NIM</b> (the engine and its rate sensitivity), <b>fee income</b>, the <b>efficiency ratio</b>, <b>provisions</b> and cost of risk (credit quality), and <b>ROE/ROTE</b> versus the cost of equity. On the balance sheet: <b>CET1</b> and liquidity.' }
      ]
    },
    {
      id: 'x3l2', title: 'Capital and regulation',
      th: [
        { h: 'Basel III ratios', b: `<div class="f">CET1 ratio = CET1 capital / Risk-weighted assets (RWA)</div>
<p>Each asset is risk-weighted: high-quality sovereign bonds ~0%, mortgages ~20-35%, SME loans ~75-100%. Minimum 4.5% plus buffers; large banks typically run 11-15%.</p>
<ul><li><b>Leverage ratio</b>: Tier 1 / total exposure, unweighted (min 3%).</li><li><b>LCR</b>: high-quality liquid assets / 30-day stressed outflows ≥ 100%.</li><li><b>NSFR</b>: stable funding over one year.</li></ul>
<p>Capital above the target is <b>excess capital</b>, available for dividends and buybacks.</p>` }
      ],
      ex: [
        { t: 'num', q: 'CET1 capital $12, RWA $100. CET1 ratio (%)?', a: 12, u: '%', e: '12 / 100 = 12%.' },
        { t: 'num', q: 'RWA $200, target CET1 12%, actual CET1 $30. Excess capital?', a: 6, e: 'Required 24; excess 6.' },
        { t: 'tf', q: 'The leverage ratio uses risk-weighted assets.', a: false, e: 'It is unweighted, a backstop to the CET1 ratio.' },
        { t: 'match', q: 'Match each ratio to what it measures', p: [['CET1 ratio', 'Highest-quality capital over RWA'], ['Leverage ratio', 'Tier 1 over unweighted exposure'], ['LCR', '30-day stressed liquidity'], ['NSFR', 'One-year stable funding']] },
        { t: 'int', q: 'Interview: "Why might a bank prefer mortgages to SME loans at the same margin?"', m: 'Because of <b>capital consumption</b>: mortgages carry much lower risk weights, so each dollar lent needs less CET1. At the same margin, the <b>return on equity</b> is far higher. Capital rules shape what business banks do.' }
      ]
    },
    {
      id: 'x3l3', title: 'Valuing banks and insurers',

function def() { return { xp: 0, hearts: MAXH, hts: Date.now(), streak: 0, best: 0, last: null, goal: 50, log: {}, done: {}, srs: {}, ok: 0, ko: 0, inf: false, all: false, tab: 'path' }; }

let lastSig = sig();
function save() {

// ---------- Sincronización con la cuenta ----------
// El progreso se guarda también en un documento privado del usuario (data/users/<id>/progress), así sigue entre dispositivos y no depende del almacenamiento del navegador.
const Cloud = {
  doc: null, state: 'local', busy: false, again: false, timer: 0,
  async init() {
    try {
      if (!window.claude || !claude.use) return;
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const uid = user && await user.id();
      if (!db || !uid) return;
      this.doc = db.doc('data/users/' + uid + '/progress');
      await this.pull();
      document.addEventListener('visibilitychange', () => { if (document.hidden) this.flush(); else this.pull(); });
    } catch (e) { this.state = 'local'; }
  },
  async pull() {
    if (!this.doc || SES) return;
    try {
      const snap = await this.doc.get();
      const r = snap.exists ? snap.data() : null;
      if (r && typeof r.s === 'string' && (r.ts || 0) > (S.ts || 0)) {
        const tab = S.tab; S = Object.assign(def(), JSON.parse(r.s)); S.tab = tab; lastSig = sig();
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        if (!SES) render();
      } else if (!r || (S.ts || 0) > (r.ts || 0)) { this.state = 'synced'; await this.write(); }
      this.state = 'synced'; if (S.tab === 'me' && !SES) render();
    } catch (e) { this.state = 'error'; }
  },
  push() { if (!this.doc) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.write(), 1500); },
  flush() { if (!this.doc) return; clearTimeout(this.timer); this.write(); },
  async write() {
    if (!this.doc) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try { const { tab, ...rest } = S; await this.doc.set({ s: JSON.stringify(rest), ts: S.ts || 0 }); this.state = 'synced'; }
    catch (e) { this.state = 'error'; }
    this.busy = false;
    if (this.again) { this.again = false; this.write(); }
  }
};
const dstr = d => { const z = new Date(d); return z.getFullYear() + '-' + String(z.getMonth() + 1).padStart(2, '0') + '-' + String(z.getDate()).padStart(2, '0'); };
const today = () => dstr(Date.now());
function regen() {
  if (S.hearts >= MAXH) { S.hts = Date.now(); return; }
  const n = Math.floor((Date.now() - S.hts) / HEART_MS);
  if (n > 0) { S.hearts = Math.min(MAXH, S.hearts + n); S.hts += n * HEART_MS; if (S.hearts >= MAXH) S.hts = Date.now(); save(); }
}
function streakNow() { return (S.last === today() || S.last === dstr(Date.now() - DAY)) ? S.streak : 0; }
function touchStreak() {
  const t = today(); if (S.last === t) return;
  S.streak = S.last === dstr(Date.now() - DAY) ? S.streak + 1 : 1; S.last = t; S.best = Math.max(S.best, S.streak);
}

function parseNums(s) {
