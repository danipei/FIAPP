// ---------- Lesson / review session ----------
let SES = null;
function startLesson(l) {
  regen();
  const q = [...l.th.map(t => ({ k: 'th', t })), ...l.ex.map(x => ({ k: 'ex', x }))];
  SES = { type: 'lesson', l, q, i: 0, total: q.length, done: 0, ok: 0, ko: 0, xp: 0, first: {}, t0: Date.now() };
  openSession();
}
function startReview(unitId, ids) {
  let pool = ids || Object.keys(S.srs).filter(id => EXI[id] && (!unitId || EXI[id].lesson.unit.id === unitId));
  if (!pool.length) return toast('Termina primero una lección para tener algo que repasar.');
  if (!ids) {
    const now = Date.now();
    let due = pool.filter(id => S.srs[id].due <= now).sort((a, b) => S.srs[a].due - S.srs[b].due);
    if (due.length < 8) due = due.concat(pool.filter(id => !due.includes(id)).sort((a, b) => S.srs[a].b - S.srs[b].b || S.srs[a].due - S.srs[b].due).slice(0, 8 - due.length));
    pool = due.slice(0, 12);
  }
  const q = shuffle(pool).map(id => ({ k: 'ex', x: EXI[id] }));
  SES = { type: 'review', q, i: 0, total: q.length, done: 0, ok: 0, ko: 0, xp: 0, first: {}, t0: Date.now() };
  openSession();
}
function openSession() {
  const L = document.createElement('div'); L.className = 'lesson'; L.id = 'lesson';
  L.innerHTML = `<div class="wrap lhead"><button class="x" id="lx" aria-label="Salir">${I.x}</button><div class="lprog"><div id="lp"></div></div><button class="thbtn" id="lth" hidden>TEORÍA</button></div>
  <div class="lbody"><div class="wrap" id="lb"></div></div><div class="lfoot" id="lf"><div class="wrap" id="lfw"></div></div>`;
  document.body.appendChild(L); document.body.style.overflow = 'hidden';
  $('#lx').onclick = () => sheet(`<h3>¿Salir de la lección?</h3><p class="meta">Perderás el avance de esta sesión, pero las respuestas que ya has dado cuentan para el repaso.</p><button class="btn" id="k">Seguir aprendiendo</button><button class="btn ghost" id="q" style="color:var(--red)">Salir</button>`, s => {
    $('#k', s).onclick = () => s.remove(); $('#q', s).onclick = () => { s.remove(); closeSession(); };
  });
  $('#lth').onclick = () => { const it = SES.q[SES.i]; const l = SES.l || (it && it.x && it.x.lesson); if (l) theorySheet(l); };
  step();
}
function closeSession() { const L = $('#lesson'); L && L.remove(); document.body.style.overflow = ''; SES = null; save(); render(); }
function hud() {
  $('#lp').style.width = (SES.done / SES.total * 100) + '%';
}
function foot(html, cls) { const f = $('#lf'); f.className = 'lfoot ' + (cls || ''); $('#lfw').innerHTML = html; }

function step() {
  SES.locked = false;
  hud();
  const it = SES.q[SES.i];
  if (!it) return finish();
  const b = $('#lb'); b.innerHTML = '';
  $('.lbody').scrollTop = 0;
  $('#lth').hidden = it.k === 'th';
  SES.cur = null;
  if (it.k === 'th') {
    b.innerHTML = `<div class="kind th">${I.book.replace('<svg', '<svg width="16" height="16"')} ${it.t.p ? 'Empieza aquí' : 'Teoría'}</div><div class="th${it.t.p ? ' plain' : ''}">${it.t.p ? '<span class="tag">En lenguaje llano</span>' : ''}${'<h3>' + it.t.h + '</h3>' + it.t.b}</div>`;
    linkTerms(b);
    foot(`<button class="btn" id="cont">Entendido</button>`);
    $('#cont').onclick = () => { SES.done++; SES.i++; step(); };
    return;
  }
  const x = it.x;
  R[x.t](x, b);
  b.querySelectorAll('p.q').forEach(linkTerms);
}

// Cada renderizador fija SES.cur = { ready, eval: () => ({ ok, sol }) } y llama a setReady()
function checkFoot() {
  foot(`<button class="btn" id="chk" disabled>Comprobar</button>`);
  $('#chk').onclick = doCheck;
}
function setReady(v) { const c = $('#chk'); if (c) c.disabled = !v; }
const kindLbl = { mc: 'Elige la respuesta', tf: 'Verdadero o falso', fill: 'Completa el hueco', num: 'Calcula', ord: 'Ordena', match: 'Empareja', int: 'Pregunta de entrevista' };
const kindHead = (t) => `<div class="kind ${t === 'int' ? 'int' : ''}">${t === 'int' ? I.mic.replace('<svg', '<svg width="16" height="16"') : ''}${kindLbl[t]}</div>`;

const R = {
  mc(x, b) {
    const order = shuffle(x.o.map((_, i) => i));
    b.innerHTML = kindHead('mc') + `<p class="q">${x.q}</p><div class="opts">${order.map((oi, k) => `<button class="opt" data-k="${k}"><kbd>${k + 1}</kbd><span>${x.o[oi]}</span></button>`).join('')}</div>`;
    let sel = -1;
    b.querySelectorAll('.opt').forEach(o => o.onclick = () => { if (SES.locked) return; sel = +o.dataset.k; b.querySelectorAll('.opt').forEach(z => z.classList.toggle('sel', z === o)); setReady(true); });
    SES.cur = { eval: () => { const ok = order[sel] === x.a; b.querySelectorAll('.opt').forEach((z, k) => { if (order[k] === x.a) z.classList.add('good'); else if (k === sel) z.classList.add('bad'); }); return { ok, sol: x.o[x.a] }; } };
    checkFoot();
  },
  tf(x, b) {
    b.innerHTML = kindHead('tf') + `<p class="q">${x.q}</p><div class="tf"><button class="opt" data-v="1"><kbd>1</kbd>Verdadero</button><button class="opt" data-v="0"><kbd>2</kbd>Falso</button></div>`;
    let sel = null;
    b.querySelectorAll('.opt').forEach(o => o.onclick = () => { if (SES.locked) return; sel = o.dataset.v === '1'; b.querySelectorAll('.opt').forEach(z => z.classList.toggle('sel', z === o)); setReady(true); });
    SES.cur = { eval: () => { const ok = sel === x.a; b.querySelectorAll('.opt').forEach(z => { const v = z.dataset.v === '1'; if (v === x.a) z.classList.add('good'); else if (v === sel) z.classList.add('bad'); }); return { ok, sol: x.a ? 'Verdadero' : 'Falso' }; } };
    checkFoot();
  },
  fill(x, b) {
    const order = shuffle(x.o.map((_, i) => i));
    const [pre, post] = x.q.split('___');
    b.innerHTML = kindHead('fill') + `<p class="sentence">${pre}<span class="blank" id="bl">&nbsp;</span>${post || ''}</p><div class="chips">${order.map((oi, k) => `<button class="chip opt" data-k="${k}"><kbd>${k + 1}</kbd>${x.o[oi]}</button>`).join('')}</div>`;
    let sel = -1; const bl = $('#bl', b);
    b.querySelectorAll('.chip').forEach(o => o.onclick = () => {
      if (SES.locked) return; const k = +o.dataset.k;
      sel = sel === k ? -1 : k;
      b.querySelectorAll('.chip').forEach(z => z.classList.toggle('sel', +z.dataset.k === sel));
      bl.textContent = sel < 0 ? ' ' : x.o[order[sel]]; bl.classList.toggle('filled', sel >= 0); setReady(sel >= 0);
    });
    SES.cur = { eval: () => ({ ok: order[sel] === x.a, sol: x.o[x.a] }) };
    checkFoot();
  },
  num(x, b) {
    b.innerHTML = kindHead('num') + `<p class="q">${x.q}</p><div class="numin"><input id="ni" inputmode="decimal" autocomplete="off" placeholder="Tu respuesta">${x.u ? `<span>${x.u}</span>` : ''}</div><p class="hint">Usa coma o punto para los decimales. No escribas unidades ni símbolos.</p>`;
    const inp = $('#ni', b);
    inp.oninput = () => setReady(parseNums(inp.value).length > 0);
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); const c = $('#chk'); if (c && !c.disabled) c.click(); else { const n = $('#nx'); n && n.click(); } } };
    setTimeout(() => inp.focus({ preventScroll: true }), 60);
    const tol = x.tol != null ? x.tol : Math.max(Math.abs(x.a) * 0.005, 0.01);
    SES.cur = { eval: () => { inp.disabled = true; return { ok: parseNums(inp.value).some(v => Math.abs(v - x.a) <= tol), sol: fmt(x.a) + (x.u ? ' ' + x.u : '') }; } };
    checkFoot();
  },
  ord(x, b) {
    let order = shuffle(x.o.map((_, i) => i));
    if (order.every((v, i) => v === i)) order = order.reverse();
    const chosen = [];
    b.innerHTML = kindHead('ord') + `<p class="q">${x.q}</p><div class="answer" id="ans"></div><div class="bank" id="bank">${order.map(oi => `<button class="chip" data-i="${oi}">${x.o[oi]}</button>`).join('')}</div>`;
    const ans = $('#ans', b), bank = $('#bank', b);
    const draw = () => {
      ans.innerHTML = chosen.map((oi, k) => `<button class="chip" data-i="${oi}"><b>${k + 1}</b>${x.o[oi]}</button>`).join('');
      bank.querySelectorAll('.chip').forEach(c => c.classList.toggle('used', chosen.includes(+c.dataset.i)));
      ans.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (SES.locked) return; chosen.splice(chosen.indexOf(+c.dataset.i), 1); draw(); });
      setReady(chosen.length === x.o.length);
    };
    bank.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (SES.locked || chosen.includes(+c.dataset.i)) return; chosen.push(+c.dataset.i); draw(); });
    SES.cur = { eval: () => ({ ok: chosen.every((v, i) => v === i), sol: x.o.join(' → ') }) };
    checkFoot(); draw();
  },
  match(x, b) {
    const L = shuffle(x.p.map((_, i) => i)), Rr = shuffle(x.p.map((_, i) => i));
    b.innerHTML = kindHead('match') + `<p class="q">${x.q}</p><div class="match"><div class="col">${L.map(i => `<button class="opt" data-s="l" data-i="${i}">${x.p[i][0]}</button>`).join('')}</div><div class="col">${Rr.map(i => `<button class="opt" data-s="r" data-i="${i}">${x.p[i][1]}</button>`).join('')}</div></div><p class="hint">Toca un elemento de cada columna para emparejarlos.</p>`;
    let pick = null, matched = 0, miss = 0;
    b.querySelectorAll('.opt').forEach(o => o.onclick = () => {
      if (SES.locked || o.classList.contains('ok')) return;
      if (!pick || pick.dataset.s === o.dataset.s) { if (pick) pick.classList.remove('sel'); pick = o; o.classList.add('sel'); return; }
      const a = pick, c = o; pick = null; a.classList.remove('sel');
      if (a.dataset.i === c.dataset.i) {
        [a, c].forEach(z => { z.classList.add('ok'); z.disabled = true; }); matched++;
        if (matched === x.p.length) { setReady(true); setTimeout(doCheck, 250); }
      } else {
        miss++; [a, c].forEach(z => z.classList.add('wrong')); setTimeout(() => [a, c].forEach(z => z.classList.remove('wrong')), 450);
      }
    });
    SES.cur = { eval: () => ({ ok: miss === 0, sol: x.p.map(p => p[0] + ' = ' + p[1]).join(' · '), note: miss ? `Has fallado ${miss} pareja${miss > 1 ? 's' : ''}.` : '' }) };
    checkFoot();
  },
  int(x, b) {
    b.innerHTML = kindHead('int') + `<p class="q">${x.q.replace(/^(Interview|Entrevista):\s*/, '')}</p><p class="hint">Responde en voz alta o por escrito como si estuvieras en la entrevista y luego compárala con la respuesta modelo.</p><textarea id="ia" placeholder="Tu respuesta (opcional)"></textarea><div id="mdl"></div>`;
    foot(`<button class="btn blue" id="rev">Ver respuesta modelo</button>`);
    $('#rev').onclick = () => {
      $('#mdl', b).innerHTML = `<div class="model"><h4>Respuesta modelo</h4><p>${x.m}</p></div>`;
      $('#mdl', b).scrollIntoView({ behavior: 'smooth', block: 'start' });
      foot(`<p class="hint" style="text-align:center">¿Tu respuesta cubría las ideas clave?</p><div class="row"><button class="btn red" id="no">Tengo que repasarla</button><button class="btn" id="si">La he clavado</button></div>`);
      $('#si').onclick = () => selfGrade(true); $('#no').onclick = () => selfGrade(false);
    };
  }
};

function selfGrade(ok) {
  const x = SES.q[SES.i].x;
  if (!SES.first[x.id]) { SES.first[x.id] = 1; srsMark(x.id, ok); }
  if (ok) { const g = SES.type === 'lesson' ? 10 : 5; SES.xp += g; addXP(g); SES.ok++; S.ok++; SES.done++; }
  else { SES.ko++; S.ko++; SES.done++; }
  save(); SES.i++; step();
}

function doCheck() {
  if (!SES.cur || SES.locked) return;
  SES.locked = true;
  const it = SES.q[SES.i], x = it.x, r = SES.cur.eval();
  const first = !SES.first[x.id];
  if (first) { SES.first[x.id] = 1; srsMark(x.id, r.ok); r.ok ? S.ok++ : S.ko++; }
  if (r.ok) {
    const g = (SES.type === 'lesson' ? 10 : 5) / (first ? 1 : 2);
    SES.xp += g; addXP(g); SES.done++; if (first) SES.ok++;
  } else {
    if (first) SES.ko++;
    SES.q.push({ k: 'ex', x });
  }
  save(); hud();
  const praise = ['¡Correcto!', '¡Muy bien!', '¡Exacto!', '¡Perfecto!'][Math.floor(Math.random() * 4)];
  foot(`<div class="fb">${r.ok ? `<h4>${I.check.replace('<svg', '<svg width="24" height="24"')} ${praise}</h4>` : `<h4>${I.x.replace('<svg', '<svg width="24" height="24"')} Casi</h4><p class="sol">Respuesta correcta: ${r.sol}</p>`}${r.note ? `<p>${r.note}</p>` : ''}${x.e ? `<p>${x.e}</p>` : ''}${!r.ok ? '<p class="hint">Esta pregunta volverá al final de la sesión.</p>' : ''}</div><button class="btn" id="nx">Continuar</button>`, r.ok ? 'good' : 'bad');
  document.querySelectorAll('#lfw .fb p').forEach(linkTerms);
  $('#nx').onclick = () => {
    SES.locked = false;
    SES.i++; step();
  };
}


function finish() {
  const mins = Math.max(1, Math.round((Date.now() - SES.t0) / 60e3));
  const answered = SES.ok + SES.ko, acc = answered ? Math.round(SES.ok / answered * 100) : 100;
  let bonus = 0, title, sub;
  if (SES.type === 'lesson') {
    S.done[SES.l.id] = (S.done[SES.l.id] || 0) + 1;
    bonus = 15 + (SES.ko === 0 ? 10 : 0);
    title = SES.ko === 0 ? '¡Lección perfecta!' : '¡Lección completada!';
    const nxt = LESSONS[SES.l.idx + 1];
    sub = nxt ? `Siguiente: ${nxt.title}` : 'Has terminado todo el temario. Sigue repasando hasta dominarlo.';
  } else {
    bonus = 5;
    title = '¡Repaso completado!'; sub = 'Las preguntas que dominas volverán menos a menudo; las que fallas, antes.';
  }
  addXP(bonus); SES.xp += bonus; touchStreak(); save();
  $('#lth').hidden = true; $('#lp').style.width = '100%';
  $('#lb').innerHTML = `<div class="sec end"><div class="medal">${I.star}</div><h2>${title}</h2><p class="lead">${sub}</p>
  <div class="tiles"><div class="tile gold"><b>+${SES.xp}</b><span>XP</span></div><div class="tile grn"><b>${acc}%</b><span>acierto</span></div><div class="tile blu"><b>${mins}′</b><span>tiempo</span></div></div>
  <p class="lead">Racha: <b>${streakNow()} ${streakNow() === 1 ? 'día' : 'días'}</b></p></div>`;
  foot(`<button class="btn" id="end">Continuar</button>`);
  $('#end').onclick = () => { vPath.scrolled = 0; closeSession(); };
}

// ---------- Teclado ----------
document.addEventListener('keydown', e => {
  if (!SES || document.querySelector('.scrim')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.key === 'Enter' && tag !== 'textarea') {
    const btn = $('#nx') || $('#chk') || $('#cont') || $('#end') || $('#rev');
    if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
    return;
  }
  if (tag === 'input' || tag === 'textarea') return;
  if (/^[1-9]$/.test(e.key) && !SES.locked) {
    const o = document.querySelectorAll('#lb .opts .opt, #lb .tf .opt, #lb .chips .chip')[+e.key - 1];
    o && o.click();
  }
});

// ---------- Términos del glosario: se pueden tocar en tarjetas, preguntas y explicaciones ----------
const TERMS = (() => {
  const skip = new Set(['ventas', 'Deuda', 'Interés', 'Intereses', 'Activos', 'Pasivos', 'Margen', 'Múltiplo', 'Float', 'Existencias', 'Ingresos', 'Acciones', 'Vencimiento', 'Cupón', 'Dividendo', 'M&A', 'NDA', 'IPO', 'IRR', 'EV']);
  const out = [];
  GLOSS.forEach(([t, d], gi) => {
    const names = [];
    t.split(' / ').forEach(part => { const m = part.match(/^(.*?)\s*\((.*)\)\s*$/); if (m) names.push(m[1], m[2]); else names.push(part); });
    names.map(n => n.trim()).filter(n => n.length > 2 && !skip.has(n)).forEach(n => {
      const esc = n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&/g, '(?:&|&amp;)');
      const acro = (n.match(/[A-Z]/g) || []).length >= 2;
      out.push({ gi, n, re: new RegExp('(?<![\\p{L}\\d_-])' + esc + (acro ? '' : '(?:e?s)?') + '(?![\\p{L}\\d_-])', acro ? 'u' : 'iu') });
    });
  });
  return out.sort((a, b) => b.n.length - a.n.length);
})();
function linkTerms(root) {
  if (!root) return;
  const used = new Set();
  for (const T of TERMS) {
    if (used.has(T.gi)) continue;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('.gt, button, h3, .tag, .kind') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    let node;
    while ((node = w.nextNode())) {
      const m = T.re.exec(node.data);
      if (!m) continue;
      const after = node.splitText(m.index); after.splitText(m[0].length);
      const sp = document.createElement('span'); sp.className = 'gt'; sp.dataset.g = T.gi; sp.textContent = after.data;
      after.replaceWith(sp); used.add(T.gi); break;
    }
  }
}
document.addEventListener('click', e => {
  const old = $('.gpop'); if (old) old.remove();
  const g = e.target.closest('.gt'); if (!g) return;
  e.stopPropagation();
  const [t, d] = GLOSS[+g.dataset.g];
  const p = document.createElement('div'); p.className = 'gpop'; p.innerHTML = `<b></b><span></span>`;
  p.querySelector('b').textContent = t; p.querySelector('span').textContent = d;
  document.body.appendChild(p); clearTimeout(linkTerms.t); linkTerms.t = setTimeout(() => p.remove(), 7000);
}, true);

// ---------- Arranque ----------
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('#nav-path').insertAdjacentHTML('afterbegin', I.path);
$('#nav-review').insertAdjacentHTML('afterbegin', I.loop);
$('#nav-notes').insertAdjacentHTML('afterbegin', I.book);
$('#nav-me').insertAdjacentHTML('afterbegin', I.user);
if (!['path', 'review', 'notes', 'me'].includes(S.tab)) S.tab = 'path';
render();
setInterval(() => { if (!SES) topbar(); }, 60e3);
Cloud.init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script></body></html>
