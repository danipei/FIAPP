      ],
      ex: [
        { t: 'ord', q: 'Order the five steps of a DCF', o: ['Study the target and determine key performance drivers', 'Project free cash flow', 'Calculate WACC', 'Determine terminal value', 'Calculate present value and determine valuation'], e: 'Chapter 3 summary of steps.' },
        { t: 'tf', q: 'A DCF is an intrinsic valuation method.', a: true, e: 'It values projected cash flows rather than relying on market prices of peers (though the exit multiple method reintroduces market inputs).' },
        { t: 'match', q: 'Match each driver to its projection line', p: [['Price and volume growth', 'Sales'], ['Operating leverage', 'EBITDA margin'], ['Capital intensity', 'Capex as % of sales'], ['Collection period', 'Receivables (DSO)']] },
        { t: 'mc', q: 'Which is an external performance driver?', o: ['A change in input commodity prices', 'A new cost-cutting plan', 'A sales force reorganization', 'A new product launch'], a: 0, e: 'Macro and market factors are external; management initiatives are internal.' },
        { t: 'int', q: 'Interview: "Walk me through a DCF."', m: '<b>1)</b> Project unlevered free cash flow for about 5 years: EBIT after tax, plus D&amp;A, minus capex and the increase in NWC. <b>2)</b> Calculate a terminal value with an exit multiple or perpetuity growth. <b>3)</b> Discount the cash flows and terminal value at the WACC. The sum is enterprise value; subtract net debt to get equity value and divide by fully diluted shares for the implied price.' }
      ]
    },
    {
      id: 'c3l2', title: 'Step II: projecting sales, EBITDA and EBIT',
      th: [
        { h: 'Considerations for projecting FCF', b: `<ul><li><b>Historical performance</b>: usually 3 years of history to ground the projections.</li><li><b>Projection period</b>: typically <b>5 years</b>, long enough to reach a steady state (longer for businesses still maturing or cyclical ones covering a full cycle).</li><li><b>Sources</b>: management projections in a sell-side deal (often adjusted), equity research and consensus for public companies, or your own build.</li><li><b>Cases</b>: Base, Upside, Downside (Management Case vs a more conservative Sponsor or Bank Case).</li></ul>` },
        { h: 'Projecting the top lines', b: `<p><b>Sales</b>: grow from the last historical year with growth rates by year, often from consensus for the first 2-3 years, then trending toward long-term sector growth.</p>
<p><b>EBITDA and EBIT</b>: margins held at historical levels or trended per the business plan. D&amp;A is projected as % of sales or capex (or from a PP&amp;E schedule).</p>
<p>Example: sales $1,000, growth 10% → year 1 sales $1,100; margin 20% → EBITDA $220; D&amp;A 4% of sales = $44 → EBIT $176.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Year 0 sales $1,000 grow 10%. EBITDA margin 20%. Year 1 EBITDA?', a: 220, e: '1,100 × 20% = 220.' },
        { t: 'num', q: 'Year 1 EBITDA $220; D&A is 4% of year 1 sales of $1,100. EBIT?', a: 176, e: 'D&A 44 → 176.' },
        { t: 'mc', q: 'How many years are typically projected in a DCF?', o: ['About 5, until a steady state', '1', '25', 'Exactly 20'], a: 0, e: 'Longer for businesses that take time to mature or to cover a full cycle.' },
        { t: 'mc', q: 'In a sell-side process, the "Management Case" is often:', o: ['Optimistic, so bankers may also build a more conservative case', 'Always conservative', 'Built by the buyer only', 'Prohibited'], a: 0, e: 'Sponsors and lenders usually haircut it.' },
        { t: 'tf', q: 'Projecting a full business cycle can justify a longer projection period for cyclical companies.', a: true, e: 'Otherwise the terminal year could be a peak or trough.' },
        { t: 'int', q: 'Interview: "How would you build the revenue projection for a DCF?"', m: 'Start from historicals and the key drivers: <b>volume × price</b>, or units/customers × revenue per unit, or market size × share. For a public company, anchor years 1-2 on consensus and management guidance, then fade growth toward the long-term industry or GDP rate by the end of the projection period. Build scenarios (base, upside, downside) and sanity-check implied market share.' }
      ]
    },
    {
      id: 'c3l3', title: 'Step II: projecting free cash flow',
      th: [
        { h: 'Unlevered free cash flow', b: `<div class="f">UFCF = EBIT × (1 − t) + D&amp;A − Capex − Increase in NWC</div>
<p>EBIT × (1 − t) is <b>EBIAT</b> (or NOPAT). Taxes are calculated on EBIT, as if the company had no debt: the interest tax shield is captured in the WACC instead.</p>
<p>UFCF is <b>before interest</b>, so it belongs to all capital providers and is discounted at the WACC to give <b>enterprise value</b>.</p>` },
        { h: 'Capex and working capital', b: `<p><b>Capex</b>: as % of sales based on history and guidance; growth companies spend above D&amp;A.</p>
<p><b>NWC</b>: project each item with ratios: receivables via DSO, inventory via DIO, payables via DPO, prepaid and accrued as % of sales. Then take the year-on-year change.</p>
<p>Example: EBIT $176, tax 25% → EBIAT $132; + D&amp;A $44; − capex $55; − ΔNWC $10 → <b>UFCF $111</b>.</p>` }
      ],
      ex: [
        { t: 'ord', q: 'Order the build of unlevered free cash flow', o: ['EBIT', '− Taxes on EBIT', '+ D&A', '− Capex', '− Increase in NWC'], e: 'EBIT → EBIAT → add back non-cash → subtract investment.' },
        { t: 'num', q: 'EBIT $200, tax 25%, D&A $30, capex $50, increase in NWC $10. UFCF?', a: 120, e: '150 + 30 − 50 − 10 = 120.' },
        { t: 'num', q: 'Sales $1,100, DSO 45 days. Receivables (use 365 days)?', a: 135.6, tol: 0.3, e: '1,100 × 45 / 365 = 135.6.' },
        { t: 'tf', q: 'UFCF is calculated after interest expense.', a: false, e: 'It is before interest; levered FCF is after interest.' },
        { t: 'fill', q: 'EBIT × (1 − t) is called ___', o: ['EBIAT (NOPAT)', 'EBITDA', 'EBT', 'Levered FCF'], a: 0, e: 'Earnings before interest after taxes.' },
        { t: 'mc', q: 'At what rate is UFCF discounted, and what do you get?', o: ['WACC, giving enterprise value', 'Cost of equity, giving equity value', 'Risk-free rate, giving share price', 'Cost of debt, giving net debt'], a: 0, e: 'Cash for all investors, discounted at the cost to all investors, gives value to all investors.' },
        { t: 'int', q: 'Interview: "Why don’t you subtract interest in unlevered free cash flow?"', m: 'Because UFCF is the cash available to <b>all</b> capital providers, including lenders. Interest is the return to lenders, so subtracting it would double count: the cost of debt (after tax, capturing the tax shield) is already in the <b>WACC</b>.' }
      ]
    },
    {
      id: 'c3l4', title: 'Step III(a)-(b): capital structure and cost of debt',
      th: [
        { h: 'WACC', b: `<div class="f">WACC = rd × (1 − t) × D/(D+E) + re × E/(D+E)</div>
<p>The WACC is the blended return required by debt and equity holders, weighted by the <b>target capital structure</b>.</p>` },
        { h: 'Step III(a): target capital structure', b: `<p>Based on the company’s <b>current</b> capitalization (at market values), the capitalization of its <b>peers</b> (mean/median D/(D+E)), and management’s stated targets. For a private company the peers carry the most weight. An optimal structure balances the cheaper, tax-deductible cost of debt against rising financial distress risk.</p>` },
        { h: 'Step III(b): cost of debt', b: `<p>The rate the company would pay on new debt today: the <b>yield</b> on its traded bonds and loans, or, if none, the yield implied by its (implied) <b>credit rating</b> from comparable issuers. It is then <b>tax-effected</b>: rd × (1 − t), because interest is tax-deductible.</p>
<p>Example: rd 6%, tax 25% → after-tax 4.5%.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Pre-tax cost of debt 6%, tax rate 25%. After-tax cost of debt (%)?', a: 4.5, u: '%', e: '6% × 0.75 = 4.5%.' },
        { t: 'num', q: 'Equity 60% at re 10%, debt 40% at rd 5%, tax 25%. WACC (%)?', a: 7.5, u: '%', e: '6% + 0.4 × 5% × 0.75 = 7.5%.' },
        { t: 'mc', q: 'For a private target, the target capital structure is mainly based on:', o: ['Its public peers’ capital structures', 'Its book equity', 'The risk-free rate', 'Its dividend policy'], a: 0, e: 'Private companies have no market value of equity, so peers anchor the structure.' },
        { t: 'mc', q: 'Why is the cost of debt tax-effected?', o: ['Interest is tax-deductible', 'Lenders pay the tax', 'Convention only', 'Debt has no cost'], a: 0, e: 'Each dollar of interest reduces taxable income.' },
        { t: 'tf', q: 'The cost of debt should reflect the rate on new borrowing today, not the historical coupon.', a: true, e: 'Market yields reflect today’s risk and rates.' },
        { t: 'int', q: 'Interview: "Does adding debt always lower the WACC?"', m: 'No. Initially yes, because debt is cheaper than equity and tax-deductible. But as leverage rises, <b>distress risk</b> increases both the cost of debt and the levered beta (cost of equity). Beyond a point the WACC rises again: there is an optimal capital structure in between.' }
      ]
    },
    {
      id: 'c3l5', title: 'Step III(c)-(d): cost of equity and WACC',
      th: [
        { h: 'CAPM', b: `<div class="f">re = rf + βL × (rm − rf) + Size premium</div>
<ul><li><b>Risk-free rate</b>: yield on long-dated US Treasuries (the book uses the interpolated 20-year yield; many use the 10-year).</li><li><b>Market risk premium</b> (rm − rf): the expected excess return of equities over Treasuries, from sources such as Kroll (formerly Duff &amp; Phelps); historically around 5-7%.</li><li><b>Beta</b>: sensitivity of the stock to the market (systematic risk).</li><li><b>Size premium</b>: extra return for smaller companies, which historically earned more than CAPM predicts.</li></ul>` },
        { h: 'Levering and unlevering beta', b: `<div class="f">βU = βL / (1 + (1 − t) × D/E)     βL = βU × (1 + (1 − t) × D/E)</div>
<p>Unlever each peer’s beta to strip out its capital structure, take the mean or median, then relever at the target capital structure.</p>
<p>Example: peer βL 1.32, D/E 0.4, t 20% → βU 1.0. Relevered at D/E 0.5 → <b>βL 1.4</b>. With rf 4% and MRP 5%: re = 4% + 1.4 × 5% = <b>11%</b>.</p>` }
      ],
      ex: [
        { t: 'num', q: 'rf 4%, beta 1.2, market risk premium 5%, no size premium. Cost of equity (%)?', a: 10, u: '%', e: '4% + 6% = 10%.' },
        { t: 'num', q: 'Levered beta 1.32, D/E 0.4, tax 20%. Unlevered beta?', a: 1, e: '1.32 / 1.32 = 1.0.' },
        { t: 'num', q: 'Unlevered beta 1.0, target D/E 0.5, tax 20%. Relevered beta?', a: 1.4, e: '1.0 × (1 + 0.8 × 0.5) = 1.4.' },
        { t: 'num', q: 'rf 4%, relevered beta 1.4, MRP 5%, size premium 1%. Cost of equity (%)?', a: 12, u: '%', e: '4% + 7% + 1% = 12%.' },
        { t: 'mc', q: 'Why unlever peer betas?', o: ['To remove the effect of their different capital structures', 'To make them below 1', 'Because auditors require it', 'To add a control premium'], a: 0, e: 'You isolate business risk and then apply the target’s structure.' },
        { t: 'tf', q: 'Beta captures only systematic (non-diversifiable) risk.', a: true, e: 'Company-specific risk can be diversified away, so CAPM does not reward it.' },
        { t: 'mc', q: 'Why is the cost of equity higher than the cost of debt?', o: ['Equity holders are paid last and bear more risk', 'Stocks always pay higher dividends', 'Debt has a negative beta', 'Regulation'], a: 0, e: 'Equity is the residual claim.' },
        { t: 'int', q: 'Interview: "How would you calculate the WACC of a private company?"', m: 'Use <b>public comparables</b>: unlever their betas, take the median, relever at the target capital structure (based on peers). Apply CAPM with the risk-free rate, market risk premium and a <b>size premium</b> if relevant. Estimate the cost of debt from the company’s implied rating or current borrowing cost, tax-effect it, and weight both by the target structure.' }
      ]
    },
    {
      id: 'c3l6', title: 'Step IV: terminal value',
      th: [
        { h: 'Two methods', b: `<p><b>Exit Multiple Method (EMM)</b>: value at the end of the projection period based on a multiple of the terminal year EBITDA, usually from LTM trading comps (sometimes precedents).</p>
<div class="f">TV = EBITDA(n) × Exit multiple</div>
<p><b>Perpetuity Growth Method (PGM)</b>: Gordon growth on the terminal year FCF.</p>
<div class="f">TV = FCF(n) × (1 + g) / (WACC − g)</div>
<p>g is typically 2-4%, near long-term nominal GDP growth or inflation. TV is often <b>60-80%</b> of total value.</p>` },
        { h: 'Cross-checks', b: `<p><b>Implied perpetuity growth rate</b> from the EMM:</p>
<div class="f">g = (TV × WACC − FCF(n)) / (TV + FCF(n))</div>
<p><b>Implied exit multiple</b> from the PGM: TV / EBITDA(n).</p>
<p>Example: EBITDA(5) $200 × 8.0x = $1,600. PGM with FCF(5) $100, g 2%, WACC 8%: 102 / 0.06 = <b>$1,700</b> → implied 8.5x.</p>` }
      ],
      ex: [
        { t: 'num', q: 'PGM: FCF in year 5 $100, g 2%, WACC 8%. Terminal value?', a: 1700, e: '100 × 1.02 / 0.06 = 1,700.' },
        { t: 'num', q: 'EMM: year 5 EBITDA $200 at 8.0x. Terminal value?', a: 1600, e: '200 × 8 = 1,600.' },
        { t: 'num', q: 'PGM terminal value $1,700 and terminal year EBITDA $200. Implied exit multiple (x)?', a: 8.5, u: 'x', e: '1,700 / 200 = 8.5x.' },
        { t: 'num', q: 'EMM terminal value $2,560, terminal FCF $160, WACC 10%. Implied perpetuity growth rate (%, 1 decimal)?', a: 3.5, tol: 0.1, u: '%', e: '(2,560 × 0.10 − 160) / (2,560 + 160) = 96 / 2,720 = 3.5%.' },
        { t: 'mc', q: 'What happens if g is greater than or equal to the WACC?', o: ['The formula breaks down', 'TV is zero', 'TV equals FCF', 'Nothing'], a: 0, e: 'The denominator becomes zero or negative.' },
        { t: 'mc', q: 'Which TV method introduces market-based valuation into the DCF?', o: ['Exit multiple method', 'Perpetuity growth method', 'Neither', 'Both equally'], a: 0, e: 'The multiple comes from comps.' },
        { t: 'int', q: 'Interview: "Which terminal value method do you prefer?"', m: 'I run both and cross-check. The <b>exit multiple</b> is common in banking because it is anchored in market data and easy to defend, but it imports market mispricing into an intrinsic method. The <b>perpetuity growth</b> method is more theoretically consistent but very sensitive to g and WACC. I check that the implied growth rate of the EMM and the implied multiple of the PGM are reasonable.' }
      ]
    },
    {
      id: 'c3l7', title: 'Step V: present value, valuation and sensitivities',
      th: [
        { h: 'Discounting', b: `<div class="f">Discount factor = 1 / (1 + WACC)^n</div>
<p><b>Mid-year convention</b>: cash flows arrive throughout the year, so discount each at n − 0.5. It increases value.</p>
<p>Terminal value with mid-year convention: under the <b>PGM</b> it uses the mid-year period, consistent with the FCF stream; under the <b>EMM</b> it uses the full year n, since the multiple values the business as if sold at year-end.</p>` },
        { h: 'Determine valuation', b: `<p>EV = Σ PV(UFCF) + PV(TV). Then EV − net debt (and other claims) = equity value; ÷ fully diluted shares = implied share price (circular via the TSM).</p>
<p>Check the % of EV coming from the terminal value.</p>` },
        { h: 'Sensitivities, pros and cons', b: `<p>Two-way tables: WACC vs exit multiple, WACC vs g, plus operating sensitivities (sales growth, margins). A DCF output is a <b>range</b>.</p>
<p><b>Pros</b>: cash flow-based; market independent; self-sufficient (no need for peers); flexibility to model scenarios.</p>
<p><b>Cons</b>: dependence on financial projections; sensitivity to assumptions; terminal value dominates; assumes a constant capital structure.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Present value of $110 received in one year at 10%?', a: 100, e: '110 / 1.10 = 100.' },
        { t: 'num', q: 'Discount factor for year 2 at a 10% WACC (3 decimals)?', a: 0.826, tol: 0.002, e: '1 / 1.21 = 0.826.' },
        { t: 'num', q: 'Year 1 cash flow $111, WACC 10%, mid-year convention. Present value (1 decimal)?', a: 105.8, tol: 0.3, e: '111 / 1.1^0.5 = 105.8.' },
        { t: 'num', q: 'PV of FCF $400 and PV of TV $1,100. Share of EV from terminal value (%)?', a: 73.3, tol: 0.5, u: '%', e: '1,100 / 1,500 = 73.3%.' },
        { t: 'tf', q: 'Under the exit multiple method, terminal value is discounted using the full year even when the mid-year convention is used for cash flows.', a: true, e: 'The multiple represents a sale at the end of year n.' },
        { t: 'mc', q: 'If the WACC rises by 1 point, DCF enterprise value:', o: ['Falls', 'Rises', 'Is unchanged', 'Doubles'], a: 0, e: 'Higher discount rate, lower present value, especially for the terminal value.' },
        { t: 'match', q: 'Classify each DCF point', p: [['Market independent', 'Pro: not driven by peer prices'], ['Flexibility', 'Pro: easy to run scenarios'], ['Terminal value', 'Con: dominates total value'], ['Constant capital structure', 'Con: assumes WACC does not change']] },
        { t: 'int', q: 'Interview: "What moves a DCF the most?"', m: 'The <b>terminal value</b>, usually 60-80% of EV, and within it the <b>WACC</b> and the <b>growth rate</b> or exit multiple. Small changes in WACC or g move value a lot, especially when WACC − g is small. That is why I always show sensitivity tables and cross-check with comps and precedents.' }
      ]
    },
    {
      id: 'c3l8', title: 'Illustrative DCF for ValueCo',
      th: [
        { h: 'The case (simplified)', b: `<p>Year 0 sales $1,000; growth 10%; EBITDA margin 20%; D&amp;A 4% of sales; capex 5% of sales; ΔNWC 10% of the change in sales; tax 25%; WACC 10%; net debt $270; 100 diluted shares.</p>
<p>Year 1: sales 1,100; EBITDA 220; EBIT 176; EBIAT 132; UFCF = 132 + 44 − 55 − 10 = <b>111</b>.</p>` },
        { h: 'Valuation', b: `<p>Sum of PV of UFCF years 1-5 = <b>$480</b>. Year 5 EBITDA $320 × 8.0x = TV <b>$2,560</b>; PV = 2,560 / 1.1⁵ = <b>$1,590</b>.</p>
<p>EV = <b>$2,070</b> → equity $1,800 → <b>$18.00 per share</b>. TV is 77% of EV. Implied perpetuity growth with FCF(5) $160: <b>3.5%</b>.</p>` }
      ],
      ex: [
        { t: 'num', q: 'ValueCo year 1: EBIT $176, tax 25%, D&A $44, capex $55, ΔNWC $10. UFCF?', a: 111, e: '132 + 44 − 55 − 10 = 111.' },
        { t: 'num', q: 'Terminal value $2,560 at the end of year 5, WACC 10%. Present value (nearest whole number)?', a: 1590, tol: 3, e: '2,560 / 1.61051 = 1,590.' },
        { t: 'num', q: 'PV of FCF $480, PV of TV $1,590, net debt $270, 100 diluted shares. Implied share price?', a: 18, e: '2,070 − 270 = 1,800 / 100 = 18.00.' },
        { t: 'num', q: 'Year 1 sales rise from $1,000 to $1,100 and NWC is 10% of the change in sales. Increase in NWC?', a: 10, e: '10% × 100 = 10.' },
        { t: 'mc', q: 'TV is 77% of EV. What should you do?', o: ['Normal; cross-check implied g and multiple and run sensitivities', 'Reject the DCF', 'Shorten the projection to 1 year', 'Ignore the TV'], a: 0, e: '60-80% is typical; check reasonableness.' },
        { t: 'int', q: 'Interview: "Your DCF gives $18 and the stock trades at $25. What do you tell the client?"', m: 'I would check my <b>assumptions</b> first: growth and margins versus consensus, WACC inputs, terminal value. Then explain what the market is pricing: the <b>implied</b> growth or margin needed to justify $25 (reverse DCF). The answer is a range with sensitivities, triangulated with comps and precedents, not a single number.' }
      ]
    }
  ]
});
UNITS.push({
  id: 'c4', title: 'Leveraged Buyouts', sub: 'Participants, ideal candidates, returns, exits and how LBOs are financed', ch: 'Chapter 4', col: 'var(--u5)',
  lessons: [
    {
      id: 'c4l1', title: 'Key participants',
      th: [
        { h: 'What an LBO is', b: `<p>A leveraged buyout is the acquisition of a company by a <b>financial sponsor</b> using a significant amount of <b>debt</b>, repaid over time with the target’s own cash flow. The remainder is funded with <b>equity</b> from the sponsor.</p>` },
        { h: 'Who is involved', b: `<ul><li><b>Financial sponsors</b>: private equity firms, plus family offices, pension funds and sovereign funds investing directly. They raise funds from LPs and target high returns.</li>
<li><b>Investment banks</b>: M&amp;A advice to buyer or seller, and <b>financing</b>: they commit to underwrite the debt (commitment letters, bridge loans) and then syndicate loans and bonds.</li>
<li><b>Bank and institutional lenders</b>: <b>pro rata</b> lenders (banks) hold the revolver and Term Loan A; <b>institutional</b> lenders (CLOs, loan funds, hedge funds, insurers) buy Term Loan B.</li>
<li><b>Bond investors</b>: high yield mutual funds, insurers, pension funds, hedge funds.</li>
<li><b>Private credit funds</b>: non-bank direct lenders offering senior, <b>unitranche</b> or junior loans with speed, certainty and confidentiality; a major source of LBO financing today.</li>
<li><b>Target management</b>: often <b>roll over</b> equity and receive an option or incentive pool; in a <b>management buyout (MBO)</b> management itself leads the deal with a sponsor.</li></ul>` }
      ],
      ex: [
        { t: 'match', q: 'Match each participant to its role', p: [['Financial sponsor', 'Provides the equity and controls the deal'], ['Pro rata lenders', 'Hold the revolver and Term Loan A'], ['Institutional lenders', 'Buy Term Loan B'], ['Private credit funds', 'Direct lenders offering unitranche loans']] },
        { t: 'mc', q: 'Which investors typically buy Term Loan B?', o: ['CLOs and other institutional investors', 'Retail savers', 'Only commercial banks', 'The sponsor itself'], a: 0, e: 'TLBs are structured for institutional investors: minimal amortization, longer tenor.' },
        { t: 'mc', q: 'What is a unitranche loan?', o: ['A single loan combining senior and junior debt at a blended rate', 'A bond with no coupon', 'An equity security', 'A revolving facility'], a: 0, e: 'Common in private credit: one lender group, one document, faster execution.' },
        { t: 'tf', q: 'In many LBOs, management rolls over part of its existing equity into the new company.', a: true, e: 'Rollover aligns management with the sponsor; an incentive pool adds upside.' },
        { t: 'mc', q: 'What do investment banks provide in an LBO beyond M&A advice?', o: ['Committed financing that they then syndicate', 'The sponsor’s equity', 'The audit', 'Regulatory approval'], a: 0, e: 'Commitment letters give the sponsor financing certainty for its bid.' },
        { t: 'int', q: 'Interview: "Explain an LBO to my grandmother."', m: 'It is like buying a rental flat with a <b>mortgage</b>. You put in a small amount of your own money and borrow the rest. The rent (the company’s cash flow) pays down the mortgage. After a few years you sell: you owe less and the flat may be worth more, so your small contribution has multiplied. A private equity fund does the same with companies.' }
      ]
    },
    {
      id: 'c4l2', title: 'Characteristics of a strong LBO candidate',
      th: [
        { h: 'The seven characteristics', b: `<ol><li><b>Strong cash flow generation</b>: predictable cash to service and repay debt.</li><li><b>Leading and defensible market positions</b>: brands, scale, customer relationships, barriers to entry.</li><li><b>Growth opportunities</b>: organic and via add-on acquisitions.</li><li><b>Efficiency enhancement opportunities</b>: cost cuts, procurement, footprint, pricing.</li><li><b>Low capex requirements</b>: more free cash flow for debt paydown.</li><li><b>Strong asset base</b>: collateral for secured debt (receivables, inventory, PP&amp;E, IP).</li><li><b>Proven management team</b>: able to execute under leverage.</li></ol>
<p>Poor candidates: highly cyclical or volatile cash flows, heavy capex, secular decline, weak management.</p>` }
      ],
      ex: [
        { t: 'mc', q: 'Which is the best LBO candidate?', o: ['A mature company with stable cash flow and low capex', 'A pre-revenue biotech', 'A highly cyclical miner with heavy capex', 'An airline with recurring losses'], a: 0, e: 'Stable cash flow and low capex support debt service.' },
        { t: 'tf', q: 'High capex requirements make a company a more attractive LBO target.', a: false, e: 'Capex consumes the cash that should repay debt.' },
        { t: 'mc', q: 'Why does a strong asset base matter?', o: ['It provides collateral that lowers the cost and increases the availability of secured debt', 'It raises taxes', 'It increases goodwill', 'It is required by law'], a: 0, e: 'Lenders lend more, more cheaply, against good collateral.' },
        { t: 'match', q: 'Match each characteristic to an example', p: [['Efficiency opportunities', 'Consolidating duplicate warehouses'], ['Growth opportunities', 'A pipeline of add-on acquisitions'], ['Defensible position', 'Long-term contracts and high switching costs'], ['Strong cash flow', 'Recurring subscription revenue']] },
        { t: 'int', q: 'Interview: "What makes a company a good LBO candidate?"', m: 'Stable, predictable <b>cash flow</b> to service debt; a <b>leading, defensible</b> market position; <b>growth</b> and <b>efficiency</b> opportunities to create value; <b>low capex</b>; a <b>strong asset base</b> for collateral; and a <b>proven management team</b>. Plus an entry price that allows the target return and a clear exit path.' }
      ]
    },
    {
      id: 'c4l3', title: 'Economics: IRR and cash return',
      th: [
        { h: 'Returns analysis', b: `<p><b>IRR</b>: the discount rate that sets the NPV of the sponsor’s cash flows (equity in, distributions and exit proceeds out) to zero. Sponsors historically target <b>~20%+</b> (often 15-20%+ today).</p>
<p><b>Cash return</b> (multiple of money, MoM or cash-on-cash) = total cash received / equity invested. It ignores time.</p>
<p>Single exit: IRR = MoM^(1/n) − 1. Memorize: 2x in 3 yrs ≈ 26%, 2x in 5 ≈ 15%, 3x in 3 ≈ 44%, 3x in 5 ≈ 25%.</p>` },
        { h: 'How LBOs generate returns', b: `<ul><li><b>Debt repayment</b> (deleveraging): cash flow pays down debt, increasing the equity portion of EV.</li><li><b>EBITDA growth</b>: organic growth, margin improvement, add-ons.</li><li><b>Multiple expansion</b>: exiting at a higher multiple than entry (market-dependent, less controllable).</li></ul>
<p>Example: equity $400 grows to $1,000 → 2.5x. In 5 years: 2.5^(0.2) − 1 ≈ <b>20.1%</b>.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Sponsor invests $400; equity is worth $1,000 at exit. Cash return (x)?', a: 2.5, u: 'x', e: '1,000 / 400 = 2.5x.' },
        { t: 'mc', q: '2.0x over 5 years is approximately what IRR?', o: ['15%', '26%', '40%', '8%'], a: 0, e: '2^(1/5) − 1 = 14.9%.' },
        { t: 'mc', q: '3.0x over 5 years is approximately what IRR?', o: ['25%', '15%', '44%', '60%'], a: 0, e: '3^(1/5) − 1 = 24.6%.' },
        { t: 'num', q: '2.5x over 5 years. IRR (%, 1 decimal)?', a: 20.1, tol: 0.3, u: '%', e: '2.5^0.2 − 1 = 20.1%.' },
        { t: 'tf', q: 'For the same cash return, an earlier exit gives a higher IRR.', a: true, e: 'IRR penalizes time; MoM does not.' },
        { t: 'match', q: 'Match each return driver to an example', p: [['Debt repayment', 'Debt falls from $600 to $300'], ['EBITDA growth', 'EBITDA rises from $100 to $140'], ['Multiple expansion', 'Buy at 8x, sell at 10x'], ['Dividend recap', 'Early return of capital']] },
        { t: 'int', q: 'Interview: "Why might a sponsor care about MoM and not only IRR?"', m: 'IRR can be inflated by a <b>quick flip</b> or an early dividend recap: 1.3x in one year is a 30% IRR but little absolute money. LPs ultimately care about <b>dollars returned</b> (MoM, DPI). Sponsors look at both: a high IRR with a low multiple may not be worth the effort, and a high multiple over ten years may be a poor IRR.' }
      ]
    },
    {
      id: 'c4l4', title: 'How leverage enhances returns',
      th: [
        { h: 'Same deal, two structures', b: `<p>Purchase price $1,000. Exit EV in year 5: $1,500.</p>
<ul><li><b>30% debt</b>: debt $300, equity $700. Debt left at exit $100 → exit equity $1,400 → <b>2.0x, ~14.9% IRR</b>.</li><li><b>70% debt</b>: debt $700, equity $300. More interest means less paydown: debt left $450 → exit equity $1,050 → <b>3.5x, ~28.5% IRR</b>.</li></ul>
<p>The same business returns far more on a smaller equity check.</p>` },
        { h: 'Why, and the trade-off', b: `<p>Leverage works because debt is <b>cheaper</b> than equity, interest is <b>tax-deductible</b>, and value gains accrue to a smaller equity base.</p>
<p>The cost is <b>risk</b>: higher interest burden, less flexibility, covenant pressure, and potential <b>financial distress</b> if performance disappoints. Leverage magnifies losses as well as gains.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Purchase $1,000 with 30% debt. Debt left at exit $100, exit EV $1,500. Cash return (x)?', a: 2, u: 'x', e: 'Equity in 700; out 1,400 → 2.0x.' },
        { t: 'num', q: 'Purchase $1,000 with 70% debt. Debt left at exit $450, exit EV $1,500. Cash return (x)?', a: 3.5, u: 'x', e: 'Equity in 300; out 1,050 → 3.5x.' },
        { t: 'num', q: '3.5x over 5 years. IRR (%, 1 decimal)?', a: 28.5, tol: 0.4, u: '%', e: '3.5^0.2 − 1 = 28.5%.' },
        { t: 'mc', q: 'Why does more debt leave more debt outstanding at exit here?', o: ['Higher interest consumes cash that would otherwise repay principal', 'Debt grows automatically', 'Lenders refuse repayment', 'Taxes rise'], a: 0, e: 'More leverage, more interest, less free cash for paydown.' },
        { t: 'tf', q: 'Leverage magnifies losses as well as gains for the equity holder.', a: true, e: 'If exit EV fell to $800, the 70% debt structure could wipe out the equity.' },
        { t: 'int', q: 'Interview: "Why not fund an LBO with 100% debt?"', m: 'Lenders would not accept it: they need an <b>equity cushion</b> to absorb losses ahead of them. Interest would swamp the company’s cash flow and the <b>risk of default</b> would be extreme. Credit markets cap leverage (e.g. 4-6x EBITDA depending on sector and conditions), and sponsors balance return enhancement against distress risk.' }
      ]
    },
    {
      id: 'c4l5', title: 'Exit and monetization strategies',
      th: [
        { h: 'Ways out', b: `<ul><li><b>Sale of business</b>: to a <b>strategic buyer</b> (often the highest price thanks to synergies) or to another sponsor (<b>secondary buyout</b>). Gives full, immediate exit.</li>
<li><b>Initial public offering</b>: sell part of the stake in the IPO and the rest over time in follow-ons. Upside if public markets value the company highly, but lock-ups and market risk delay full exit.</li>
<li><b>Dividends / dividend recapitalization</b>: raise new debt to pay a dividend. Returns capital early (boosting IRR) while keeping ownership, at the cost of more leverage.</li>
<li><b>Below par debt repurchase</b>: when the company’s debt trades at a discount, buying it back below par reduces debt at a gain and increases equity value.</li></ul>
<p>Holding periods are typically <b>3-7 years</b>; models often assume a year-5 exit.</p>` }
      ],
      ex: [
        { t: 'match', q: 'Match each exit to its description', p: [['Sale to a strategic', 'Often highest price due to synergies'], ['Secondary buyout', 'Sale to another sponsor'], ['IPO', 'Partial exit, rest sold over time'], ['Dividend recap', 'New debt funds a dividend']] },
        { t: 'fill', q: 'Raising new debt to pay a dividend to the sponsor is a ___', o: ['dividend recapitalization', 'cash sweep', 'rollover', 'tender offer'], a: 0, e: 'It returns capital early and improves IRR.' },
        { t: 'num', q: 'A company buys back $100 face of its bonds at 80. Debt reduction ($)?', a: 100, e: 'Debt falls by the full $100 face for an $80 cash outlay: a $20 gain.' },
        { t: 'tf', q: 'An IPO usually lets the sponsor sell its entire stake immediately.', a: false, e: 'Sponsors typically sell a portion, then sell down over time after the lock-up.' },
        { t: 'mc', q: 'Why does a dividend recap raise the IRR?', o: ['It returns cash earlier', 'It lowers leverage', 'It reduces interest', 'It increases the exit multiple'], a: 0, e: 'Earlier cash flows count more in an IRR.' },
        { t: 'int', q: 'Interview: "What exit would you choose for a portfolio company and why?"', m: 'Compare <b>value, certainty and speed</b>. A <b>strategic sale</b> often pays the most (synergies) and is a clean exit. A <b>secondary buyout</b> works if credit markets are open and there is still a value creation runway. An <b>IPO</b> can maximize value for large, growing companies but exits gradually with market risk. A <b>dividend recap</b> returns capital while keeping upside. Often sponsors run a dual-track process.' }
      ]
    },
    {
      id: 'c4l6', title: 'Financing structure and secured debt',
      th: [
        { h: 'Financing structure', b: `<p>The capital structure stacks from most senior (cheapest) to most junior (most expensive): <b>secured debt</b> (bank debt) → <b>high yield bonds</b> → <b>mezzanine</b> → <b>equity</b>. Debt has historically funded roughly 60-70% of large LBOs, less in tighter markets, with the sponsor’s equity providing the rest.</p>` },
        { h: 'Secured debt', b: `<ul><li><b>Revolving credit facility</b> (revolver): drawn and repaid as needed for liquidity and working capital; commitment fee on the undrawn amount. A <b>cash flow revolver</b> is sized on EBITDA; an <b>ABL facility</b> is sized on a <b>borrowing base</b> (e.g. ~85% of eligible receivables and ~50% of inventory).</li>
<li><b>Amortizing term loans (TLA)</b>: meaningful scheduled amortization, held by banks, ~5-6 years.</li>
<li><b>Institutional term loans (TLB)</b>: ~1% annual amortization with a bullet at maturity (~7 years), held by institutional investors.</li>
<li><b>Second lien term loans</b>: secured by the same collateral but junior to first lien; higher spread.</li></ul>
<p>Bank debt is usually <b>floating rate</b> (SOFR + spread) and <b>prepayable</b>.</p>` }
      ],
      ex: [
        { t: 'num', q: 'ABL borrowing base: 85% of $200 eligible receivables plus 50% of $100 eligible inventory. Availability?', a: 220, e: '170 + 50 = 220.' },
        { t: 'mc', q: 'What is the revolver mainly for?', o: ['Liquidity and working capital needs', 'Funding the entire purchase price', 'Paying the sponsor', 'Replacing equity'], a: 0, e: 'It works like a corporate credit card.' },
        { t: 'mc', q: 'TLA vs TLB:', o: ['TLA amortizes substantially; TLB has ~1% annual amortization and a bullet', 'TLB is always cheaper', 'TLA is a bond', 'TLB has no interest'], a: 0, e: 'TLB suits institutional investors and leaves more cash for the company.' },
        { t: 'tf', q: 'A second lien term loan shares the same collateral as the first lien but ranks behind it.', a: true, e: 'Hence the higher spread.' },
        { t: 'num', q: 'Undrawn revolver of $100 with a 0.50% commitment fee. Annual fee ($)?', a: 0.5, e: '100 × 0.5% = 0.5.' },
        { t: 'ord', q: 'Order from most senior to most junior', o: ['First lien term loan', 'Second lien term loan', 'Senior unsecured notes', 'Senior subordinated notes', 'Sponsor equity'], e: 'Lower priority means higher risk and higher required return.' },
        { t: 'int', q: 'Interview: "What’s the difference between a cash flow revolver and an ABL?"', m: 'A <b>cash flow revolver</b> is sized and covenanted on the company’s EBITDA and cash generation, typical for most LBOs. An <b>ABL</b> is sized on a <b>borrowing base</b> of liquid collateral (percentages of eligible receivables and inventory), so availability moves with working capital. ABLs suit asset-heavy businesses like retailers and distributors and are usually cheaper with lighter covenants.' }
      ]
    },
    {
      id: 'c4l7', title: 'High yield, mezzanine and equity',
      th: [
        { h: 'High yield bonds', b: `<p>Non-investment grade, <b>unsecured</b> (senior or senior subordinated) notes, sold to institutional investors (often under Rule 144A). <b>Fixed coupon</b>, <b>8-10 year</b> bullet maturity, <b>incurrence covenants</b> and <b>call protection</b>. More expensive than bank debt but more flexible and with no amortization.</p>` },
        { h: 'Mezzanine debt', b: `<p>Privately placed subordinated debt between senior debt and equity, often with a cash coupon plus <b>PIK</b> interest and an <b>equity kicker</b> (warrants). Targets returns in the mid-teens. Used for smaller deals or when bonds are not an option.</p>
<p><b>PIK</b> (payment-in-kind): interest accrues and is added to principal instead of being paid in cash.</p>` },
        { h: 'Equity contribution', b: `<p>The sponsor’s equity (plus management <b>rollover</b>) is the cushion under the debt. Historically ~30-40% of the total sources; recently often higher given leverage limits. A bigger equity check lowers risk but also lowers the IRR.</p>` }
      ],
      ex: [
        { t: 'tf', q: 'High yield bonds are typically fixed-rate with a bullet maturity.', a: true, e: 'And usually unsecured, with incurrence covenants.' },
        { t: 'mc', q: 'What is an equity kicker in mezzanine financing?', o: ['Warrants or co-investment rights that give the lender equity upside', 'A penalty fee', 'A type of revolver', 'A dividend to management'], a: 0, e: 'It boosts the mezzanine lender’s return.' },
        { t: 'num', q: '$100 of PIK notes at 10% with interest compounding annually. Balance after 2 years?', a: 121, e: '100 × 1.1² = 121.' },
        { t: 'num', q: 'Purchase price $1,000 funded with $600 of debt. Equity contribution (%)?', a: 40, u: '%', e: '400 / 1,000 = 40%.' },
        { t: 'mc', q: 'Why would a sponsor accept a larger equity check?', o: ['Leverage limits in the market or a desire for lower risk', 'To raise the IRR', 'To increase interest', 'Lenders require 100% equity'], a: 0, e: 'More equity reduces risk but dilutes returns.' },
        { t: 'int', q: 'Interview: "Why would a company issue high yield bonds instead of more term loans?"', m: 'Bonds offer <b>longer maturity</b>, <b>no amortization</b>, <b>fixed rate</b> (hedging rate risk) and <b>incurrence-only covenants</b>, so more flexibility. They also tap a different investor base, allowing more total debt. The trade-offs are a higher cost, <b>call protection</b> (expensive to refinance early) and public disclosure.' }
      ]
    },
    {
      id: 'c4l8', title: 'Key terms: security to call protection',
      th: [
        { h: 'Security and seniority', b: `<p><b>Security</b>: a lien on collateral (first lien, second lien) versus unsecured.</p>
<p><b>Seniority</b>: priority of claims. <b>Contractual subordination</b>: an agreement that one debt is paid after another. <b>Structural subordination</b>: debt at a holding company ranks behind all liabilities at the operating subsidiaries, because holdco creditors only receive what is left after opco creditors are paid.</p>` },
        { h: 'Maturity and coupon', b: `<p><b>Maturity</b>: revolver ~5 years, TLA ~5-6, TLB ~7, high yield 8-10. Junior debt matures after senior debt.</p>
<p><b>Coupon</b>: bank debt pays <b>SOFR + spread</b> (e.g. +350 bps), sometimes with a <b>SOFR floor</b> and issued at a discount (<b>OID</b>). Bonds pay a fixed coupon.</p>` },
        { h: 'Call protection', b: `<p>Bonds are typically <b>non-callable</b> for the first years (e.g. NC3 on an 8-year), then callable at a premium that steps down to par. Term loans are usually prepayable at par, sometimes with <b>soft call</b> protection (e.g. 101 for 6-12 months on a repricing).</p>` }
      ],
      ex: [
        { t: 'num', q: 'Loan at SOFR + 350 bps with SOFR at 5%. All-in rate (%)?', a: 8.5, u: '%', e: '5% + 3.5% = 8.5%.' },
        { t: 'num', q: 'Loan at SOFR + 400 bps with a 1.0% SOFR floor; SOFR is 0.5%. Rate (%)?', a: 5, u: '%', e: 'The floor applies: 1.0% + 4.0% = 5.0%.' },
        { t: 'num', q: 'A $500 term loan issued at an OID of 98. Cash proceeds?', a: 490, e: '500 × 98% = 490.' },
        { t: 'mc', q: 'What is structural subordination?', o: ['Holdco debt ranks behind all opco liabilities', 'A clause in the indenture', 'A type of covenant', 'Secured debt'], a: 0, e: 'Holdco lenders only get what remains after operating subsidiaries pay their creditors.' },
        { t: 'tf', q: 'Bank term loans are usually prepayable at par, while high yield bonds have call protection.', a: true, e: 'Soft call on loans aside.' },
        { t: 'match', q: 'Match each term to its meaning', p: [['NC3', 'Non-callable for three years'], ['OID', 'Debt issued below par'], ['SOFR floor', 'Minimum base rate'], ['Soft call', '101 premium on early repricing']] },
        { t: 'int', q: 'Interview: "Why do bond investors demand call protection?"', m: 'Because they accept a <b>fixed coupon</b> for years. If rates fall or the credit improves, the issuer would refinance immediately, taking away the investor’s above-market coupon. Call protection guarantees investors earn the coupon for a minimum period or are compensated with a <b>call premium</b>.' }
      ]
    },
    {
      id: 'c4l9', title: 'Covenants, term sheets and sizing the structure',
      th: [
        { h: 'Covenants', b: `<ul><li><b>Affirmative</b>: things the borrower must do (deliver financials, maintain insurance, pay taxes).</li><li><b>Negative</b>: limits on debt, liens, dividends, asset sales, investments, affiliate transactions.</li><li><b>Financial maintenance</b> (bank loans): tested quarterly, e.g. maximum Debt/EBITDA, minimum EBITDA/interest, maximum capex.</li><li><b>Incurrence</b> (bonds): tested only when the company takes an action, e.g. raising debt only if pro forma coverage stays above 2.0x.</li></ul>
<p>Many term loans today are <b>covenant-lite</b>: no maintenance covenants, like bonds (revolvers may keep a springing covenant).</p>` },
        { h: 'Term sheets and determining the structure', b: `<p>A <b>term sheet</b> summarizes the key terms of each facility: amount, tenor, pricing, amortization, security, covenants, call protection, fees.</p>
<p>The structure is sized on <b>leverage multiples</b> the market will bear for that sector and credit (e.g. 4.0-6.0x total), coverage ratios, the company’s ability to <b>repay</b> a meaningful share of debt over the hold, and the trade-off between returns and flexibility. Sponsors compare alternatives (bank-only, bank + bonds, unitranche) on cost, flexibility and execution certainty.</p>` }
      ],
      ex: [
        { t: 'match', q: 'Match each covenant to its type', p: [['Deliver quarterly financials', 'Affirmative'], ['Limit on new liens', 'Negative'], ['Max 5.0x Debt/EBITDA tested quarterly', 'Financial maintenance'], ['May borrow only if coverage > 2.0x', 'Incurrence']] },
        { t: 'num', q: 'Debt $500, EBITDA $100, interest $25. Coverage ratio (x)?', a: 4, u: 'x', e: '100 / 25 = 4.0x.' },
        { t: 'num', q: 'Maximum leverage covenant 5.0x and EBITDA $90. Maximum debt allowed?', a: 450, e: '5.0 × 90 = 450.' },
        { t: 'tf', q: 'A covenant-lite loan has no financial maintenance covenants.', a: true, e: 'It behaves like a bond, with incurrence-style tests.' },
        { t: 'mc', q: 'What happens if a borrower breaches a maintenance covenant?', o: ['Technical default; it usually negotiates a waiver or amendment', 'Nothing', 'Automatic bankruptcy', 'The bonds convert to equity'], a: 0, e: 'Lenders gain leverage to reprice or tighten terms; the sponsor may inject an equity cure.' },
        { t: 'int', q: 'Interview: "How do you decide how much debt to put on an LBO?"', m: 'Start with what the <b>market will bear</b>: leverage multiples for comparable credits and current conditions. Check <b>coverage</b> (EBITDA/interest, (EBITDA − capex)/interest) and that the company can <b>repay</b> a meaningful share of debt under the base and downside cases without breaching covenants. Then balance the <b>IRR</b> benefit of more debt against flexibility and distress risk, and compare structures (bank + bonds vs unitranche).' }
      ]
    }
  ]
});

UNITS.push({
  id: 'c5', title: 'LBO Analysis', sub: 'Building the LBO model step by step, from pre-LBO to returns and valuation', ch: 'Chapter 5', col: 'var(--u5)',
  lessons: [
    {
      id: 'c5l1', title: 'Steps I-II: information and the pre-LBO model',
      th: [
        { h: 'What the model answers', b: `<p>LBO analysis is the core tool to assess <b>financing structure</b> (how much debt, what mix) and <b>valuation</b> (what a sponsor can pay given a target IRR). Steps:</p>
<ol><li>Locate and analyze the necessary information</li><li>Build the pre-LBO model</li><li>Input transaction structure</li><li>Complete the post-LBO model</li><li>Perform LBO analysis</li></ol>` },
        { h: 'Step I and Step II', b: `<p><b>Step I</b>: in a sell-side auction, the <b>CIM</b>, management projections and data room; otherwise filings and research. Build a <b>Sponsor Case</b> (more conservative than the Management Case) and a downside.</p>
<p><b>Step II(a)</b>: historical and projected income statement through <b>EBIT</b>.</p>
<p><b>Step II(b)</b>: input the opening balance sheet and project balance sheet items (working capital, PP&amp;E).</p>
<p><b>Step II(c)</b>: build the cash flow statement through investing activities: operating cash flow (pre-interest) less capex.</p>` }
      ],
      ex: [
        { t: 'ord', q: 'Order the steps of LBO analysis', o: ['Locate and analyze the necessary information', 'Build the pre-LBO model', 'Input transaction structure', 'Complete the post-LBO model', 'Perform LBO analysis'], e: 'Chapter 5 structure.' },
        { t: 'mc', q: 'In a sell-side auction, the main source for the LBO model is:', o: ['The CIM and management projections', 'The proxy statement', 'Research reports only', 'The buyer’s tax return'], a: 0, e: 'Supplemented by the data room and management meetings.' },
        { t: 'tf', q: 'A Sponsor Case is usually more conservative than the Management Case.', a: true, e: 'Sponsors and lenders haircut management’s assumptions.' },
        { t: 'mc', q: 'The pre-LBO income statement is built through which line in Step II(a)?', o: ['EBIT', 'Net income', 'Sales only', 'Free cash flow'], a: 0, e: 'Interest and below depend on the new capital structure, added in Step IV.' },
        { t: 'int', q: 'Interview: "What are the two main things an LBO model is used for?"', m: 'To determine the <b>financing structure</b> a business can support (debt quantum, mix, repayment capacity, credit statistics) and its <b>valuation</b> from a sponsor’s perspective: the price a sponsor can pay and still achieve its target IRR, which acts as a floor in a sale process.' }
      ]
    },
    {
      id: 'c5l2', title: 'Step III: purchase price and sources and uses',
      th: [
        { h: 'Step III(a): purchase price', b: `<p>Public target: <b>offer price per share × fully diluted shares</b> (offer value), plus refinanced net debt = purchase EV. Private target: a <b>multiple of LTM EBITDA</b> on a cash-free, debt-free basis.</p>
<p>Example: LTM EBITDA $100 × 9.0x = purchase EV <b>$900</b>.</p>` },
        { h: 'Step III(b): sources and uses', b: `<p><b>Uses</b>: equity purchase price, refinancing existing net debt, tender/call premiums, <b>M&amp;A fees</b> and <b>financing fees</b>.</p>
<p><b>Sources</b>: revolver, term loans, bonds, cash on balance sheet, management rollover and <b>sponsor equity</b> (the plug).</p>
<div class="f">Sources = Uses</div>
<p>Example: uses = 900 + fees 30 = 930. Debt 5.0x EBITDA = 500. <b>Sponsor equity = 430</b>.</p>` }
      ],
      ex: [
        { t: 'num', q: 'LTM EBITDA $100 bought at 9.0x, fees $30, debt 5.0x EBITDA. Sponsor equity?', a: 430, e: 'Uses 930 − debt 500 = 430.' },
        { t: 'num', q: 'Offer $25 per share × 40M diluted shares, refinance $300 of net debt, fees $40. Total uses ($M)?', a: 1340, e: '1,000 + 300 + 40 = 1,340.' },
        { t: 'num', q: 'Total uses $1,340; term loan $500, notes $300, rollover $40. Sponsor equity ($M)?', a: 500, e: '1,340 − 840 = 500.' },
        { t: 'tf', q: 'Sponsor equity is usually the balancing figure in sources and uses.', a: true, e: 'Debt is sized by the market; equity fills the gap.' },
        { t: 'mc', q: 'Which is a use of funds?', o: ['Refinancing the target’s existing debt', 'The new term loan', 'Management rollover', 'Sponsor equity'], a: 0, e: 'The others are sources.' },
        { t: 'int', q: 'Interview: "Walk me through sources and uses in an LBO."', m: '<b>Uses</b> are what the money pays for: buying the equity, refinancing existing debt (plus any premiums), and transaction fees (M&amp;A advisory and financing). <b>Sources</b> are where it comes from: the new debt tranches sized on leverage multiples, any existing cash used, management rollover, and the sponsor’s equity, which is the plug that makes sources equal uses.' }
      ]
    },
    {
      id: 'c5l3', title: 'Step III(c): balance sheet adjustments',
      th: [
        { h: 'Linking sources and uses to the balance sheet', b: `<ul><li><b>New debt</b> added; <b>existing debt</b> refinanced is removed.</li><li><b>Old shareholders’ equity</b> eliminated and replaced with the <b>sponsor’s equity</b>.</li><li><b>Goodwill</b> created: purchase equity price − net identifiable assets (book equity, adjusted for write-ups). Existing goodwill is written off and replaced.</li><li><b>Financing fees</b> are capitalized as <b>deferred financing fees</b> (an asset) and amortized over the life of the debt (non-cash expense).</li><li><b>M&amp;A fees</b> and other transaction expenses are expensed, reducing the new equity.</li></ul>` },
        { h: 'Worked example', b: `<p>Equity purchase price $1,000; target book equity $400, no write-ups → <b>goodwill $600</b>.</p>
<p>Financing fees $21 on 7-year debt → amortization of <b>$3 per year</b>, added back in cash flow because it is non-cash.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Equity purchase price $1,000; target net identifiable assets $400 (no write-ups). Goodwill created?', a: 600, e: '1,000 − 400 = 600.' },
        { t: 'num', q: 'Financing fees of $21 on debt with a 7-year term. Annual amortization of deferred financing fees?', a: 3, e: '21 / 7 = 3.' },
        { t: 'mc', q: 'How are financing fees treated in the pro forma balance sheet?', o: ['Capitalized as an asset and amortized over the life of the debt', 'Expensed immediately', 'Added to goodwill', 'Ignored'], a: 0, e: 'Deferred financing fees.' },
        { t: 'tf', q: 'The target’s existing shareholders’ equity is eliminated and replaced by the sponsor’s equity.', a: true, e: 'The sponsor is the new owner.' },
        { t: 'mc', q: 'Is the amortization of deferred financing fees a cash expense?', o: ['No, it is non-cash and added back in the cash flow statement', 'Yes, it is paid yearly', 'Only in year 1', 'It is a financing inflow'], a: 0, e: 'The cash was paid at closing.' },
        { t: 'int', q: 'Interview: "What balance sheet adjustments happen at the close of an LBO?"', m: 'Add the <b>new debt</b> and remove refinanced debt; use any balance sheet cash; eliminate the old <b>equity</b> and record the sponsor’s equity (net of expensed M&amp;A fees); write off old goodwill and create <b>new goodwill</b> (and any asset write-ups with deferred taxes); capitalize <b>deferred financing fees</b>. The pro forma balance sheet must still balance.' }
      ]
    },
    {
      id: 'c5l4', title: 'Step IV(a): the debt schedule',
      th: [
        { h: 'What it does', b: `<p>The debt schedule tracks each tranche: beginning balance, <b>mandatory</b> repayments (scheduled amortization), <b>optional</b> repayments, ending balance and <b>interest expense</b>.</p>
<ul><li>Floating-rate tranches use a <b>forward SOFR curve</b> plus spread.</li><li><b>Cash available for optional repayment</b> = free cash flow (after interest) + beginning cash − minimum cash − mandatory repayments.</li><li><b>Cash sweep</b>: excess cash repays prepayable debt, usually senior first (revolver, then term loans).</li><li><b>Revolver</b>: draws if cash falls short, repaid first when cash is available; undrawn commitment fee.</li></ul>` },
        { h: 'Average balances and circularity', b: `<p>Interest is often calculated on the <b>average</b> balance (beginning + ending / 2). But the ending balance depends on cash flow, which depends on interest: a <b>circular reference</b>, solved with iterative calculation and a circularity switch.</p>
<p>Example: TLB $500 at 8%, 1% amortization ($5), optional repayment $55 → ending $440, average $470, interest <b>$37.6</b>.</p>` }
      ],
      ex: [
        { t: 'num', q: '$500 TLB with 1% annual mandatory amortization. Mandatory repayment in year 1?', a: 5, e: '1% × 500 = 5.' },
        { t: 'num', q: 'FCF after interest $80, beginning cash $20, minimum cash $10, mandatory repayment $5. Cash available for optional repayment?', a: 85, e: '80 + 20 − 10 − 5 = 85.' },
        { t: 'num', q: 'TLB beginning $500, ending $440, rate 8%, interest on average balance. Interest expense?', a: 37.6, tol: 0.1, e: 'Average 470 × 8% = 37.6.' },
        { t: 'mc', q: 'Why is there circularity in an LBO model?', o: ['Interest depends on debt, which depends on cash flow, which depends on interest', 'Excel error', 'EBITDA depends on price', 'Sources do not equal uses'], a: 0, e: 'Solved with iteration or beginning-balance interest.' },
        { t: 'mc', q: 'In a typical cash sweep, which is repaid first?', o: ['The revolver, then term loans', 'The high yield bonds', 'The sponsor equity', 'Deferred financing fees'], a: 0, e: 'Most senior, prepayable debt first; bonds are non-call.' },
        { t: 'tf', q: 'Floating-rate debt interest in projections is usually based on a forward SOFR curve.', a: true, e: 'The market’s expectation of future base rates.' },
        { t: 'int', q: 'Interview: "How does the revolver work in a model?"', m: 'It acts as the <b>liquidity plug</b>. If cash after mandatory payments falls below the minimum cash balance, the revolver <b>draws</b> to fill the gap; when there is excess cash it is <b>repaid first</b> in the sweep. Interest is charged on drawn amounts and a commitment fee on the undrawn portion.' }
      ]
    },
    {
      id: 'c5l5', title: 'Step IV(b)-(d): pro forma statements',
      th: [
        { h: 'Pro forma income statement', b: `<p>From EBIT down: subtract <b>interest expense</b> from the debt schedule (including commitment fees) and the <b>amortization of deferred financing fees</b>, less any interest income → EBT → taxes → net income.</p>` },
        { h: 'Pro forma balance sheet and cash flow', b: `<p><b>Cash flow statement</b>: net income + D&amp;A + amortization of deferred financing fees − ΔNWC = operating cash flow; − capex = investing; ± debt repayments/draws = financing. The result is the change in cash.</p>
<p><b>Balance sheet</b>: debt balances from the schedule; cash from the cash flow; retained earnings grow by net income; deferred financing fees decline with amortization. It must balance every year.</p>
<p>Example year 1: EBITDA 110, D&amp;A 20, interest 44, tax 25% → taxes 11.5; capex 20; ΔNWC 5 → cash for debt paydown <b>29.5</b>.</p>` }
      ],
      ex: [
        { t: 'num', q: 'EBITDA $110, D&A $20, interest $44, tax 25%. Net income (1 decimal)?', a: 34.5, tol: 0.1, e: 'EBT 46, taxes 11.5, net income 34.5.' },
        { t: 'num', q: 'Same case: net income $34.5, D&A $20, capex $20, increase in NWC $5. Free cash flow for debt repayment (1 decimal)?', a: 29.5, tol: 0.1, e: '34.5 + 20 − 20 − 5 = 29.5.' },
        { t: 'tf', q: 'Amortization of deferred financing fees reduces net income but is added back in the cash flow statement.', a: true, e: 'Non-cash charge.' },
        { t: 'mc', q: 'If the pro forma balance sheet does not balance, the most common cause is:', o: ['A link between cash flow, debt schedule and balance sheet is missing or wrong', 'Too much equity', 'A high tax rate', 'The exit multiple'], a: 0, e: 'Every cash flow line must hit the balance sheet.' },
        { t: 'int', q: 'Interview: "Walk me through an LBO model."', m: '<b>1)</b> Transaction assumptions: purchase price, debt structure, fees. <b>2)</b> <b>Sources and uses</b>, with sponsor equity as the plug. <b>3)</b> <b>Pro forma balance sheet</b> with new debt, goodwill and deferred financing fees. <b>4)</b> Projections of the income statement and cash flow. <b>5)</b> <b>Debt schedule</b>: interest, mandatory amortization and cash sweep. <b>6)</b> <b>Exit</b> in year 5 at a multiple; EV less net debt = equity. <b>7)</b> <b>IRR and MoM</b>, with sensitivities to entry and exit multiples and leverage.' }
      ]
    },
    {
      id: 'c5l6', title: 'Step V(a)-(b): financing structure and returns',
      th: [
        { h: 'Step V(a): analyze the financing structure', b: `<p>Review credit statistics over the projection: <b>total and senior leverage</b> (Debt/EBITDA), <b>coverage</b> (EBITDA/interest, (EBITDA − capex)/interest), <b>cumulative debt repaid</b> (% of initial debt) and liquidity (revolver availability). Lenders want deleveraging and a cushion in the downside case.</p>` },
        { h: 'Step V(b): returns analysis', b: `<p>Assume an <b>exit</b> (usually year 5) at an exit multiple, often equal to the entry multiple to be conservative.</p>
<div class="f">Exit equity = Exit EBITDA × Exit multiple − Net debt at exit</div>
<p>Example: EBITDA $150 × 8.0x = $1,200; net debt $300 → equity $900; invested $400 → <b>2.25x</b>, IRR ≈ <b>17.6%</b>.</p>
<p>Sensitize IRR to exit multiple vs exit year, and purchase price vs leverage.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Exit EBITDA $150 × 8.0x, net debt at exit $300. Exit equity value?', a: 900, e: '1,200 − 300 = 900.' },
        { t: 'num', q: 'Sponsor invested $400 and receives $900 in year 5. IRR (%, 1 decimal)?', a: 17.6, tol: 0.4, u: '%', e: '2.25^0.2 − 1 = 17.6%.' },
        { t: 'num', q: 'Initial debt $500, debt at year 5 $300. Cumulative debt repaid (%)?', a: 40, u: '%', e: '200 / 500 = 40%.' },
        { t: 'mc', q: 'Why is the exit multiple often set equal to the entry multiple?', o: ['To avoid relying on multiple expansion', 'Because it is required by lenders', 'It always maximizes IRR', 'Because markets never change'], a: 0, e: 'Returns should come from deleveraging and EBITDA growth.' },
        { t: 'match', q: 'Match each sensitivity to the question it answers', p: [['Exit multiple vs exit year', 'How timing and market affect IRR'], ['Purchase price vs leverage', 'What we can pay for a given structure'], ['Downside case credit stats', 'Whether covenants hold'], ['Cumulative debt repaid', 'How fast the business deleverages']] },
        { t: 'int', q: 'Interview (paper LBO): "Buy a company with $50 EBITDA at 10x with 60% debt. EBITDA reaches $75 in 5 years, exit at 10x, and $100 of debt is repaid. MoM and IRR?"', m: 'Entry: EV 500, debt 300, <b>equity 200</b>. Exit: EV 750, debt 200, <b>equity 550</b>. MoM = <b>2.75x</b>. Over 5 years that is between 15% (2x) and 25% (3x), about <b>22%</b>. Value bridge: 250 from EBITDA growth, 100 from debt paydown.' }
      ]
    },
    {
      id: 'c5l7', title: 'Step V(c)-(d): valuation and transaction summary',
      th: [
        { h: 'Step V(c): determine valuation', b: `<p>Solve for the <b>purchase price</b> that delivers the sponsor’s target IRR (e.g. 15-20%+) given the available financing. The resulting range is a key reference in a sale process: often a <b>floor</b>, because strategic buyers with synergies can pay more.</p>
<p>Example: exit equity $1,000 in year 5, target IRR 20% → maximum equity today = 1,000 / 1.2⁵ = <b>$402</b>. With $500 debt and $30 fees → max EV $872 → <b>8.7x</b> LTM EBITDA of $100.</p>` },
        { h: 'Step V(d): transaction summary page', b: `<p>One page that summarizes the deal for decision-makers: <b>sources and uses</b>, purchase price and multiples, capital structure and credit statistics, the <b>returns analysis</b> (IRR and MoM) and key sensitivities. It is what the investment committee or the client looks at first.</p>` }
      ],
      ex: [
        { t: 'num', q: 'Exit equity $1,000 in year 5. Maximum equity today for a 20% IRR (nearest whole number)?', a: 402, tol: 1, e: '1,000 / 2.48832 = 402.' },
        { t: 'num', q: 'Maximum equity $402, debt $500, fees $30, LTM EBITDA $100. Maximum entry multiple (x, 1 decimal)?', a: 8.7, tol: 0.1, u: 'x', e: 'EV = 402 + 500 − 30 = 872 → 8.7x.' },
        { t: 'mc', q: 'In a sale process, the LBO valuation usually represents:', o: ['A floor: what a financial buyer can pay', 'The ceiling for all buyers', 'The market price', 'The book value'], a: 0, e: 'Strategics with synergies can often pay more.' },
        { t: 'tf', q: 'Raising the target IRR lowers the price a sponsor can pay.', a: true, e: 'A higher discount rate on the same exit proceeds means less equity today.' },
        { t: 'mc', q: 'What is the transaction summary page?', o: ['A one-page overview of S&U, structure, credit stats and returns', 'The legal agreement', 'The CIM cover', 'A tax filing'], a: 0, e: 'The page decision-makers read first.' },
        { t: 'int', q: 'Interview: "How would you use an LBO to value a company?"', m: 'Fix the sponsor’s <b>target IRR</b> and the <b>financing</b> the market will provide, project the business and the exit, then solve backwards for the <b>maximum purchase price</b> that still achieves the IRR. That price range shows what financial buyers can pay and serves as a <b>floor</b> in a sale process.' }
      ]
    },
    {
      id: 'c5l8', title: 'Illustrative LBO for ValueCo',
      th: [
        { h: 'The case (simplified)', b: `<ul><li>LTM EBITDA $100; purchase at <b>9.0x</b> (EV $900, cash-free, debt-free); fees $30</li><li>Debt 5.0x: TLB $300 at 8%, senior notes $200 at 10%</li><li>Sponsor equity: <b>$430</b> (46% of $930)</li><li>Tax 25%; D&amp;A $20; capex $20; ΔNWC $5 in year 1; EBITDA $110 in year 1</li></ul>
<p>Year 1 interest: 24 + 20 = 44 → cash for debt paydown 29.5.</p>` },
        { h: 'Exit and value bridge', b: `<p>Year 5: EBITDA $150 × 9.0x = EV $1,350; net debt $350 → equity <b>$1,000</b> → <b>2.33x</b>, IRR ≈ <b>18.4%</b>.</p>
<p>Bridge of the $570 gain: EBITDA growth (150 − 100) × 9.0 = <b>+450</b>; debt paydown 500 − 350 = <b>+150</b>; multiple <b>0</b>; fees <b>−30</b>.</p>` }
      ],
      ex: [
        { t: 'num', q: 'TLB $300 at 8% and notes $200 at 10%. Year 1 interest on opening balances?', a: 44, e: '24 + 20 = 44.' },
        { t: 'num', q: 'Exit EBITDA $150 at 9.0x, net debt at exit $350. Exit equity?', a: 1000, e: '1,350 − 350 = 1,000.' },
        { t: 'num', q: 'Equity in $430, equity out $1,000. MoM (x, 2 decimals)?', a: 2.33, tol: 0.01, u: 'x', e: '1,000 / 430 = 2.33x.' },
        { t: 'num', q: '2.33x over 5 years. IRR (%, 1 decimal)?', a: 18.4, tol: 0.5, u: '%', e: '2.326^0.2 − 1 = 18.4%.' },
        { t: 'num', q: 'EBITDA rises from $100 to $150 at a constant 9.0x. Value created by EBITDA growth?', a: 450, e: '50 × 9 = 450.' },
        { t: 'num', q: 'Debt falls from $500 to $350 at a constant multiple. Equity value added by deleveraging?', a: 150, e: 'Each dollar of debt repaid accrues to equity.' },
        { t: 'int', q: 'Interview: "The IC wants a 20% IRR on this deal, but you model 18%. What levers can you pull?"', m: 'Lower the <b>entry price</b> (8.7x instead of 9.0x hits 20%), add <b>leverage</b> if the market and credit stats allow, find more <b>EBITDA growth</b> (pricing, cost savings, add-ons), plan an earlier <b>exit</b> or a <b>dividend recap</b>, negotiate <b>lower fees</b>, or underwrite a modest multiple expansion if justified. I would show the IC the sensitivity tables for each.' }

    {
      id: 'c6l1', title: 'Auctions and auction structure',
      th: [
        { h: 'Types of sale process', b: `<ul><li><b>Broad auction</b>: contact many potential buyers, strategic and financial. Maximizes <b>competitive tension</b> and the chance of finding the highest bidder, but takes longer, risks <b>leaks</b> and disrupts the business; a thin response can make the asset look "shopped".</li>
<li><b>Targeted auction</b>: a select group of the most likely buyers. Balances competition with confidentiality.</li>
<li><b>Negotiated sale</b>: one buyer. Maximum confidentiality, speed and flexibility, less price tension. Fits when there is a clear natural buyer.</li></ul>` },
        { h: 'Two-round auction structure', b: `<ol><li><b>Organization and preparation</b>: objectives, due diligence, valuation, buyer list, marketing materials.</li><li><b>First round</b>: teaser, CA, CIM, initial bids.</li><li><b>Second round</b>: management presentations, site visits, data room, final bids.</li><li><b>Negotiations</b>: evaluate bids, negotiate, fairness opinion, sign.</li><li><b>Closing</b>: approvals, financing, close.</li></ol>
<p>A typical auction runs several months from organization to signing, plus the time to close.</p>` }
      ],
      ex: [
        { t: 'mc', q: 'Which process maximizes competitive tension?', o: ['Broad auction', 'Negotiated sale', 'Targeted auction', 'None'], a: 0, e: 'More buyers, more competition for the asset.' },

        { t: 'tf', q: 'A negotiated sale offers more confidentiality but less competitive tension.', a: true, e: 'With one buyer, the seller has less leverage on price.' },
        { t: 'ord', q: 'Order the stages of a two-round auction', o: ['Organization and preparation', 'First round', 'Second round', 'Negotiations', 'Closing'], e: 'Chapter 6 structure.' },
